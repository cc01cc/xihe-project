# ============================================================================
# 冻结说明（2026-10-07 用户裁定；2026-10-09 强调并已注释任务）
#
# XH 的 Docker 构建与服务容器化全部暂缓、冻结：只有 PostgreSQL 保留为
# Docker 容器，CP / Agent / Runtime / UI 一律以宿主进程运行。
#   日常开发：mise run dev:host
#   验收/隔离 E2E：mise run test:e2e:host（PG 容器 + 全 host 服务）
#
# 已注释冻结的 docker 相关任务（解冻必须经用户明确裁定，并同步
# AGENTS.md / DEV-002 / DEV-020 后恢复）：
#   dev:full、dev:backend、test:e2e:compose、test:e2e、image:workspace:build
# 保留：dev:host:start:pg（仅 PostgreSQL 容器，属冻结口径允许项）。
#
# 误触记录（2026-10-09）：曾误启 test:e2e:compose 触发三镜像构建；
# runtime 构建中止、agent 镜像已删除、无容器/卷/网络残留。
# ============================================================================

[env]
NODE_OPTIONS = "--max-old-space-size=2048"
# sccache 试点结论（2026-11-05，**未启用**）：sccache 0.19.0 已装入 mise 全局，
# 但在本机（rustup shim + Windows）实测**每个编译都返回 `UnhandledCompile`**（`SCCACHE_LOG=debug` 实证），
# 换 target 目录与直接调 rustc 均 0 命中 ⇒ **零收益**，故不写入 `RUSTC_WRAPPER`。
# 另：无条件设置 RUSTC_WRAPPER 会让未安装 sccache 的机器直接构建失败，属可移植性回归。
# 需要继续诊断时按 `scripts/worktree-env.ps1 -EnableSccache` 单次开启，不要改回本文件。
# uv cache: 使用 uv 自身默认位置（不再写死盘符）。需要与其它项目共享缓存的人
# 自行在外层 shell 设置 UV_CACHE_DIR；本仓库不替用户决定机器布局。
#
# Rust 构建产物根（PLAN-0656 的 task-80 收口）：语法侧只有这一个 knob
#   `XH_CARGO_TARGET_ROOT`。显式设置后主检出落 `<root>/{main,stack-N,e2e}`，
#   linked worktree 落 `<root>/<worktree 目录名>/{…}`（两个 lane 跑同一个 stack 不会
#   互相覆盖 exe —— 那正是 BL-221 的失效模式，只是换了盘）。
#   优先级：CARGO_TARGET_DIR（worktree-env.ps1 / 手工覆盖）> 本变量 > 旧推导
#   `<one>/.tmp/cargo-target`。**未设本变量时行为与引入前逐字节相同**，这是回归断言。
#   **本机真值不入库**：写进 gitignored 的 `mise.local.toml`，形如
#     [env]
#     XH_CARGO_TARGET_ROOT = '<本机绝对路径>'
#   （优先级高于本文件）。本文件只写契约、不写机器绝对路径——换盘/换机只改
#   `mise.local.toml`，不动仓库；本机示例见 DEV-002 §6。变量指向不存在的目录或
#   相对路径时脚本 fail-fast，绝不静默回落到旧盘。
#   覆盖范围：经 `scripts/cargo-run.mjs` 的 mise cargo 任务（build / test / lint / sweep）
#   落 `<root>`；**未经 wrapper 的裸 `cargo` 与 IDE/rust-analyzer 仍按 `.cargo/config.toml`
#   落 `<one>/.tmp/cargo-target/main`**（刻意保留的残余，见 DEV-002 §6）。

[tools]
node = "24"
pnpm = "10"
python = "3.14"
uv = "latest"
java = "temurin-25"
maven = "3.9"
rust = "1.97.1"

[tasks.setup]
depends = ["setup:ui", "setup:agent", "setup:cp", "setup:runtime"]
description = "Install dependencies for all active modules"
alias = "setup"

[tasks."setup:ui"]
run = "pnpm install"
description = "Install UI dependencies"
dir = "packages/ui"
alias = "setup:ui"

[tasks."setup:agent"]
run = "uv sync --all-extras"
description = "Sync Python dependencies for the agent"
dir = "packages/agent"
alias = "setup:agent"

[tasks."setup:cp"]
run = "mvn dependency:resolve"
description = "Resolve Maven dependencies for the control plane"
dir = "packages/control-plane"
alias = "setup:cp"

[tasks."setup:runtime"]
run = "cargo fetch"
description = "Fetch Rust dependencies for the runtime"
dir = "packages/runtime"
alias = "setup:runtime"

[tasks.dev]
depends = ["dev:ui"]
description = "Start the UI development server (backend must be running)"
alias = "dev"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:full"]
# run = "bash scripts/dev-all.sh"
# description = "Start all 4 modules via Docker + UI on host (Ctrl+C cleans up containers)"
# alias = "dev:full"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:backend"]
# run = "bash -c 'trap \"docker compose down\" EXIT; docker compose up --build runtime control-plane agent postgres'"
# description = "Start runtime, agent, control plane via Docker Compose"
# alias = "dev:backend"

[tasks."dev:ui"]
run = "node ../../scripts/stack-run.mjs ui"
description = "Start the UI development server (Windows native; port from XIHE_STACK_ID)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:ui"

[tasks."dev:agent"]
run = "node ../../scripts/stack-run.mjs agent"
description = "Start the agent service (Windows native; port from XIHE_STACK_ID)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:agent"

[tasks."dev:cp"]
run = "node ../../scripts/stack-run.mjs cp"
description = "Start the control plane (Windows native; port from XIHE_STACK_ID)"
dir = "packages/control-plane"
env = { XIHE_ENV = "dev" }
alias = "dev:cp"

[tasks."dev:runtime"]
run = "node ../../scripts/stack-run.mjs runtime"
description = "Start the runtime service (Windows native; port from XIHE_STACK_ID)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:runtime"

[tasks.build]
depends = ["build:ui", "build:runtime"]
description = "Build all production artifacts"
alias = "build"

[tasks."build:ui"]
run = "pnpm run build"
description = "Build the UI bundle"
dir = "packages/ui"
alias = "build:ui"

# task-80 (2026-11-08): cargo tasks below go through scripts/cargo-run.mjs, which
# injects CARGO_TARGET_DIR=<XH_CARGO_TARGET_ROOT>/[<worktree>/]main ONLY when the
# variable is set (unset => bare cargo, byte-identical to before). Cargo itself does
# not read that variable, so without the wrapper these tasks rebuild a multi-GB cache
# on H: even though the dev stacks already build on the configured root.
# Intentionally still bare: `cargo fetch` (writes CARGO_HOME, not the target dir).
[tasks."build:runtime"]
run = "node ../../scripts/cargo-run.mjs build --release"
description = "Build all runtime binaries (lib + 3 bin targets)"
dir = "packages/runtime"
alias = "build:runtime"

[tasks.test]
depends = ["test:ui", "test:agent", "test:cp", "test:runtime:lib", "test:cli"]
description = "Run all tests"
alias = "test"

[tasks."test:cli"]
run = "node --test scripts/xihe-cli.test.mjs scripts/xihe-cli/skill.test.mjs scripts/xihe-cli/window-preflight.test.mjs scripts/lib/stack-ports.test.mjs scripts/lib/env-file.test.mjs scripts/lib/env-values.test.mjs scripts/lib/dev-admin-password.test.mjs scripts/lib/reset-admin-input.test.mjs scripts/lib/service-supervisor.test.mjs scripts/lib/llm-env.test.mjs scripts/lib/cp-boot-plan.test.mjs scripts/lib/wait-for-cp-budget.test.mjs scripts/lib/e2e-rounds.test.mjs scripts/lib/e2e-test-counts.test.mjs scripts/lib/e2e-preflight-disk.test.mjs scripts/lib/e2e-host-cli.test.mjs scripts/stack-run.test.mjs scripts/e2e-host-readiness.test.mjs scripts/test-wiring.test.mjs scripts/pkg/phase-parity.test.mjs scripts/pkg/ports-json.test.mjs scripts/pkg/launcher-security.test.mjs scripts/pkg/launcher-security-behavior.test.mjs scripts/env-log-level.test.mjs scripts/lib/stack-cargo-target.test.mjs scripts/lib/stack-adopt.test.mjs scripts/lib/stack-orphan.test.mjs scripts/lib/stack-lease.test.mjs scripts/lib/kill-guard.test.mjs scripts/lib/cp-build-info.test.mjs scripts/lib/cp-build-dir.test.mjs scripts/lib/build-commit-env.test.mjs scripts/lib/stack-cp-args.test.mjs scripts/__tests__/check-event-keys.test.mjs scripts/check-e2e-inpage-bypass.test.mjs scripts/check-e2e-block-comments.test.mjs scripts/check-test-global-state.test.mjs scripts/run-with-timeout.test.mjs scripts/check-provider-catalog.test.mjs scripts/check-ui-inplace-mutation.test.mjs scripts/check-cp-baseline.test.mjs scripts/check-commit-msg.test.mjs scripts/check-doc-line-refs.test.mjs scripts/lib/cp-jar-sidecar.test.mjs scripts/lib/e2e-build-artifact.test.mjs scripts/lib/e2e-preflight-gate.test.mjs scripts/lib/e2e-runtime-target.test.mjs scripts/lib/e2e-host-boot-phases.test.mjs scripts/lib/e2e-child-exit.test.mjs scripts/xh-verify-gates.test.mjs scripts/check-mock-baseline.test.mjs scripts/check-test-executed.test.mjs scripts/i18n-scan.test.mjs scripts/lane-sync-hot.test.mjs scripts/lib/user-env.test.mjs scripts/perf/run-baseline.seed.test.mjs scripts/gen-api-docs.test.mjs scripts/validate-openapi.test.mjs scripts/check-api-types-drift.test.mjs scripts/l2/shard-report.test.mjs scripts/l2/lib/coverage-verdict.test.mjs scripts/e2e-window-preflight.test.mjs scripts/gate-receipt-read.test.mjs scripts/lib/gate-receipt.test.mjs scripts/gate-screenshot-preflight.test.mjs scripts/check-e2e-spec-lane.test.mjs && node scripts/check-test-global-state.mjs"
description = "Run every scripts/**/*.test.mjs unit test (explicit file list pinned by scripts/test-wiring.test.mjs) + BL-262 static guard: no unguarded process-global mutation in Rust test code"
alias = "test:cli"

[tasks."test:mock"]
run = "pnpm exec playwright test --config e2e/playwright.config.ts e2e/mock --workers=4"
description = "Mock-lane browser suite — no backend needed (Playwright starts its own Vite dev server). Gate semantics: real failures fail the task; known flaky cases are absorbed by Playwright retries. Proven able to go red (2026-11-03: 48 failures at baseline ⇒ 当日修复转绿，48 的出处 = 提交 `b96b1ed7b` 正文「141P/48F」；现行读数以 `packages/ui/e2e/mock-baseline.json` 的 `counts` 为准). Two env pins are load-bearing: XIHE_E2E_BROWSER_CHANNEL=chrome-beta (the bundled chromium revision expected by this Playwright version is not installed — without it every launch fails with 'Executable doesn't exist at ...chromium_headless_shell-1243'), and --workers=4 (at the default 16 workers on a loaded machine the lane produces rotating page.goto/visibility timeouts that are indistinguishable from real regressions)."
dir = "packages/ui"
env = { XIHE_E2E_PROFILE = "mock", XIHE_E2E_BROWSER_CHANNEL = "chrome-beta", XIHE_MOCK_REPORT = "1" }
alias = "test:mock"

# task-47（PLAN-0752 后续）：S1 浏览器面**快车道**。全量 test:mock 实测 903 s / 317 用例 / 64 红
# （2026-11-10，含并发负载放大），只能留 L2；这里钉 29 个文件 —— 实测全绿、203 s test-time、
# 墙钟 60–90 s，覆盖设置区 IA / 导航 / 主题色阶 / i18n / 无障碍 / workspace 管理 / 轻量会话矩阵。
#
# 清单必须**留在这里**，不得只留 .tmp 指针：.tmp 是 gitignored，指针等于没留
# （规则出处 internal/A03-xihe/docs/mock-baseline-provenance.md）。增删本清单时同批更新本节。
#
# 端口硬约束：playwright.config.ts 默认 XIHE_UI_PORT=12630，**落在验证窗口禁用段 12630-12633**，
# 所以这里不设默认值、未设置即 exit 2（防止窗口期默默占用别人的端口段）。
[tasks."test:mock:smoke"]
run = '''
node -e "const p=Number(process.env.XIHE_UI_PORT||0);if(!p){console.error('[test:mock:smoke] XIHE_UI_PORT 未设置：playwright.config.ts 的默认端口是 12630，它落在验证窗口禁用段 12630-12633 内 ⇒ 窗口期会默默占别人的段。请显式给一个空闲端口，例如 $env:XIHE_UI_PORT=12730。');process.exit(2)}if(p>=12630&&p<=12633){console.error('[test:mock:smoke] XIHE_UI_PORT='+p+' 落在窗口禁用段 12630-12633，请换一个（如 12730）。');process.exit(2)}" && pnpm exec playwright test --config e2e/playwright.config.ts --workers=4 e2e/mock/plan-0752-settings-ia.spec.ts e2e/mock/plan-0560-settings.spec.ts e2e/mock/plan0678-config-surfaces.spec.ts e2e/mock/tab-navigation.spec.ts e2e/mock/theme.spec.ts e2e/mock/i18n-switch.spec.ts e2e/mock/screenshots.spec.ts e2e/mock/viewport-matrix.spec.ts e2e/mock/plan-0631-color.spec.ts e2e/mock/aria-label.spec.ts e2e/mock/toast.spec.ts e2e/mock/login.spec.ts e2e/mock/workspace-management.spec.ts e2e/mock/workspace-members.spec.ts e2e/mock/workspace-files.spec.ts e2e/mock/task-continuity.spec.ts e2e/mock/policy-management.spec.ts e2e/mock/plan0702-mobile-safe-area.spec.ts e2e/mock/prefers-reduced-motion.spec.ts e2e/mock/session-agent-selection.spec.ts e2e/mock/agents-tab.spec.ts e2e/mock/session-matrix-to.spec.ts e2e/mock/session-matrix-roles.spec.ts e2e/mock/session-matrix-mention.spec.ts e2e/mock/audit.spec.ts e2e/mock/knowledge-base.spec.ts e2e/mock/data-controls.spec.ts e2e/mock/export-command.spec.ts e2e/mock/x-demo-card.spec.ts e2e/mock/x-demo-html-selfcheck.spec.ts e2e/mock/r17-viewer-readonly-surfaces.spec.ts
'''
description = "Mock-lane S1 smoke (31 spec files, 实测 77 s〔2026-11-15 单次实测，端口 28640，workers=4，报告 duration 75.5 s〕) for verification windows — no backend needed (Playwright starts its own Vite dev server). 与全量 test:mock（L2）互补：全量留 L2，本任务进 verify 类。全量读数**以 `packages/ui/e2e/mock-baseline.json` 的 `counts` 为唯一 SSOT**（此处不复制数字：历史上确曾在本次任务描述里记过**时点绑定**的实跑读数，但那是**第三份副本**且已漂（曾写 expected 328 / skipped 20，而 baseline 现已 291 / 68）⇒ 现行口径是「读数只写在 baseline，据历史值请查 git 历史与 `mock-baseline.json`」，避免副本各自过期）。**XIHE_UI_PORT 必须显式设置**（未设置或落在 12630-12633 直接 exit 2），因为 playwright.config.ts 的默认端口在窗口禁用段内。"
dir = "packages/ui"
env = { XIHE_E2E_PROFILE = "mock", XIHE_E2E_BROWSER_CHANNEL = "chrome-beta", XIHE_MOCK_REPORT = "1" }
alias = "test:mock:smoke"

# task-249 B（D-1649，2026-11-16）：preview 链路车道上线。A 段（方案 D，D-1625）已给两个 preview spec
# 加了跑法守卫（XIHE_E2E_EXPECT_CHAIN !== "preview" ⇒ skip 带原因）；本任务把 preview 车道从一次性
# 命令变成可复跑的 mise 入口，防 skip 腐烂成「报表上像通过」（D-1610 同族）。
# 只钉这 2 个文件（11 用例）：EXPECT_CHAIN=preview 会把 /workspace/** 入口改写成 preview-real.html
# （注入 mock 登录态），e2e/mock 的其他 spec 不按该链路设计，不得整目录跑。
# 不写 JSON 报告（不设 XIHE_MOCK_REPORT）⇒ 不碰全量基线报告 .mock-report.json 与 smoke 的子集报告。
# 端口与 smoke 同口径：显式 XIHE_UI_PORT 必填、禁段 12630-12633。
# 链路守卫：实测 mise 2026.7.15 的 task env **覆盖**父进程同名变量（父进程带 EXPECT_CHAIN=index
# 仍跑 preview，11 passed，2026-11-16 实测）。守卫是 fail-fast 断言：生效 env 若不是 preview
# （未来 mise 语义变化 / 绕过 task 直跑内层命令），exit 2 —— 防 11 条全 skip 且 exit 0 的假绿。
# stale-deps：vite deps 冷缓存首跑可能 env(stale-deps) 红，再跑一次即预热稳态（spec 头注释同口径）。
[tasks."test:mock:preview"]
run = '''
node -e "const p=Number(process.env.XIHE_UI_PORT||0);if(!p){console.error('[test:mock:preview] XIHE_UI_PORT 未设置：请显式给一个空闲端口（如 28642），避免与并行车道/验证窗口静默撞端口。');process.exit(2)}if(p>=12630&&p<=12633){console.error('[test:mock:preview] XIHE_UI_PORT='+p+' 落在窗口禁用段 12630-12633，请换一个（如 28642）。');process.exit(2)}if(process.env.XIHE_E2E_EXPECT_CHAIN!=='preview'){console.error('[test:mock:preview] 生效 XIHE_E2E_EXPECT_CHAIN='+JSON.stringify(process.env.XIHE_E2E_EXPECT_CHAIN)+' 不是 preview（task env 本应注入 preview；见到此说明 env 语义变化或在直跑内层命令），11 条会全 skip 成假绿，拒绝跑。');process.exit(2)}" && pnpm exec playwright test --config e2e/playwright.config.ts --workers=1 --retries=0 e2e/mock/task25-preview-sessions.spec.ts e2e/mock/task449-workspace-agents.spec.ts
'''
description = "Preview-chain lane (task-249 B, D-1649): runs ONLY the 2 preview specs (task25-preview-sessions + task449-workspace-agents, 11 cases) with XIHE_E2E_EXPECT_CHAIN=preview — config injects XIHE_UI_MOCK_API=1 and rewrites /workspace/** entries to preview-real.html (mock login). In the default mock lane these 11 cases are skipped with a reason; this lane is what actually runs them (skip-rot prevention, D-1610 family). No backend needed (Playwright starts its own Vite dev server). XIHE_UI_PORT is REQUIRED (unset or in 12630-12633 exits 2); the effective XIHE_E2E_EXPECT_CHAIN is asserted to be preview before running (all-skip with exit 0 would be a false green; measured mise 2026.7.15 task env overrides parent env). --workers=1 --retries=0. A cold vite deps cache can fail the first run with env(stale-deps) — rerun once for the warm steady state. Writes no JSON report (never touches .mock-report.json / mock-baseline). NOT part of validate."
dir = "packages/ui"
env = { XIHE_E2E_PROFILE = "mock", XIHE_E2E_BROWSER_CHANNEL = "chrome-beta", XIHE_E2E_EXPECT_CHAIN = "preview" }
alias = "test:mock:preview"
# PLAN-0735 / BL-164: mock-lane baseline gate. Reads packages/ui/e2e/.mock-report.json
# (written by test:mock above via the playwright config JSON reporter) and compares counts
# + skip titles against packages/ui/e2e/mock-baseline.json. The report is a runtime artifact
# and stays untracked.
# task-250 model "C": counts.expected/skipped AUTO-FOLLOW the actual collected numbers by default
# (written only when failed=0; with failed≠0 nothing is written and the run still fails). Count
# drift is therefore no longer a red on its own. What still reds: unregistered/retired skip titles
# (--allow-drift accepts those deliberately), a non-zero baseline flaky, a stale or subset report.
# Semantics live in DEV-020 zh §3.6.2 / en §3.3.2 — do not restate them here.
#
# task-179 (Lead ruling 2026-11-13): `expected`/`skipped`/`failed` stay exact; `flaky` is NOT
# compared exactly (concurrent lanes made that cycle-false-red). Instead four orthogonal rules:
#   (1) flaky case ∩ spec files this change touched ⇒ E_MOCK_FLAKY_IN_CHANGED_SPEC, exit 1;
#   (2) flaky outside that surface ⇒ WARN only, but names every case + that run's env evidence
#       (HEAD sha / porcelain lines / port / workers / java+node process counts);
#   (3) the baseline's `counts.flaky` MUST stay 0 — the gate rejects a non-zero baseline
#       (E_MOCK_BASELINE_FLAKY_NONZERO) so nobody can silence flaky by editing the baseline;
#   (4) the same case in >=3 consecutive runs ⇒ E_MOCK_FLAKY_PERSISTENT and file a BL.
# task-225: when `flaky > 0` the gate ALSO prints a "可能原因（提示，不作判定）" hint line — a
# shared artifact directory across concurrent Playwright processes makes `retries` absorb the
# noise into `flaky`; the hint names `XIHE_MOCK_OUTPUT_DIR` (task-224) as the isolation knob.
# It is a hint only: it never changes the verdict or the exit code.
# Self-test: `node scripts/check-mock-baseline.mjs --selftest` — the fixture count is whatever
# that command prints (`OK: N case(s)`); **do not pin a number here**. It already went stale once:
# task-227 wrote 10, task-250 (e2b489152) raised it to 16 and nobody updated this line (task-260).
# Includes the negative-control pair: inside the change surface ⇒ exit 1, same report moved out ⇒ exit 0.
[tasks."check:mock-baseline"]
run = "node scripts/check-mock-baseline.mjs"
dir = "."
alias = "check:mock-baseline"

[tasks."test:ui"]
run = "pnpm run test:unit"
description = "Run the UI unit test suite"
dir = "packages/ui"
alias = "test:ui"

[tasks."test:e2e:fixtures"]
# PLAN-0648: e2e 测试夹具自身的状态机（fake LLM mode=chain 的会话游标 / 重试重放 /
# 耗尽回落）在真栈上只表现为"工具莫名不出现"，排障成本极高；这里用 node:test 直接
# 守住状态机：不起栈、不开浏览器、秒级。改 e2e/fixtures 的模式机必须先跑这条。
run = "pnpm run test:e2e:fixtures"
description = "Run e2e fixture self-tests (fake LLM chain state machine; no stack, seconds)"
dir = "packages/ui"
alias = "test:e2e:fixtures"

[tasks."test:agent"]
run = "uv run pytest"
description = "Run the agent test suite"
dir = "packages/agent"
alias = "test:agent"

[tasks."gate:agent-quality"]
run = "uv run python -m xihe_agent.evaluation gate"
description = "Local quality-regression gate (PLAN-0512/0540) over one report per lane; pass --report/--baseline after --"
dir = "packages/agent"
alias = "gate:agent-quality"

[tasks."test:cp:live-chain"]
  # task-618: 真链路测试的**指定档**。ContextSourceLiveChainTest 用 Assumptions.assumeTrue 守环境，
  # 没有 live stack 时它在普通 test:cp 里是 **skipped**（surefire 视为不失败）⇒「已验证」与「没跑过」不可区分。
  # 本档要求它真的跑：skip ⇒ 红（第二段命令把 skip 变成 exit 1 并打印 assume 失败原因与行号）。
  # 前置=起了 dev 栈（Runtime :12645 可 /ready、CP :12631 可 /actuator/health）；不进 validate（需要活栈）。
  run = [
    "cmd /c mvn -o -q test -Dtest=ContextSourceLiveChainTest -Dsurefire.failIfNoSpecifiedTests=false",
    "node ../../scripts/check-surefire-skips.mjs --dir target/surefire-reports --class com.cc01cc.p.xihe.cp.context.ContextSourceLiveChainTest --max-skipped 0"
  ]
  description = "task-618 live-chain: run ContextSourceLiveChainTest and FAIL if it was skipped (needs a live dev stack; not in validate)"
  dir = "packages/control-plane"
  alias = "test:cp:live-chain"

