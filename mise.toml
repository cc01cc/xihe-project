# ============================================================================
# 冻结说明（2026-10-07 用户裁定；2026-10-09 强调并已注释任务）
#
# XH 的 Docker 构建与服务容器化全部暂缓、冻结：只有 PostgreSQL 保留为
# Docker 容器，CP / Agent / Runtime / UI 一律以宿主进程运行。
#   日常开发：mise run dev:host
#   验收/隔离 E2E：mise run test:e2e:host（PG 容器 + 全 host 服务）
#
# 已注释冻结的 docker 相关任务（解冻必须经用户明确裁定，并同步
# AGENTS.md / DEV-002 / DEV-020 后恢复）：
#   dev:full、dev:backend、test:e2e:compose、test:e2e、image:workspace:build
# 保留：dev:host:start:pg（仅 PostgreSQL 容器，属冻结口径允许项）。
#
# 误触记录（2026-10-09）：曾误启 test:e2e:compose 触发三镜像构建；
# runtime 构建中止、agent 镜像已删除、无容器/卷/网络残留。
# ============================================================================

[env]
NODE_OPTIONS = "--max-old-space-size=2048"

[tools]
node = "24"
pnpm = "10"
python = "3.12"
uv = "latest"
java = "temurin-25"
maven = "3.9"
rust = "1.97.1"

[tasks.setup]
depends = ["setup:ui", "setup:agent", "setup:cp", "setup:runtime"]
description = "Install dependencies for all active modules"
alias = "setup"

[tasks."setup:ui"]
run = "pnpm install"
description = "Install UI dependencies"
dir = "packages/ui"
alias = "setup:ui"

[tasks."setup:agent"]
run = "uv sync --all-extras"
description = "Sync Python dependencies for the agent"
dir = "packages/agent"
alias = "setup:agent"

[tasks."setup:cp"]
run = "mvn dependency:resolve"
description = "Resolve Maven dependencies for the control plane"
dir = "packages/control-plane"
alias = "setup:cp"

[tasks."setup:runtime"]
run = "cargo fetch"
description = "Fetch Rust dependencies for the runtime"
dir = "packages/runtime"
alias = "setup:runtime"

[tasks.dev]
depends = ["dev:ui"]
description = "Start the UI development server (backend must be running)"
alias = "dev"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:full"]
# run = "bash scripts/dev-all.sh"
# description = "Start all 4 modules via Docker + UI on host (Ctrl+C cleans up containers)"
# alias = "dev:full"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:backend"]
# run = "bash -c 'trap \"docker compose down\" EXIT; docker compose up --build runtime control-plane agent postgres'"
# description = "Start runtime, agent, control plane via Docker Compose"
# alias = "dev:backend"

[tasks."dev:ui"]
run = "node ../../scripts/dev-ui-host.mjs --mode dev --host 127.0.0.1 --port 12630 --strictPort"
description = "Start the UI development server (Windows native)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:ui"

[tasks."dev:agent"]
run = "uv run python -m xihe_agent.main"
description = "Start the agent service (Windows native)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:agent"

[tasks."dev:cp"]
run = "mvn spring-boot:run"
description = "Start the control plane (Windows native)"
dir = "packages/control-plane"
env = { XIHE_ENV = "dev" }
alias = "dev:cp"

[tasks."dev:runtime"]
run = "cargo run --bin xihe-runtime"
description = "Start the runtime service (Windows native)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:runtime"

[tasks.build]
depends = ["build:ui", "build:runtime"]
description = "Build all production artifacts"
alias = "build"

[tasks."build:ui"]
run = "pnpm run build"
description = "Build the UI bundle"
dir = "packages/ui"
alias = "build:ui"

[tasks."build:runtime"]
run = "cargo build --release"
description = "Build all runtime binaries (lib + 3 bin targets)"
dir = "packages/runtime"
alias = "build:runtime"

[tasks.test]
depends = ["test:ui", "test:agent", "test:cp", "test:runtime:lib", "test:cli"]
description = "Run all tests"
alias = "test"

[tasks."test:cli"]
run = "node --test scripts/xihe-cli.test.mjs"
description = "Run the dev/ops CLI unit tests"
alias = "test:cli"

[tasks."test:ui"]
run = "pnpm run test:unit"
description = "Run the UI unit test suite"
dir = "packages/ui"
alias = "test:ui"

[tasks."test:agent"]
run = "uv run pytest"
description = "Run the agent test suite"
dir = "packages/agent"
alias = "test:agent"

[tasks."test:cp"]
run = "mvn test"
description = "Run the control plane test suite"
dir = "packages/control-plane"
alias = "test:cp"

[tasks."test:runtime"]
run = "cargo test"
description = "Run the runtime test suite (all, sandbox tests need Docker)"
dir = "packages/runtime"
alias = "test:runtime"

[tasks."test:runtime:lib"]
run = "cargo test --lib"
description = "Run runtime unit tests only (no Docker needed)"
dir = "packages/runtime"
alias = "test:runtime:lib"

# [FROZEN 2026-10-07] Compose lane 冻结，见文件头冻结说明
# [tasks."test:e2e:compose"]
# run = "node scripts/e2e-compose.mjs"
# description = "Run Compose-compatible end-to-end tests (auto-start/stop frozen Docker Compose)"
# alias = "test:e2e:compose"

# [FROZEN 2026-10-07] Compose lane 冻结（旧名一并冻结），见文件头冻结说明
# [tasks."test:e2e"]
# run = "node scripts/e2e-compose.mjs"
# description = "Deprecated alias of test:e2e:compose (Compose-compatible E2E)"
# alias = "test:e2e"

[tasks."test:e2e:host"]
run = "node scripts/e2e-host.mjs"
description = "Run host-only E2E tests in an isolated per-run native stack"
alias = "test:e2e:host"

[tasks.xihe]
run = "node scripts/xihe.mjs"
description = "Run the XH development and operations CLI; pass command arguments after --"
alias = "xihe"

[tasks."test:e2e:host:real"]
run = "node scripts/xihe.mjs test real"
description = "Run one explicit real-MiMo host spec; pass the spec and --route after --"
alias = "test:e2e:host:real"

[tasks."test:integration"]
depends = ["test:integration:t2", "test:integration:t3"]
description = "Run backend integration tests — T2 (no Docker) + T3 (auto Docker partial stack)"
alias = "test:integration"

[tasks."test:integration:t2"]
run = "C:/Progra~1/Git/bin/bash.exe scripts/mise/integration-test-t2.sh"
description = "Run T2 cross-module stub integration tests (no Docker required)"
alias = "test:integration:t2"

[tasks."test:integration:t3"]
run = "C:/Progra~1/Git/bin/bash.exe scripts/mise/integration-test-t3.sh"
description = "Run T3 cross-module real integration tests (requires Docker)"
alias = "test:integration:t3"

[tasks.lint]
depends = ["lint:ui", "lint:agent", "lint:cp", "lint:runtime", "lint:log-secrets"]
description = "Run all linters"
alias = "lint"

[tasks."lint:log-secrets"]
run = "node scripts/scan-log-secrets.mjs"
description = "Scan logs/ for credential leakage (PLAN-196 gate)"

[tasks."lint:ui"]
run = "pnpm run lint"
description = "Run UI lint (oxlint)"
dir = "packages/ui"
alias = "lint:ui"

[tasks."lint:agent"]
run = "uv run ruff check && uv run mypy src/"
description = "Run Agent lint (ruff + mypy)"
dir = "packages/agent"
alias = "lint:agent"

[tasks."lint:cp"]
run = "mvn checkstyle:check"
description = "Run CP lint (Checkstyle)"
dir = "packages/control-plane"
alias = "lint:cp"

[tasks."lint:runtime"]
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
description = "Run Runtime lint (rustfmt check + clippy all-targets)"
dir = "packages/runtime"
alias = "lint:runtime"

[tasks."lint:links"]
run = "C:/Progra~1/Git/bin/bash.exe scripts/check-doc-links-entry.sh ."
description = "Check documentation links (no escape from docs/)"
alias = "lint:links"

[tasks.typecheck]
depends = ["typecheck:ui"]
description = "Run static type checks"
alias = "typecheck"

[tasks."typecheck:ui"]
run = "pnpm run typecheck"
description = "Run UI type check (vue-tsc)"
dir = "packages/ui"
alias = "typecheck:ui"

[tasks.format]
run = "bash scripts/mise/format.sh"
description = "Format code across modules"
alias = "format"

[tasks.validate]
depends = ["lint", "typecheck", "build", "test", "lint:links"]
description = "Run all quality gates — lint + typecheck + build + test (Docker auto-managed)"
alias = "validate"

[tasks."validate:full"]
depends = ["validate", "test:runtime", "test:integration"]
description = "Run full validation + integration (Compose E2E frozen — see file-top freeze note; PG container only)"
alias = "validate:full"

[tasks."dev:host"]
depends = ["dev:host:start:pg"]
run = [
  { tasks = ["dev:host:start:cp", "dev:host:start:agent", "dev:host:start:runtime", "dev:host:start:ui"] }
]
description = "Start PostgreSQL in Docker and CP/Agent/Runtime/UI; does not import config or create provider connections"
alias = "dev:host"

[tasks."dev:host:import-config"]
run = "node scripts/xihe.mjs config import config.import.local.jsonc"
description = "Explicitly import non-secret local config after CP is ready; not part of dev:host startup"
dir = "."
alias = "dev:host:import-config"

[tasks."dev:host:provider-init"]
run = "node scripts/xihe.mjs dev init"
description = "Initialize/verify an explicit provider and scope; pass CLI options after --"
dir = "."
alias = "dev:host:provider-init"

[tasks."dev:host:watch"]
run = "node scripts/dev-host-watch.mjs"
description = "Keep the mise-managed native host stack alive and restart it after a service failure"
alias = "dev:host:watch"

[tasks."dev:host:check"]
run = "node scripts/xihe.mjs dev check"
description = "Read-only preflight for host tools, Docker, ports, config sources, and workspace root"
alias = "dev:host:check"

[tasks."dev:reset"]
run = "pwsh -File scripts/dev-reset.ps1"
description = "Dry-run or explicitly reset local Xihe development data"
alias = "dev:reset"

[tasks."dev:host:stop"]
run = "pwsh -File scripts/dev-host.ps1 -Stop"
description = "Stop dev:host PostgreSQL and workspace Sandbox containers (preserve host storage)"
alias = "dev:host:stop"

[tasks."dev:host:check-config"]
run = "node scripts/dev-host-check-config.mjs"
description = "Print resolved host config sources and masked key values"
alias = "dev:host:check-config"

[tasks."dev:host:start:pg"]
run = "docker compose up -d --wait postgres"
description = "Start PostgreSQL container"
dir = "."
alias = "dev:host:start:pg"

[tasks."dev:host:start:cp"]
run = "mvn spring-boot:run"
description = "Start Control Plane (port 12631)"
dir = "packages/control-plane"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:cp"

[tasks."dev:host:start:agent"]
run = "uv run python -m xihe_agent.main"
description = "Start Agent (port 12632)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:agent"

[tasks."dev:host:start:runtime"]
run = "cargo run --bin xihe-runtime"
description = "Start Runtime (port 12633)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:runtime"

[tasks."dev:host:start:ui"]
run = "node ../../scripts/dev-ui-host.mjs --mode dev --host 127.0.0.1 --port 12630 --strictPort"
description = "Start UI dev server (port 12630)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:ui"

# [FROZEN 2026-10-07] docker 构建冻结，见文件头冻结说明（现存镜像可继续被 Runtime 使用）
# [tasks."image:workspace:build"]
# run = "docker build -t xihe/workspace -f docker/images/workspace/Dockerfile ."
# description = "Build the xihe/workspace Docker image (multi-stage)"
# alias = "image:workspace:build"

[tasks."reset-admin"]
run = "pwsh -NoProfile -File scripts/reset-admin.ps1"
description = "Reset dev admin@xihe.local password (random if not specified; PLAN-229)"
alias = "reset-admin"

[tasks.clean]
run = "rm -rf logs packages/*/target packages/*/dist packages/*/coverage"
description = "Remove build artifacts, logs, and temporary files"
alias = "clean"

[tasks."clean:runtime-sweep"]
run = "cargo sweep --time 7 && cargo sweep --maxsize 12GB"
description = "Sweep orphaned Rust artifacts (7d+ / 12GB cap, keeps live fingerprints, no rebuild)"
dir = "packages/runtime"
alias = "clean:runtime-sweep"

[tasks."check:runtime-target"]
run = "node scripts/check-runtime-target.mjs"
description = "Check Runtime target water lines (normal 12GB / watch >12GB / warn 15GB / force 20GB or H free <5GB; exit 1 = force)"
alias = "check:target"
