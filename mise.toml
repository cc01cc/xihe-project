# task-171 ②（D-1532 ③「逐步规范化减少 warning」）建门，**task-219（2026-11-15）改为按族拦并接线**。
# 判据 = **任一 rule 族**的计数不得超过 packages/ui/oxlint-warning-baseline.json 的 `byRule`；errors 恒为硬失败。
# **总数只打印、不拦**：总数会被「A 族 +2、B 族 −2」互相抵消而掩盖漂移 —— 2026-11-15 实测
# `consistent-type-imports` +3 的当天，若只看总数就会被别的族抹平；这条是 task-217 盘点漏过 3 条新警告的根因。
# 红点会点名「族 + 现值/基线 + 新增 file:line（基线存了 locations 时）」，并给出自愈单命令。
# 本门只读 oxlint 输出，**不要求工作树 clean**（不红在他人中间态）；自检 7 例：`--selftest`。
# 基线只许变小：`node packages/ui/scripts/check-lint-warnings.mjs --write-baseline` 收账（新增而变大须在卡面写原因）。
# 配套登记门：`node packages/ui/scripts/check-lint-rule-registry.mjs`（off 规则必须有登记行，exit 1 = 缺行）。
# 实测成本（2026-11-15 本机）：mise 包装冷启 2,720 ms（含一次全包 oxlint：709 文件 / 43 族）；二次连跑读数一致。
[tasks."check:lint-warnings"]
run = "node packages/ui/scripts/check-lint-warnings.mjs --enforce"
description = "UI oxlint warnings ratchet, per-rule (any rule above baseline ⇒ exit 1; total not gated; --write-baseline to re-baseline). Pair gate: node packages/ui/scripts/check-lint-rule-registry.mjs"

[tasks."lint:agent"]
run = "uv run ruff check && uv run mypy src/"
description = "Run Agent lint (ruff + mypy)"
dir = "packages/agent"
alias = "lint:agent"

[tasks."check:mise-env"]
run = "node scripts/check-mise-env.mjs"
description = "env 变量登记门（task-131 → task-273 fail-closed → task-313 挂 validate.depends 最前）：properties 里 XIHE_* 未登记 ⇒ WARN 且 exit 1（此前 fail-closed 但零自动执行者）"

[tasks."lint:cp"]
# task-583 把 checkstyle 钉进 Maven 的 validate 相位后，本任务与 test:cp 的 mvn 会在
# `mise run validate` 里**并发**跑（mise 的 depends 并行，实测两子任务同毫秒起止）；两者同 dir，
# 默认都会写 packages/control-plane/target/checkstyle-*（cachefile/checker.xml/result.xml）。
# 这里用仓库已有的 -Dxihe.build.suffix 把它挪到 target-lint/（.gitignore 的 **/target-*/ 已覆盖）
# ⇒ 各写各的目录，不串行、不降并行。**不是笔误，别删**。
run = 'mvn checkstyle:check "-Dxihe.build.suffix=-lint"'
description = "Run CP lint (Checkstyle)"
dir = "packages/control-plane"
alias = "lint:cp"

[tasks."lint:runtime"]
run = "node ../../scripts/cargo-run.mjs fmt --check && node ../../scripts/cargo-run.mjs clippy --all-targets -- -D warnings"
description = "Run Runtime lint (rustfmt check + clippy all-targets)"
dir = "packages/runtime"
alias = "lint:runtime"

[tasks."lint:links"]
run = "node scripts/mise/run-posix.mjs scripts/check-doc-links-entry.sh ."
description = "Check documentation links (no escape from docs/); skips and exits 0 when the ONE main checkout (and its scripts/check-doc-links.sh) is absent — same degradation as check:standalone (check:ports is fail-closed instead: missing ONE ⇒ exit 2)"
alias = "lint:links"

[tasks."lint:i18n"]
run = "node scripts/i18n-scan.mjs"
description = "i18n gate (task-96): zh-CN/en-US key-set diff + per-key {placeholder} drift + static t(\"…\") references resolved on both sides; read-only, silent on success, names file:line on failure (-- --json for structure, -- --root <dir> to scan another root)"
alias = "lint:i18n"

[tasks."lint:e2e"]
run = "node scripts/run-e2e-static-gates.mjs"
description = "E2E static hygiene gates, ALL gates always run and each exit is reported (task-66 aggregator: a red gate must not hide the next one; aggregate exit = worst of 1/2). (1) timeout budget (task-252) action/assertion ≤10s, test ≤30s, >10s literals need // timeout-exempt: <reason> and may not exceed 60s (budgets live in packages/ui/e2e/timeouts.ts, env-overridable E2E_*_TIMEOUT_MS); (2) block-comment early close (task-66) a glob path written inside a block comment closes the comment early and breaks the whole lane load (playwright --list = 0, No tests found)"
alias = "lint:e2e"

[tasks."perf:chat"]
run = "node scripts/perf/chat-gate.mjs"
description = "PLAN-0670 perf gate: one command boots the isolated perf stack, measures 1k/5k/20k, prints PASS/FAIL (p95/response bytes/heap peak/RSS growth) and always tears down; L2/release only, never stack-1/stack-2. Pass -- --dry-run / -- --self-check for a stack-free check, -- --with-ui for the WebUI stage"
alias = "perf:chat"

[tasks.typecheck]
depends = ["typecheck:ui"]
description = "Run static type checks"
alias = "typecheck"

[tasks."typecheck:ui"]
run = "pnpm run typecheck"
description = "Run UI type check (vue-tsc)"
dir = "packages/ui"
alias = "typecheck:ui"

[tasks."check:types"]
run = "pnpm --dir packages/ui run typecheck && pnpm --dir packages/ui run typecheck:e2e"
description = "D-727: TypeScript gates — UI vue-tsc + e2e spec typecheck (fail-fast; run in every verify window, ~20–40 s)"
alias = "check:types"

[tasks.format]
run = "node scripts/mise/run-posix.mjs scripts/mise/format.sh"
description = "Format code across modules"
alias = "format"

[tasks."check:plan-anchors"]
  # task-604（D-1046「门要么在链路上」）：selfcheck-plan 的 evidence 指针自检。
  # 它校验每一条 evidence 的锚点能否解析（键名 [tasks."x"] / 章节 §5 / 行号兜底 file:NNN !kw），
  # 挡住「指针指向空行 / 指向同文件另一个无关 task / 行号漂到无关内容」。接线时实测 51 锚点问题 0
  # （不制造恒红）；行号兜底剩 19 处（md 散文没有可锚键名），它们一旦漂就红在这条门上 —— 这正是接线目的。
  run = "node scripts/selfcheck-plan.mjs --check-anchors"
  description = "task-604: selfcheck-plan evidence 指针自检（键名/章节/行号兜底锚点 + !kw 关键词；有问题 exit 1）"
  alias = "check:plan-anchors"

[tasks.validate]
# test:e2e:fixtures 排在 UI 单测（test）之后、E2E 之前：它只跑 e2e 夹具自身的状态机
# （不起栈/秒级），放在 E2E 车道前面能最早暴露"夹具坏了导致的假绿"。
# task-237: check:api-docs 与 check:openapi 同段 —— 两者都是「契约/文档是否落后」的静态门，且 validate 已通过
# lint:agent 依赖 uv/python，把 python 依赖放这里不会污染纯 Maven 的 test:cp 车道（故不挂到 check:openapi 上）。
# task-313（D-1062 第 6a / 10a 项）：把两道「已绿但零自动执行者」的门接进来 ——
# ① check:mise-env 挂**最前**：毫秒级、已 fail-closed（WARN 非空 ⇒ exit 1），最便宜的失败放第一位；
#    **depends 为并行执行，首个失败即中止**（2026-11-12 实测注入 WARN 后 35.2 s 收口）；排在首位的理由是
#    毫秒级且无外部依赖，**不是执行顺序** —— 别把这条读成"串行第一步"。
# ② check:openapi:lint 紧贴 check:openapi：文档承诺「HTTP 形态四道门全绿才算现行」，此前它无执行者；
#    实测 errors=0 / warnings=124，而 redocly 只按 errors 退出、本命令也没设 --max-warnings ⇒ 不制造恒红。
# 不接的两类（同卡 10b / 10d）：check:docs-gates 走 monitor 第⑧问（慢且依赖其它仓状态，接进来会拖垮每次提交）；
# 其余 report-only 门只登记不接 —— 接进去等于把 report-only 偷偷变阻断，那是策略变更，不是接线。
# task-266 / D-1132 / D-1133：`check:font` 已**从 validate 摘除**（2026-11-13）。字体自托管整案缓做（BL-622），
# 实现（产物 + 四脚本 + 决策稿）搬去 ONE 侧 `internal/A03-xihe/deferred/font-self-hosted/`。
# 任务定义仍留在下方 `[tasks."check:font"]`（可手动复跑），但**不再是任何门的依赖** ——
# 一条指向已搬走脚本的门挂在这里，会让 validate 恒红（这正是 D-1133 说的「留着就是干扰」）。
depends = ["check:mise-env", "check:openapi", "check:openapi:lint", "check:api-docs", "check:plan-anchors", "check:runtime:ignored", "check:commit-msg", "lint", "typecheck", "build", "test", "test:e2e:fixtures", "lint:links"]
description = "Run all quality gates — check:mise-env + check:openapi + check:openapi:lint + check:api-docs + check:commit-msg + lint + typecheck + build + test (ui/agent/cp/runtime lib/cli) + test:e2e:fixtures + lint:links; no Docker step in the chain (CP defaults to H2, runtime uses --lib, agent deselects integration)"
alias = "validate"

[tasks."validate:full"]
depends = ["validate", "test:runtime", "test:integration"]
description = "Run full validation + integration (Compose E2E frozen — see file-top freeze note; PG container only)"
alias = "validate:full"

[tasks."dev:host"]
# task-16: 启动前检查 in-tree runtime target 水位（12/15/20GB；watch 只打印，<1s），
# 防止 `packages/runtime/target` 再次长到 GB 级。护栏实现见 scripts/check-runtime-target.mjs。
depends = ["dev:host:start:pg", "check:runtime-target"]
run = [
  { tasks = ["dev:host:start:cp", "dev:host:start:agent", "dev:host:start:runtime", "dev:host:start:ui"] }
]
description = "Start PostgreSQL in Docker and CP/Agent/Runtime/UI; does not import config or create provider connections"
alias = "dev:host"

# PLAN-0603: detached full-stack supervisor (survives terminal/turn exit; waits for readiness).
# `mise run dev:stack -- --stack 4 --with-pg`; status/stop: `node scripts/dev-stack.mjs status|stop`.
[tasks."dev:stack"]
run = "node scripts/dev-stack.mjs start"
description = "Start CP/Agent/Runtime/UI detached for the current stack (--stack N; --with-pg to include PostgreSQL)"
alias = "dev:stack"

# PLAN-0662 L4: read-only build-freshness view (每栈 cpBuild: runningCommit/headCommit/
# behind/stale/verdict). 只读，不重建、不重启；`-- --json` 是 lane 脚本消费的固定契约。
[tasks."dev:host:status"]
run = "node scripts/dev-stack.mjs status --all"
description = "Per-stack CP build freshness (commit/head/behind/stale/verdict) + service health; pass -- --json for the fixed contract"
dir = "."
alias = "dev:host:status"

[tasks."dev:host:import-config"]
run = "node scripts/xihe.mjs config import config.import.local.jsonc"
description = "Explicitly import non-secret local config after CP is ready; not part of dev:host startup"
dir = "."
alias = "dev:host:import-config"

[tasks."dev:host:provider-init"]
run = "node scripts/xihe.mjs dev init"
description = "Initialize/verify an explicit provider and scope; pass CLI options after --"
dir = "."
alias = "dev:host:provider-init"

[tasks."dev:host:watch"]
run = "node scripts/stack-run.mjs watch"
description = "Keep the mise-managed native host stack alive and restart it after a service failure"
alias = "dev:host:watch"

[tasks."dev:host:check"]
run = "node scripts/xihe.mjs dev check"
description = "Read-only preflight for host tools, Docker, ports, config sources, and workspace root"
alias = "dev:host:check"

[tasks."dev:reset"]
run = "pwsh -File scripts/dev-reset.ps1"
description = "Dry-run or explicitly reset local Xihe development data"
alias = "dev:reset"

[tasks."dev:host:stop"]
run = "pwsh -File scripts/dev-host.ps1 -Stop"
description = "Stop dev:host PostgreSQL and workspace Sandbox containers (preserve host storage)"
alias = "dev:host:stop"

[tasks."dev:host:check-config"]
run = "node scripts/dev-host-check-config.mjs"
description = "Print resolved host config sources and masked key values"
alias = "dev:host:check-config"

[tasks."dev:host:start:pg"]
run = "node scripts/stack-run.mjs pg"
description = "Start PostgreSQL container for the current stack"
dir = "."
alias = "dev:host:start:pg"

[tasks."dev:host:start:cp"]
run = "node ../../scripts/stack-run.mjs cp"
description = "Start Control Plane (port from XIHE_STACK_ID); build dir is per-stack/per-commit (BL-253 L3)"
dir = "packages/control-plane"
# BL-253 L3: no hardcoded XIHE_CP_TARGET_DIR any more — stack-run derives
# `<root>/<stackId>/<sha12>[-dirty]` (root default C:/xihe-build/cp, override XIHE_CP_BUILD_ROOT).
# 显式 XIHE_CP_TARGET_DIR 仍是最优先逃生口（原样透传，回滚通道）。
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:cp"

# BL-253 L3: explicit-only retention. Dry-run by default; `-- --apply` deletes the listed dirs.
[tasks."dev:host:cp-build:clean"]
run = "node scripts/cp-build-clean.mjs --all"
description = "Dry-run list of prunable CP build dirs per stack (keep newest 3 + pointer); pass -- --apply to delete"
dir = "."
alias = "dev:host:cp-build:clean"

# PLAN-0632 T4.4（方案 C，2026-11-05；task-180 分层预算 2026-11-11）：起 Agent 之前先等 CP readiness。
# 只约束 agent（cp/runtime/ui 仍在同一并行 group）；等待**按起栈路径分层**（判据 = 起 CP 前的 build-info
# 戳 vs HEAD，与 stack-run cp 的重建判据同源）：复用已构建 60s；重建路径（stale/missing/dirty，本次会先
# clean compile）默认 240s。覆盖 `XIHE_WAIT_FOR_CP_TIMEOUT`（两路径，秒）与
# `XIHE_WAIT_FOR_CP_REBUILD_TIMEOUT`（仅重建路径，秒）；超时仍由 wait-for-cp.mjs **显式失败**
# （exit 1 + 最后状态 + 预算 + CP 日志路径）⇒ mise depends 中止，不会起 agent。
# 依据：CP 不可达时 Agent 启动 config sync 白跑 2.81s 并 degraded 到下次刷新（D32-22/D32-27；实测见
# `one/.local/evidence/plan-0632-closeout.md` §T4.4）；task-178 首启 60s 被 clean compile 耗尽。
[tasks."dev:host:wait-for-cp"]
run = "node scripts/wait-for-cp.mjs"
description = "Wait for CP /actuator/health == 200 before starting the Agent (bounded, path-layered: reuse 60s / rebuild 240s; XIHE_WAIT_FOR_CP_TIMEOUT or XIHE_WAIT_FOR_CP_REBUILD_TIMEOUT override; timeout fails loudly)"
dir = "."
alias = "dev:host:wait-for-cp"

[tasks."dev:host:start:agent"]
depends = ["dev:host:wait-for-cp"]
run = "node ../../scripts/stack-run.mjs agent"
description = "Start Agent (port from XIHE_STACK_ID); waits for CP readiness first (PLAN-0632 T4.4)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:agent"

[tasks."dev:host:start:runtime"]
run = "node ../../scripts/stack-run.mjs runtime"
description = "Start Runtime (port from XIHE_STACK_ID)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:runtime"

[tasks."dev:host:start:ui"]
run = "node ../../scripts/stack-run.mjs ui"
description = "Start UI dev server (port from XIHE_STACK_ID)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:ui"

# PLAN-0603: 旧的 `dev:stack`（`node scripts/stack-run.mjs dev-host`，前台）已被上面的
# detached supervisor 取代（同名任务不能重复定义，否则 TOML 解析失败）。
# 等价迁移：`mise run dev:stack -- --stack <n>` 仍可用（新入口是超集：readiness/PG/worktree/stop）；
# 需要旧的前台行为时直接用 `node scripts/stack-run.mjs dev-host`。

# [FROZEN 2026-10-07] docker 构建冻结，见文件头冻结说明（现存镜像可继续被 Runtime 使用）
# [tasks."image:workspace:build"]
# run = "docker build -t xihe/workspace -f docker/images/workspace/Dockerfile ."
# description = "Build the xihe/workspace Docker image (multi-stage)"
# alias = "image:workspace:build"

[tasks."reset-admin"]
run = "pwsh -NoProfile -File scripts/reset-admin.ps1 -WriteBack"
description = "Reset dev admin@xihe.local password (random if not specified; PLAN-229; PLAN-0770: -WriteBack 把生效值写回 .local/dev/admin-password)"
alias = "reset-admin"

[tasks.clean]
run = "rm -rf logs packages/*/target packages/*/dist packages/*/coverage"
description = "PERMANENTLY remove logs and all package target/dist/coverage (no recycle bin; stop builds/services first)"
alias = "clean"

[tasks."clean:runtime-sweep"]
run = "node ../../scripts/cargo-run.mjs sweep --time 7 && node ../../scripts/cargo-run.mjs sweep --maxsize 12GB"
description = "Sweep orphaned Rust artifacts only in the current metadata target (7d+ / 12GB≈11.18GiB; keeps live fingerprints)"
dir = "packages/runtime"
alias = "clean:runtime-sweep"

[tasks."check:runtime-target"]
run = "node scripts/check-runtime-target.mjs"
description = "Check Runtime target water lines (normal 12GB / watch >12GB / warn 15GB / force 20GB or H free <5GB; exit 1 = force)"
alias = "check:target"

# PLAN-0612: 严格剥离 ONE 的验收门 —— 无父级目录副本上验证启动前置（不启动服务/容器）。
# 用 `--worktree`（临时 index 打包工作树）以便**提交前**验收；CI/提交后可用默认 HEAD 模式。
[tasks."check:standalone"]
run = "node scripts/check-standalone.mjs --worktree"
description = "Export a parent-less copy of the working tree and verify stack-run/dev-check work without the ONE workspace"
alias = "check:standalone"

# PLAN-0612: A03 端口事实源 vs ONE 端口分配镜像的 parity。找不到 one 根时**不再静默放行**：
# 裸脚本只打 SKIP（不写成 OK，json 里 skipped:true），本门带 --require-mirror ⇒ 缺 one 根即 exit 2
# （task-61 P1-3 / AC-3.1 / AC-3.4：否则这条唯一的镜像校验在脱离 ONE 的工作副本里永远不被触发）。
# task-67（2026-11-11）：模块分支写面门 —— 「每个共享文件恰好一条分支能写」的机器断言。
# 判据 SSOT：one/internal/A03-xihe/docs/module-branch-model.md §4；脚本在 ONE 侧（跨仓，与 check:ports 同一形态）。
# 退出码 0 干净 / 1 越界(E_SHARED_FILE_WRITE) / 2 用法或环境错误（ONE 根找不到、非模块分支、git 读不到）。
# 用法：`mise run check:branch-scope`（自动取当前分支，模块分支上才有意义）；
#       `mise run check:branch-scope -- --branch m/cp --json`。**不接 validate**（未在窗口里跑过全量前不引入新红面）。
#       ⚠️ 入口走 `scripts/run-branch-scope.mjs`（不是直接的 ../internal 相对路径）：worktree 里
#       `<slot>/../internal` 不存在，实测会让这条门 MODULE_NOT_FOUND（2026-11-11 队列头 c0d8f056 门梯）。
[tasks."check:branch-scope"]
run = "node scripts/run-branch-scope.mjs --repo ."
description = "Module-branch write-surface gate: only packages/<module>/**, docs/i18n/** (and docs/api/openapi.yaml for m/cp) may change on m/<module> branches (0 clean / 1 E_SHARED_FILE_WRITE / 2 usage-or-environment)"
alias = "check:branch-scope"

# task-266 / D-1132 / D-1133：字体覆盖门 —— **已摘门，任务保留供手动复跑**（2026-11-13）。
# `check:font` 曾于 task-258 接入 `validate`（作为 T1 叶子档），D-1132 把自托管整案缓做后从 validate 摘除。
# 任务定义不删：D-1133 要求「摘除不是删除」，且 `mise tasks --json` 里仍能看到它 ⇒ 恢复时不用重建接线。
# 脚本在 ONE 侧缓做区（跨仓，用 `git rev-parse --git-common-dir` 定位，不是相对路径）：
#   internal/A03-xihe/deferred/font-self-hosted/scripts/run-font-gate.mjs
# 手动复跑（恢复前自查）：`node <ONE 根>/internal/A03-xihe/deferred/font-self-hosted/scripts/run-font-gate.mjs`
# 现在直接跑本任务会 exit 2（E_ENV：找不到 A03-xihe/scripts/run-font-gate.mjs）—— **这是预期的**，
# 因为它已搬走；恢复步骤见 internal/A03-xihe/deferred/font-self-hosted/README.md 第 3、4 节。
[tasks."check:font"]
run = "node ../internal/A03-xihe/deferred/font-self-hosted/scripts/run-font-gate.mjs"
description = "Font subset coverage gate — REMOVED from validate by D-1132 (font self-hosting deferred, BL-622); task kept for manual re-runs per D-1133. Scripts live in ONE-side internal/A03-xihe/deferred/font-self-hosted/"
alias = "check:font"

[tasks."check:ports"]
run = "node scripts/check-ports-parity.mjs --require-mirror"
description = "Compare the built-in xihe port table with ONE's allocation table (fail-closed: a missing ONE workspace exits 2 instead of looking green; a standalone clone should run the bare script without --require-mirror)"
alias = "check:ports"

# BL-303 Phase 3: 事件名扫描器（默认 report-only，永不非零退出；观察期结束后再考虑接入 validate）。
# 基线/语义登记见 config/event-keys-baseline.json / config/event-keys-semantics.json。
[tasks."check:event-keys"]
run = "node scripts/check-event-keys.mjs --report-only"
description = "Report-only audit of log/SSE/AgentEvent names against the BL-303 baseline + semantics registry (never fails; use --enforce manually)"
alias = "check:event-keys"

# PLAN-0687 T2.1 / D-1039 ①: E2E in-page bypass 静态门（默认 report-only，永不非零退出；翻 --enforce 走显式裁定）。
# 判据：`packages/ui/e2e/**`（real + mock，与 check:e2e-timeouts 同口径）的 `page.evaluate(...)` 块内 `fetch(` 必须带
# `// fixture-only:` / `// read-only:` 标注，或在 config/e2e-inpage-bypass-allowlist.json 登记（0644 §4.3 允许通道约定）。
# mock lane 同样在判据内（D-1039 ①：此前只扫 real 会把 e2e/mock 的改动判成「无脏」）。
[tasks."check:a11y-refs"]
run = "node scripts/check-a11y-refs.mjs --report-only"
description = "BL-519/PLAN-0733: report-only a11y label literal drift audit (English e2e literal whose i18n key has a Chinese value; default exit 0; tighten with check:a11y-refs:enforce)"
alias = "check:a11y-refs"

[tasks."check:a11y-refs:enforce"]
run = "node scripts/check-a11y-refs.mjs --enforce"
description = "BL-519/PLAN-0733: enforce a11y label literal gate (findings>0 ⇒ exit 1); enable after WP cleanup reaches findings=0 for two consecutive windows"

[tasks."check:e2e-bypass"]
run = "node scripts/check-e2e-inpage-bypass.mjs --report-only"
description = "Report-only audit of in-page fetch bypasses in packages/ui/e2e (real + mock; annotation or allowlist required; never fails; use --enforce manually)"
alias = "check:e2e-bypass"

# task-316（`DEV-010` 收口）：DEV 文档「中英编号集合漂移」只读检查。
# 判据只有两条可靠：①同一篇文档中英两侧的 PLAN-/D-/task- 编号集合对称差；②编号登记面存在性
# （PLAN 收 `plans/`，**含 `archive/` 且文件与目录都收** —— task-314 的坑；D 收台账主册 + 归档卷，
# 按「出现过」不按 `###` 标题 —— 主册不少裁定是列表条目，只认标题会当场造假阳）。
# **report-only，绝不接 `validate.depends`**（task-316 明令）：会被绕过的红门等于没有门（D-1046）。
# 盲区（负向陈述 / 运行态 task 卡 / 相对子路由 / 不覆盖组件名与 testid）由脚本在输出里自己打印。
[tasks."check:dev-i18n-drift"]
run = "node scripts/check-dev-i18n-drift.mjs"
description = "Report-only DEV i18n drift: zh/en id-set asymmetry (PLAN/D/task) + registration lookup in plans/ (incl. archive, files and dirs) and decision ledgers; prints scan surface and blind spots; never fails (use --enforce manually); NOT in validate.depends"
alias = "check:dev-i18n-drift"

# task-237（用户 2026-11-10 第四问「openapi 应该有直接从它生成 md 的工具吧」）：生成器 + 落后门。
# 生成物只覆盖契约能表达的部分（METHOD path / operationId / security / summary / 公开|服务间）；人工叙述版里的
# 路由迁移对照、调用方、错误契约仍留在 docs/api/inventory.md —— 两份并存、互不替代（生成侧不是替代品）。
# 解析用 packages/agent/.venv 的 PyYAML（零新增依赖；手写 YAML parser 违反 workspace 硬规则）；
# 缺解释器或 PyYAML 一律 exit 2 —— 不能跑的门不许看起来是绿的。
[tasks."gen:api-docs"]
run = "node scripts/gen-api-docs.mjs"
description = "Generate docs/api/inventory.generated.md from docs/api/openapi.yaml (PyYAML from packages/agent/.venv; no new dependency)"
alias = "gen:api-docs"

[tasks."check:api-docs"]
run = "node scripts/gen-api-docs.mjs --check"
description = "Gate: docs/api/inventory.generated.md must match docs/api/openapi.yaml byte-for-byte (stale ⇒ exit 1, missing interpreter ⇒ exit 2)"
alias = "check:api-docs"
# BL-162: OpenAPI 契约门。BL-162 之前 `validate-openapi.mjs` 只被人手跑（mise.toml/pom.xml/scripts 里 0 引用），
# 契约漂移能一路合进 develop。现在它是 `test:cp` / `validate` 的依赖 ⇒ 跑 CP 测试就会查契约。
# 失败时输出 path 数 + 首个失败点 + 修复提示；成功侧输出 path 数与校验面统计。
# task-164 立、task-168 接线：Flyway 迁移号登记核对（判据本体在 scripts/check-migration-numbers.mjs，
# 五条判据夹具 + 四条「登记册定位」夹具，全部由 node scripts/check-migration-numbers.mjs --selftest 跑）。
# **exit 0/1/2 三态**：0 = 干净；1 = 有 finding（重号 / 登记册落后 / 新号未登记，逐条打 code + 文件）；
#   2 = **判不了**（迁移目录或登记册读不到、登记册头三个值解析不出）—— 2 不是绿，这条门不会把「读不到」当通过。
# 跨仓前置：登记册是 **workspace 文件**（one/internal/A03-xihe/docs/migration-numbers.md），不在本仓。
#   定位顺序 = -- --registry <path> > 本仓兄弟目录 ../internal/… > **主检出**（git rev-parse --git-common-dir 的父目录）。
#   lane 在 .worktrees/<slot> 时走第三条，并在输出里打 NOTE 跨仓登记册；三条都不成立 ⇒ exit 2 + 两条修法。
# **不接 validate**（与 check:dev-i18n-drift / check:e2e-bypass 同纪律：先证明它能响，再谈挂上流水线）。
# 改本任务必须同批改 zh/en 的 DEV-002 §4（**en 的 §4 不是同一节，两侧各查、别按编号平移**）。
[tasks."check:migrations"]
run = "node scripts/check-migration-numbers.mjs"
description = "Gate: Flyway migration numbers must be unique and registered in workspace migration-numbers.md (1 = finding, 2 = cannot answer — 2 is NOT green; cross-repo registry via pass-through arg --registry <path>) Needs a workspace prerequisite (the registry lives in the one repo) and is DELIBERATELY NOT a validate dependency: a gate that routinely returns 2 trains people to ignore exit codes; if the registry ever moves into this repository, re-evaluate wiring."
alias = "check:migrations"

[tasks."check:openapi"]
run = "node scripts/validate-openapi.mjs"
description = "Validate docs/api/openapi.yaml (structure + frozen contract slices); dependency of test:cp and validate"
alias = "check:openapi"

# PLAN-0632 T4.3: 打包产物入口接线（此前只有脚本、mise 无命中 —— 2026-11-04 归档审计 C 类项）。
# 只做「接线」：不改变两个脚本的 CLI 语义，参数一律用 `--` 透传（与 dev:stack / dev:host:provider-init 同惯例）。
#   mise run pkg:launcher -- start --install <安装目录>
#   mise run pkg:launcher -- status --stack 1 --json
#   mise run pkg:launcher -- stop
# 顺序与门：PG(TCP) -> CP(/actuator/health 200) -> Agent(/internal/v1/agent/health) -> Runtime(/health) -> UI(同源 /)
[tasks."pkg:launcher"]
run = "node scripts/pkg/launcher.mjs"
description = "Packaged-product supervisor: start|status|stop (args after `--`); readiness-gated order PG -> CP -> Agent -> Runtime -> UI"
alias = "pkg:launcher"

# 安装包构建（一条命令可重跑：渲染 ports.json + 编 Java launcher + 组装 payload + makensis + 体积报告）。
# 不编译四个服务（各自构建车道负责）；产物只写 <repo>/.tmp/pkg/（gitignored），不入库。
#   mise run pkg:installer -- --stage-only     # 只组装/校验 stage，不跑 makensis
[tasks."pkg:installer"]
run = "node scripts/pkg/build-installer.mjs"
description = "Build the NSIS installer from existing service artifacts (rerunnable; --stage-only skips makensis; artifacts stay under .tmp/pkg)"
alias = "pkg:installer"

# 提交信息门禁（2026-11-06 起）：**已阻断**（D-213 的观察窗判据已满足：自 a632de77 起 32 条提交、
# E_* 违规率 0%、merge 零超宽 ⇒ 由 report-only 翻 --enforce 并接入 validate，见决策 D-216）。
# 历史提交豁免：基线段 a632de77 之前不检查。手写提交前的本地校验走 scripts/hooks/commit-msg。
[tasks."check:commit-msg"]
run = "node scripts/check-commit-msg.mjs --range a632de77..HEAD --enforce"
description = "Blocking commit-message gate (type/scope, display-width <=72 cols / merge <=100, empty line before body, PLAN-####/BL-###/D-### reference) over a632de77..HEAD; blocking is the script default and this task is a validate dependency (D-216) — pass --report-only for the old never-fails audit"
# PLAN-0763：规范级自洽校验（redocly）与 API HTML 预览。dev-only；lint 未接入 validate（task-133/D-909 后 error=0，warnings 126 = 存量 56 + internal summary 降格 70；public 面 error 归 0）。
# task-69 / D-827：build-docs 已切 Redoc 3，主题走「模板注入 CSS 变量」而不是 .redocly.yaml 的 theme 块（后者在 Redoc 3 下实测无效）。
#   -t ../../.redocly/api-docs.hbs ⇒ XH 主题（字体/主色/侧栏），相对路径从 packages/ui 解析；
#   --openapi.disableTelemetry=true ⇒ 关掉 Redoc 3 的 OpenTelemetry 上报（内部文档页不该向第三方发请求）；
#   模板里的 CSP 再做一层浏览器级兜底（外联一律拒绝，含 Redoc 硬编码的 logo）。
#   --inlineBundle ⇒ 把 Redoc 脚本内嵌进产物。缺它时产物含 6 处 https 外链（Redocly CDN），断网打开是白屏 ——
#   而本任务的 description 写的是「单文件 HTML 文档」，不内嵌就是名不副实。
[tasks."check:openapi:lint"]
run = "cd packages/ui && pnpm exec redocly lint --config ../../.redocly.yaml ../../docs/api/openapi.yaml"
description = "Redocly 规范级 lint（$ref/operationId 唯一/unused）；**task-313 起接入 `validate`**（D-1062 10a，此前零自动执行者）；判据只有 errors（当前 0）——redocly 默认按 errors 退出、本命令无 `--max-warnings`，故 124 warnings 不阻断（2026-11-12 20:16 实测；存量 warnings 清账见 task-245）"

[tasks."docs:api:html"]
run = "cd packages/ui && pnpm exec redocly build-docs --config ../../.redocly.yaml ../../docs/api/openapi.yaml -o ../../.tmp/api-docs/index.html --inlineBundle -t ../../.redocly/api-docs.hbs --openapi.disableTelemetry=true"
description = "从 openapi.yaml 生成单文件 HTML 文档到 .tmp/api-docs/index.html（gitignored）"
