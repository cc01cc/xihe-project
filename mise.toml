[tasks."test:integration"]
depends = ["test:integration:t2", "test:integration:t3"]
description = "Run backend integration tests — T2 (no Docker) + T3 (auto Docker partial stack)"
alias = "test:integration"

[tasks."test:integration:t2"]
run = "node scripts/mise/run-posix.mjs scripts/mise/integration-test-t2.sh"
description = "Run T2 cross-module stub integration tests (no Docker required)"
alias = "test:integration:t2"

[tasks."test:integration:t3"]
run = "node scripts/mise/run-posix.mjs scripts/mise/integration-test-t3.sh"
description = "Run T3 cross-module real integration tests (requires Docker)"
alias = "test:integration:t3"

[tasks.lint]
depends = ["lint:ui", "lint:agent", "lint:cp", "lint:runtime", "lint:log-secrets"]
description = "Run all linters"
alias = "lint"

[tasks."lint:log-secrets"]
run = "node scripts/scan-log-secrets.mjs"
description = "Scan logs/ for credential leakage (PLAN-196 gate)"

[tasks."lint:ui"]
run = "pnpm run lint"
description = "Run UI lint (oxlint)"
dir = "packages/ui"
alias = "lint:ui"

[tasks."lint:agent"]
run = "uv run ruff check && uv run mypy src/"
description = "Run Agent lint (ruff + mypy)"
dir = "packages/agent"
alias = "lint:agent"

[tasks."lint:cp"]
run = "mvn checkstyle:check"
description = "Run CP lint (Checkstyle)"
dir = "packages/control-plane"
alias = "lint:cp"

[tasks."lint:runtime"]
run = "node ../../scripts/cargo-run.mjs fmt --check && node ../../scripts/cargo-run.mjs clippy --all-targets -- -D warnings"
description = "Run Runtime lint (rustfmt check + clippy all-targets)"
dir = "packages/runtime"
alias = "lint:runtime"

[tasks."lint:links"]
run = "node scripts/mise/run-posix.mjs scripts/check-doc-links-entry.sh ."
description = "Check documentation links (no escape from docs/); skips and exits 0 when the ONE main checkout (and its scripts/check-doc-links.sh) is absent — same degradation as check:ports / check:standalone"
alias = "lint:links"

[tasks."lint:e2e"]
run = "node scripts/check-e2e-timeouts.mjs"
description = "E2E timeout budget gate (task-252): action/assertion ≤10s, test ≤30s; >10s literals need // timeout-exempt: <reason> and may not exceed 60s. Budgets live in packages/ui/e2e/timeouts.ts and are env-overridable (E2E_*_TIMEOUT_MS)"
alias = "lint:e2e"

[tasks."perf:chat"]
run = "node scripts/perf/chat-gate.mjs"
description = "PLAN-0670 perf gate: one command boots the isolated perf stack, measures 1k/5k/20k, prints PASS/FAIL (p95/response bytes/heap peak/RSS growth) and always tears down; L2/release only, never stack-1/stack-2. Pass -- --dry-run / -- --self-check for a stack-free check, -- --with-ui for the WebUI stage"
alias = "perf:chat"

[tasks.typecheck]
depends = ["typecheck:ui"]
description = "Run static type checks"
alias = "typecheck"

[tasks."typecheck:ui"]
run = "pnpm run typecheck"
description = "Run UI type check (vue-tsc)"
dir = "packages/ui"
alias = "typecheck:ui"

[tasks."check:types"]
run = "pnpm --dir packages/ui run typecheck && pnpm --dir packages/ui run typecheck:e2e"
description = "D-727: TypeScript gates — UI vue-tsc + e2e spec typecheck (fail-fast; run in every verify window, ~20–40 s)"
alias = "check:types"

[tasks.format]
run = "node scripts/mise/run-posix.mjs scripts/mise/format.sh"
description = "Format code across modules"
alias = "format"

[tasks.validate]
# test:e2e:fixtures 排在 UI 单测（test）之后、E2E 之前：它只跑 e2e 夹具自身的状态机
# （不起栈/秒级），放在 E2E 车道前面能最早暴露"夹具坏了导致的假绿"。
depends = ["check:openapi", "check:commit-msg", "lint", "typecheck", "build", "test", "test:e2e:fixtures", "lint:links"]
description = "Run all quality gates — check:openapi + check:commit-msg + lint + typecheck + build + test (ui/agent/cp/runtime lib/cli) + test:e2e:fixtures + lint:links; no Docker step in the chain (CP defaults to H2, runtime uses --lib, agent deselects integration)"
alias = "validate"

[tasks."validate:full"]
depends = ["validate", "test:runtime", "test:integration"]
description = "Run full validation + integration (Compose E2E frozen — see file-top freeze note; PG container only)"
alias = "validate:full"

[tasks."dev:host"]
# task-16: 启动前检查 in-tree runtime target 水位（12/15/20GB；watch 只打印，<1s），
# 防止 `packages/runtime/target` 再次长到 GB 级。护栏实现见 scripts/check-runtime-target.mjs。
depends = ["dev:host:start:pg", "check:runtime-target"]
run = [
  { tasks = ["dev:host:start:cp", "dev:host:start:agent", "dev:host:start:runtime", "dev:host:start:ui"] }
]
description = "Start PostgreSQL in Docker and CP/Agent/Runtime/UI; does not import config or create provider connections"
alias = "dev:host"

# PLAN-0603: detached full-stack supervisor (survives terminal/turn exit; waits for readiness).
# `mise run dev:stack -- --stack 4 --with-pg`; status/stop: `node scripts/dev-stack.mjs status|stop`.
[tasks."dev:stack"]
run = "node scripts/dev-stack.mjs start"
description = "Start CP/Agent/Runtime/UI detached for the current stack (--stack N; --with-pg to include PostgreSQL)"
alias = "dev:stack"

# PLAN-0662 L4: read-only build-freshness view (每栈 cpBuild: runningCommit/headCommit/
# behind/stale/verdict). 只读，不重建、不重启；`-- --json` 是 lane 脚本消费的固定契约。
[tasks."dev:host:status"]
run = "node scripts/dev-stack.mjs status --all"
description = "Per-stack CP build freshness (commit/head/behind/stale/verdict) + service health; pass -- --json for the fixed contract"
dir = "."
alias = "dev:host:status"

[tasks."dev:host:import-config"]
run = "node scripts/xihe.mjs config import config.import.local.jsonc"
description = "Explicitly import non-secret local config after CP is ready; not part of dev:host startup"
dir = "."
alias = "dev:host:import-config"

[tasks."dev:host:provider-init"]
run = "node scripts/xihe.mjs dev init"
description = "Initialize/verify an explicit provider and scope; pass CLI options after --"
dir = "."
alias = "dev:host:provider-init"

[tasks."dev:host:watch"]
run = "node scripts/stack-run.mjs watch"
description = "Keep the mise-managed native host stack alive and restart it after a service failure"
alias = "dev:host:watch"

[tasks."dev:host:check"]
run = "node scripts/xihe.mjs dev check"
description = "Read-only preflight for host tools, Docker, ports, config sources, and workspace root"
alias = "dev:host:check"

[tasks."dev:reset"]
run = "pwsh -File scripts/dev-reset.ps1"
description = "Dry-run or explicitly reset local Xihe development data"
alias = "dev:reset"

[tasks."dev:host:stop"]
run = "pwsh -File scripts/dev-host.ps1 -Stop"
description = "Stop dev:host PostgreSQL and workspace Sandbox containers (preserve host storage)"
alias = "dev:host:stop"

[tasks."dev:host:check-config"]
run = "node scripts/dev-host-check-config.mjs"
description = "Print resolved host config sources and masked key values"
alias = "dev:host:check-config"

[tasks."dev:host:start:pg"]
run = "node scripts/stack-run.mjs pg"
description = "Start PostgreSQL container for the current stack"
dir = "."
alias = "dev:host:start:pg"

[tasks."dev:host:start:cp"]
run = "node ../../scripts/stack-run.mjs cp"
description = "Start Control Plane (port from XIHE_STACK_ID); build dir is per-stack/per-commit (BL-253 L3)"
dir = "packages/control-plane"
# BL-253 L3: no hardcoded XIHE_CP_TARGET_DIR any more — stack-run derives
# `<root>/<stackId>/<sha12>[-dirty]` (root default C:/xihe-build/cp, override XIHE_CP_BUILD_ROOT).
# 显式 XIHE_CP_TARGET_DIR 仍是最优先逃生口（原样透传，回滚通道）。
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:cp"

# BL-253 L3: explicit-only retention. Dry-run by default; `-- --apply` deletes the listed dirs.
[tasks."dev:host:cp-build:clean"]
run = "node scripts/cp-build-clean.mjs --all"
description = "Dry-run list of prunable CP build dirs per stack (keep newest 3 + pointer); pass -- --apply to delete"
dir = "."
alias = "dev:host:cp-build:clean"

# PLAN-0632 T4.4（方案 C，2026-11-05）：起 Agent 之前先等 CP readiness。
# 只约束 agent（cp/runtime/ui 仍在同一并行 group）；等待有界（默认 60s，`XIHE_WAIT_FOR_CP_TIMEOUT` 可覆盖），
# 超时由 wait-for-cp.mjs **显式失败**（exit 1 + 最后状态 + CP 日志路径）⇒ mise depends 中止，不会起 agent。
# 依据：CP 不可达时 Agent 启动 config sync 白跑 2.81s 并 degraded 到下次刷新（D32-22/D32-27；实测见
# `one/.local/evidence/plan-0632-closeout.md` §T4.4）。
[tasks."dev:host:wait-for-cp"]
run = "node scripts/wait-for-cp.mjs"
description = "Wait for CP /actuator/health == 200 before starting the Agent (bounded; default 60s, XIHE_WAIT_FOR_CP_TIMEOUT override; timeout fails loudly)"
dir = "."
alias = "dev:host:wait-for-cp"

[tasks."dev:host:start:agent"]
depends = ["dev:host:wait-for-cp"]
run = "node ../../scripts/stack-run.mjs agent"
description = "Start Agent (port from XIHE_STACK_ID); waits for CP readiness first (PLAN-0632 T4.4)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:agent"

[tasks."dev:host:start:runtime"]
run = "node ../../scripts/stack-run.mjs runtime"
description = "Start Runtime (port from XIHE_STACK_ID)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:runtime"

[tasks."dev:host:start:ui"]
run = "node ../../scripts/stack-run.mjs ui"
description = "Start UI dev server (port from XIHE_STACK_ID)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:ui"

# PLAN-0603: 旧的 `dev:stack`（`node scripts/stack-run.mjs dev-host`，前台）已被上面的
# detached supervisor 取代（同名任务不能重复定义，否则 TOML 解析失败）。
# 等价迁移：`mise run dev:stack -- --stack <n>` 仍可用（新入口是超集：readiness/PG/worktree/stop）；
# 需要旧的前台行为时直接用 `node scripts/stack-run.mjs dev-host`。

# [FROZEN 2026-10-07] docker 构建冻结，见文件头冻结说明（现存镜像可继续被 Runtime 使用）
# [tasks."image:workspace:build"]
# run = "docker build -t xihe/workspace -f docker/images/workspace/Dockerfile ."
# description = "Build the xihe/workspace Docker image (multi-stage)"
# alias = "image:workspace:build"

[tasks."reset-admin"]
run = "pwsh -NoProfile -File scripts/reset-admin.ps1"
description = "Reset dev admin@xihe.local password (random if not specified; PLAN-229)"
alias = "reset-admin"

[tasks.clean]
run = "rm -rf logs packages/*/target packages/*/dist packages/*/coverage"
description = "PERMANENTLY remove logs and all package target/dist/coverage (no recycle bin; stop builds/services first)"
alias = "clean"

[tasks."clean:runtime-sweep"]
run = "node ../../scripts/cargo-run.mjs sweep --time 7 && node ../../scripts/cargo-run.mjs sweep --maxsize 12GB"
description = "Sweep orphaned Rust artifacts only in the current metadata target (7d+ / 12GB≈11.18GiB; keeps live fingerprints)"
dir = "packages/runtime"
alias = "clean:runtime-sweep"

[tasks."check:runtime-target"]
run = "node scripts/check-runtime-target.mjs"
description = "Check Runtime target water lines (normal 12GB / watch >12GB / warn 15GB / force 20GB or H free <5GB; exit 1 = force)"
alias = "check:target"

# PLAN-0612: 严格剥离 ONE 的验收门 —— 无父级目录副本上验证启动前置（不启动服务/容器）。
# 用 `--worktree`（临时 index 打包工作树）以便**提交前**验收；CI/提交后可用默认 HEAD 模式。
[tasks."check:standalone"]
run = "node scripts/check-standalone.mjs --worktree"
description = "Export a parent-less copy of the working tree and verify stack-run/dev-check work without the ONE workspace"
alias = "check:standalone"

# PLAN-0612: A03 端口事实源 vs ONE 端口分配镜像的 parity（ONE 不存在时显式 skip）。
[tasks."check:ports"]
run = "node scripts/check-ports-parity.mjs"
description = "Compare the built-in xihe port table with ONE's allocation table (skips with a reason when ONE is absent)"
alias = "check:ports"

# BL-303 Phase 3: 事件名扫描器（默认 report-only，永不非零退出；观察期结束后再考虑接入 validate）。
# 基线/语义登记见 config/event-keys-baseline.json / config/event-keys-semantics.json。
[tasks."check:event-keys"]
run = "node scripts/check-event-keys.mjs --report-only"
description = "Report-only audit of log/SSE/AgentEvent names against the BL-303 baseline + semantics registry (never fails; use --enforce manually)"
alias = "check:event-keys"

# PLAN-0687 T2.1: E2E in-page bypass 静态门（默认 report-only，永不非零退出；翻 --enforce 走显式裁定）。
# 判据：`packages/ui/e2e/real/**` 的 `page.evaluate(...)` 块内 `fetch(` 必须带 `// fixture-only:` /
# `// read-only:` 标注，或在 config/e2e-inpage-bypass-allowlist.json 登记（0644 §4.3 允许通道约定）。
# mock lane 不在本门判据内（本 PLAN 只登记不扩包）。
[tasks."check:a11y-refs"]
run = "node scripts/check-a11y-refs.mjs --report-only"
description = "BL-519/PLAN-0733: report-only a11y label literal drift audit (English e2e literal whose i18n key has a Chinese value; use without --report-only to enforce)"
alias = "check:a11y-refs"

[tasks."check:e2e-bypass"]
run = "node scripts/check-e2e-inpage-bypass.mjs --report-only"
description = "Report-only audit of in-page fetch bypasses in packages/ui/e2e/real (annotation or allowlist required; never fails; use --enforce manually)"
alias = "check:e2e-bypass"

# BL-162: OpenAPI 契约门。BL-162 之前 `validate-openapi.mjs` 只被人手跑（mise.toml/pom.xml/scripts 里 0 引用），
# 契约漂移能一路合进 develop。现在它是 `test:cp` / `validate` 的依赖 ⇒ 跑 CP 测试就会查契约。
# 失败时输出 path 数 + 首个失败点 + 修复提示；成功侧输出 path 数与校验面统计。
[tasks."check:openapi"]
run = "node scripts/validate-openapi.mjs"
description = "Validate docs/api/openapi.yaml (structure + frozen contract slices); dependency of test:cp and validate"
alias = "check:openapi"

# PLAN-0632 T4.3: 打包产物入口接线（此前只有脚本、mise 无命中 —— 2026-11-04 归档审计 C 类项）。
# 只做「接线」：不改变两个脚本的 CLI 语义，参数一律用 `--` 透传（与 dev:stack / dev:host:provider-init 同惯例）。
#   mise run pkg:launcher -- start --install <安装目录>
#   mise run pkg:launcher -- status --stack 1 --json
#   mise run pkg:launcher -- stop
# 顺序与门：PG(TCP) -> CP(/actuator/health 200) -> Agent(/internal/v1/agent/health) -> Runtime(/health) -> UI(同源 /)
[tasks."pkg:launcher"]
run = "node scripts/pkg/launcher.mjs"
description = "Packaged-product supervisor: start|status|stop (args after `--`); readiness-gated order PG -> CP -> Agent -> Runtime -> UI"
alias = "pkg:launcher"

# 安装包构建（一条命令可重跑：渲染 ports.json + 编 Java launcher + 组装 payload + makensis + 体积报告）。
# 不编译四个服务（各自构建车道负责）；产物只写 <repo>/.tmp/pkg/（gitignored），不入库。
#   mise run pkg:installer -- --stage-only     # 只组装/校验 stage，不跑 makensis
[tasks."pkg:installer"]
run = "node scripts/pkg/build-installer.mjs"
description = "Build the NSIS installer from existing service artifacts (rerunnable; --stage-only skips makensis; artifacts stay under .tmp/pkg)"
alias = "pkg:installer"

# 提交信息门禁（2026-11-06 起）：**已阻断**（D-213 的观察窗判据已满足：自 a632de77 起 32 条提交、
# E_* 违规率 0%、merge 零超宽 ⇒ 由 report-only 翻 --enforce 并接入 validate，见决策 D-216）。
# 历史提交豁免：基线段 a632de77 之前不检查。手写提交前的本地校验走 scripts/hooks/commit-msg。
[tasks."check:commit-msg"]
run = "node scripts/check-commit-msg.mjs --range a632de77..HEAD --enforce"
description = "Blocking commit-message gate (type/scope, display-width <=72 cols / merge <=100, empty line before body, PLAN-####/BL-###/D-### reference) over a632de77..HEAD; blocking is the script default and this task is a validate dependency (D-216) — pass --report-only for the old never-fails audit"