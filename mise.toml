# ============================================================================
# 冻结说明（2026-10-07 用户裁定；2026-10-09 强调并已注释任务）
#
# XH 的 Docker 构建与服务容器化全部暂缓、冻结：只有 PostgreSQL 保留为
# Docker 容器，CP / Agent / Runtime / UI 一律以宿主进程运行。
#   日常开发：mise run dev:host
#   验收/隔离 E2E：mise run test:e2e:host（PG 容器 + 全 host 服务）
#
# 已注释冻结的 docker 相关任务（解冻必须经用户明确裁定，并同步
# AGENTS.md / DEV-002 / DEV-020 后恢复）：
#   dev:full、dev:backend、test:e2e:compose、test:e2e、image:workspace:build
# 保留：dev:host:start:pg（仅 PostgreSQL 容器，属冻结口径允许项）。
#
# 误触记录（2026-10-09）：曾误启 test:e2e:compose 触发三镜像构建；
# runtime 构建中止、agent 镜像已删除、无容器/卷/网络残留。
# ============================================================================

[env]
NODE_OPTIONS = "--max-old-space-size=2048"
# sccache 试点结论（2026-11-05，**未启用**）：sccache 0.19.0 已装入 mise 全局，
# 但在本机（rustup shim + Windows）实测**每个编译都返回 `UnhandledCompile`**（`SCCACHE_LOG=debug` 实证），
# 换 target 目录与直接调 rustc 均 0 命中 ⇒ **零收益**，故不写入 `RUSTC_WRAPPER`。
# 另：无条件设置 RUSTC_WRAPPER 会让未安装 sccache 的机器直接构建失败，属可移植性回归。
# 需要继续诊断时按 `scripts/worktree-env.ps1 -EnableSccache` 单次开启，不要改回本文件。
# uv cache: 使用 uv 自身默认位置（不再写死盘符）。需要与其它项目共享缓存的人
# 自行在外层 shell 设置 UV_CACHE_DIR；本仓库不替用户决定机器布局。
#
# Rust 构建产物根（PLAN-0656 的 task-80 收口）：语法侧只有这一个 knob
#   `XH_CARGO_TARGET_ROOT`。显式设置后主检出落 `<root>/{main,stack-N,e2e}`，
#   linked worktree 落 `<root>/<worktree 目录名>/{…}`（两个 lane 跑同一个 stack 不会
#   互相覆盖 exe —— 那正是 BL-221 的失效模式，只是换了盘）。
#   优先级：CARGO_TARGET_DIR（worktree-env.ps1 / 手工覆盖）> 本变量 > 旧推导
#   `<one>/.tmp/cargo-target`。**未设本变量时行为与引入前逐字节相同**，这是回归断言。
#   **本机真值不入库**：写进 gitignored 的 `mise.local.toml`，形如
#     [env]
#     XH_CARGO_TARGET_ROOT = '<本机绝对路径>'
#   （优先级高于本文件）。本文件只写契约、不写机器绝对路径——换盘/换机只改
#   `mise.local.toml`，不动仓库；本机示例见 DEV-002 §6。变量指向不存在的目录或
#   相对路径时脚本 fail-fast，绝不静默回落到旧盘。
#   覆盖范围：经 `scripts/cargo-run.mjs` 的 mise cargo 任务（build / test / lint / sweep）
#   落 `<root>`；**未经 wrapper 的裸 `cargo` 与 IDE/rust-analyzer 仍按 `.cargo/config.toml`
#   落 `<one>/.tmp/cargo-target/main`**（刻意保留的残余，见 DEV-002 §6）。

[tools]
node = "24"
pnpm = "10"
python = "3.14"
uv = "latest"
java = "temurin-25"
maven = "3.9"
rust = "1.97.1"

[tasks.setup]
depends = ["setup:ui", "setup:agent", "setup:cp", "setup:runtime"]
description = "Install dependencies for all active modules"
alias = "setup"

[tasks."setup:ui"]
run = "pnpm install"
description = "Install UI dependencies"
dir = "packages/ui"
alias = "setup:ui"

[tasks."setup:agent"]
run = "uv sync --all-extras"
description = "Sync Python dependencies for the agent"
dir = "packages/agent"
alias = "setup:agent"

[tasks."setup:cp"]
run = "mvn dependency:resolve"
description = "Resolve Maven dependencies for the control plane"
dir = "packages/control-plane"
alias = "setup:cp"

[tasks."setup:runtime"]
run = "cargo fetch"
description = "Fetch Rust dependencies for the runtime"
dir = "packages/runtime"
alias = "setup:runtime"

[tasks.dev]
depends = ["dev:ui"]
description = "Start the UI development server (backend must be running)"
alias = "dev"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:full"]
# run = "bash scripts/dev-all.sh"
# description = "Start all 4 modules via Docker + UI on host (Ctrl+C cleans up containers)"
# alias = "dev:full"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:backend"]
# run = "bash -c 'trap \"docker compose down\" EXIT; docker compose up --build runtime control-plane agent postgres'"
# description = "Start runtime, agent, control plane via Docker Compose"
# alias = "dev:backend"

[tasks."dev:ui"]
run = "node ../../scripts/stack-run.mjs ui"
description = "Start the UI development server (Windows native; port from XIHE_STACK_ID)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:ui"

[tasks."dev:agent"]
run = "node ../../scripts/stack-run.mjs agent"
description = "Start the agent service (Windows native; port from XIHE_STACK_ID)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:agent"

[tasks."dev:cp"]
run = "node ../../scripts/stack-run.mjs cp"
description = "Start the control plane (Windows native; port from XIHE_STACK_ID)"
dir = "packages/control-plane"
env = { XIHE_ENV = "dev" }
alias = "dev:cp"

[tasks."dev:runtime"]
run = "node ../../scripts/stack-run.mjs runtime"
description = "Start the runtime service (Windows native; port from XIHE_STACK_ID)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:runtime"

[tasks.build]
depends = ["build:ui", "build:runtime"]
description = "Build all production artifacts"
alias = "build"

[tasks."build:ui"]
run = "pnpm run build"
description = "Build the UI bundle"
dir = "packages/ui"
alias = "build:ui"

# task-80 (2026-11-08): cargo tasks below go through scripts/cargo-run.mjs, which
# injects CARGO_TARGET_DIR=<XH_CARGO_TARGET_ROOT>/[<worktree>/]main ONLY when the
# variable is set (unset => bare cargo, byte-identical to before). Cargo itself does
# not read that variable, so without the wrapper these tasks rebuild a multi-GB cache
# on H: even though the dev stacks already build on the configured root.
# Intentionally still bare: `cargo fetch` (writes CARGO_HOME, not the target dir).
[tasks."build:runtime"]
run = "node ../../scripts/cargo-run.mjs build --release"
description = "Build all runtime binaries (lib + 3 bin targets)"
dir = "packages/runtime"
alias = "build:runtime"

[tasks.test]
depends = ["test:ui", "test:agent", "test:cp", "test:runtime:lib", "test:cli"]
description = "Run all tests"
alias = "test"

[tasks."test:cli"]
run = "node --test scripts/xihe-cli.test.mjs scripts/xihe-cli/skill.test.mjs scripts/lib/stack-ports.test.mjs scripts/lib/env-file.test.mjs scripts/lib/service-supervisor.test.mjs scripts/lib/llm-env.test.mjs scripts/lib/cp-boot-plan.test.mjs scripts/lib/e2e-rounds.test.mjs scripts/lib/e2e-test-counts.test.mjs scripts/lib/e2e-preflight-disk.test.mjs scripts/lib/e2e-host-cli.test.mjs scripts/stack-run.test.mjs scripts/e2e-host-readiness.test.mjs scripts/test-wiring.test.mjs scripts/pkg/phase-parity.test.mjs scripts/pkg/ports-json.test.mjs scripts/pkg/launcher-security.test.mjs scripts/pkg/launcher-security-behavior.test.mjs scripts/env-log-level.test.mjs scripts/lib/stack-cargo-target.test.mjs scripts/lib/stack-orphan.test.mjs scripts/lib/stack-lease.test.mjs scripts/lib/kill-guard.test.mjs scripts/lib/cp-build-info.test.mjs scripts/lib/cp-build-dir.test.mjs scripts/__tests__/check-event-keys.test.mjs scripts/__tests__/check-e2e-inpage-bypass.test.mjs scripts/check-test-global-state.test.mjs scripts/run-with-timeout.test.mjs scripts/check-provider-catalog.test.mjs scripts/check-ui-inplace-mutation.test.mjs scripts/check-cp-baseline.test.mjs scripts/check-commit-msg.test.mjs scripts/lib/cp-jar-sidecar.test.mjs scripts/lib/e2e-build-artifact.test.mjs scripts/lib/e2e-preflight-gate.test.mjs scripts/lib/e2e-runtime-target.test.mjs scripts/lib/e2e-host-boot-phases.test.mjs scripts/lib/e2e-child-exit.test.mjs && node scripts/check-test-global-state.mjs"
description = "Run every scripts/**/*.test.mjs unit test (explicit file list pinned by scripts/test-wiring.test.mjs) + BL-262 static guard: no unguarded process-global mutation in Rust test code"
alias = "test:cli"

[tasks."test:mock"]
run = "pnpm exec playwright test --config e2e/playwright.config.ts e2e/mock --workers=4"
description = "Mock-lane browser suite — no backend needed (Playwright starts its own Vite dev server). Gate semantics: real failures fail the task; known flaky cases are absorbed by Playwright retries. Proven able to go red (2026-11-03: 48 failures at baseline before this lane was repaired to 187 passed / 0 failed). Two env pins are load-bearing: XIHE_E2E_BROWSER_CHANNEL=chrome-beta (the bundled chromium revision expected by this Playwright version is not installed — without it every launch fails with 'Executable doesn't exist at ...chromium_headless_shell-1243'), and --workers=4 (at the default 16 workers on a loaded machine the lane produces rotating page.goto/visibility timeouts that are indistinguishable from real regressions)."
dir = "packages/ui"
env = { XIHE_E2E_PROFILE = "mock", XIHE_E2E_BROWSER_CHANNEL = "chrome-beta", XIHE_MOCK_REPORT = "1" }
alias = "test:mock"

# PLAN-0735 / BL-164: mock-lane baseline gate. Reads packages/ui/e2e/.mock-report.json
# (written by test:mock above via the playwright config JSON reporter) and compares counts
# + skip titles against packages/ui/e2e/mock-baseline.json. Drift ⇒ exit 1 unless
# --allow-drift is passed explicitly. The report is a runtime artifact and stays untracked.
[tasks."check:mock-baseline"]
run = "node scripts/check-mock-baseline.mjs"
dir = "."
alias = "check:mock-baseline"

[tasks."test:ui"]
run = "pnpm run test:unit"
description = "Run the UI unit test suite"
dir = "packages/ui"
alias = "test:ui"

[tasks."test:e2e:fixtures"]
# PLAN-0648: e2e 测试夹具自身的状态机（fake LLM mode=chain 的会话游标 / 重试重放 /
# 耗尽回落）在真栈上只表现为"工具莫名不出现"，排障成本极高；这里用 node:test 直接
# 守住状态机：不起栈、不开浏览器、秒级。改 e2e/fixtures 的模式机必须先跑这条。
run = "pnpm run test:e2e:fixtures"
description = "Run e2e fixture self-tests (fake LLM chain state machine; no stack, seconds)"
dir = "packages/ui"
alias = "test:e2e:fixtures"

[tasks."test:agent"]
run = "uv run pytest"
description = "Run the agent test suite"
dir = "packages/agent"
alias = "test:agent"

[tasks."gate:agent-quality"]
run = "uv run python -m xihe_agent.evaluation gate"
description = "Local quality-regression gate (PLAN-0512/0540) over one report per lane; pass --report/--baseline after --"
dir = "packages/agent"
alias = "gate:agent-quality"

[tasks."test:cp"]
depends = ["check:openapi"]
run = "node ../../scripts/cp-test-run.mjs"
description = "Run the control plane test suite (check:openapi first; zero-execution guard on success)"
dir = "packages/control-plane"
alias = "test:cp"

# BL-461 / PLAN-0727: read the surefire reports from the most recent run and fail when
# Maven executed zero tests. Run from packages/control-plane; pass --reports for external
# -Dxihe.target.dir layouts. test:cp already calls this after a successful mvn run.
[tasks."test:cp:executed"]
run = "node ../../scripts/check-test-executed.mjs"
dir = "packages/control-plane"
description = "Fail (exit 1) when the latest surefire reports show zero executed tests (BL-461)"

# BL-368 (2026-11-06；2026-11-08 更正口径)：当前基线 0 条（scripts/cp-known-baseline.json 的 entries 为空）。
# 此前本行写"2 条已登记基线"，与事实不符——那是立项时的数字，条目现已清零。CP 全量现存预存红（最近记录
# 10 条，主因 PLAN-0691 插件面未同步，见 BL-489），所以 `mise run test:cp` 现在仍会红、本任务也吸收不了
# 任何红点；修好后 test:cp 才会绿。下面这条是独立任务：不接进 test:cp（否则会吞掉 mvn 输出）；用法：
# 先跑 `mise run test:cp`（红），再跑本任务读它刚写的 surefire 报告。基线只许缩小、转绿必须删、
# reviewBy 过期即失败。
[tasks."test:cp:baseline"]
run = "node scripts/check-cp-baseline.mjs"
description = "Classify CP surefire failures against scripts/cp-known-baseline.json (exit 0 only if every failure is a fresh known baseline; run after mise run test:cp)"

[tasks."test:runtime"]
run = "node ../../scripts/cargo-run.mjs test"
description = "Run the runtime test suite (all, sandbox tests need Docker)"
dir = "packages/runtime"
alias = "test:runtime"

[tasks."test:runtime:lib"]
run = "node ../../scripts/cargo-run.mjs test --lib"
description = "Run runtime unit tests only (no Docker needed)"
dir = "packages/runtime"
alias = "test:runtime:lib"

# BL-262（2026-11-04）：竞态复验门。串行 1 次证明"确定性绿"，并行 3 连跑逼调度变化——
# 单次并行通过没有说服力，连跑才暴露抢全局状态。**故意不进 validate**：日常 validate 保持
# 并行 ~5.5s 的手感，本任务只在里程碑 / 竞态类修复后跑（约 1 分钟，串行那趟 ~41s）。
# 为什么不把日常那档改串行：串行跑不出并行能暴露的竞态 = 消灭证据（负例恒真同型陷阱）。
[tasks."test:runtime:lib:gate"]
run = [
  "node ../../scripts/cargo-run.mjs test --locked --lib -- --test-threads=1",
  "node ../../scripts/cargo-run.mjs test --locked --lib",
  "node ../../scripts/cargo-run.mjs test --locked --lib",
  "node ../../scripts/cargo-run.mjs test --locked --lib"
]
description = "BL-262 gate: serial once + parallel 3x (milestone / post-race-fix verification; not part of validate)"
dir = "packages/runtime"
alias = "test:runtime:lib:gate"

# BL-262 ignored 套件两档（2026-11-04 Lead 批准；**都不进 validate**）。
# 19 条 `--ignored` 里 0 条需要 Docker；盲跑 `--ignored` 会挂：2 条子进程 helper（单独跑无意义）、
# 10 条 200x/10k 基准或手动诊断（分钟级）、3 条读真实 dev store（env 驱动）、1 条 symlink 需特权。
# 故按**显式列名**分两档，其余保持手动；分类表见 one/.local/bl229-evidence/ignored-suite-triage.md。
#
# 共同前置：host git ≥ 2.20（`require_git()` 是 assert，缺失即 FAIL 而非 skip）。
# 幂等性：全部用 tempdir，不写真实 dev store / home；V3_REPORT_PATH / V3_SYMLINK_REPORT_PATH 只在
# 显式设置时写报告文件。
# timeout 取值 = 实测基线 × ~3（2026-11-04 在 bl232 e2e 并行负载下测得，属上限）：
#   t3_5_no_git_full_chain_smoke 0.13s→60s；p3_migration_tool 1.83s→60s；
#   p3_migration_verify 1.44s→60s；v6_three_rounds 3.47s→60s；
#   v3_git_checkout_parity 38.12s→180s；v5_1000_file_restore 13.51s→90s。
# `cargo test --no-run` 先单独编译，避免冷编译时间被算进被测超时。
[tasks."test:runtime:lib:ignored:isolated"]
run = [
  "node ../../scripts/cargo-run.mjs test --locked --lib --no-run",
  "node ../../scripts/run-with-timeout.mjs --timeout-sec 60 -- node ../../scripts/cargo-run.mjs test --locked --lib -- --ignored --exact checkpoint_api::tests::t3_5_no_git_full_chain_smoke --test-threads=1"
]
description = "BL-262 ignored tier 1/2: PATH-stripped no-git smoke, isolated (--test-threads=1); not part of validate"
dir = "packages/runtime"
alias = "test:runtime:lib:ignored:isolated"

[tasks."test:runtime:lib:ignored:functional"]
run = [
  "node ../../scripts/cargo-run.mjs test --locked --lib --no-run",
  "node ../../scripts/run-with-timeout.mjs --timeout-sec 60 -- node ../../scripts/cargo-run.mjs test --locked --lib -- --ignored --exact checkpoint::tests::p3_migration_tool_backfills_git_only_history --test-threads=1",
  "node ../../scripts/run-with-timeout.mjs --timeout-sec 60 -- node ../../scripts/cargo-run.mjs test --locked --lib -- --ignored --exact checkpoint::tests::p3_migration_verify_store_matches_shadow --test-threads=1",
  "node ../../scripts/run-with-timeout.mjs --timeout-sec 60 -- node ../../scripts/cargo-run.mjs test --locked --lib -- --ignored --exact checkpoint::tests::v6_three_rounds_self_git_self_restore_history --test-threads=1",
  "node ../../scripts/run-with-timeout.mjs --timeout-sec 180 -- node ../../scripts/cargo-run.mjs test --locked --lib -- --ignored --exact checkpoint_store::restore_full::tests::v3_git_checkout_parity --test-threads=1",
  "node ../../scripts/run-with-timeout.mjs --timeout-sec 90 -- node ../../scripts/cargo-run.mjs test --locked --lib -- --ignored --exact checkpoint_store::restore_full::tests::v5_1000_file_restore_zero_diff --test-threads=1"
]
description = "BL-262 ignored tier 2/2: 5 functional ignored tests, serial + measured timeouts; not part of validate"
dir = "packages/runtime"
alias = "test:runtime:lib:ignored:functional"

# [FROZEN 2026-10-07] Compose lane 冻结，见文件头冻结说明
# [tasks."test:e2e:compose"]
# run = "node scripts/e2e-compose.mjs"
# description = "Run Compose-compatible end-to-end tests (auto-start/stop frozen Docker Compose)"
