# 一开 `no-undef` 就抓到 `l2/shard-report.mjs` 缺 `node:child_process` import 的静默降级。
# 配置 = 仓根 `.oxlintrc.json`（`no-undef` 常开；`perf/bl301-multitab.mjs` 用 per-file browser env，
