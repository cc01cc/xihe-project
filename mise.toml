# ============================================================================
# 冻结说明（2026-10-07 用户裁定；2026-10-09 强调并已注释任务）
#
# XH 的 Docker 构建与服务容器化全部暂缓、冻结：只有 PostgreSQL 保留为
# Docker 容器，CP / Agent / Runtime / UI 一律以宿主进程运行。
#   日常开发：mise run dev:host
#   验收/隔离 E2E：mise run test:e2e:host（PG 容器 + 全 host 服务）
#
# 已注释冻结的 docker 相关任务（解冻必须经用户明确裁定，并同步
# AGENTS.md / DEV-002 / DEV-020 后恢复）：
#   dev:full、dev:backend、test:e2e:compose、test:e2e、image:workspace:build
# 保留：dev:host:start:pg（仅 PostgreSQL 容器，属冻结口径允许项）。
#
# 误触记录（2026-10-09）：曾误启 test:e2e:compose 触发三镜像构建；
# runtime 构建中止、agent 镜像已删除、无容器/卷/网络残留。
# ============================================================================

[env]
NODE_OPTIONS = "--max-old-space-size=2048"
# uv cache: 使用 uv 自身默认位置（不再写死盘符）。需要与其它项目共享缓存的人
# 自行在外层 shell 设置 UV_CACHE_DIR；本仓库不替用户决定机器布局。

[tools]
node = "24"
pnpm = "10"
python = "3.14"
uv = "latest"
java = "temurin-25"
maven = "3.9"
rust = "1.97.1"

[tasks.setup]
depends = ["setup:ui", "setup:agent", "setup:cp", "setup:runtime"]
description = "Install dependencies for all active modules"
alias = "setup"

[tasks."setup:ui"]
run = "pnpm install"
description = "Install UI dependencies"
dir = "packages/ui"
alias = "setup:ui"

[tasks."setup:agent"]
run = "uv sync --all-extras"
description = "Sync Python dependencies for the agent"
dir = "packages/agent"
alias = "setup:agent"

[tasks."setup:cp"]
run = "mvn dependency:resolve"
description = "Resolve Maven dependencies for the control plane"
dir = "packages/control-plane"
alias = "setup:cp"

[tasks."setup:runtime"]
run = "cargo fetch"
description = "Fetch Rust dependencies for the runtime"
dir = "packages/runtime"
alias = "setup:runtime"

[tasks.dev]
depends = ["dev:ui"]
description = "Start the UI development server (backend must be running)"
alias = "dev"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:full"]
# run = "bash scripts/dev-all.sh"
# description = "Start all 4 modules via Docker + UI on host (Ctrl+C cleans up containers)"
# alias = "dev:full"

# [FROZEN 2026-10-07] 服务容器化冻结，见文件头冻结说明
# [tasks."dev:backend"]
# run = "bash -c 'trap \"docker compose down\" EXIT; docker compose up --build runtime control-plane agent postgres'"
# description = "Start runtime, agent, control plane via Docker Compose"
# alias = "dev:backend"

[tasks."dev:ui"]
run = "node ../../scripts/stack-run.mjs ui"
description = "Start the UI development server (Windows native; port from XIHE_STACK_ID)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:ui"

[tasks."dev:agent"]
run = "node ../../scripts/stack-run.mjs agent"
description = "Start the agent service (Windows native; port from XIHE_STACK_ID)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:agent"

[tasks."dev:cp"]
run = "node ../../scripts/stack-run.mjs cp"
description = "Start the control plane (Windows native; port from XIHE_STACK_ID)"
dir = "packages/control-plane"
env = { XIHE_ENV = "dev" }
alias = "dev:cp"

[tasks."dev:runtime"]
run = "node ../../scripts/stack-run.mjs runtime"
description = "Start the runtime service (Windows native; port from XIHE_STACK_ID)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:runtime"

[tasks.build]
depends = ["build:ui", "build:runtime"]
description = "Build all production artifacts"
alias = "build"

[tasks."build:ui"]
run = "pnpm run build"
description = "Build the UI bundle"
dir = "packages/ui"
alias = "build:ui"

[tasks."build:runtime"]
run = "cargo build --release"
description = "Build all runtime binaries (lib + 3 bin targets)"
dir = "packages/runtime"
alias = "build:runtime"

[tasks.test]
depends = ["test:ui", "test:agent", "test:cp", "test:runtime:lib", "test:cli"]
description = "Run all tests"
alias = "test"

[tasks."test:cli"]
run = "node --test scripts/xihe-cli.test.mjs scripts/xihe-cli/skill.test.mjs scripts/lib/stack-ports.test.mjs scripts/lib/env-file.test.mjs scripts/lib/service-supervisor.test.mjs scripts/lib/llm-env.test.mjs scripts/lib/cp-boot-plan.test.mjs scripts/lib/e2e-rounds.test.mjs scripts/stack-run.test.mjs scripts/e2e-host-readiness.test.mjs scripts/test-wiring.test.mjs scripts/pkg/phase-parity.test.mjs scripts/pkg/ports-json.test.mjs scripts/pkg/launcher-security.test.mjs scripts/pkg/launcher-security-behavior.test.mjs scripts/env-log-level.test.mjs scripts/lib/stack-cargo-target.test.mjs scripts/lib/stack-orphan.test.mjs scripts/lib/kill-guard.test.mjs"
description = "Run every scripts/**/*.test.mjs unit test — the file list is explicit and pinned by scripts/test-wiring.test.mjs (a new test file that is not listed turns that meta test red)"
alias = "test:cli"

[tasks."test:mock"]
run = "pnpm exec playwright test --config e2e/playwright.config.ts e2e/mock --reporter=list --workers=4"
description = "Mock-lane browser suite — no backend needed (Playwright starts its own Vite dev server). Gate semantics: real failures fail the task; known flaky cases are absorbed by Playwright retries. Proven able to go red (2026-11-03: 48 failures at baseline before this lane was repaired to 187 passed / 0 failed). Two env pins are load-bearing: XIHE_E2E_BROWSER_CHANNEL=chrome-beta (the bundled chromium revision expected by this Playwright version is not installed — without it every launch fails with 'Executable doesn't exist at ...chromium_headless_shell-1243'), and --workers=4 (at the default 16 workers on a loaded machine the lane produces rotating page.goto/visibility timeouts that are indistinguishable from real regressions)."
dir = "packages/ui"
env = { XIHE_E2E_PROFILE = "mock", XIHE_E2E_BROWSER_CHANNEL = "chrome-beta" }
alias = "test:mock"

[tasks."test:ui"]
run = "pnpm run test:unit"
description = "Run the UI unit test suite"
dir = "packages/ui"
alias = "test:ui"

[tasks."test:e2e:fixtures"]
# PLAN-0648: e2e 测试夹具自身的状态机（fake LLM mode=chain 的会话游标 / 重试重放 /
# 耗尽回落）在真栈上只表现为"工具莫名不出现"，排障成本极高；这里用 node:test 直接
# 守住状态机：不起栈、不开浏览器、秒级。改 e2e/fixtures 的模式机必须先跑这条。
run = "pnpm run test:e2e:fixtures"
description = "Run e2e fixture self-tests (fake LLM chain state machine; no stack, seconds)"
dir = "packages/ui"
alias = "test:e2e:fixtures"

[tasks."test:agent"]
run = "uv run pytest"
description = "Run the agent test suite"
dir = "packages/agent"
alias = "test:agent"

[tasks."gate:agent-quality"]
run = "uv run python -m xihe_agent.evaluation gate"
description = "Local quality-regression gate (PLAN-0512/0540) over one report per lane; pass --report/--baseline after --"
dir = "packages/agent"
alias = "gate:agent-quality"

[tasks."test:cp"]
run = "mvn test"
description = "Run the control plane test suite"
dir = "packages/control-plane"
alias = "test:cp"

[tasks."test:runtime"]
run = "cargo test"
description = "Run the runtime test suite (all, sandbox tests need Docker)"
dir = "packages/runtime"
alias = "test:runtime"

[tasks."test:runtime:lib"]
run = "cargo test --lib"
description = "Run runtime unit tests only (no Docker needed)"
dir = "packages/runtime"
alias = "test:runtime:lib"

# [FROZEN 2026-10-07] Compose lane 冻结，见文件头冻结说明
# [tasks."test:e2e:compose"]
# run = "node scripts/e2e-compose.mjs"
# description = "Run Compose-compatible end-to-end tests (auto-start/stop frozen Docker Compose)"
# alias = "test:e2e:compose"

# [FROZEN 2026-10-07] Compose lane 冻结（旧名一并冻结），见文件头冻结说明
# [tasks."test:e2e"]
# run = "node scripts/e2e-compose.mjs"
# description = "Deprecated alias of test:e2e:compose (Compose-compatible E2E)"
# alias = "test:e2e"

[tasks."test:e2e:host"]
run = "node scripts/e2e-host.mjs"
description = "Run host-only E2E tests in an isolated per-run native stack (own ports/PG/build targets; dev stacks keep running — PLAN-0656 R2)"
alias = "test:e2e:host"

[tasks.xihe]
run = "node scripts/xihe.mjs"
description = "Run the XH development and operations CLI; pass command arguments after --"
alias = "xihe"

[tasks."test:e2e:host:real"]
run = "node scripts/xihe.mjs test real"
description = "Run one explicit real-MiMo host spec; pass the spec and --route after --"
alias = "test:e2e:host:real"

[tasks."test:integration"]
depends = ["test:integration:t2", "test:integration:t3"]
description = "Run backend integration tests — T2 (no Docker) + T3 (auto Docker partial stack)"
alias = "test:integration"

[tasks."test:integration:t2"]
run = "node scripts/mise/run-posix.mjs scripts/mise/integration-test-t2.sh"
description = "Run T2 cross-module stub integration tests (no Docker required)"
alias = "test:integration:t2"

[tasks."test:integration:t3"]
run = "node scripts/mise/run-posix.mjs scripts/mise/integration-test-t3.sh"
description = "Run T3 cross-module real integration tests (requires Docker)"
alias = "test:integration:t3"

[tasks.lint]
depends = ["lint:ui", "lint:agent", "lint:cp", "lint:runtime", "lint:log-secrets"]
description = "Run all linters"
alias = "lint"

[tasks."lint:log-secrets"]
run = "node scripts/scan-log-secrets.mjs"
description = "Scan logs/ for credential leakage (PLAN-196 gate)"

[tasks."lint:ui"]
run = "pnpm run lint"
description = "Run UI lint (oxlint)"
dir = "packages/ui"
alias = "lint:ui"

[tasks."lint:agent"]
run = "uv run ruff check && uv run mypy src/"
description = "Run Agent lint (ruff + mypy)"
dir = "packages/agent"
alias = "lint:agent"

[tasks."lint:cp"]
run = "mvn checkstyle:check"
description = "Run CP lint (Checkstyle)"
dir = "packages/control-plane"
alias = "lint:cp"

[tasks."lint:runtime"]
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
description = "Run Runtime lint (rustfmt check + clippy all-targets)"
dir = "packages/runtime"
alias = "lint:runtime"

[tasks."lint:links"]
run = "node scripts/mise/run-posix.mjs scripts/check-doc-links-entry.sh ."
description = "Check documentation links (no escape from docs/)"
alias = "lint:links"

[tasks.typecheck]
depends = ["typecheck:ui"]
description = "Run static type checks"
alias = "typecheck"

[tasks."typecheck:ui"]
run = "pnpm run typecheck"
description = "Run UI type check (vue-tsc)"
dir = "packages/ui"
alias = "typecheck:ui"

[tasks.format]
run = "node scripts/mise/run-posix.mjs scripts/mise/format.sh"
description = "Format code across modules"
alias = "format"

[tasks.validate]
# test:e2e:fixtures 排在 UI 单测（test）之后、E2E 之前：它只跑 e2e 夹具自身的状态机
# （不起栈/秒级），放在 E2E 车道前面能最早暴露"夹具坏了导致的假绿"。
depends = ["lint", "typecheck", "build", "test", "test:e2e:fixtures", "lint:links"]
description = "Run all quality gates — lint + typecheck + build + test + e2e fixture self-tests (Docker auto-managed)"
alias = "validate"

[tasks."validate:full"]
depends = ["validate", "test:runtime", "test:integration"]
description = "Run full validation + integration (Compose E2E frozen — see file-top freeze note; PG container only)"
alias = "validate:full"

[tasks."dev:host"]
# task-16: 启动前检查 in-tree runtime target 水位（12/15/20GB；watch 只打印，<1s），
# 防止 `packages/runtime/target` 再次长到 GB 级。护栏实现见 scripts/check-runtime-target.mjs。
depends = ["dev:host:start:pg", "check:runtime-target"]
run = [
  { tasks = ["dev:host:start:cp", "dev:host:start:agent", "dev:host:start:runtime", "dev:host:start:ui"] }
]
description = "Start PostgreSQL in Docker and CP/Agent/Runtime/UI; does not import config or create provider connections"
alias = "dev:host"

# PLAN-0603: detached full-stack supervisor (survives terminal/turn exit; waits for readiness).
# `mise run dev:stack -- --stack 4 --with-pg`; status/stop: `node scripts/dev-stack.mjs status|stop`.
[tasks."dev:stack"]
run = "node scripts/dev-stack.mjs start"
description = "Start CP/Agent/Runtime/UI detached for the current stack (--stack N; --with-pg to include PostgreSQL)"
alias = "dev:stack"

[tasks."dev:host:import-config"]
run = "node scripts/xihe.mjs config import config.import.local.jsonc"
description = "Explicitly import non-secret local config after CP is ready; not part of dev:host startup"
dir = "."
alias = "dev:host:import-config"

[tasks."dev:host:provider-init"]
run = "node scripts/xihe.mjs dev init"
description = "Initialize/verify an explicit provider and scope; pass CLI options after --"
dir = "."
alias = "dev:host:provider-init"

[tasks."dev:host:watch"]
run = "node scripts/stack-run.mjs watch"
description = "Keep the mise-managed native host stack alive and restart it after a service failure"
alias = "dev:host:watch"

[tasks."dev:host:check"]
run = "node scripts/xihe.mjs dev check"
description = "Read-only preflight for host tools, Docker, ports, config sources, and workspace root"
alias = "dev:host:check"

[tasks."dev:reset"]
run = "pwsh -File scripts/dev-reset.ps1"
description = "Dry-run or explicitly reset local Xihe development data"
alias = "dev:reset"

[tasks."dev:host:stop"]
run = "pwsh -File scripts/dev-host.ps1 -Stop"
description = "Stop dev:host PostgreSQL and workspace Sandbox containers (preserve host storage)"
alias = "dev:host:stop"

[tasks."dev:host:check-config"]
run = "node scripts/dev-host-check-config.mjs"
description = "Print resolved host config sources and masked key values"
alias = "dev:host:check-config"

[tasks."dev:host:start:pg"]
run = "node scripts/stack-run.mjs pg"
description = "Start PostgreSQL container for the current stack"
dir = "."
alias = "dev:host:start:pg"

[tasks."dev:host:start:cp"]
run = "node ../../scripts/stack-run.mjs cp"
description = "Start Control Plane (port from XIHE_STACK_ID)"
dir = "packages/control-plane"
env = { XIHE_ENV = "dev", XIHE_CP_TARGET_DIR = "C:/xihe-build/dev-host" }
alias = "dev:host:start:cp"

[tasks."dev:host:start:agent"]
run = "node ../../scripts/stack-run.mjs agent"
description = "Start Agent (port from XIHE_STACK_ID)"
dir = "packages/agent"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:agent"

[tasks."dev:host:start:runtime"]
run = "node ../../scripts/stack-run.mjs runtime"
description = "Start Runtime (port from XIHE_STACK_ID)"
dir = "packages/runtime"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:runtime"

[tasks."dev:host:start:ui"]
run = "node ../../scripts/stack-run.mjs ui"
description = "Start UI dev server (port from XIHE_STACK_ID)"
dir = "packages/ui"
env = { XIHE_ENV = "dev" }
alias = "dev:host:start:ui"

# PLAN-0603: 旧的 `dev:stack`（`node scripts/stack-run.mjs dev-host`，前台）已被上面的
# detached supervisor 取代（同名任务不能重复定义，否则 TOML 解析失败）。
# 等价迁移：`mise run dev:stack -- --stack <n>` 仍可用（新入口是超集：readiness/PG/worktree/stop）；
# 需要旧的前台行为时直接用 `node scripts/stack-run.mjs dev-host`。

# [FROZEN 2026-10-07] docker 构建冻结，见文件头冻结说明（现存镜像可继续被 Runtime 使用）
# [tasks."image:workspace:build"]
# run = "docker build -t xihe/workspace -f docker/images/workspace/Dockerfile ."
# description = "Build the xihe/workspace Docker image (multi-stage)"
# alias = "image:workspace:build"

[tasks."reset-admin"]
run = "pwsh -NoProfile -File scripts/reset-admin.ps1"
description = "Reset dev admin@xihe.local password (random if not specified; PLAN-229)"
alias = "reset-admin"

[tasks.clean]
run = "rm -rf logs packages/*/target packages/*/dist packages/*/coverage"
description = "PERMANENTLY remove logs and all package target/dist/coverage (no recycle bin; stop builds/services first)"
alias = "clean"

[tasks."clean:runtime-sweep"]
run = "cargo sweep --time 7 && cargo sweep --maxsize 12GB"
description = "Sweep orphaned Rust artifacts only in the current metadata target (7d+ / 12GB≈11.18GiB; keeps live fingerprints)"
dir = "packages/runtime"
alias = "clean:runtime-sweep"

[tasks."check:runtime-target"]
run = "node scripts/check-runtime-target.mjs"
description = "Check Runtime target water lines (normal 12GB / watch >12GB / warn 15GB / force 20GB or H free <5GB; exit 1 = force)"
alias = "check:target"

# PLAN-0612: 严格剥离 ONE 的验收门 —— 无父级目录副本上验证启动前置（不启动服务/容器）。
# 用 `--worktree`（临时 index 打包工作树）以便**提交前**验收；CI/提交后可用默认 HEAD 模式。
[tasks."check:standalone"]
run = "node scripts/check-standalone.mjs --worktree"
description = "Export a parent-less copy of the working tree and verify stack-run/dev-check work without the ONE workspace"
alias = "check:standalone"

# PLAN-0612: A03 端口事实源 vs ONE 端口分配镜像的 parity（ONE 不存在时显式 skip）。
[tasks."check:ports"]
run = "node scripts/check-ports-parity.mjs"
description = "Compare the built-in xihe port table with ONE's allocation table (skips with a reason when ONE is absent)"
alias = "check:ports"
