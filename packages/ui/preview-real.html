<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
        <!-- task-304：同 index.html / preview.html / preview-dockview.html —— 这一族 4 份入口
             都声明双配色，原生控件（滚动条/焦点环/日期选择器/autofill）才跟随深浅 -->
        <meta name="color-scheme" content="light dark" />
        <title>xihe - 真实 UI · mock 数据预览（dev-only）</title>
        <script>
            /**
             * task-137 rev2（dev-only 入口）：渲染**产品真页面**，只在网络层 mock 数据
             * （vite 中间件 src/preview/mock/api-server.ts，XIHE_UI_MOCK_API=1 才挂载）。
             *
             * 产品代码零分支：真 App（/src/main.ts）不认 mock；这里只负责两件 dev-only 的事 ——
             * ①注入 mock 登录态（真 router 的 guard 只查 localStorage 的 xihe-token）；
             * ②固定语言 zh-CN（设置区稿面要中文；产品语言 SSOT 在 xihe-language）。
             */
            (function () {
                try {
                    if (!localStorage.getItem("xihe-token")) {
                        localStorage.setItem("xihe-token", "mock-lane-token");
                    }
                    // 缓存 user（含 capability 投影）必须与 token 同时存在：真页面首帧按
                    // capabilities 判定「实例层可见」，缺失时 forbidden 会在 capability 回填前
                    // 让域页 load() 提前 return，页面永久停在「加载中...」；真产品里这份缓存由
                    // 登录流程写入，mock lane 由这里补，随后 /auth/me 会用权威值覆盖。
                    if (!localStorage.getItem("xihe-user")) {
                        localStorage.setItem(
                            "xihe-user",
                            JSON.stringify({
                                id: "mock-user",
                                email: "mock@xihe.dev",
                                name: "张安",
                                username: "mock",
                                capabilities: {
                                    isInstanceAdmin: true,
                                    isInstanceSuper: true,
                                    workspaceAdminOf: [],
                                },
                            }),
                        );
                    }
                    localStorage.setItem("xihe-language", "zh-CN");
                    // task-75：**只在键不存在时**写默认值。此前是无条件写 `"light"`
                    // （JSON 引号形态），而这段脚本在每次 HTML 加载时都跑 —— 于是"点深色→刷新"
                    // 在 mock 车道里永远回浅色，任何主题持久化验证都会假失败
                    // （细节见 internal/A03-xihe/evidence/2026-11-11-color-shadcn-unify/green-light-audit.md）。
                    // 语义保留"新环境默认浅色、截图可复现"，但不覆盖用户/产品已写入的值；
                    // 形态用规范**裸值**（与产品 SSOT 一致），不再制造 JSON 引号形态。
                    if (!localStorage.getItem("xihe-theme")) {
                        localStorage.setItem("xihe-theme", "light");
                    }
                    document.documentElement.lang = "zh-CN";
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
