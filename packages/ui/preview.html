<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- task-294：同 index.html —— 预览页也是真实组件，原生控件同样要跟随深浅 -->
        <meta name="color-scheme" content="light dark" />
        <title>xihe · UI preview（真实组件 + mock 数据）</title>
        <script>
            (function () {
                try {
                    // task-75：`xihe-theme` 规范形态是**裸值**（`dark`），历史上出现过 JSON
                    // 引号形态（`"dark"`）。只认一种就会出现"存了深色、首屏却浅色"——两种都认。
                    var raw = localStorage.getItem("xihe-theme");
                    var theme = raw === null ? "system" : raw;
                    if (theme.charAt(0) === '"') {
                        theme = JSON.parse(theme);
                    }
                    if (
                        theme === "dark" ||
                        (theme === "system" &&
                            window.matchMedia("(prefers-color-scheme: dark)").matches)
                    ) {
                        document.documentElement.classList.add("dark");
                    }
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="ui-preview-root"></div>
        <script type="module" src="/src/preview/main.ts"></script>
    </body>
</html>
