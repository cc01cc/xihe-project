<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
        <!-- task-294：声明本页支持双配色，原生控件（滚动条/焦点环/日期选择器/autofill）才跟随深浅 -->
        <meta name="color-scheme" content="light dark" />
        <title>xihe - AI Agent Platform</title>
        <script>
            (function () {
                try {
                    var value = localStorage.getItem("xihe-language") || "zh-CN";
                    if (value.charAt(0) === '"') {
                        value = JSON.parse(value);
                    }
                    var key = String(value).trim().toLowerCase().replace(/_/g, "-");
                    document.documentElement.lang = key.indexOf("en") === 0 ? "en-US" : "zh-CN";
                } catch (e) {}
            })();
            (function () {
                try {
                    // `task-65`：`xihe-theme` 的规范形态是**裸值**（`dark`），历史上有过 JSON 引号形态
                    // （`"dark"`）。两种都要认 —— 只认一种就会出现"用户选了深色、刷新回浅色"。
                    var raw = localStorage.getItem("xihe-theme");
                    var theme = raw === null ? "system" : raw;
                    if (theme.charAt(0) === '"') {
                        theme = JSON.parse(theme);
                    }
                    if (
                        theme === "dark" ||
                        (theme === "system" &&
                            window.matchMedia("(prefers-color-scheme: dark)").matches)
                    ) {
                        document.documentElement.classList.add("dark");
                    }
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
