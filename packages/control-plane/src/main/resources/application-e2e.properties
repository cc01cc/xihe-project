# PLAN-294 F.5 (optimization A): E2E-only lazy bean initialization.
# The E2E stack boots four services per run and only exercises a handful of
# endpoints; deferring bean creation until first use cuts CP startup 30-50%
# (industry-measured). The cost — slower first request — is absorbed by the
# LLM readiness gate and sendChat's retry loop. Never enable for dev/prod.
spring.main.lazy-initialization=true
