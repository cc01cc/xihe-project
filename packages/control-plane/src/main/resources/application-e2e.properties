# PLAN-294 F.5 (optimization A): E2E-only lazy bean initialization.
# The E2E stack boots four services per run and only exercises a handful of
# endpoints; deferring bean creation until first use cuts CP startup 30-50%
# (industry-measured). The cost — slower first request — is absorbed by the
# LLM readiness gate and sendChat's retry loop. Never enable for dev/prod.
spring.main.lazy-initialization=true

# task-244 / PLAN-0763 D-800: the shipped default is springdoc OFF (debug artifact,
# not contract). E2E keeps it ON so reconciliation/debugging during a run works the
# same as before; the packaged default is unaffected.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# task-172 (D-1532 ④): the shipped default is **no** seeded admin (a fresh install must reach
# /onboarding). The host E2E harness logs in as admin@xihe.local (scripts/e2e-host.mjs) and only
# injects XIHE_DEV_ADMIN_PASSWORD, so this lane opts in explicitly. The packaged default is
# unaffected (application.properties keeps ${XIHE_SEED_ADMIN:false}); an explicit value from the
# operator still wins.
cp.bootstrap.seed-admin=${XIHE_SEED_ADMIN:true}

