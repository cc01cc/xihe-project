# PLAN-0584: native host-compatibility build only; activate the Spring `native-aot` profile.
# If the explicit run-scoped URL is absent, fall back only to this run's isolated PG port/database.
spring.datasource.url=${XIHE_CP_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:${XIHE_PG_PORT}/xihe}
spring.datasource.driver-class-name=${XIHE_CP_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${XIHE_CP_DATASOURCE_USERNAME:xihe}
spring.datasource.password=${XIHE_CP_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.aot.jpa.repositories.use-entitymanager=true
xihe.channel.enabled=${XIHE_CHANNEL_ENABLED:true}
server.port=${XIHE_CP_PORT:0}
# PLAN-0584: micrometer's TomcatMetricsBinder (ApplicationStartedEvent listener) calls
# ManagementFactory.getPlatformMBeanServer(), which GraalVM native cannot satisfy:
# NotCompliantMBeanException on MemoryMXBean.getHeapMemoryUsage because MemoryUsage
# cannot be mapped to an open type (same failure as spring-boot#33210; micrometer#2637
# documents that JVM platform MBeans are not usable in native images, and Tomcat's JMX
# connector MBeans are not registered there either). Excluded only in this native-aot
# profile - the default JVM path keeps Tomcat metrics unchanged.
spring.autoconfigure.exclude=org.springframework.boot.tomcat.autoconfigure.metrics.TomcatMetricsAutoConfiguration
