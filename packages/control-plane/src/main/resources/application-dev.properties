# XH CP dev 通道（profile=dev，**默认不激活**）。task-225 / 2026-11-08
# 边界：本文件只在显式 `--spring.profiles.active=dev`（或 SPRING_PROFILES_ACTIVE=dev）时生效；
# 验证窗口（e2e / native-aot / 默认 profile）不激活它 ⇒ 不得污染 L2 证据。
# 只暴露只读管理面；env/beans/heapdump/threaddump 等敏感或重量级端点一律不暴露。

# 1) 管理面独立端口：不把 actuator 混进业务口（12641 等栈位端口），也避免业务口安全链被管理面牵动。
#    12699 属开发段外空闲口（实测 0 监听），且只绑定 127.0.0.1（对本机开放，不对外）。
management.server.port=12699
management.server.address=127.0.0.1

# 2) 只开三个只读端点：health（存活/就绪）、info（构建戳/版本）、metrics（Micrometer 指标）。
#    其余端点（env/beans/configprops/heapdump/threaddump/loggers）保持关闭——dev 不需要，暴露面越小越好。
management.endpoints.web.exposure.include=health,info,metrics

# 3) health 详情按 never：即便 dev 也不把 DB/磁盘/组件细节放到 HTTP 面（需要排障时走日志/jcmd）。
management.endpoint.health.show-details=never

# 4) lazy-init：**本卡否决 dev 启用**（保留注释形态，待有实测条件后再议）。
#    理由：①`application-e2e.properties:1-5` 明确 "Never enable for dev/prod"；
#    ②本机无法独立测量"首次请求代价"（Lead 要求不起第二个 CP 实例，单活跃实例假设）；
#    ③e2e 注释里的 30–50% 是 industry-measured，不是本机事实——没实测就不开，避免把估算当判据。
#spring.main.lazy-initialization=true

# 5) devtools 重启参数：poll-interval=1s / quiet-period=400ms 已是 Boot 默认
#    （`spring-boot-devtools-4.0.6.jar` 的 `DevToolsProperties$Restart` javap 可见 Duration.ofSeconds/ofMillis 构造），
#    按"默认已如此则不加"的卡面规则不重复写默认值；需要更快热循环时另开卡调小并实测。
