server.port=${XIHE_CP_PORT:12631}
spring.threads.virtual.enabled=true
# Suppress the auto-generated UserDetailsService warning (it prints a random
# password to the log and triggers scan-log-secrets). CP uses JWT only; this
# InMemory user is never used for real auth.
spring.security.user.name=xihe
# PLAN-0307 T3.4: XIHE_CP_SECURITY_PASSWORD removed (declared unused, decision #7);
# user.name is retained only for the legacy warning-suppression intent above.

# ============================================================
# Database - H2 for dev, PostgreSQL for production
# ============================================================
spring.datasource.url=${XIHE_CP_DATASOURCE_URL:jdbc:postgresql://localhost:${XIHE_PG_PORT:12634}/xihe}
spring.datasource.driver-class-name=${XIHE_CP_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${XIHE_CP_DATASOURCE_USERNAME:xihe}
spring.datasource.password=${XIHE_CP_DATASOURCE_PASSWORD:}

# Flyway is the only schema manager (PLAN-280): Hibernate validates only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${XIHE_CP_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# PLAN-0346 T1.8: upper bound for PostgreSQL lock waits inside ledger/context
# write transactions (SET LOCAL per transaction; see DbLockTimeout). A timed-out
# request fails explicitly with 503 OPERATION_LOCK_TIMEOUT and is safe to retry.
cp.lock-timeout-ms=${XIHE_CP_LOCK_TIMEOUT_MS:5000}

# Flyway migrations
spring.flyway.enabled=true
# Fresh installs apply the new V1 baseline from empty; legacy databases are
# rejected and must be reset (PLAN-280 destructive rebaseline).
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# H2 Console (dev only)
spring.h2.console.enabled=${XIHE_CP_H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ============================================================
# JWT Configuration
# ============================================================
cp.jwt.secret=${XIHE_CP_JWT_SECRET:xihe-cp-jwt-secret-key-change-in-production}
cp.jwt.access-token-validity-seconds=${XIHE_CP_JWT_ACCESS_VALIDITY:900}
cp.jwt.refresh-token-validity-seconds=${XIHE_CP_JWT_REFRESH_VALIDITY:604800}

# ============================================================
# Login brute-force protection (PLAN-0558)
# Counters are in-process. Set a max-failures value to 0 to disable that
# dimension. X-Forwarded-For is ignored unless the socket remote address is
# listed in cp.auth.login.trusted-proxies (comma-separated IP/CIDR).
# ============================================================
cp.auth.login.account.max-failures=${XIHE_CP_AUTH_LOGIN_ACCOUNT_MAX_FAILURES:5}
cp.auth.login.account.window-seconds=${XIHE_CP_AUTH_LOGIN_ACCOUNT_WINDOW_SECONDS:900}
cp.auth.login.account.lock-seconds=${XIHE_CP_AUTH_LOGIN_ACCOUNT_LOCK_SECONDS:900}
cp.auth.login.account.max-concurrent=${XIHE_CP_AUTH_LOGIN_ACCOUNT_MAX_CONCURRENT:2}
cp.auth.login.ip.max-failures=${XIHE_CP_AUTH_LOGIN_IP_MAX_FAILURES:20}
cp.auth.login.ip.window-seconds=${XIHE_CP_AUTH_LOGIN_IP_WINDOW_SECONDS:900}
cp.auth.login.ip.lock-seconds=${XIHE_CP_AUTH_LOGIN_IP_LOCK_SECONDS:900}
cp.auth.login.global-max-concurrent=${XIHE_CP_AUTH_LOGIN_GLOBAL_MAX_CONCURRENT:4}
cp.auth.login.max-tracked-keys=${XIHE_CP_AUTH_LOGIN_MAX_TRACKED_KEYS:10000}
cp.auth.login.cleanup-interval-ms=${XIHE_CP_AUTH_LOGIN_CLEANUP_INTERVAL_MS:60000}
cp.auth.login.trusted-proxies=${XIHE_CP_AUTH_TRUSTED_PROXIES:}
cp.auth.login.ipv6-prefix-length=${XIHE_CP_AUTH_LOGIN_IPV6_PREFIX_LENGTH:64}
cp.auth.login.register.max-attempts=${XIHE_CP_AUTH_LOGIN_REGISTER_MAX_ATTEMPTS:30}
cp.auth.login.register.window-seconds=${XIHE_CP_AUTH_LOGIN_REGISTER_WINDOW_SECONDS:3600}
cp.auth.login.register.lock-seconds=${XIHE_CP_AUTH_LOGIN_REGISTER_LOCK_SECONDS:1800}
cp.auth.login.register.exempt-loopback=${XIHE_CP_AUTH_LOGIN_REGISTER_EXEMPT_LOOPBACK:true}

# ============================================================
# MCP reverse proxy config
# ============================================================
cp.mcp.runtime-url=${XIHE_RUNTIME_URL:http://127.0.0.1:${XIHE_RUNTIME_PORT:12633}}
cp.attachments-base-path=${XIHE_ATTACHMENTS_BASE_PATH:/data/xihe/attachments}
cp.attachments.allowed-extensions=${XIHE_ATTACHMENTS_ALLOWED_EXTENSIONS:png,jpg,jpeg,gif,webp,svg,bmp,pdf,doc,docx,txt,md,json,csv,xls,xlsx,ppt,pptx,mp3,wav,m4a,ogg,flac,aac,mp4,webm,mov,avi,mkv}
cp.attachments.orphan-retention-hours=${XIHE_ATTACHMENTS_ORPHAN_RETENTION_HOURS:24}
cp.attachments.orphan-cleanup-interval-ms=${XIHE_ATTACHMENTS_ORPHAN_CLEANUP_INTERVAL_MS:3600000}
cp.agent-url=${XIHE_AGENT_URL:http://localhost:${XIHE_AGENT_PORT:12632}/internal/v1/agent/chat}
cp.agent-base-url=${XIHE_AGENT_BASE_URL:http://localhost:${XIHE_AGENT_PORT:12632}}
cp.agent-api-token=${XIHE_AGENT_API_TOKEN:${XIHE_CP_API_TOKEN:dev-token-not-secure}}
cp.mcp.websearch-url=http://localhost:3000/mcp
cp.mcp.timeout.read-file=10s
cp.mcp.timeout.execute-command=5min
cp.mcp.response.max-size=50MB

# Remote MCP OAuth. Production must provide a base64-encoded AES-256 key and disable the dev key.
cp.oauth.encryption-key=${XIHE_CP_OAUTH_ENCRYPTION_KEY:}
cp.oauth.allow-dev-key=${XIHE_CP_OAUTH_ALLOW_DEV_KEY:true}
# Comma-separated exact hosts or wildcard suffixes for remote MCP/OAuth endpoints.
cp.oauth.allowed-hosts=${XIHE_CP_OAUTH_ALLOWED_HOSTS:}

# Provider Connection credentials were retired by PLAN-0553; keys live in the
# credential manager domain below. Legacy cp.provider-credentials.* keys are gone.

# Credential manager domain (PLAN-0495). Production must provide a base64-encoded
# AES-256 key (cp.credentials.encryption-key) or a multi-version key ring
# (cp.credentials.key-ring, JSON {version: base64 key}; the ring must contain
# cp.credentials.current-version) and disable the development fallback.
cp.credentials.encryption-key=${XIHE_CP_CREDENTIALS_KEY:}
cp.credentials.key-ring=${XIHE_CP_CREDENTIALS_KEY_RING:}
cp.credentials.current-version=${XIHE_CP_CREDENTIALS_CURRENT_VERSION:v1}
cp.credentials.allow-dev-key=${XIHE_CP_CREDENTIALS_ALLOW_DEV_KEY:true}

# PLAN-0552: temporary escape hatch for the legacy workspace->user profile
# connection fallback. Strict per-layer resolution is the default; set true only
# for a short rollback window.
cp.llm.profile-legacy-connection-fallback=${XIHE_CP_LLM_PROFILE_LEGACY_FALLBACK:false}

# ============================================================
# XH Channel over WebSocket (PLAN-245) — default off: no WS
# endpoint is registered and Runtime keeps HTTP heartbeat/poll.
# ============================================================
xihe.channel.enabled=${XIHE_CHANNEL_ENABLED:false}
# Heartbeat timeout: no app-level heartbeat within this window marks the session stale.
xihe.channel.heartbeat-timeout-seconds=${XIHE_CHANNEL_HEARTBEAT_TIMEOUT_SECONDS:90}

# ============================================================
# Unified Config (PLAN-0307: physical items live in env, not DB)
# ============================================================

# Audit logging
cp.audit.log-to-console=${XIHE_CP_AUDIT_LOG_TO_CONSOLE:true}

# Agent base URL (for proxy endpoints, derived from agent-url)
cp.agent-base-url=${XIHE_AGENT_BASE_URL:http://localhost:12632}

# PLAN-0489 T1.2: scheduled_tasks scan (0486 spec §3/§5 拟定值)
cp.scheduled.scan-interval-ms=30000
cp.scheduled.scan-initial-delay-ms=30000
cp.scheduled.grace-ms=600000
cp.scheduled.dispatch-timeout-ms=60000

logging.level.com.cc01cc.p.xihe.cp=${XIHE_LOG_LEVEL_CP:${XIHE_LOG_LEVEL:INFO}}
logging.file.dir=${XIHE_LOG_DIR:logs}
