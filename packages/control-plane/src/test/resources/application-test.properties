# PostgreSQL integration test profile (Testcontainers)
# Datasource is injected via @DynamicPropertySource in AbstractIntegrationTest

# Flyway is the only schema manager (PLAN-280); Hibernate validates only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway runs against real PostgreSQL
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

cp.jwt.secret=test-jwt-secret-key-for-testing-purposes
cp.jwt.access-token-validity-seconds=900
cp.jwt.refresh-token-validity-seconds=604800
# PLAN-eff/task-13 M1: 2-shard 并行时两个 fork 不能共用同一个附件目录（否则 A/B shard 互相
# 删除对方刚上传的文件、或 OrphanAttachmentCleanupService 把对方的活文件当孤儿）。默认值 0
# 保证单 fork 运行时路径与历史一致（旧路径只是变成 attachments-0）。
cp.attachments-base-path=${java.io.tmpdir}/xihe-test/attachments-${surefire.forkNumber:0}

# PLAN-0558: disable login throttling by default in the shared test context;
# lockout tests opt in with @TestPropertySource and their own context.
cp.auth.login.account.max-failures=0
cp.auth.login.ip.max-failures=0
cp.auth.login.global-max-concurrent=0
cp.auth.login.register.max-attempts=0

# PLAN-0612 M4: the shared PG test lane exercises the docker workspace backend (jobs/materialize);
# the frozen-by-default gate is asserted by WorkspaceBackendPolicyTest, while the host E2E lane
# injects the same exemption explicitly (DEV-020).
XIHE_WORKSPACE_DOCKER_BACKEND=disabled

# PLAN-0691 (D-66) gated the whole plugin surface behind cp.plugin.enabled (shipped default: false,
# read from XIHE_CP_PLUGIN_ENABLED). That default is right for the product but wrong for the shared
# test profile: the contract in docs/api/openapi.yaml describes the plugin routes, so with the flag
# off every test context holds "documented but implemented by no controller" and
# RouteContractParityTest can never be green — i.e. the gate would hide a real drift forever.
# The test profile therefore runs the feature ENABLED (the build we validate), while:
#   * the shipped default stays false (application.properties, untouched);
#   * PluginKvFeatureFlagTest pins cp.plugin.enabled=false inline to keep asserting the off contract
#     (404 rather than 401/403 — BE-D66: an off feature must look like it never existed);
#   * plugin-surface tests keep setting the flag inline (they do not depend on this).
cp.plugin.enabled=true
