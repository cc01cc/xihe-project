# PostgreSQL integration test profile (Testcontainers)
# Datasource is injected via @DynamicPropertySource in AbstractIntegrationTest

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway runs against real PostgreSQL
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

cp.jwt.secret=test-jwt-secret-key-for-testing-purposes
cp.jwt.access-token-validity-seconds=900
cp.jwt.refresh-token-validity-seconds=604800
cp.attachments-base-path=${java.io.tmpdir}/xihe-test/attachments
