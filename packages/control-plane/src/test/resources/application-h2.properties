# H2 开发测试配置（无需 Docker，用于本地开发）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PLAN-280 Decision 18 explicit exception: H2 legacy unit tests use create-drop
# from JPA entities and do not run Flyway. H2 results must not be counted as
# PostgreSQL schema-gate evidence; PostgreSQL is validated via Testcontainers.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 测试不运行 Flyway（PostgreSQL 语法在 H2 下可能有兼容问题）
spring.flyway.enabled=false

# PLAN-0691 T2.2: plugin_records / plugin_index_declarations only exist in the V142 migration and
# deliberately have no JPA entity (the ledger is written by the index DDL executor over raw JDBC), so
# create-drop cannot produce them. h2-schema.sql adds exactly those two tables AFTER Hibernate's DDL
# (defer is what puts it after; without it the script would run on an empty database and Hibernate
# would then create its own tables on top). H2 stays a Java-lifecycle lane: schema facts are asserted
# on PostgreSQL via Testcontainers.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2-schema.sql

cp.jwt.secret=test-jwt-secret-key-for-testing-purposes
cp.jwt.access-token-validity-seconds=900
cp.jwt.refresh-token-validity-seconds=604800

# Internal API token for module-to-module communication
cp.agent-api-token=dev-token-not-secure
cp.attachments-base-path=${java.io.tmpdir}/xihe-test/attachments-${surefire.forkNumber:0}
