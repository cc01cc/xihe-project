      responses:
        '200':
          description: Workspace git status
          content:
            application/json:
              schema: { type: object, required: [isRepository, entries], properties: { isRepository: { type: boolean }, entries: { type: array, items: { type: object, properties: { status: { type: string }, path: { type: string } } } } } }
