openapi: 3.1.0
info:
  title: Xihe API
  version: 1.0.0
  description: Canonical HTTP contract for Xihe public and service APIs.
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/workspaces/current:
    get: { operationId: getCurrentWorkspace, security: [{ bearerAuth: [] }], responses: { '200': { description: Current workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      security: [{ bearerAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/workspaces/{workspaceId}:
    get: { operationId: getWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: updateWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUpdateRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '204': { description: Logically deleted }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/sessions:
    get: { operationId: listSessions, security: [{ bearerAuth: [] }], responses: { '200': { description: Sessions } } }
    post: { operationId: createSession, security: [{ bearerAuth: [] }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreateRequest' } } } }, responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '401': { $ref: '#/components/responses/Problem' } } }
  /api/v1/sessions/{sessionId}:
    get: { operationId: getSession, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: updateSession, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/SessionUpdateRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteSession, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/sessions/{sessionId}/compact:
    post: { operationId: compactSessionContext, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { upToSequence: { type: integer, format: int64, description: Optional compaction cursor } } } } } }, responses: { '200': { description: 'Manual compaction applied (sequence/eventType/created_at); 409 when a chat run is active' }, '409': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/oauth/sessions:
    post:
      operationId: startOAuthSession
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Created }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/oauth/callback:
    get:
      operationId: oauthCallback
      parameters: [{ in: query, name: state, required: true, schema: { type: string } }, { in: query, name: code, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthBindingRequest' }
      responses:
        '200':
          description: Revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/oauth/token:
    post:
      operationId: brokerOAuthToken
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthTokenRequest' } } } }
      responses: { '200': { description: 'OAuth token response (access_token / token_type / expires_in / scope)' }, '400': { $ref: '#/components/responses/Problem' }, '401': { description: 'OAUTH_REAUTH_REQUIRED: missing credential, non-AUTHORIZED status, scope mismatch, or provider rejected the refresh (4xx / OAuth error)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '403': { $ref: '#/components/responses/Problem' }, '503': { description: 'OAUTH_TOKEN_UNAVAILABLE (provider unreachable / timeout / 5xx) or OPERATION_LOCK_TIMEOUT (PLAN-0346 lock wait was bounded)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } } }
  /api/v1/mcp:
    post:
      operationId: mcpPost
      summary: MCP JSON-RPC endpoint (tools/list, tools/call, discovery)
      description: |
        Agent-facing MCP gateway. The Gateway-public built-in mutation `apply_patch` is exposed
        through the normal approval path. `tools/call` is policy-gated: ALLOW dispatches, ASK requires an
        exact approval grant or session fingerprint. A run-scoped ASK without either creates (or
        reuses) the durable pending approval and answers `409` with a JSON-RPC error frame carrying
        the safe extension in `error.data`; a call without run context falls back to the legacy
        `application/problem+json` body (no extension — the Agent registers no waiter and fails
        closed).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: MCP JSON-RPC response }
        '409':
          description: APPROVAL_REQUIRED — no valid approval grant / session fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpApprovalRequiredError' }
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: "https://xihe.dev/problems/approval-required", title: "Approval required", status: 409, code: "APPROVAL_REQUIRED", detail: "Tool execution requires approval before dispatch", requestId: "req-..." }
    get: { operationId: mcpStream, security: [{ bearerAuth: [] }], responses: { '200': { description: MCP SSE stream, content: { text/event-stream: {} } } } }
    delete: { operationId: mcpDisconnect, security: [{ bearerAuth: [] }], responses: { '204': { description: Disconnected } } }
  /internal/v1/config/effective/{domain}:
    get:
      operationId: getEffectiveConfig
      summary: Resolve effective config for a domain (env > workspace > user > instance > defaults); no layer exposure
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: query, name: userId, required: false, schema: { type: string, format: uuid } }
      responses: { '200': { description: Effective configuration (entries/revision/source) }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' } }
  /internal/v1/workspaces/{workspaceId}/stdio-servers:
    get:
      operationId: getInternalWorkspaceStdioServers
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      responses: { '200': { description: Stdio servers with generation/hash }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/chat:
    post:
      operationId: chat
      summary: Enqueue a chat turn (requires active SSE)
      description: |
        Accepts a user message for the given session and enqueues an async relay to the Agent.
        The caller must already hold an active `GET /api/v1/events?sessionId=` subscription for the same session;
        otherwise the request is rejected with `409 SSE_SUBSCRIPTION_REQUIRED`.
        Only one in-flight run per session is allowed (`409 CHAT_IN_PROGRESS`).
        The accepted run streams `token` events followed by a terminal `done` over the persistent session SSE —
        `done` ends the run, not the SSE connection. The SSE remains reusable for the next chat.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 128 }
          description: Reuses an existing run for the same request hash; conflicting payloads return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '202':
          description: Accepted — run enqueued, progress via SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRunResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: SSE subscription missing or run already active
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: "https://xihe.dev/problems/sse-subscription-required", title: "SSE subscription required", status: 409, code: "SSE_SUBSCRIPTION_REQUIRED", detail: "An active SSE subscription is required", requestId: "req-..." }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/runs/{runId}:
    get:
      operationId: getChatRunStatus
      summary: Get a ChatRun status and its pending approvals
      description: |
        Returns the authenticated user's ChatRun status for the current workspace.
        `pendingApprovals` contains the CP-owned durable approval envelope, not the
        raw Agent approval status. The envelope is also used for reconnect/reload
        recovery and contains only the bounded approval preview and safe policy metadata.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ChatRun recovery status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRunStatusResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/approvals/{requestId}/decision:
    post:
      operationId: decideChatApproval
      summary: Submit a user decision for a pending Chat approval
      description: |
        The browser submits an approval decision through Control Plane. The
        requestId is a UUID and must belong to the authenticated user's current
        workspace/session/run. Control Plane forwards the decision to Agent
        with the service Bearer; browsers must never call the Agent internal
        approval endpoint directly. Repeating the same decision is idempotent.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatApprovalDecisionRequest' }
      responses:
        '200':
          description: Decision accepted or repeated idempotently
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatApprovalDecisionResponse' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/v1/approvals/pending:
    get:
      operationId: listPendingApprovals
      summary: Cross-session live actionable approval/retry indicator (counts only)
      description: |
        PLAN-0328 M1 T1.16 (spec/ui-ux §1.2): one entry per session with at least one of the
        live actionable approval/retry states (`pending` or `dispatch_unknown`) for the authenticated
        user in the current workspace. `dispatching` remains in-flight and is not counted.
        Counts and timestamps only — never tool arguments, approval details or rule text
        (spec/approval.md §15).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pending approval summaries, oldest session first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingApprovalSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/mode:
    get:
      operationId: getPolicyMode
      summary: Get the session-scoped policy mode
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current session policy mode and session rule count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyModeState' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: setPolicyMode
      summary: Set the session-scoped policy mode
      description: |
        Persists `manual` / `auto` on the session row (PLAN-0337 V24), so the choice survives a CP
        restart; a workspace-level default comes from the `approval-policy` config domain. An
        unsupported mode is rejected with `400 INVALID_REQUEST`, an unknown/unowned session with
        `404 SESSION_NOT_FOUND`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyModeUpdateRequest' }
      responses:
        '200':
          description: Updated session policy mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyModeUpdateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/domains:
    get:
      operationId: listPolicyDomains
      summary: List action-class domains with their effective layer
      description: |
        PLAN-0328 M1 (spec/ui-ux §3.3): per-domain (`actionClass`) view of the persisted policy
        layers. `effectiveLayer` is the highest layer that configures the domain, or `builtin`
        when only built-in defaults apply. `ruleCounts` lists only layers that hold at least one
        rule. Domains are the built-in action classes plus every action class configured by
        persisted instance/user/workspace rules.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Domain views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyDomainView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/rules:
    get:
      operationId: listPolicyRules
      summary: List persisted rules of one layer
      description: |
        Returns the rules persisted in the requested layer together with the server-derived
        `effective` flag (this layer is the domain's effective layer) and the static conflict
        note (`conflict`, null when none). It does not report runtime matches. Instance-layer
        reads require ADMIN; workspace-layer reads use the authenticated workspace scope.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: layer
          required: true
          schema: { type: string, enum: [instance, user, workspace] }
      responses:
        '200':
          description: Layer rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyRuleView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPolicyRule
      summary: Create a persisted rule in one layer
      description: |
        Instance-layer writes require the server-side ADMIN guard; workspace-layer writes require
        the workspace OWNER/ADMIN guard. `locked` is ADMIN-only and may only accompany deny/ask.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleCreateRequest' }
      responses:
        '200':
          description: Created rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRuleView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/rules/{id}:
    delete:
      operationId: deletePolicyRule
      summary: Delete a persisted rule in its layer
      description: |
        Deletion is scoped by `layer` and ownership; a rule of another layer/owner is reported as
        404 without leaking its existence. Instance-layer deletes require ADMIN; workspace-layer
        deletes require workspace OWNER/ADMIN.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: layer
          required: true
          schema: { type: string, enum: [instance, user, workspace] }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/rules/conflicts:
    get:
      operationId: listPolicyRuleConflicts
      summary: List the conflict-carrying rules of one layer
      description: |
        Static conflict view for one layer: the subset of `GET /api/v1/policy/rules?layer=` whose
        `conflict` note is present (for example an allow shadowed by a more specific deny).
        Conflict detection is server-side; clients never derive it locally.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: layer
          required: true
          schema: { type: string, enum: [instance, user, workspace] }
      responses:
        '200':
          description: Rules carrying a conflict note
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyRuleView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/tool-faces:
    get:
      operationId: listPolicyToolFaces
      summary: List built-in and persisted tool classifications
      description: |
        Returns the effective tool-face catalog for the requested `instance` or `workspace`
        scope. Built-in entries are returned with `id: null`, `scope: builtin`, and
        `ownerId: null`. Persisted instance entries override built-ins; workspace entries
        override both for a workspace request. Unknown third-party tools are intentionally
        absent until their first approval request and explicit classification. Authorization
        is enforced server-side from the authenticated TenantContext.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string, enum: [instance, workspace] }
          description: Effective catalog scope to list; `builtin` is response metadata only.
      responses:
        '200':
          description: Effective tool-face catalog, sorted by tool name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ToolFaceView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: upsertPolicyToolFace
      summary: Classify a tool face
      description: |
        Creates or updates an explicit instance or workspace classification. Built-in faces
        cannot be written as a scope. Instance writes require the server-side ADMIN guard;
        workspace writes require the server-side workspace owner/admin guard.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolFaceUpsertRequest' }
      responses:
        '200':
          description: Persisted classification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolFaceView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/events:
    get:
      operationId: chatEvents
      summary: Subscribe to session-scoped persistent SSE
      description: |
        Session-scoped **persistent** Server-Sent Events connection.
        * One active emitter per `sessionId` (v1). A new `GET /api/v1/events?sessionId=` replaces any prior emitter for the same session; the old emitter's completion/timeout/error callbacks are identity-checked and must not delete the new emitter (`stale_cleanup_ignored`).
        * `done` terminates a **run**, not the session SSE. The connection stays open across multiple `POST /api/v1/chat` turns and only closes on client disconnect, session deletion, or explicit server termination.
        * The server sends a `heartbeat` comment/event every 15s to keep the connection observable. Heartbeat never enters the message bubble nor resets the run's token count.
        * Connection authorization is bounded by the access-token lifetime; v1 closes the SSE before token expiry and the UI enters a recoverable authenticated state (no silent credential leak).
        * PLAN-0338/0339: the session channel also carries `run_checkpoint` — `{runId, sessionId, sliceRef?, capturedAt?, state, changedCount, unrollableReason?, revert?}` — after a slice capture, a degraded capture, or a completed restore (`revert` = `{state, at, counts, ref, attemptCount}`). The event only annotates lifecycle; the workspace slice list remains the durable source on reload.
          * Event order per run is `connected` (once per SSE open) → `status`/`thinking` (optional) → `approval_request` (optional) → approval decision via the CP public route → `tool_result` (approval gate) → downstream `tool_call`/`tool_result` and `token` (only after approval) → `done` (exactly one, may carry `errorCode`/`synthetic`). Tool events carry `toolCallId` and `origin` (`local` or `mcp`) for the channel-fact ledger; `request_approval` itself is represented by the approval event/item and does not emit a duplicate tool event. Approval live/replay envelopes are built from the durable row only and include `state` plus `replayed=false/true`; at creation, the display-only `policy` summary is persisted when it can be captured: `effect`, `sourceLayer`, `matchedRule`, `reason`, `mode`, `actionClass`, and `shape`. The policy summary never contains raw tool arguments. After the atomic decision claim, `policy.modeAtGrant` records the effective session mode at that decision and is never rewritten by a retry; replay uses the stored snapshot, and descriptor failure omits only policy metadata without blocking delivery. On rejection/expiry, no downstream sensitive tool call is allowed and a terminal `error` + `done` is sent. The session SSE is retained unless the emitter itself is unwritable. A failed, parseable command result may carry an optional `diagnostics` bundle (`{items, total, confidence}`; `items` is the Top-N slice of `total`) on `tool_result` data — structured facts copied from the Agent tool-message artifact channel and relayed unchanged by CP; the model-visible `<diagnostics>` block stays inside the untrusted envelope.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sessionId
          required: true
