    RagSearchRequest: { type: object, required: [query, embeddingProfile, embeddingCredentialLease], properties: { query: { type: string }, topK: { type: integer, default: 5 }, embeddingProfile: { type: string }, embeddingCredentialLease: { type: string, writeOnly: true } } }
