      responses:
        '200': { description: Role updated, content: { application/json: { schema: { $ref: '#/components/schemas/MemberView' } } } }
        '400': { description: INVALID_REQUEST (role not in EDITOR|VIEWER), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'WORKSPACE_FORBIDDEN (non-OWNER) / WORKSPACE_READ_ONLY (VIEWER with X-Workspace-Id)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'WORKSPACE_NOT_FOUND / MEMBER_NOT_FOUND (target not a member of this workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: LAST_OWNER, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [workspace]
      operationId: removeWorkspaceMember
      summary: Remove one member (PLAN-0565)
      description: |
        PLAN-0565 (spec §3/§4): workspace OWNER, or instance-ADMIN emergency
