      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        agentPrincipalId: { type: [string, 'null'], format: uuid, description: Sourced from the Session PRIMARY participant. }
        modelProvider: { type: [string, 'null'] }
        modelName: { type: [string, 'null'] }
        providerConnectionId: { type: [string, 'null'], format: uuid }
        connectionRevision: { type: [integer, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
