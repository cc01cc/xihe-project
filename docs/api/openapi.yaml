            userId: { type: [string, 'null'], readOnly: true }
            runId: { type: [string, 'null'], readOnly: true }
            requestId: { type: [string, 'null'], readOnly: true }
            kind: { type: string, readOnly: true }
            source: { type: string, readOnly: true }
            actorType: { type: string, readOnly: true }
            actorId: { type: [string, 'null'], readOnly: true }
            status: { type: string, readOnly: true }
