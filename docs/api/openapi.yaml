        '404': { description: 'WORKSPACE_NOT_FOUND / MEMBER_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: LAST_OWNER, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/imports:
    get: { tags: [workspace], operationId: listWorkspaceImports, summary: List imports of one workspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace import jobs }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
    post: { tags: [workspace], operationId: createWorkspaceImport, summary: Start a new workspace import, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sourcePath, idempotencyKey], properties: { sourcePath: { type: string }, excludeRules: { type: array, items: { type: string } }, idempotencyKey: { type: string } } } } } }, responses: { '202': { description: Import accepted }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { description: BACKEND_DISABLED (workspace runs on the frozen docker execution backend; migrate to direct_attach) } } }
  /api/v1/workspaces/import-sources:
    get: { tags: [workspace], operationId: listWorkspaceImportSources, summary: List available workspace import sources, security: [{ bearerAuth: [] }], parameters: [{ in: query, name: path, required: true, schema: { type: string } }], responses: { '200': { description: Runtime-visible source directory entries }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '502': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspace-imports/{importId}:
    get: { tags: [workspace], operationId: getWorkspaceImport, summary: Get one workspace import by id, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: importId, required: true, schema: { type: string } }], responses: { '200': { description: Import status }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspace-imports/{importId}/cancel:
    post: { tags: [workspace], operationId: cancelWorkspaceImport, summary: Cancel a running workspace import, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: importId, required: true, schema: { type: string } }], responses: { '200': { description: Import cancellation state }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/agent-principals/{principalId}/roles:
    get:
      tags: [agent]
      operationId: listAgentPrincipalRoles
      summary: List one agent principal's role bindings (PLAN-0667)
      description: |
        PLAN-0667: the agent-principal role binding surface. It reads the `role_bindings` rows whose
        `subject_type='agent_principal'` and `subject_id={principalId}`; user bindings keep using
        `GET /api/v1/bindings` (that surface stays user-only and unchanged).
        Gate: `MANAGE_AGENT_PRINCIPALS` (N1, instance tier) **or** `MANAGE_WORKSPACE_AGENTS` evaluated
        in the optional `workspaceId` authorization context; without either the answer is 403. A
        principal the caller cannot see answers 404 `AGENT_PRINCIPAL_NOT_FOUND` (same body as a
        missing id — no existence oracle).
        `atoms` are **localized short labels** of the role's derived atoms (PermissionAtomLabels, at most 12;
        `atomCount` carries the real distinct count, so the UI shows `slice(0,3)` plus "共 N 个"). Label
        locale comes from `?locale=` (zh-CN default, en-US supported), else the Accept-Language header; machine
        atom names never leave the server (D5: show what the role can do, never dump the whole permission surface).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context only: when present the workspace-tier atom is evaluated in this workspace; absent means only the instance-tier atom can authorize the read.' }
        - { in: query, name: locale, required: false, schema: { type: string, enum: [zh-CN, en-US] }, description: 'Label locale for atoms (zh-CN default; en-US supported). Falls back to Accept-Language, then zh-CN.' }
      responses:
        '200': { description: 'Role bindings of this principal', content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalRoleBindingListResponse' } } } }
        '400': { description: 'INVALID_REQUEST; X-Workspace-Id conflicts with ?workspaceId (send only one) ⇒ WORKSPACE_CONTEXT_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (neither MANAGE_AGENT_PRINCIPALS nor MANAGE_WORKSPACE_AGENTS in the authorization context)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND (also for a principal the caller cannot see)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [agent]
      operationId: bindAgentPrincipalRole
      summary: Bind one role to an agent principal (PLAN-0667)
      description: |
        PLAN-0667. Adds one `role_bindings` row with `subject_type='agent_principal'` and
        re-materializes the subject's grants **in the same transaction**, so the agent's next session
        already sees the new capability (no cache warm-up, no background job).
        Gates: `MANAGE_AGENT_PRINCIPALS` (instance tier) or `MANAGE_WORKSPACE_AGENTS` in `workspaceId`;
        the actor can never be the subject itself (an agent cannot bind itself).
        Scope is **server-derived** (Lead ruling 2026-11-05, real-stack gap 2): the body carries
        only `roleId`; a `workspaceId` authorization context derives workspace scope, no context
        derives the instance scope (which requires `MANAGE_AGENT_PRINCIPALS`). The caller can never
        choose a scope it cannot authorize, so `scopeType`/`scopeId` in the body are rejected.
        Refusals: a role carrying any `PermissionAtomCatalog.agentPrincipalForbiddenAtoms()` atom ⇒
        **409 `AGENT_PRINCIPAL_FORBIDDEN_ATOMS`** with only atom names in `detail`; an existing row
        for the same (role, principal, derived scope) ⇒ **409 `ROLE_BINDING_EXISTS`**; an
        unknown/invisible role or principal ⇒ 404. The agent's workspace **cap is a hard ceiling**
        (BL-287): a role carrying an atom outside that cap ⇒ **409 `ROLE_BINDING_EXCEEDS_CAP`** whose
        `detail` names the exceeding atoms — a binding is never accepted while guaranteed to have no
        effect in authorization.
        Role axis stays closed (PLAN-0680 R-6): `role_bindings` workspace rows exist only as
        reachability/cap inputs (PLAN-0629 semantics); this write surface remains single-axis
        (instance), and cap-per-axis evaluation is deferred to a separate plan after BL-287 is
        re-proven.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context only (see GET).' }
        - { in: query, name: locale, required: false, schema: { type: string, enum: [zh-CN, en-US] }, description: 'Label locale for the response atoms (see GET).' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalRoleBindRequest' } } }
      responses:
        '201': { description: 'The created binding', content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalRoleBindingView' } } } }
        '400': { description: 'INVALID_REQUEST (body must contain only roleId; a client-supplied scope is rejected); X-Workspace-Id conflicts with ?workspaceId (send only one) ⇒ WORKSPACE_CONTEXT_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (no binding authority, or actor == subject)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND / ROLE_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'AGENT_PRINCIPAL_FORBIDDEN_ATOMS / ROLE_BINDING_EXISTS', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-principals/{principalId}/roles/{bindingId}:
    delete:
      tags: [agent]
      operationId: unbindAgentPrincipalRole
      summary: Remove one role binding from an agent principal (PLAN-0667)
      description: |
        PLAN-0667. Deletes the binding row and re-materializes the subject's grants in the same
        transaction (the capability disappears for the agent's next session). Only a **seed
        binding** (`is_seed=true`, written by the seeding/creation defaults) is immutable ⇒
        **409 `ROLE_BINDING_IMMUTABLE`**; a user-created binding of a system role is deletable.
        Before the Lead ruling of 2026-11-05 the check read `roles.is_system`, so binding the most
        useful roles (WS_EDITOR etc.) to an agent principal could never be undone.
        An id that does not exist, or belongs to another subject, answers 404 `ROLE_BINDING_NOT_FOUND`
        (no cross-subject probe).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context only (see GET).' }
      responses:
        '204': { description: 'Binding removed' }
        '400': { description: 'INVALID_REQUEST; X-Workspace-Id conflicts with ?workspaceId (send only one) ⇒ WORKSPACE_CONTEXT_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (no binding authority)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND / ROLE_BINDING_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: ROLE_BINDING_IMMUTABLE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-principals/{principalId}/skills:
    get:
      tags: [agent]
      operationId: listAgentPrincipalSkills
      summary: List one agent principal's skill bindings (PLAN-0667)
      description: |
        PLAN-0667: reads `skill_bindings` rows with `subject_type='agent_principal'` and
        `subject_id={principalId}`. Same authorization shape as the roles listing
        (`MANAGE_AGENT_PRINCIPALS` or `MANAGE_WORKSPACE_AGENTS` in `workspaceId`), same
        404-for-invisible-principal rule.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context only (see GET roles).' }
      responses:
        '200': { description: 'Skill bindings of this principal', content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalSkillBindingListResponse' } } } }
        '400': { description: 'INVALID_REQUEST; X-Workspace-Id conflicts with ?workspaceId (send only one) ⇒ WORKSPACE_CONTEXT_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND (also for a principal the caller cannot see)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [agent]
      operationId: bindAgentPrincipalSkill
      summary: Bind one skill to an agent principal (PLAN-0667)
      description: |
        PLAN-0680 (dual axis): the binding scope is server-derived from the authorization context —
        `workspaceId` present ⇒ `scope_type='workspace'`, `scope_id` = that workspace (the agent
        carries the skill only inside that workspace); absent ⇒ `scope_type='instance'`,
        `scope_id=null` (instance-tier authority required). The nested body carries only `skillId`;
        a `scopeType`/`scopeId` key is 400 `INVALID_REQUEST`, because scope is an authorization
        decision, not a client choice (same shape as the role surface).
        Definition visibility and the atom-source restriction form one fixed-order chain: a
        workspace-private definition is bindable only inside its own workspace; any other
        workspace-private definition answers 404 `SKILL_NOT_FOUND` (no existence leak); an
        instance-library definition is bindable on either axis, and a workspace-triggered bind
        always writes the current workspace row (never an instance row) — the workspace axis only
        grants atoms of that workspace, and the instance library is already instance-visible, so
        the binding narrows, never widens, the visible surface.
        A user-scope (personal) definition is never bindable here, on either axis: a principal is
        not its owner, so the answer is 404 `SKILL_NOT_FOUND`, the same as a missing id — the
        personal library stays inside its owner's own skill bindings and cannot ride an agent
        whose prompts another caller can drive.
        A duplicate answers 409 `SKILL_BINDING_EXISTS`, computed per (skill, subject, scopeType,
        scopeId), so an instance row and a workspace row for the same (principal, skill) can
        coexist. A disabled or invisible principal answers 404 `AGENT_PRINCIPAL_NOT_FOUND`.
        The former `400 SKILL_DEFINITION_OUT_OF_SCOPE` is **retired on this surface only**: the
        user-facing `POST /api/v1/skill-bindings` still returns it, so the code is not globally
        deprecated.
        The skill catalog of the agent's next session includes the binding immediately (catalog is
        read from `skill_bindings` per request).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context only (see GET roles).' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalSkillBindRequest' } } }
      responses:
        '201': { description: 'The created binding', content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalSkillBindingView' } } } }
        '400': { description: 'INVALID_REQUEST; X-Workspace-Id conflicts with ?workspaceId (send only one) ⇒ WORKSPACE_CONTEXT_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (no binding authority, or actor == subject)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND / SKILL_NOT_FOUND (a missing definition and another workspace''s private definition are indistinguishable — no existence leak)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: SKILL_BINDING_EXISTS, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-principals/{principalId}/skills/{bindingId}:
    delete:
      tags: [agent]
      operationId: unbindAgentPrincipalSkill
      summary: Remove one skill binding from an agent principal (PLAN-0667)
      description: |
        PLAN-0667. Deletes the row; the agent's next session catalog no longer contains the skill.
        An id that does not exist, or belongs to another subject, answers 404 `SKILL_BINDING_NOT_FOUND`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context only (see GET roles).' }
      responses:
        '204': { description: 'Binding removed' }
        '400': { description: 'INVALID_REQUEST; X-Workspace-Id conflicts with ?workspaceId (send only one) ⇒ WORKSPACE_CONTEXT_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND / SKILL_BINDING_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-principals:
    get:
      tags: [agent]
      operationId: listAgentPrincipals
      summary: List Agent principals visible to the caller
      description: |
        D-174 (user ruling 2026-11-05, tier removed): the `scope` query is gone. Visibility is:
        - without `workspaceId` — a holder of the instance-tier `MANAGE_AGENT_PRINCIPALS` (N1)
          sees every principal; any other caller sees only the rows they **created**
          (`created_by_user_id` = self, PLAN-0750 M2 / G13=(a): user-level creates never write
          `owner_user_id`, so an owner-based arm would answer an empty list — see
          `AgentPrincipalRepository.findByCreatedByUserId`);
        - with `workspaceId` — Workspace membership plus the **real reach**: principals bound in
          that Workspace (`workspace_agents` row or a workspace-scoped agent role binding) unioned
          with the caller's own owned rows (an owned, unbound row appears with `bound: false` so a
          fresh create stays discoverable; `created_by_user_id` is never an authorization source).

        The workspace arm stays deliberately **owner**-based (PLAN-0750 M2): it is reach-gated, so an
        owner-less row carries no reach there and enters a Workspace only through the bind surface.

        PLAN-0629 (user ruling 2026-11-04, B-class change): an agent principal's permission is a
        **role binding**, exactly like a human account's — permissions live in the config surface
        (`roles` / `role_permissions`) and subjects only get bound to roles; workspace visibility
        (`GET /api/v1/workspaces/{workspaceId}/agents`) is computed from workspace-scoped role
        bindings (`role_bindings.subject_type = 'agent_principal'`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Agent principals, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [agent]
      operationId: createAgentPrincipal
      summary: Create an Agent principal from a readable template snapshot
      description: |
        PLAN-0750 M1 (user ruling 2026-11-10) splits the former D-174 single path into **two
        doors**; they are independent and never alias-merged:

        1. **user-level create** — **no explicit workspace context** (an implicit `source=default`
           membership counts as none, G3) means "create a principal for myself" and is authorized
           by the instance-scope `CREATE_OWN_AGENT` atom (403 `FORBIDDEN` without it). No Workspace
           is involved and none is required: 409 `WORKSPACE_CONTEXT_REQUIRED` is **not** returned on
           this path any more.
        2. **workspace-tier create** — an **explicit** workspace context (header
           `X-Workspace-Id`, G3=b: the context stays a header, never a body field) keeps the D-174
           requirement verbatim: the caller must hold `MANAGE_WORKSPACE_AGENTS` in that Workspace
           (403).

        Either way the legacy `scope` body field is rejected with 400 `INVALID_REQUEST` (no
        compatibility branch), the caller never assigns an owner (`ownerUserId` stays NULL — G2=(b)
        expresses ownership through bindings, not through the column), and **no Workspace binding
        is created** — reach is granted later through the existing bind surface. The durable audit
        records the atom that actually authorized the create (`detail.authorizationAction`).

        `roleIds` defaults to the instance seed role `AGENT_USER` (the human USER registration
        base set; the user-level creation atom `CREATE_OWN_AGENT` is part of that base set again
        since PLAN-0750 M1 restored it with these semantics); every id is validated once before the
        row is written (unknown / agent-principal-forbidden / wider than the caller holds ⇒ 403
        `ROLE_NOT_GRANTABLE`; the grant-side subset guard answers 403 `PRIVILEGE_ESCALATION` and
        names the atoms). Resolves an optional template only from caller-readable config layers and
        freezes the snapshot in one transaction.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalCreateRequest' } } }
      responses:
        '201': { description: Created Agent principal, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalCreateView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/agent-principals/{principalId}/disable:
    post:
      tags: [agent]
      operationId: disableAgentPrincipal
      summary: Disable an Agent principal (bodies are never hard-deleted)
      description: |
        PLAN-0622 M1 + D-174 (tier removed): disabling is terminal for new Sessions
        and writes the durable audit `agent_principal_disabled`; the row itself is
        never deleted (FK ON DELETE RESTRICT keeps historical references intact).
        The authority is **owner-or-N1-or-workspace**: the row's `owner_user_id` (legacy
        owned rows), a holder of the instance-tier `MANAGE_AGENT_PRINCIPALS`, **or** an actor holding
        `MANAGE_WORKSPACE_AGENTS` in a workspace that **binds** this principal (BL-331 / D-206, same
        family as the cap `PUT`/`DELETE` faces — a workspace that owns the binding owns the lifecycle
        write). A single Workspace's management right still never reaches principals it does not bind.

        **Gate order (BL-326 / D22, revised by D-196 / BL-336, 2026-11-06)**: the context gate is
        **scope-aware** — existence (`404 AGENT_PRINCIPAL_NOT_FOUND`) → *only for a workspace-scoped row*
        a missing explicit workspace context (`409 WORKSPACE_CONTEXT_REQUIRED`) → authority
        (`403 AGENT_PRINCIPAL_OWNER_MISMATCH`).
        A **personal** (instance-scope) principal — including preset guards — needs **no** workspace
        context: it has no workspace by construction, and demanding one made its write surface
        unreachable (the D22 regression). For a **workspace-scoped** row (no `ownerUserId`, i.e. the
        D-174 "owner = workspace" shape) a context-less caller is still refused before any authority
        evaluation, so it learns nothing about the row beyond its existence.
        **Residual oracle, stated on purpose**: the row must be read to learn its scope, so a
        context-less caller can still tell `404` (unknown id) from `409` (exists and is workspace-scoped).
        Accepted — ids are UUIDv4 and unguessable, and before D22 the same caller could distinguish
        `404` from `403`, which leaked strictly more. See `inventory.md` for the same statement.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: principalId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Principal disabled }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/agent-principals/{principalId}:
    patch:
      tags: [agent]
      operationId: updateAgentPrincipalDocuments
      summary: Replace an Agent principal's hook subscriptions and/or memory policy
      description: |
        PLAN-0625 M2 (D25-14) + PLAN-0629 M1 (D29-21) + D-174: there is no separate `/hooks` or
        `/context-policy` sub-resource — the principal's own update surface accepts the
        subject-level documents, so the same **owner-or-N1-or-workspace** authority that guards
        `disable` is reused verbatim (the row's `owner_user_id`, a holder of the instance-tier
        `MANAGE_AGENT_PRINCIPALS`, or `MANAGE_WORKSPACE_AGENTS` in a workspace that binds this
        principal — BL-331 / D-206; a workspace right still does not reach principals it never binds).

        The body is `{hooks?, contextPolicy?, delegationPolicy?, defaultModelProvider?,
        defaultModelName?, allowedModels?}` with `additionalProperties:false`: at least
        one key is required, any other key is a 400 `INVALID_REQUEST`, and an explicit
        `null` clears that document (the column is written NULL). An absent key is left
        untouched; the response echoes the persisted documents, never the caller's raw input.

        task-413 (G1 edit half): the model-intent triple is writable here too — the two faces
        share one wire-body gate on purpose, so they cannot drift. `defaultModelProvider` and
        `defaultModelName` are both-or-neither on the **merged** result (present replaces, absent
        keeps the stored value, null clears), so renaming only the model is legal while clearing
        one half alone answers 400 `INVALID_AGENT_PRINCIPAL`. `allowedModels` is an array of
        `{provider, model}` (both halves per entry; empty array or null clears). A preset guard
        refuses with 403 `GUARD_MODEL_INTENT_IMMUTABLE`. The authority is unchanged: the same
        owner-or-N1-or-workspace rule that guards `disable`.

        `hooks` is `{advisors:[{kind,on:[actionClass]}]}`; shape violations answer 400
        (D25-12: `on` must hit the frozen action-class whitelist — today `approval.ask`).
        A preset guard (`origin=SYSTEM_PRESET`) owns its subscriptions through the template
        and refuses with 403 `GUARD_HOOKS_IMMUTABLE`, deliberately distinct from
        `GUARD_CAP_IMMUTABLE`; that refusal is hooks-only, the memory policy stays writable.

        `contextPolicy` is the memory document from D29-25 (extended by M1-6 / D29-26):
        `{memory:{enabled?,writeMode?,passive?,types?}}` where `enabled` is a boolean (default
        false — a new subject has no memory until the user switches it on), `writeMode` is
        `off|tool` (`judge` is reserved for M2 and is refused with an explicit 400 detail),
        `passive` is `off|summary|judge` (default `off`), and `types` is a subset of
        `profile|fact` (an empty array means no type, i.e. memory effectively off). `passive`
        turns on the system-side write path — `summary` derives one memory from the compaction
        summary that already exists, `judge` also asks the existing judge seam whether that
        segment is worth remembering — and both only ever land as `status=candidate`, so
        nothing becomes visible until an explicit channel promotes it (V99 pairs
        `origin LIKE 'passive.%'` with `status='candidate'`; the passive writer additionally
        requires `fact` in `types`). There is deliberately no `auto` write channel: D29-24
        rejected auto-summarising writes that take effect, and the durable `origin` enum of the
        memory rows is `tool|ui|cli` plus the candidate-only `passive.summary|passive.judge`.

        Written mutations are audited per surface as `agent_principal_hooks_updated` and
        `agent_principal_context_policy_updated`.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: principalId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalUpdateRequest' } } }
      responses:
        '200': { description: The persisted subject documents, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalUpdateView' } } } }
        '400': { description: 'INVALID_REQUEST — body carries a key outside hooks/contextPolicy, names neither document, or a document fails its shape validation (hooks D25-12 whitelist; contextPolicy D29-25 shape/`writeMode` values)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — the caller lacks the tier authority; or GUARD_HOOKS_IMMUTABLE — a preset guard owns its subscriptions through the template, not the API; or GUARD_CONTEXT_POLICY_IMMUTABLE — a preset guard is a system asset, so its memory policy is not a user setting', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: AGENT_PRINCIPAL_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'WORKSPACE_CONTEXT_REQUIRED — raised **only for a workspace-scoped subject** (no `ownerUserId`) and only when the request carries no explicit workspace context (D-196 / BL-336, which revises D22''s unconditional gate). Presence of the row is resolved first, so an unknown id answers 404 and the accepted residual 404-vs-409 oracle is documented on the operation above.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-templates:
    get:
      tags: [agent]
      operationId: listAgentTemplates
      summary: Read one caller-readable Agent template config layer
      description: layer selects a single raw config layer (instance=ADMIN only, user=caller only, workspace=Workspace member only, workspace-default=any authenticated caller - the shared workspace default layer of PLAN-0766) with the fail-closed rules of AgentTemplateService; workspaceId is optional for the workspace layer and falls back to the tenant workspace context. Never returns a merged-effective or cross-layer view, roles[], or secret fields; denied responses carry no template content.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: layer, required: true, schema: { type: string, enum: [instance, user, workspace, workspace-default] } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid, description: Required for the workspace layer when the token carries no workspace context; ignored for other layers. } }
      responses:
        '200': { description: 'Raw templates[] entries of the requested layer', content: { application/json: { schema: { $ref: '#/components/schemas/AgentTemplateListView' } } } }
        '400': { description: 'INVALID_REQUEST — layer missing/unknown, workspaceId malformed, or workspace layer without any workspace context', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — non-ADMIN instance read or non-member workspace read (no template content in the body)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'WORKSPACE_NOT_FOUND — the requested workspace does not exist', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/credentials:
    get:
      tags: [credential]
      operationId: listCredentials
      summary: List credential metadata for one owner
      description: 'PLAN-0496 T3.1: USER owner defaults to the caller; WORKSPACE owner requires membership. D-1009 (PLAN-0771 M3): credentials are owned by a user, a workspace, or the instance itself - an INSTANCE row has an empty ownerId (there is no instance owner subject), is managed only by cap:instance:admin, is usable only by instance-level resources (platform agents, the instance MCP registry) and can never be produced by promoting a user/workspace credential; its dedicated entry point is /api/v1/instance/credentials, and ownerType=INSTANCE here selects the same rows (with ownerId omitted - a supplied ownerId answers 400 INVALID_REQUEST, since an instance row has no owner id). An INSTANCE provider connection may reference a USER credential of the admin who created it; that credential row stays visible only to its owner, while the shared connection resolves it server-side through short-lived leases. Returns sanitized metadata with reference counts — never ciphertext, suffixes or secret values.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: ownerType, required: false, schema: { type: string, enum: [USER, WORKSPACE, INSTANCE] } }
        - { in: query, name: ownerId, required: false, schema: { type: string, format: uuid, description: 'Required for USER/WORKSPACE owners. Must be omitted for INSTANCE (an instance row has no owner id); a supplied value answers 400 INVALID_REQUEST.' } }
      responses:
        '200':
          description: Owner-scoped credential summaries
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialList' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [credential]
      operationId: createCredential
      summary: Register a credential (requires credential_manage@credential:*)
      description: 'PLAN-0496 T3.1: the secret payload is encrypted at rest as one envelope; the response never carries plaintext or a suffix.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: 'Conditional secret: kind=token requires token; kind=key_pair requires accessKey and secretKey. The payload is encrypted at rest as one envelope and is never echoed.'
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialCreateRequest' } } }
      responses:
        '201':
          description: Created credential (sanitized)
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/precheck:
    post:
      tags: [credential]
      operationId: precheckCredentialAtoms
      summary: Read-only pre-check of candidate atoms against the caller's grants
      description: 'PLAN-0496 T3.1 (0498 role editor): returns the candidate atoms not covered by the caller — credential atoms use the naming rule, other atoms the standard evaluation.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialPrecheckRequest' } } }
      responses:
        '200':
          description: Uncovered atoms
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialPrecheckResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/{id}/replace:
    post:
      tags: [credential]
      operationId: replaceCredentialSecret
      summary: "'Replace the secret value in place (credential_manage@credential:<id>)'"
      description: 'PLAN-0496 T3.1: keeps the credential id; revision +1; the response never carries plaintext or a suffix.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        description: 'Conditional secret matching the stored kind: kind=token requires token; kind=key_pair requires accessKey and secretKey. Replaces the envelope in place (revision +1, id preserved).'
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialReplaceRequest' } } }
      responses:
        '200':
          description: Replaced credential (sanitized)
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
