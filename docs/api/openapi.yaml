openapi: 3.1.0
info:
  title: Xihe API
  version: 1.0.0
  description: Canonical HTTP contract for Xihe public and service APIs.
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/workspaces/current:
    get: { operationId: getCurrentWorkspace, security: [{ bearerAuth: [] }], responses: { '200': { description: Current workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces:
    get: { operationId: listWorkspaces, security: [{ bearerAuth: [] }], responses: { '200': { description: Active workspaces for current user, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Workspace' } } } } }, '401': { $ref: '#/components/responses/Problem' } } }
    post:
      operationId: createWorkspace
      security: [{ bearerAuth: [] }]
      parameters: [{ in: header, name: Idempotency-Key, required: false, schema: { type: string, maxLength: 128 } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/workspaces/{workspaceId}:
    get: { operationId: getWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: updateWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUpdateRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '204': { description: Logically deleted }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces/{workspaceId}/agents:
    get:
      operationId: listWorkspaceAgents
      summary: List Agent principals bound to a Workspace
      description: Workspace members may read binding metadata and this Workspace's permission caps; prompts and provider secrets are never returned.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Workspace Agent bindings, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkspaceAgentView' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: setWorkspaceAgentCap
      summary: Add or update one Workspace Agent binding cap
      description: Requires the independent MANAGE_WORKSPACE_AGENTS grant scoped to this Workspace. Permissions must be within both the actor's current grants and the Agent principal's grants; only this Workspace binding is changed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permissions]
              properties:
                permissions: { type: array, items: { $ref: '#/components/schemas/WorkspaceAgentPermission' } }
      responses:
        '200': { description: Current Workspace binding cap, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceAgentCapView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/agents/{principalId}:
    delete:
      operationId: unbindWorkspaceAgent
      summary: Remove one Workspace Agent binding
      description: Requires MANAGE_WORKSPACE_AGENTS; removes only this Workspace binding and preserves the principal and its other Workspace bindings.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Binding removed }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/imports:
    get: { operationId: listWorkspaceImports, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace import jobs }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
    post: { operationId: createWorkspaceImport, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sourcePath, idempotencyKey], properties: { sourcePath: { type: string }, excludeRules: { type: array, items: { type: string } }, idempotencyKey: { type: string } } } } } }, responses: { '202': { description: Import accepted }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces/import-sources:
    get: { operationId: listWorkspaceImportSources, security: [{ bearerAuth: [] }], parameters: [{ in: query, name: path, required: true, schema: { type: string } }], responses: { '200': { description: Runtime-visible source directory entries }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '502': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspace-imports/{importId}:
    get: { operationId: getWorkspaceImport, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: importId, required: true, schema: { type: string } }], responses: { '200': { description: Import status }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspace-imports/{importId}/cancel:
    post: { operationId: cancelWorkspaceImport, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: importId, required: true, schema: { type: string } }], responses: { '200': { description: Import cancellation state }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/agent-principals:
    post:
      operationId: createAgentPrincipal
      summary: Create an Agent principal from a readable template snapshot
      description: Requires the independent human CREATE_ACCOUNT grant. Resolves an optional template only from caller-readable config layers, freezes the snapshot and grants in one transaction, and does not create a Workspace binding.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                templateId: { type: [string, 'null'], format: uuid }
      responses:
        '201': { description: Created Agent principal, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalCreateView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/agent-templates:
    get:
      operationId: listAgentTemplates
      summary: Read one caller-readable Agent template config layer
      description: layer selects a single raw config layer (instance=ADMIN only, user=caller only, workspace=Workspace member only) with the fail-closed rules of AgentTemplateService; workspaceId is optional for the workspace layer and falls back to the tenant workspace context. Never returns a merged-effective or cross-layer view, roles[], or secret fields; denied responses carry no template content.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: layer, required: true, schema: { type: string, enum: [instance, user, workspace] } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid, description: Required for the workspace layer when the token carries no workspace context; ignored for other layers. } }
      responses:
        '200': { description: 'Raw templates[] entries of the requested layer', content: { application/json: { schema: { $ref: '#/components/schemas/AgentTemplateListView' } } } }
        '400': { description: 'INVALID_REQUEST — layer missing/unknown, workspaceId malformed, or workspace layer without any workspace context', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — non-ADMIN instance read or non-member workspace read (no template content in the body)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'WORKSPACE_NOT_FOUND — the requested workspace does not exist', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/credentials:
    get:
      operationId: listCredentials
      summary: List credential metadata for one owner
      description: 'PLAN-0496 T3.1: USER owner defaults to the caller; WORKSPACE owner requires membership. Returns sanitized metadata with reference counts — never ciphertext, suffixes or secret values.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: ownerType, required: false, schema: { type: string, enum: [USER, WORKSPACE] } }
        - { in: query, name: ownerId, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Owner-scoped credential summaries
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialList' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCredential
      summary: Register a credential (requires credential_manage@credential:*)
      description: 'PLAN-0496 T3.1: the secret payload is encrypted at rest as one envelope; the response never carries plaintext or a suffix.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: 'Conditional secret: kind=token requires token; kind=key_pair requires accessKey and secretKey. The payload is encrypted at rest as one envelope and is never echoed.'
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialCreateRequest' } } }
      responses:
        '201':
          description: Created credential (sanitized)
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/precheck:
    post:
      operationId: precheckCredentialAtoms
      summary: Read-only pre-check of candidate atoms against the caller's grants
      description: 'PLAN-0496 T3.1 (0498 role editor): returns the candidate atoms not covered by the caller — credential atoms use the naming rule, other atoms the standard evaluation.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialPrecheckRequest' } } }
      responses:
        '200':
          description: Uncovered atoms
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialPrecheckResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/{id}/replace:
    post:
      operationId: replaceCredentialSecret
      summary: 'Replace the secret value in place (credential_manage@credential:<id>)'
      description: 'PLAN-0496 T3.1: keeps the credential id; revision +1; the response never carries plaintext or a suffix.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        description: 'Conditional secret matching the stored kind: kind=token requires token; kind=key_pair requires accessKey and secretKey. Replaces the envelope in place (revision +1, id preserved).'
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialReplaceRequest' } } }
      responses:
        '200':
          description: Replaced credential (sanitized)
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'CREDENTIAL_CONFLICT — the credential changed concurrently (revision fence); retry', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/credentials/{id}:
    delete:
      operationId: deleteCredential
      summary: Soft-delete a credential and return the reference report
      description: 'PLAN-0496 T3.1 (0494 #18): requires credential_manage@credential:<id>; the response lists referencing grants and workspace caps so callers can warn before the row is removed.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Delete report
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialDeleteReport' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/{id}/references:
    get:
      operationId: getCredentialReferences
      summary: Reference report for one credential
      description: 'PLAN-0496 T3.1: grants and workspace caps carrying an exact credential:<id> atom (wide credential:* grants are not listed); requires credential_manage@credential:<id>.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: References
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialReferencesView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/{id}/reveal:
    post:
      operationId: revealCredential
      summary: 'Reveal the plaintext once (credential_reveal@credential:<id> + step-up)'
      description: 'PLAN-0497 T3.1: user-only credential_reveal intersection, reveal-tier gate, step-up password re-verification throttled at 5 failures / 15 minutes, response Cache-Control: no-store, audit credential_revealed without the value; v1 never creates an approval.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRevealRequest' } } }
      responses:
        '200':
          description: The plaintext for this response only (no-store)
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRevealView' } } }
        '400': { description: 'INVALID_REQUEST (malformed body/id) or INVALID_ACTOR', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { description: 'AUTHORIZATION_REQUIRED (unauthenticated) or CREDENTIAL_REVEAL_STEP_UP_FAILED — the step-up password is wrong (audited as credential_reveal_failed)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '403': { description: 'FORBIDDEN (credential_reveal@credential:<id> missing or no workspace context) or CREDENTIAL_DISABLED (credential not active)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'CREDENTIAL_NOT_FOUND or USER_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '422': { description: 'CREDENTIAL_TIER_MISMATCH — only reveal-tier credentials can be revealed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '429': { description: 'CREDENTIAL_REVEAL_RATE_LIMITED — 5 failed step-ups within 15 minutes', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/credentials/{id}/events:
    get:
      operationId: getCredentialEvents
      summary: Owner-visible credential audit trail (never a value)
      description: 'PLAN-0497 T3.2 (0498 audit view): the credential_events trail newest first — created/replaced/deleted/lease_issued/lease_redeemed/revealed with actor; owner visibility applies; bounded by limit (default 200, max 500).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 }, description: Newest-first bound; values outside 1..500 are clamped. }
      responses:
        '200':
          description: Credential events
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialEventsView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/credentials/{id}/bindings:
    post:
      operationId: bindCredentialToAgents
      summary: Bind the credential to Agent principals (all-or-nothing)
      description: 'PLAN-0496 T3.1 (0494 #12): adds credential_use@credential:<id> to each principal grant and workspace cap in one transaction under the operator ceiling; applies to new sessions only.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialBindRequest' } } }
      responses:
        '200':
          description: Binding applied
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialBindResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { description: 'CREDENTIAL_NOT_FOUND — a referenced credential does not exist for the operator or workspace (batch is not applied)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      operationId: unbindCredentialFromAgents
      summary: Unbind the credential from Agent principals (all-or-nothing)
      description: 'PLAN-0496 T3.1: removes the credential_use@credential:<id> atoms added by the binding; applies to new sessions only.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialBindRequest' } } }
      responses:
        '200':
          description: Binding removed
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialBindResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions:
    get: { operationId: listSessions, security: [{ bearerAuth: [] }], responses: { '200': { description: Sessions } } }
    post: { operationId: createSession, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreateRequest' } } } }, responses: { '201': { description: Created Agent Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/sessions/{sessionId}/follow-ups:
    get:
      operationId: getFollowUpQueue
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Durable Session Follow-up queue, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpQueueSnapshot' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: enqueueFollowUp
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpCreateRequest' } } } }
      responses:
        '202': { description: Follow-up queued, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpQueueSnapshot' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpQueueSnapshot' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/follow-ups/{itemId}:
    delete:
      operationId: withdrawFollowUp
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current queue after withdrawal, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpQueueSnapshot' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/follow-ups/continue:
    post:
      operationId: continueFollowUpQueue
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202': { description: Queue resumed, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpQueueSnapshot' } } } }
        '200': { description: Queue is already active, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpQueueSnapshot' } } } }
