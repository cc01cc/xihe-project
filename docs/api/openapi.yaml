  /api/v1/users/{userId}/status:
    patch:
      tags: [admin]
      operationId: changeUserStatus
      summary: Enable or disable an account (PLAN-0581)
      description: 'ADMIN only. Body {status: ACTIVE|DISABLED} (400 INVALID_STATUS otherwise). A soft-deleted target answers 409 USER_DELETED for ANY status write — including a write that would otherwise be a no-op, because the deletion guard runs before the no-change check (v1 deletion is irreversible; the ck_users_deleted_status CHECK stays as the safety net rather than as the error contract). ACTIVE->DISABLED revokes both channels in the same transaction, so the next request with an old access token answers 401 AUTHORIZATION_REQUIRED and an old refresh token answers 401 at /auth/refresh; DISABLED->ACTIVE does not revive old credentials (the user logs in again). A request that does not change the status of a live account is a 200 no-op (no epoch bump, no audit). Guards: 409 SELF_OPERATION_FORBIDDEN, 409 INSTANCE_OWNER_PROTECTED, 409 LAST_ADMIN (PLAN-0610 W4a: the usable-administrator count is the ACTIVE holders of an instance ADMIN/SUPER_ADMIN role binding — the users.role column is not read); lock wait over cp.lock-timeout-ms = 503 OPERATION_LOCK_TIMEOUT (retryable). Audited as user_status_changed; refusals as user_admin_action_denied.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusRequest' }
      responses:
        '200': { description: 'Updated admin view', content: { application/json: { schema: { $ref: '#/components/schemas/UserAdminView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/users/{userId}/password-reset:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: Admin password reset (PLAN-0581)
      description: 'ADMIN only. Generates a one-time password, stores only its hash, revokes BOTH channels in the same transaction and returns {temporaryPassword} exactly once; the plaintext never reaches audit_logs, logs or events. A soft-deleted target answers 409 USER_DELETED (deletion is irreversible in v1). 409 SELF_OPERATION_FORBIDDEN when the target is the caller (owner/last-admin guards do not apply: the role and state are untouched). Audited as user_password_reset.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'One-time password', content: { application/json: { schema: { $ref: '#/components/schemas/UserPasswordResetResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/principal-grants/{username}:
