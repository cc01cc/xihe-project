        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config-locks:
    get:
      tags: [config]
      operationId: listConfigLocks
      summary: Read the admin config-lock catalog (PLAN-0556)
      description: 'ADMIN only. Without domain, returns existing locks only; with domain, returns every schema key with lockable/notLockableReason (INSTANCE_ONLY, ENV_LOCKED, WHOLE_UNIT, SECRET_KEY, NOT_OVERRIDABLE, NO_SCHEMA), lock state, reason, last actor/time and revision. No config values are returned. Non-admin requests are 403 without any key names.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: domain, required: false, schema: { type: string } }
      responses:
        '200': { description: 'Catalog {domain, revision, keys[]}', content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config-locks/{domain}/{key}:
    put:
      tags: [config]
      operationId: lockConfigKey
      summary: Lock one config key and pin its instance value (PLAN-0556)
      description: 'ADMIN only. Writes the enforced value to the instance layer and the lock row in one transaction (A2). Body: {mode?, reason, value?, revision}. reason is mandatory (max 200 chars, shown to users); value is required unless the instance row already has one. revision is the row revision from the catalog (0 for a new lock); a stale value returns 409 CONFIG_LOCK_CONFLICT. Only enforce_value is accepted in v1 (UNSUPPORTED_MODE otherwise). Not-lockable keys return 400 NOT_LOCKABLE.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: path, name: key, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Locked key view (key/lockable/locked/reason/mode/updatedBy/updatedAt/revision/valuePresent)' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [config]
      operationId: unlockConfigKey
      summary: Unlock one config key (PLAN-0556)
      description: 'ADMIN only. Deletes the lock row; the pinned instance value stays as an ordinary default unless clearValue=true, which also removes it and restores inheritance. Idempotent when no lock exists. A stale revision returns 409 CONFIG_LOCK_CONFLICT.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: path, name: key, required: true, schema: { type: string } }
        - { in: query, name: revision, required: false, schema: { type: integer, format: int64, default: 0 } }
        - { in: query, name: clearValue, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: '{"status":"ok"}' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/config/embedding/effective:
    get:
      tags: [config]
      operationId: getEmbeddingEffectiveProfile
      summary: Read-only effective embedding profile for the settings surface
      description: >-
        PLAN-0485: CP serves the pinned V1 contract (modelId/dimension) instead of letting the
        client re-declare it. profile/profileScope show the whole-unit layer profile; resolved is
        the non-secret owner view of the same-key READY embedding connection, or null with a stable
        conflict code. An embedding profile is resolved as one whole unit through the layer chain
        workspace profile -> workspace-default profile -> user profile -> instance profile (the
        first configured layer wins, no key-level merge). The connection belongs to the layer that
        supplied the profile (workspace and workspace-default profiles -> WORKSPACE, user profile ->
        the consuming user's USER connection, instance profile -> the consuming user's USER
        connection); a missing layer connection falls back to the INSTANCE shared connection as the
        last resort, and no other layer's connection is searched. When a profile exists but no enabled + READY connection matches,
        resolved is null and code is EMBEDDING_PROFILE_CONFLICT (EMBEDDING_MODEL_UNSUPPORTED for
        a non-V1 model); when no profile is configured at all, resolution fails with 409
        EMBEDDING_PROFILE_REQUIRED, while this read returns null profile/profileScope/resolved
        with no code. A pure read never fails on a missing profile or connection. A
        client-supplied workspaceId is authorized for the caller.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Effective embedding profile, content: { application/json: { schema: { $ref: '#/components/schemas/EmbeddingEffectiveProfile' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config/embedding/test:
    post:
      tags: [config]
      operationId: testEmbeddingProfile
      summary: Probe the resolved embedding profile through the Agent
      description: 'PLAN-0485: resolves the authenticated caller profile, issues a one-use credential lease and asks the Agent to embed a probe text. Takes no request body (a non-empty body is rejected). The response is sanitized: no credential, provider payload or vector is returned.'
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sanitized probe result, content: { application/json: { schema: { $ref: '#/components/schemas/EmbeddingTestResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/v1/config/import:
    post:
      tags: [config]
      operationId: importConfig
      summary: Import an instance config bundle
      description: >-
        Management plane (instance layer only). The request body is the raw JSONC bundle as text,
        not a nested JSON object. Import merges domain entries; env-locked keys are skipped with a
        warning and are never overwritten. Bodies over 1 MiB answer 413.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: layer, required: false, schema: { type: string, enum: [instance], default: instance } }
      requestBody:
        required: true
        description: Raw JSONC bundle text.
        content: { application/json: { schema: { type: string } } }
      responses:
        '200':
          description: Import report
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigImportReport' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /api/v1/config/export:
    get: { tags: [config], operationId: exportConfig, summary: Export the config bundle, security: [{ bearerAuth: [] }], parameters: [{ in: query, name: layer, required: false, schema: { type: string, enum: [instance] } }, { in: query, name: includeSecrets, required: false, schema: { type: boolean, default: true } }], responses: { '200': { description: 'Raw JSONC configuration text (plaintext secrets unless includeSecrets=false); CP serves it with Cache-Control: no-store.' } } }
  # /api/v1/providers removed (PLAN-0307 T2.22): use /api/v1/provider-connections + /api/v1/provider-catalog
  /api/v1/sessions/{sessionId}/messages:
    get:
      tags: [session]
      operationId: listMessages
      summary: List messages of one session
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid }, description: Returns only messages visible on this server-resolved branch path. }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1 }, description: 'PLAN-0670 M2 page size. Only meaningful together with pagination: an absent `limit` with `before` present defaults to 50; values above 200 are truncated to 200 (never rejected) and the effective value is echoed in the response. Negative/zero ⇒ 400 INVALID_REQUEST.' }
        - { in: query, name: before, required: false, schema: { type: string }, description: 'PLAN-0670 M2 opaque cursor returned as `nextCursor`; asks for the page strictly OLDER than that boundary. Clients must not parse it. An invalid cursor ⇒ 400 INVALID_CURSOR.' }
      responses:
        '200':
          description: |
            PLAN-0670 M2. Without `limit`/`before` the legacy contract is unchanged for normal
            sessions: a bare array of all visible messages (ascending). PLAN-0670 M2b adds a hard
            ceiling to that legacy path — above 2000 messages it answers 413 PAGINATION_REQUIRED
            **before reading any row** (compatibility must not mean unbounded memory; the legacy body
            is never silently truncated). When either pagination parameter is present the response
            is a page envelope `{messages, limit, truncated, nextCursor}`: `messages` ascending
            (newest window reversed for rendering), `truncated=true` when older messages remain and
            `nextCursor` is then present, otherwise `nextCursor` is omitted (never an empty string).
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: '#/components/schemas/SessionMessage' } }
                  - $ref: '#/components/schemas/SessionMessagePage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { description: 'PAGINATION_REQUIRED (PLAN-0670 M2b) — the legacy full read was refused because the session exceeds 2000 messages (same cap as the BL-279 A1 export guard); the body carries messages (actual count) and limit (the cap) and asks the caller to page with limit/before. Refused before any message row is read.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/sessions/{sessionId}/messages/{messageId}:
    delete: { tags: [session], operationId: deleteMessage, summary: Delete one message, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { in: path, name: messageId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted }, '409': { description: FORK_REQUEST_IN_PROGRESS while the Session snapshot is copying / SESSION_DELETING while a delete intent is recorded (V47), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } } } }
  /api/v1/sessions/{sessionId}/attachments:
    post: { tags: [attachment], operationId: uploadAttachments, summary: Upload attachments to one session, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Upload result } } }
  /api/v1/sessions/{sessionId}/attachments/{fileId}:
    get: { tags: [attachment], operationId: getAttachment, summary: Get one session attachment, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { in: path, name: fileId, required: true, schema: { type: string } }], responses: { '200': { description: Attachment metadata } } }
    delete: { tags: [attachment], operationId: deleteAttachment, summary: Delete one session attachment, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { in: path, name: fileId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/files/{fileId}:
    get:
      tags: [attachment]
      operationId: getFile
      summary: Get one workspace file
      security: [{ bearerAuth: [] }]
      description: >-
        Attachment/workspace file content. A single RFC 9110 `bytes` range is supported
        with a server-side preview budget (PLAN-0683 / BL-381): the 206 body is clamped to
        at most 8 MiB, `Content-Range` always reports the real file length, multi-range and
        non-`bytes`/malformed headers are rejected with 400, and an unsatisfiable range
        returns 416. Requests without `Range` keep the historical 200 full-body response.
      parameters:
        - { in: path, name: fileId, required: true, schema: { type: string } }
        - { in: header, name: Range, required: false, schema: { type: string }, description: 'Single byte range, e.g. `bytes=0-8388607`; multi-range (`bytes=0-9,20-29`) and non-bytes units are rejected with 400.' }
      responses:
        '200':
          description: 'Full file content (no Range header); `Accept-Ranges: bytes` is still advertised'
          headers:
            Accept-Ranges: { description: 'Always `bytes`', schema: { type: string } }
        '206':
          description: 'Single byte range; body length ≤ 8 MiB (`end = min(end, start + 8388608 - 1)`) and Content-Range carries the real total, e.g. `bytes 0-8388607/16777216`'
          headers:
            Accept-Ranges: { description: 'Always `bytes`', schema: { type: string } }
            Content-Range: { description: '`bytes <start>-<end>/<real total>`; `<end>` reflects the 8 MiB clamp, `<real total>` is the entity length', schema: { type: string } }
        '400':
          description: 'INVALID_RANGE — malformed Range header (including values a permissive parser would normalize, e.g. `bytes=+0-9` or a trailing empty list element `bytes=0-9,`), non-bytes unit, or multi-range request; `Content-Range` is `bytes */<total>`'
          headers:
            Accept-Ranges: { description: 'Always `bytes`', schema: { type: string } }
            Content-Range: { description: '`bytes */<real total>`', schema: { type: string } }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '416':
          description: 'RANGE_NOT_SATISFIABLE — range start is at/after EOF or start > end; `Content-Range` is `bytes */<total>`'
          headers:
            Accept-Ranges: { description: 'Always `bytes`', schema: { type: string } }
            Content-Range: { description: '`bytes */<real total>`', schema: { type: string } }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/files/upload:
    post: { tags: [attachment], operationId: uploadFile, summary: Upload a workspace file, security: [{ bearerAuth: [] }], description: WorkspaceStorage file upload (maximum 64 MiB; Chat attachments use a separate route and limit). Refused with 503 BACKEND_DISABLED while the workspace runs on the frozen docker backend (PLAN-0612)., responses: { '201': { description: Uploaded }, '413': { description: Workspace file exceeds 64 MiB limit }, '503': { description: BACKEND_DISABLED (docker execution backend frozen; use direct_attach) } } }
