  /api/v1/instance/agent-principals:
    get:
      tags: [agent]
      operationId: listInstanceAgentPrincipals
      summary: List the instance platform agents (every authenticated caller)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008 / D-1009): the deployment-level platform agents of PLAN-0771 2.4 - global by default, no per-workspace binding, no fork, and never recorded in workspace_agents. This is the READ face and it is deliberately NOT caller-scoped: GET /api/v1/agent-principals answers "what this caller may use" (rows it created, or reach through a workspace binding), while this path answers "what the deployment installed" - no owner filter, no created_by filter, no workspaceId query (the instance layer has no workspace dimension). It stays open to every authenticated caller because platform agents are ownerless and carry no secret material; an unauthenticated request is refused by the JWT filter (401), and a caller who may not write the instance layer sees the same list an instance admin sees. Every row returned here is an instance row: ownerUserId is null (the instance is the owner - there is no instance owner user), and a user/workspace principal can never be promoted into this list (D-1009 2/3).'
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'The instance platform agents (every row has ownerUserId=null)', content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalListResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [agent]
      operationId: createInstanceAgentPrincipal
      summary: Create an instance platform agent (instance admin only)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008 / D-1009): creates a NEW platform agent owned by the instance. Gate: cap:instance:admin (CAP_INSTANCE_ADMIN) AND the instance-tier MANAGE_AGENT_PRINCIPALS atom, both evaluated at the capability-atom layer (never a role-name special case); any other caller answers 403 FORBIDDEN before the body is read. The body is AgentPrincipalCreateRequest unchanged and it carries NO ownership field at all - ownership is server-derived (the owner user stays NULL; the instance owns the row), so no request shape can address an owner, and there is no promote/import operation: a user or workspace principal can never become a platform agent (D-1009 2/3). Role and template validation keep their existing codes: 400 INVALID_NAME_FORMAT for the name shape, 403 ROLE_NOT_GRANTABLE / 403 PRIVILEGE_ESCALATION for roleIds, and an instance-administrator role is still refused for an agent principal (agentPrincipalForbiddenAtoms). No workspace binding is created and this path never writes workspace_agents (PLAN-0771 2.4): reach is granted later through the existing bind surface. The durable audit records the atom that authorized the create (detail.authorizationAction).'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalCreateRequest' } } }
      responses:
        '201':
          description: Created instance platform agent (sanitized echo; ownerUserId=null)
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalCreateView' } } }
        '400': { description: 'INVALID_NAME_FORMAT - name shape; or INVALID_REQUEST - unknown key / body shape', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN - cap:instance:admin (CAP_INSTANCE_ADMIN) or MANAGE_AGENT_PRINCIPALS missing; or ROLE_NOT_GRANTABLE / PRIVILEGE_ESCALATION for roleIds', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/agent-principals/{principalId}:
    patch:
      tags: [agent]
      operationId: updateInstanceAgentPrincipalDocuments
      summary: Update an instance platform agent's documents (instance admin only)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008 / D-1009): the same subject-document semantics as PATCH /api/v1/agent-principals/{principalId} - hooks / contextPolicy / delegationPolicy plus the model-intent triple defaultModelProvider / defaultModelName / allowedModels (task-413), additionalProperties:false, at least one key, an explicit null clears that document, an absent key is untouched, and the response echoes the persisted documents rather than the caller raw input - with the instance-layer gate added: cap:instance:admin AND MANAGE_AGENT_PRINCIPALS. There is no owner to intersect with (the instance owns the row, not a user), so the gate is the atoms and a workspace right can never reach it. Gate order: existence first (404 AGENT_PRINCIPAL_NOT_FOUND), then authority (403); a row that is NOT instance-owned answers the identical 404 a missing row answers, so this surface is no cross-layer existence oracle. WORKSPACE_CONTEXT_REQUIRED is never raised here - this prefix carries no workspace context at all (D22''s workspace-scope gate belongs to the non-instance surface). A preset guard keeps its template-owned subscriptions: 403 GUARD_HOOKS_IMMUTABLE is hooks-only, the memory policy stays writable.'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: principalId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalUpdateRequest' } } }
      responses:
        '200':
          description: The persisted subject documents
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentPrincipalUpdateView' } } }
        '400': { description: 'INVALID_REQUEST - body carries a key outside hooks/contextPolicy/delegationPolicy/defaultModelProvider/defaultModelName/allowedModels, names no field, or a document fails its shape validation; INVALID_AGENT_PRINCIPAL - the merged model intent is half-filled or an allowedModels entry lacks provider/model (task-413)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN - cap:instance:admin or MANAGE_AGENT_PRINCIPALS missing; or GUARD_HOOKS_IMMUTABLE - a preset guard owns its subscriptions through the template; or GUARD_MODEL_INTENT_IMMUTABLE - a preset guard model intent is preset-owned too (task-413)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND - no INSTANCE-owned principal with this id (a user/workspace row answers the same 404)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [agent]
      operationId: deleteInstanceAgentPrincipal
      summary: Retire an instance platform agent (instance admin only; never a hard delete)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008 / D-1009): 204, and the row is RETIRED, not removed. Principal rows are never hard-deleted in this system - POST /api/v1/agent-principals/{principalId}/disable states the invariant and FK ON DELETE RESTRICT keeps historical session/delegation references intact - so DELETE on this prefix is the instance-surface spelling of that terminal lifecycle: disabledAt is set, the agent is unusable for new sessions, and the durable audit writes agent_principal_disabled. It is idempotent: an already-retired instance row answers 204 again. Gate: cap:instance:admin AND MANAGE_AGENT_PRINCIPALS; a row that is not INSTANCE-owned answers 404 AGENT_PRINCIPAL_NOT_FOUND, the same answer an unknown id gives (no cross-layer oracle). It deliberately does not touch the role bindings or the delegations - those are separate surfaces with their own authority.'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: principalId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Principal retired (row kept; disabledAt set) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN - cap:instance:admin (CAP_INSTANCE_ADMIN) or MANAGE_AGENT_PRINCIPALS missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND - no INSTANCE-owned principal with this id (a user/workspace row answers the same 404)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/credentials:
    get:
      tags: [credential]
      operationId: listInstanceCredentials
      summary: List instance-owned credential metadata (instance admin)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1009): the deployment itself owns credentials, so this path takes no ownerType/ownerId query - the owner IS the instance (owner_type=INSTANCE, owner_id empty; there is no instance owner subject). Gated by cap:instance:admin (CAP_INSTANCE_ADMIN); any other caller answers 403 FORBIDDEN from the security access-denied handler (no new error code). Returns the same sanitized metadata as GET /api/v1/credentials - labels, kind, delivery tier, fingerprint, reference count - and never ciphertext, suffixes or secret values. Instance credentials are usable only by instance-level resources (platform agents, the instance MCP registry); user/workspace resources cannot reference them, and a lower-layer credential can never be promoted into one (D-1009 2/3).'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'Instance-owned credential summaries (ownerType=INSTANCE, ownerId null)'
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialList' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — cap:instance:admin (CAP_INSTANCE_ADMIN) missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [credential]
      operationId: createInstanceCredential
      summary: Register an instance-owned credential (instance admin + credential_manage)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1009): creates a NEW secret bound to the instance; ownership is server-derived (owner_type=INSTANCE, owner_id empty) and therefore not part of the body - sending ownerType or ownerId answers 400 INVALID_REQUEST (an instance row has no owner id to address). There is deliberately no promote/import operation: a user or workspace credential can never be turned into an instance one (D-1009 2), so the only way to obtain an instance credential is to register its secret here. Requires cap:instance:admin AND credential_manage@credential:* (the atom layer is unchanged; the instance layer adds the admin gate). The secret payload is encrypted at rest as one envelope and the response never carries plaintext or a suffix.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: 'label/kind/deliveryTier plus the conditional secret (kind=token requires token; kind=key_pair requires accessKey and secretKey). ownerType/ownerId must be absent (400 INVALID_REQUEST otherwise).'
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialCreateRequest' } } }
      responses:
        '201':
          description: 'Created instance credential (sanitized; ownerType=INSTANCE, ownerId null)'
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialView' } } }
        '400': { description: 'INVALID_REQUEST — shape/secret mismatch for the declared kind, or ownerType/ownerId supplied', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — cap:instance:admin missing or credential_manage@credential:* not granted', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/credentials/{id}:
    get:
      tags: [credential]
      operationId: getInstanceCredential
      summary: Read one instance-owned credential's metadata (instance admin)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1009): metadata only (same sanitized projection as the list). A row that is not INSTANCE-owned answers 404 CREDENTIAL_NOT_FOUND - the identical answer a missing row gives - so this surface cannot be used to probe whether a user or workspace credential of that id exists (no cross-owner oracle). Requires cap:instance:admin.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'Instance credential metadata (ownerType=INSTANCE, ownerId null)'
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialView' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — cap:instance:admin (CAP_INSTANCE_ADMIN) missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'CREDENTIAL_NOT_FOUND — no INSTANCE-owned credential with this id (a user/workspace row answers the same 404)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [credential]
      operationId: deleteInstanceCredential
      summary: Soft-delete an instance-owned credential and return the reference report
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1009): same semantics as DELETE /api/v1/credentials/{id} - soft delete plus a reference report so callers can warn before the row disappears - with the instance-layer gate added (cap:instance:admin AND credential_manage@credential:<id>). The report lists the consumers that will lose the credential; once M3 lands that includes instance-level ones (platform agents, the instance MCP registry), which are reported rather than silently cascaded. A row that is not INSTANCE-owned answers 404 CREDENTIAL_NOT_FOUND (no cross-owner oracle).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Delete report
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialDeleteReport' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — cap:instance:admin missing or credential_manage@credential:<id> not granted', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'CREDENTIAL_NOT_FOUND — no INSTANCE-owned credential with this id (a user/workspace row answers the same 404)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/credentials/{id}/reveal:
    post:
      tags: [credential]
      operationId: revealInstanceCredential
      summary: "'Reveal an instance credential — no-store delivery (repeatable reads) (instance admin + credential_reveal + step-up)'"
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1009): the same step-up / throttle / no-store / audit shape as POST /api/v1/credentials/{id}/reveal, with the instance-layer gate added: cap:instance:admin AND credential_reveal@credential:<id>. There is no owner intersection to apply - the instance has no owner row - so the gate is the atom plus the instance-admin capability, not "the caller owns the row". Step-up password re-verification throttled at 5 failures / 15 minutes, response Cache-Control: no-store, audit credential_revealed without the value; a row that is not INSTANCE-owned answers 404 CREDENTIAL_NOT_FOUND (no cross-owner oracle); v1 never creates an approval.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRevealRequest' } } }
      responses:
        '200':
          description: The plaintext for this response only (no-store)
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRevealView' } } }
        '400': { description: 'INVALID_REQUEST (malformed body/id) or INVALID_ACTOR', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { description: 'AUTHORIZATION_REQUIRED (unauthenticated) or CREDENTIAL_REVEAL_STEP_UP_FAILED — the step-up password is wrong (audited as credential_reveal_failed)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '403': { description: 'FORBIDDEN (cap:instance:admin or credential_reveal@credential:<id> missing) or CREDENTIAL_DISABLED (credential not active)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'CREDENTIAL_NOT_FOUND (no INSTANCE-owned credential with this id) or USER_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '422': { description: 'CREDENTIAL_TIER_MISMATCH — only reveal-tier credentials can be revealed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '429': { description: 'CREDENTIAL_REVEAL_RATE_LIMITED — 5 failed step-ups within 15 minutes', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/identity:
    get:
      tags: [admin]
      operationId: getInstanceIdentity
      summary: Read the deployment instance identity (PLAN-0767 M1)
      description: 'D-932 contract-first (PLAN-0767 M1): the deployment identity card, gated by the READ_INSTANCE_CONTENT action atom (an authenticated caller without it gets 403 FORBIDDEN; a missing/invalid credential gets 401 from the JWT filter — no new error code). Response is exactly {instanceId, createdAt, schemaVersion}. instanceId is the immutable UUID anchor of instance-layer resources (the database row is the authority; XIHE_DEPLOYMENT_ID only seeds the first boot and a mismatch fails startup, it never rewrites the identity). createdAt is the first-boot instant. schemaVersion is nullable and stays null during M1 (the read DTO does not produce it until M2): consumers must treat null as "not reported yet", not as an error. Module versions are NOT repeated here — GET /api/v1/version already serves them and the UI identity card combines both responses. The response deliberately carries no ownerPrincipalId (ownership is its own surface, GET/PUT /api/v1/instance/owner, and transfers are audited) and no boot-time env override state (an internal deployment detail that a READ_INSTANCE_CONTENT holder must not learn).'
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Instance identity view', content: { application/json: { schema: { $ref: '#/components/schemas/InstanceIdentityView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/instance/mcp:
    get:
      tags: [mcp]
      operationId: listInstanceMcpServers
      summary: Read the instance MCP server registry
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008): the deployment-level MCP registry - the fallback layer every workspace inherits. The response is the SAME document shape as GET /api/v1/workspaces/{workspaceId}/mcp-config ({mcpServers: {<name>: entry}}, remote entries by value, stdio entries persisted verbatim), and it is keyed by server NAME because that name is the resource identity: PLAN-0771 2.5 makes the workspace layer an inheriting layer that OVERRIDES an instance entry of the same name, so both layers address the same key and no synthetic id exists at either layer. Returning the identical document shape is deliberate - a client can diff the instance registry against a workspace config without a second model. Carries no secret material: oauth credentials live in the credential vault and are referenced, never echoed (an instance entry may reference only an instance-owned credential, PLAN-0771 2.5). Read face is open to every authenticated caller (this registry shapes routing, not authority); the write face is instance-admin only.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'The instance registry: mcpServers keyed by server name'
          content:
            application/json:
              schema:
                type: object
                required: [mcpServers]
                properties:
                  mcpServers:
                    type: object
                    additionalProperties:
                      oneOf:
                        - $ref: '#/components/schemas/RemoteMcpServerEntry'
                        - type: object
                          description: Stdio entry (Claude Desktop compatible value; CP persists it verbatim)
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [mcp]
      operationId: createInstanceMcpServer
      summary: Register one instance MCP server (instance admin only)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008): registers EXACTLY ONE entry in the instance registry. The request body is the same mcpServers document the config surface uses, constrained to exactly one key - 0 keys or 2+ keys answer 400 INVALID_REQUEST - so this card adds NO new document or entry model (a {name, entry} wrapper would have been a second model for the same thing). Gate: cap:instance:admin (CAP_INSTANCE_ADMIN) evaluated at the capability-atom layer; any other caller answers 403 FORBIDDEN before the body is read. An entry must be one shape, never both (a remote entry has url + optional oauth, a stdio entry has command/args; CP answers 400 INVALID_REQUEST on a mix, PLAN-0759). A name already present in the instance registry answers 409 MCP_SERVER_EXISTS - the registry is instance-admin-owned, so a silent overwrite would be an unattributable change; use PATCH to replace. An instance entry may reference only an instance-owned credential (PLAN-0771 2.5); a workspace credential reference is refused. The workspace layer is untouched: workspaces inherit this entry until they declare an own entry with the same name.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: 'The mcpServers document with exactly one key (the new server name).'
        content:
          application/json:
            schema:
              type: object
              required: [mcpServers]
              properties:
                mcpServers:
                  type: object
                  additionalProperties:
                    oneOf:
                      - $ref: '#/components/schemas/RemoteMcpServerEntry'
                      - type: object
                        description: Stdio entry (Claude Desktop compatible value; CP persists it verbatim)
      responses:
        '201':
          description: 'The registry after the create (same document shape as GET)'
          content:
            application/json:
              schema:
                type: object
                required: [mcpServers]
                properties:
                  mcpServers:
                    type: object
                    additionalProperties:
                      oneOf:
                        - $ref: '#/components/schemas/RemoteMcpServerEntry'
                        - type: object
                          description: Stdio entry (Claude Desktop compatible value; CP persists it verbatim)
        '400': { description: 'INVALID_REQUEST - the document carries 0 or 2+ names, or one entry mixes remote and stdio fields', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN - cap:instance:admin (CAP_INSTANCE_ADMIN) missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'MCP_SERVER_EXISTS - a registry entry with this name already exists (use PATCH to replace it)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/mcp/{name}:
    patch:
      tags: [mcp]
      operationId: updateInstanceMcpServer
      summary: Replace one instance MCP server entry (instance admin only)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008): replaces the VALUE of one existing registry entry, addressed by its name. The request body is one entry (the same oneOf the document uses: remote RemoteMcpServerEntry with url + optional oauth, or the stdio value), so the entry model stays single-sourced with the config surface; changing the name is not part of this operation (register under a new name, then delete the old one) and a body that carries a second name or a mixing of shapes answers 400 INVALID_REQUEST. Gate: cap:instance:admin; a name that is not in the instance registry answers 404 MCP_SERVER_NOT_FOUND - the same answer an unknown name gives on this prefix, so the read face learns nothing extra. The response echoes the registry document after the replace (same shape as GET), never the caller raw input. A preset/instance entry stays inheritable: a workspace that already overrides this name keeps its own entry (that is a workspace-layer row, not this one).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string, minLength: 1 }, description: 'The server name (the mcpServers key), not a uuid: both layers address entries by name (PLAN-0771 2.5).' }
      requestBody:
        required: true
        description: 'One entry (remote or stdio, never both, never a second name).'
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RemoteMcpServerEntry'
                - type: object
                  description: Stdio entry (Claude Desktop compatible value; CP persists it verbatim)
      responses:
        '200':
          description: 'The registry after the replace (same document shape as GET)'
          content:
            application/json:
              schema:
                type: object
                required: [mcpServers]
                properties:
                  mcpServers:
                    type: object
                    additionalProperties:
                      oneOf:
                        - $ref: '#/components/schemas/RemoteMcpServerEntry'
                        - type: object
                          description: Stdio entry (Claude Desktop compatible value; CP persists it verbatim)
        '400': { description: 'INVALID_REQUEST - the body mixes remote and stdio fields or carries a name that is not the path parameter', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN - cap:instance:admin (CAP_INSTANCE_ADMIN) missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'MCP_SERVER_NOT_FOUND - no instance registry entry with this name', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [mcp]
      operationId: deleteInstanceMcpServer
      summary: Remove one instance MCP server from the registry (instance admin only)
      description: 'D-932 contract-first (PLAN-0771 M3 / D-1008): 204 and the registry entry is gone. This is a registry-layer delete, not a session or routing operation: stdio/remote sessions are owned by the Runtime and are rebuilt lazily from the next resolved config, and a workspace that overrides this name keeps its own entry (the override is a workspace-layer row and is not touched here). Gate: cap:instance:admin; an unknown name answers 404 MCP_SERVER_NOT_FOUND (the identical answer a name that was never in this registry gives, so the write face enables no existence oracle for names the caller does not own). Not idempotent by design: a second DELETE answers 404, which is what "not in the registry" means.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string, minLength: 1 }, description: 'The server name (the mcpServers key), not a uuid.' }
      responses:
        '204': { description: Removed from the instance registry }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN - cap:instance:admin (CAP_INSTANCE_ADMIN) missing', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'MCP_SERVER_NOT_FOUND - no instance registry entry with this name', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/instance/owner:
    get:
      tags: [auth]
      operationId: getInstanceOwner
      summary: Read the instance owner pointer (PLAN-0580)
      description: 'Any authenticated user. Returns ownerUserId/assignedAt/isCurrentUser; both owner fields are null when the instance has no ADMIN yet (HTTP 200, never 404). The response MUST NOT carry username/email/name: the users surface is ADMIN-only (PLAN-0581), so exposing the owner handle here would be an account-enumeration side channel.'
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Instance owner view', content: { application/json: { schema: { $ref: '#/components/schemas/InstanceOwnerView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      tags: [auth]
      operationId: transferInstanceOwner
      summary: Transfer instance ownership (PLAN-0580)
      description: 'Current owner only: an ADMIN who is not the owner gets 403 NOT_INSTANCE_OWNER. Body {targetUserId, password, reason?}; the password is re-verified against the caller row (401 INVALID_CREDENTIALS, counted by the PLAN-0558 lockout, no new counter). target must exist (404 USER_NOT_FOUND), be ACTIVE (409 OWNER_TARGET_UNAVAILABLE: a disabled account could never use the ownership and would leave the instance without a usable super admin), not be soft-deleted (409 USER_DELETED) and hold the instance ADMIN capability — an instance-scope ADMIN/SUPER_ADMIN role binding, never the legacy users.role column — else 409 OWNER_TARGET_NOT_ADMIN (PLAN-0610 T4.3). One transaction (lock order instance_owner -> users -> role_bindings): instance lock -> owner/emergency gate -> target checks -> password -> binding handover (the incoming owner gets SUPER_ADMIN, the outgoing owner is left on ADMIN) -> materialized atom reconciliation -> token_version bump -> single-row UPDATE -> durable audit. Normal face audits instance_owner_transferred (detail from/to, never the password) plus authorization_instance_super_admin_transferred. Emergency face (PLAN-0767 M1-5, spec §6 door 2 — the pointer is empty because the first boot never assigned an owner or the DB was restored, or it points at an account that is no longer usable because that account was manually disabled or soft-deleted outside the guarded lifecycle): the caller must already hold cap:instance:admin at the URL layer, must send a non-blank reason (400 INVALID_REQUEST otherwise; at most 200 characters), and the pointer moves with instance_owner_emergency_transferred (detail from=<none>|<uuid> to=… reason=…). The guarded lifecycle itself cannot produce an unusable owner (the owner cannot be disabled, deleted or demoted and fk_instance_owner_user is ON DELETE RESTRICT), so a non-owner ADMIN on a healthy pointer still gets 403 NOT_INSTANCE_OWNER. Any failure rolls all of it back and the instance keeps at least one ACTIVE SUPER_ADMIN (409 LAST_SUPER_ADMIN if the post-state would violate I5). The previous owner stays ADMIN. A lock wait over cp.lock-timeout-ms answers 503 OPERATION_LOCK_TIMEOUT.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceOwnerTransferRequest' }
      responses:
        '200': { description: 'New owner view', content: { application/json: { schema: { $ref: '#/components/schemas/InstanceOwnerView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Admin user list (PLAN-0581)
      description: 'ADMIN only. Filters are all optional: q (case-insensitive substring over email/username/name), status (ACTIVE|DISABLED), includeDeleted (default false). Ordered by createdAt DESC, size clamped to 100 (default 20). Response {items,total,page,size}; items are the admin view {id,email,username,name,role,status,deletedAt,createdAt} and never carry password_hash, token_version or session_version.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, required: false, schema: { type: string } }
        - { in: query, name: status, required: false, schema: { type: string, enum: [ACTIVE, DISABLED] } }
        - { in: query, name: includeDeleted, required: false, schema: { type: boolean, default: false } }
        - { in: query, name: page, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'Paged admin view', content: { application/json: { schema: { $ref: '#/components/schemas/UserAdminPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
