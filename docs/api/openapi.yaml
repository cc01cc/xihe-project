        security: [{ bearerAuth: [] }]
        parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertRequest' } } }
        responses:
          '200':
