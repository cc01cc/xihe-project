    ProviderConnectionListResponse:
       type: object
       required: [connections]
       properties:
         connections: { type: array, items: { $ref: '#/components/schemas/ProviderConnection' } }
    ProviderConnection:
        type: object
        description: >-
          One logical provider connection slot. The unique key is (scope, ownerId, providerId,
          connectionKey). USER is owned by the caller, WORKSPACE by the connection workspace and
          INSTANCE is a whole-deployment shared default owned by the deployment instance identifier
          (never a user or workspace id); SYSTEM is a legacy value that is read-only and can no
          longer be created. INSTANCE rows are managed only with cap:instance:admin
          (CAP_INSTANCE_ADMIN: create/update/verify/delete) and are listed only to instance admins;
          ordinary users never see them but runtime resolution still consumes them. Secrets never
          appear in this view: apiKey is write-only, credentialId is a vault reference and maskedKey
          is always null. An llm-provider profile (providerId, connectionKey) is resolved as one
          whole unit through the layer chain workspace profile -> workspace-default profile -> user
          profile -> instance profile (the first configured layer wins, no key-level merge). The
          connection belongs to the layer that supplied the profile (workspace and workspace-default
          profiles -> WORKSPACE, user profile -> the consuming user's USER connection, instance
          profile -> the consuming user's USER connection); a missing layer connection falls back
          to the INSTANCE connection as the last resort, and no other layer's connection is
          searched. The first enabled + READY match wins; none matches returns 409
          LLM_PROFILE_CONFLICT, never a silent fallback.
        required: [id, providerId, connectionKey, apiTypeId, apiTypeVersion, operation, label, scope, hasKey, enabled, status, revision, modelDiscovery, manualModels]
        properties:
          id: { type: string, format: uuid, readOnly: true }
          providerId: { type: string }
          connectionKey: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
          apiTypeId: { type: string, readOnly: true }
          apiTypeVersion: { type: integer, minimum: 1, readOnly: true }
          operation: { type: string, enum: [chat, embedding], readOnly: true }
          label: { type: string, maxLength: 128 }
          scope: { type: string, enum: [USER, WORKSPACE, INSTANCE, SYSTEM], readOnly: true, description: 'Owner scope. USER = the caller; WORKSPACE = the connection workspace; INSTANCE = a whole-deployment shared default owned by the deployment instance identifier; SYSTEM is legacy read-only and can no longer be created.' }
          ownerId: { type: string, readOnly: true, description: 'Scope-dependent owner: user id for USER, workspace id for WORKSPACE, deployment instance identifier (stable per deployment, not a user/workspace id) for INSTANCE.' }
          baseUrl: { type: [string, 'null'], format: uri }
          hasKey: { type: boolean, readOnly: true }
          credentialId: { type: [string, 'null'], format: uuid, readOnly: true, description: 'PLAN-0553: owner-neutral reference into the credential vault; null means no key. A USER/WORKSPACE connection links the credential of its owner; an INSTANCE connection links a USER lease-tier credential of the admin who created it, and every consumer resolves that secret server-side through short-lived leases (it is never returned). Credentials themselves stay USER/WORKSPACE-owned: there is no INSTANCE credential ownership.' }
          maskedKey: { type: [string, 'null'], readOnly: true, description: 'Always null; ordinary reads never derive a credential suffix.' }
          modelDiscovery: { type: string, enum: [remote-models, litellm-catalog, curated, manual] }
          manualModels: { type: array, items: { type: string } }
          enabled: { type: boolean }
          status: { type: string, enum: [UNVERIFIED, VERIFYING, READY, INVALID_CREDENTIALS, UNREACHABLE, DISABLED] }
          lastVerifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
          lastErrorCode: { type: [string, 'null'], readOnly: true }
          revision: { type: integer, minimum: 1, readOnly: true }
          maxInflight: { type: [integer, 'null'], minimum: 1, description: 'PLAN-0622 resource governor: concurrent lease ceiling; null = unlimited.' }
          maxQueue: { type: [integer, 'null'], minimum: 0, description: 'Reserved queue depth for this connection; admission never blocks, over-limit is refused with 429 RESOURCE_EXHAUSTED.' }
          windowTokenBudget: { type: [integer, 'null'], format: int64, minimum: 1, description: 'Token budget per windowSeconds for this connection.' }
          windowSeconds: { type: [integer, 'null'], minimum: 1 }
          modelLimits: { type: array, items: { $ref: '#/components/schemas/ModelLimit' }, description: 'Per-model overrides; an entry inherits the omitted connection-level value.' }
    ProviderConnectionCreateRequest:
       type: object
       required: [providerId, label, connectionKey]
       properties:
         apiTypeId: { type: string, description: Optional supported Type pair; omission selects the catalog default. }
         apiTypeVersion: { type: integer, minimum: 1 }
         providerId: { type: string }
         label: { type: string, minLength: 1, maxLength: 128 }
         connectionKey: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
         scope: { type: string, enum: [USER, WORKSPACE, INSTANCE], default: USER, description: 'Owner scope of the new row. INSTANCE = whole-deployment shared default and requires cap:instance:admin (CAP_INSTANCE_ADMIN); WORKSPACE requires a writable workspace role or MANAGE_PROVIDER_CONNECTIONS. The server derives ownerId (the deployment instance identifier for INSTANCE rows); clients cannot create SYSTEM connections.' }
         apiKey: { type: [string, 'null'], minLength: 1, writeOnly: true, description: 'Quick-creates a USER lease-tier token credential and links it; mutually exclusive with credentialId. Even for scope=INSTANCE the credential is USER-owned by the admin caller; the secret is never echoed.' }
         credentialId: { type: [string, 'null'], format: uuid, description: 'Links an existing credential the caller may use; mutually exclusive with apiKey. For scope=INSTANCE it must be a credential the admin caller may use (their own USER lease-tier credential); the shared connection leases it server-side for every consumer and the credential row stays visible only to its owner.' }
         baseUrl: { type: [string, 'null'], format: uri }
         modelDiscovery: { type: [string, 'null'], enum: [remote-models, litellm-catalog, curated, manual] }
         manualModels: { type: array, items: { type: string }, maxItems: 256 }
    ApiRequestTemplateRef: { type: object, additionalProperties: false, required: [layer, templateId, version], properties: { layer: { type: string, enum: [instance, user, workspace, workspace-default] }, templateId: { type: string, format: uuid }, version: { type: integer, minimum: 1 } } }
    ApiRequestTemplate: { type: object, required: [id, version, name, apiTypeId, apiTypeVersion, bodySource, status], properties: { id: { type: string, format: uuid }, version: { type: integer, minimum: 1 }, name: { type: string }, description: { type: string }, apiTypeId: { type: string }, apiTypeVersion: { type: integer, minimum: 1 }, bodySource: { type: string, description: 'Strict JSON provider body. Only ${xh.*} slots declared in spec/fixtures/xh-variables.json are legal; substitution is single-pass and $${...} emits a literal. PLAN-0632 Gate G-0 slots: user_input, agent_instructions, skill_catalog, agent_memory, model ($.model only), rag_context (RAG data-role positions only), tools and conversation_history (structural splice only). An undeclared variable is rejected at publish and again at render time; it is never rendered as an empty string. Adding a slot requires changing both sides plus that fixture.' }, status: { type: string, enum: [draft, published] } } }
    ApiRequestTemplateValidation: { type: object, required: [valid, diagnostics], properties: { valid: { type: boolean }, diagnostics: { type: array, items: { type: object, required: [code, path, message], properties: { code: { type: string }, path: { type: string }, message: { type: string } } } } } }
    ApiTypeChangeImpact: { type: object, required: [connectionRevision, currentType, targetType, compatibleTemplates, incompatibleOverrides, sessionRebindCount], properties: { connectionRevision: { type: integer }, currentType: { $ref: '#/components/schemas/ApiTypePair' }, targetType: { $ref: '#/components/schemas/ApiTypePair' }, compatibleTemplates: { type: array, items: { $ref: '#/components/schemas/ApiRequestTemplateRef' } }, incompatibleOverrides: { type: array, items: { type: object, required: [scope, count], properties: { scope: { type: string }, count: { type: integer } } } }, sessionRebindCount: { type: integer } } }
    DeleteImpactView: { type: object, required: [connectionId, providerId, connectionKey, bindingCount, bindingUserScopes, defaultTemplateRef, profileCount, profileScopes, sessionCount, blocked], properties: { connectionId: { type: string, format: uuid }, providerId: { type: string }, connectionKey: { type: string }, bindingCount: { type: integer, description: 'Total model entries under providerModelBindings[connectionId] across all user-layer rows' }, bindingUserScopes: { type: integer, description: Distinct user-layer rows holding bindings for this connection }, defaultTemplateRef: { type: boolean, description: Whether the owner-layer connectionDefaultTemplates entry exists }, profileCount: { type: integer, description: 'llm-provider.profile rows resolving to this connection (providerId+connectionKey); malformed rows are skipped' }, profileScopes: { type: array, items: { type: string, enum: [instance, user, workspace] } }, sessionCount: { type: integer, description: 'Session rows referencing the connection (all rows, including delete-requested)' }, blocked: { type: boolean } } }
    ConnectionInUseProblem: { type: object, allOf: [{ $ref: '#/components/schemas/ProblemDetails' }, { type: object, required: [code, sessionCount, connectionId], properties: { code: { type: string, enum: [CONNECTION_IN_USE] }, sessionCount: { type: integer }, connectionId: { type: string, format: uuid } } }] }
    ProviderConnectionUpdateRequest:
       type: object
       required: [expectedRevision]
       minProperties: 1
       properties:
         expectedRevision: { type: integer, minimum: 1, description: Required revision CAS; stale writes return CONNECTION_REVISION_CHANGED. }
         apiTypeId: { type: string, description: Must be paired with apiTypeVersion. }
         apiTypeVersion: { type: integer, minimum: 1 }
         confirmedTypeChange: { type: boolean, description: Required true when changing the Type pair. }
         connectionDefaultTemplateRef: { $ref: '#/components/schemas/ApiRequestTemplateRef' }
         label: { type: string, minLength: 1, maxLength: 128 }
         connectionKey: { type: [string, 'null'], minLength: 1, maxLength: 64, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', description: 'Omitted preserves the key; null is rejected with PROVIDER_CONNECTION_KEY_INVALID; a different key is rejected with PROVIDER_CONNECTION_KEY_IMMUTABLE.' }
         apiKey: { type: [string, 'null'], minLength: 1, writeOnly: true, description: 'Quick-creates a new USER lease-tier token credential and rebinds it; mutually exclusive with credentialId. Even for an INSTANCE connection the credential is USER-owned by the admin caller; the secret is never echoed.' }
         credentialId: { type: [string, 'null'], format: uuid, description: 'Rebinds the connection to an existing credential the caller may use; mutually exclusive with apiKey. For an INSTANCE connection this must be a credential the admin caller may use; the shared connection then leases it server-side for every consumer.' }
         baseUrl: { type: [string, 'null'], format: uri }
         enabled: { type: boolean }
         modelDiscovery: { type: [string, 'null'], enum: [remote-models, litellm-catalog, curated, manual] }
         manualModels: { type: array, items: { type: string }, maxItems: 256 }
         maxInflight: { type: [integer, 'null'], minimum: 1, description: 'PLAN-0622: concurrent lease ceiling; null clears the limit.' }
         maxQueue: { type: [integer, 'null'], minimum: 0, description: 'PLAN-0622: reserved queue depth; null clears it.' }
         windowTokenBudget: { type: [integer, 'null'], format: int64, minimum: 1, description: 'PLAN-0622: token budget per windowSeconds; null clears it.' }
         windowSeconds: { type: [integer, 'null'], minimum: 1 }
         modelLimits: { type: array, items: { $ref: '#/components/schemas/ModelLimit' }, description: 'PLAN-0622 per-model overrides with FULL-REPLACEMENT semantics: omitting the field keeps the stored rows untouched, an empty array clears every model-level override, and a model entry that omits one of maxInflight/windowTokenBudget/windowSeconds inherits the connection-level value (null on the connection level = unlimited). Sending the field replaces the whole set, it never merges per key.' }
