        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/user-events:
    get:
      tags: [event]
      operationId: userEvents
      summary: Subscribe to the user-level persistent SSE channel
      description: |
        PLAN-0660 T5.4 — the **user-level** SSE channel (contract `spec/session/user-channel.md` §4). BL-320 批 1：此前只在该文件的其他描述里被提到，没有 path 条目。
        * Authenticated by the user's Bearer token only: **no `X-Workspace-Id` is required** — the channel is per user and survives workspace switching. Missing/invalid credentials answer `401 AUTHORIZATION_REQUIRED` before any stream opens.
        * The first frame is always `connected` with `{serverTime}` (ISO-8601 instant). There is **no replay** (the session channel's `Last-Event-ID` semantics do not apply), so a reconnect is a fresh subscription.
        * Event names are a **closed public set** — `connected` / `participant_notified` / `user_question` — deliberately independent of the internal `wake_*` names:
          * `participant_notified` = `{sessionId, participantId}` — a notify signal only (it never creates a Run);
          * `user_question` = `{questionId, sessionId, state}` — an interactive question addressed to this user changed state (`pending`/`answered`/`expired`), the same filter as `GET /api/v1/user-questions`.
        * This channel is the delivery path for the badge/unread surface; the durable sources stay `GET /api/v1/user-questions` and the per-participant derived unread count.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'SSE stream — user-scoped notify + question events'
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: connected
                data: {"serverTime":"2026-11-05T14:03:11.482Z"}

                event: participant_notified
                data: {"sessionId":"8c2a5c1e-0d9a-4d63-8a2e-6f6d5f7c1b11","participantId":"6f1c0c4e-9a41-4c33-9d5e-71a2b3c4d5e6"}

                event: user_question
                data: {"questionId":"a71e2f30-6b0e-42b7-9e55-2f8b1c0d9a77","sessionId":"8c2a5c1e-0d9a-4d63-8a2e-6f6d5f7c1b11","state":"pending"}
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/events:
    get:
      tags: [event]
      operationId: chatEvents
      summary: Subscribe to session-scoped persistent SSE
      description: |
        Session-scoped **persistent** Server-Sent Events connection.
        * One active emitter per `sessionId` (v1). A new `GET /api/v1/events?sessionId=` replaces any prior emitter for the same session; the old emitter's completion/timeout/error callbacks are identity-checked and must not delete the new emitter (`stale_cleanup_ignored`).
        * `done` terminates a **run**, not the session SSE. The connection stays open across multiple `POST /api/v1/chat` turns and only closes on client disconnect, session deletion, or explicit server termination.
        * The server sends a `heartbeat` comment/event every 15s to keep the connection observable. Heartbeat never enters the message bubble nor resets the run's token count.
        * Connection authorization is bounded by the access-token lifetime; v1 closes the SSE before token expiry and the UI enters a recoverable authenticated state (no silent credential leak).
        * `derived_state_changed` is sent on the parent Session channel after a child terminal commits. Its JSON is exactly `{sessionId,runId,state,at}`: `sessionId` and `runId` identify the child, `at` equals durable `chat_runs.terminal_at`; it is best-effort only and the parent page re-reads its own `GET /api/v1/sessions/{sessionId}/derived-state` for authoritative state.
        * PLAN-0338/0339: the session channel also carries `run_checkpoint` — `{runId, sessionId, sliceRef?, capturedAt?, state, changedCount, unrollableReason?, revert?}` — after a slice capture, a degraded capture, or a completed restore (`revert` = `{state, at, counts, ref, attemptCount}`). The event only annotates lifecycle; the workspace slice list remains the durable source on reload.
        * PLAN-0508: bounded provider transport telemetry rides this same session channel as `transport_progress` (`{requestId,runId,attemptId,seq,stage,startedAt,elapsedMs}`; at most four stage transitions per attempt: `attempt_started`/`first_chunk`/`streaming`/`attempt_finished`) and `transport_attempt` (`{requestId,runId,attemptId,seq,startedAt,endedAt,durationMs,outcome,errorCode,firstChunkMs,chunkCount,uploadBytes,downloadBytes}`; exactly once per attempt, `outcome` ∈ `success|error|timeout|aborted`). CP persists the durable attempt row before relaying; ordering between telemetry and other events is not guaranteed and `GET /api/v1/chat/runs/{runId}/attempts` is the authoritative source. The events are diagnostic side-channel state and never change run semantics.
          * Event order per run is `connected` (once per SSE open) → `status`/`thinking` (optional) → `approval_request` (optional) → approval decision via the CP public route → `tool_result` (approval gate) → downstream `tool_call`/`tool_result` and `token` (only after approval) → `done` (exactly one, may carry `errorCode`/`synthetic`). Tool events carry `toolCallId` and `origin` (`local` or `mcp`) for canonical tool-call correlation and source attribution; `request_approval` itself is represented by the approval request and approval-history record and does not emit a duplicate tool event. Approval live/replay envelopes are built from the durable row only and include `state`, the durable creation `origin` (`cp_gate` for CP-gate rows, `agent_relay` for model-initiated `request_approval`, null for rows predating V25) plus `replayed=false/true`; at creation, the display-only `policy` summary is persisted when it can be captured: `effect`, `sourceLayer`, `matchedRule`, `reason`, `mode`, `actionClass`, and `shape`. The policy summary never contains raw tool arguments. After the atomic decision claim, `policy.modeAtGrant` records the effective session mode at that decision and is never rewritten by a retry; replay uses the stored snapshot, and descriptor failure omits only policy metadata without blocking delivery. On rejection/expiry, no downstream sensitive tool call is allowed and a terminal `error` + `done` is sent. The session SSE is retained unless the emitter itself is unwritable. PLAN-0510: tool result bodies and failure diagnostics do not cross the public SSE boundary; `tool_result.result` is a fixed CP-sanitized placeholder and no `diagnostics` field is sent. Structured diagnostics remain in the internal model/artifact channel only.
        * PLAN-0623 M1b-3: every event payload carries `participantId` — the session participant row that produced this output (AGENT run → the run's responder participant; HUMAN echo → the speaker's row), or an explicit `null` for producer-less system events (never invented). Consumers must not render a multi-subject stream as a single subject. The `asParticipantId` query parameter selects a participant view (see above); undeclared observers receive everything and still see `participantId` on every event.
        * **PLAN-0645 M2 T0.2 (run-level events must carry `runId`)**: the session connection can carry up to `maxConcurrentRunsPerSession` (default 2) runs at once, so every **run-level** event — `token`, `status`, `tool_call`, `tool_result`, `usage`, `done`, `error`, `approval_request`, `run_checkpoint`, `transport_progress`, `transport_attempt`, `context_overflow_retry`, `derived_state_changed` — carries its `runId`. CP stamps the field at the relay/dispatch boundary (`ChatController.dispatchRelayedEvent`) when the producer omits it; an explicit producer value is preserved. Clients **must** key live-stream state (bubble, parser, terminal surface) by `runId` and must not assume a single active bubble per session; a client that receives a run-level event without `runId` may treat it as the legacy/fallback scope only. Session-level events (`heartbeat`, `context_sources_changed`, `context_compaction_circuit`) are not run-scoped.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
          description: Session to subscribe to (must belong to current workspace/user)
        - in: query
          name: asParticipantId
          required: false
          schema: { type: string, format: uuid }
          description: |
            PLAN-0623 M1b-3 (D23-28): optional participant view. Declared => the stream is
            filtered by producer — only events produced by that participant row plus
            producer-less system events. Undeclared => the full stream (observer semantics,
            which is what existing consumers keep using. Filtering is by producer, never by
            visibility; @mention targeting ("sent to whom") is 0624 scope. The caller must be
            authorised to act for the participant (D23-08 gate) — otherwise 403
            `PARTICIPANT_CAP_DENIED`.
      responses:
        '200':
          description: 'SSE stream — one event per line `event: <name>` + `data: <json>`'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"sessionId":"sess-123","type":"connected"}

                event: token
                data: {"content":"hello ","type":"token","runId":"run-abc"}

                event: token
                data: {"content":"world","type":"token","runId":"run-abc"}

                event: tool_call
                data: {"tool":"write_file","toolCallId":"call-1","origin":"mcp","type":"tool_call","runId":"run-abc"}

                event: tool_result
                data: {"tool":"write_file","toolCallId":"call-1","origin":"mcp","type":"tool_result","runId":"run-abc","result":"Tool result withheld from durable history because no checkpoint-safe output schema is registered."}

                event: tool_result
                data: {"tool":"execute_command","toolCallId":"call-2","origin":"mcp","type":"tool_result","runId":"run-abc","result":"Tool result withheld from durable history because no checkpoint-safe output schema is registered."}

                event: usage
                data: {"usage":{"inputTokens":372,"outputTokens":56,"totalTokens":428,"estimatedInputTokens":351,"source":"real","providerUnknownFields":["cache_read_input_tokens"],"windowTokens":131072,"model":"deepseek/deepseek-v4-flash","cost":0.1620,"costCurrency":"USD","costSource":"price_table","costNote":null}}

                event: done
                data: {"type":"done","runId":"run-abc"}

                event: run_checkpoint
                data: {"runId":"run-abc","sessionId":"sess-123","sliceRef":"refs/xihe/slices/1757980000000-ab12cd","state":"captured","changedCount":3,"revert":null}

                event: transport_progress
                data: {"requestId":"req-123","runId":"run-abc","attemptId":"0b0f1f3e-8a2d-4f3a-9d6c-2f0c1e5a7b41","seq":1,"stage":"first_chunk","startedAt":"2026-10-14T08:00:00Z","elapsedMs":83}

                event: transport_attempt
                data: {"requestId":"req-123","runId":"run-abc","attemptId":"0b0f1f3e-8a2d-4f3a-9d6c-2f0c1e5a7b41","seq":1,"startedAt":"2026-10-14T08:00:00Z","endedAt":"2026-10-14T08:00:02Z","durationMs":2000,"outcome":"success","errorCode":null,"firstChunkMs":83,"chunkCount":5,"uploadBytes":null,"downloadBytes":null}

                event: heartbeat
                data: {"type":"heartbeat","connectionGeneration":2}

                event: derived_state_changed
                data: {"sessionId":"child-session-uuid","runId":"child-run-uuid","state":"success","at":"2026-09-27T04:00:00Z"}
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/events:
    get:
      tags: [event]
      operationId: workspaceEvents
      summary: Subscribe to workspace-scoped file and lifecycle SSE
      description: |
        Workspace-scoped Server-Sent Events for users who can access the Workspace,
        including Workspaces without a Session. The stream carries compact `file_changed` hints;
        file contents and directory listings are always re-read through the existing Workspace HTTP/MCP APIs.
        Scheduled-task state changes (PLAN-0489 T1.5) are broadcast on the same stream as a coarse
        `kind: scheduled_tasks_changed` invalidation hint with no per-row payload; on receipt the
        client refetches `GET /api/v1/workspaces/{workspaceId}/scheduled-tasks`.
        Each event has a Workspace-local sequence. v1 keeps no replay log: a gap or reconnect may require
        an HTTP/MCP refresh. An overflow, or a stale `Last-Event-ID` gap, is signalled with
        `kind: snapshot_required` plus a `reason` (`overflow` for a Runtime buffer overflow,
        `sequence_gap` for a reconnect past the retained sequence); it carries no `snapshotVersion`,
        so the client must re-read state through the Workspace HTTP/MCP APIs rather than apply a
        partial replay.
        Heartbeats are transport-only and do not represent file changes.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Last received Workspace-local event sequence.
      responses:
        '200':
          description: 'SSE stream — compact Workspace event hints'
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: 12
                event: file_changed
                data: {"workspaceId":"ws-123","sequence":12,"kind":"file_changed","path":"src/app.ts","changeType":"modified","source":"runtime"}

                id: 13
                event: scheduled_tasks_changed
                data: {"workspaceId":"ws-123","sequence":13,"kind":"scheduled_tasks_changed","source":"control-plane"}

                event: heartbeat
                data: {"workspaceId":"ws-123","sequence":13,"type":"heartbeat"}
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/models:
    get:
      tags: [config]
      operationId: listModels
      summary: List verified provider models for Chat
      description: Returns the current user's visible provider connections and verified models without credentials or raw provider configuration.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provider/model catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderModelCatalog' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { description: 'AGENT_UNAVAILABLE — Agent unreachable, timed out, rejected the service credential, or returned an unusable body. Problem Details carries dependency=agent, reason (unreachable|timeout|auth_failed|upstream_error) and retryable.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/api-input-types:
    get:
      tags: [config]
      operationId: listApiInputTypes
      summary: List built-in immutable API Type definitions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Built-in API Type registry
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiInputTypeListResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/api-input-types/{apiTypeId}/versions/{version}/validate:
    post:
      tags: [config]
      operationId: validateApiRequestTemplate
      summary: Validate an API request template
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: apiTypeId, required: true, schema: { type: string } }, { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bodySource], properties: { bodySource: { type: string } } } } } }
      responses:
        '200': { description: Non-persistent validation; invalid source returns valid=false, content: { application/json: { schema: { $ref: '#/components/schemas/ApiRequestTemplateValidation' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/config/api-request-templates:
    get:
      tags: [config]
      operationId: listApiRequestTemplates
      summary: List API request templates of the caller's scope
      description: 'BL-320 批 3（**有意保留 / kept-by-design**）：这不是单独注册的路由，而是 `GET /api/v1/config/{domain}` 在 `domain=api-request-templates` 时的**具体示例写法**（带本域专属的 query 与响应说明）。控制器只注册 `/api/v1/config/{domain}`；保留本条目是为了让调用方不必去翻通用路由的 domain 表，**不属于实现缺口**。'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: layer, required: true, schema: { type: string, enum: [instance, user, workspace, workspace-default] }, description: 'DEPRECATED value: workspace is retired from the target contract (2026-11-10 user ruling, PLAN-0763 task-250 / D-800); CP still accepts it until the UI stops calling it (task-253).' }, { in: query, name: workspaceId, schema: { type: string, format: uuid } }, { in: query, name: includeMeta, schema: { type: boolean, default: false } }]
      responses:
        '200': { description: 'Authorized config string map by default; includeMeta=true returns domain, entries and envOverridden. templates/defaults/model bindings are JSON strings.', content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config/{layer}/api-request-templates:
    put:
      tags: [config]
      operationId: saveApiRequestTemplates
      summary: Save API request templates for one layer
      description: 'BL-320 批 3（**有意保留 / kept-by-design**）：同上，`{layer}` ∈ `instance|user|workspace` 分别对应已注册的 `PUT /api/v1/config/{layer}/{domain}` 且 `domain=api-request-templates` 的具体示例，不是独立路径。**providerModelBindings 的存储层 = 绑定的「到」层**：消费方自己的 user 行，或 Connection owner 所在层（D-1140：实例层与用户层同构，实例 Connection 的按模型绑定写在实例层；workspace Connection 的写在 workspace 层）。写别的 owner 的连接 ⇒ 404 PROVIDER_CONNECTION_NOT_FOUND（该连接在本层作用域外，不是「模型绑定只能写在 user 层」）。解析顺序不变：显式选择 > user 行 > Connection owner 层 > connection-default > built-in-default。'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: layer, required: true, schema: { type: string, enum: [instance, user, workspace, workspace-default] }, description: 'DEPRECATED value: workspace is retired from the target contract (2026-11-10 user ruling, PLAN-0763 task-250 / D-800); CP still accepts it until the UI stops calling it (task-253).' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: { type: string }, description: 'templates, connectionDefaultTemplates and providerModelBindings are JSON strings. Published versions are immutable; drafts preserve invalid raw source. providerModelBindings keys are Connection ids of the layer owner; unknown ids and ids owned by another layer fail with 404 PROVIDER_CONNECTION_NOT_FOUND.' } } } }
      responses:
        '200': { description: Saved authorized config envelope }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/provider-connections/{connectionId}/api-type-change-impact:
    get:
      tags: [provider]
      operationId: getProviderApiTypeChangeImpact
      summary: Preview the impact of changing a provider connection's API type
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }, { in: query, name: apiTypeId, required: true, schema: { type: string } }, { in: query, name: version, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Owner-visible compatible refs and aggregate incompatible override/session counts; no cross-user identities or bodies, content: { application/json: { schema: { $ref: '#/components/schemas/ApiTypeChangeImpact' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/provider-connections/{connectionId}/delete-impact:
    get:
      tags: [provider]
      operationId: getProviderDeleteImpact
      summary: Preview the config references a connection delete would cascade away
      description: 'PLAN-0505: counts only — other users'' binding contents are never exposed. blocked is true while any session row references the connection; blocked connections are rejected by DELETE with 409 CONNECTION_IN_USE.'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Delete impact counts and blocked flag
          content: { application/json: { schema: { $ref: '#/components/schemas/DeleteImpactView' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/provider-catalog:
    get:
      tags: [config]
      operationId: listProviderCatalog
      summary: List connectable provider definitions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Non-secret provider definitions
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCatalogResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/provider-connections:
    get:
      tags: [provider]
      operationId: listProviderConnections
      summary: List provider connections visible to the current user
      description: >-
        Masked summaries of the caller's own USER rows and the current WORKSPACE rows; INSTANCE
        rows (whole-deployment shared defaults) are listed only to callers holding
        cap:instance:admin (CAP_INSTANCE_ADMIN) and are omitted for ordinary users, while runtime
        resolution still consumes them. No key, ciphertext, suffix or credential plaintext is ever
        returned (maskedKey stays null) and the view is read-only for every scope.
        Profile source precedence: workspace profile > workspace-default profile > user profile >
        instance profile (one whole profile unit, the first configured layer wins, no key-level
        merge). The connection follows the profile owner: a workspace or workspace-default profile
        uses the current WORKSPACE connection, a user profile uses the consuming user's USER
        connection, and an instance profile uses the consuming user's USER connection; when that
        owner layer has no enabled + READY connection, the INSTANCE connection is the last fallback -
        no other layer's connection is searched. The first enabled + READY match wins; an unmatched
        profile fails with 409 LLM_PROFILE_CONFLICT - CP never silently falls back to another owner
        or to a code default.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Masked connection summaries (USER + WORKSPACE; plus INSTANCE for instance admins)
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnectionListResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [provider]
      operationId: createProviderConnection
      summary: Create and persist an encrypted provider connection
      description: >-
        Creates one logical connection slot. The unique key is
        (scope, ownerId, providerId, connectionKey), so one provider can carry several connections
        per owner only under different connectionKey values. USER rows belong to the caller;
        WORKSPACE rows require a writable workspace role or the MANAGE_PROVIDER_CONNECTIONS
        capability; INSTANCE rows are whole-deployment shared defaults and require
        cap:instance:admin (CAP_INSTANCE_ADMIN) - any other caller answers 403 and no row is created.
        ownerId is derived server-side (the deployment instance identifier for INSTANCE rows) and
        is never supplied by the client. apiKey and credentialId are mutually exclusive; the key is
        write-only, lives in the credential vault and is never stored on the connection row or echoed
        in any response. For an INSTANCE row a quick apiKey still creates a USER-owned lease-tier
        credential of the creating admin, which is the credential the shared connection leases at
        run time.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnectionCreateRequest' } } }
      responses:
        '201':
          description: Connection saved in verifying state
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnection' } } }
        '400':
          description: 'PROVIDER_CONNECTION_INVALID / PROVIDER_CONNECTION_KEY_INVALID / PROVIDER_API_TYPE_UNSUPPORTED. PLAN-0555/0563: label errors carry field=label; the label is trimmed, limited to 40 code points, and must not contain control characters.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: 'FORBIDDEN - RFC 9457 ProblemDetails with code "FORBIDDEN" from the security access-denied handler. INSTANCE scope requires cap:instance:admin (CAP_INSTANCE_ADMIN); WORKSPACE scope requires a writable workspace role or MANAGE_PROVIDER_CONNECTIONS. The body never carries key material.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: 'PROVIDER_CONNECTION_KEY_CONFLICT when the (scope, ownerId, providerId, connectionKey) slot is already taken, or PROVIDER_CONNECTION_LABEL_CONFLICT (field=label) when another connection for the same owner and provider already uses the label (case-insensitive, trimmed).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/provider-connections/{connectionId}:
    parameters: [{ in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [provider]
      operationId: updateProviderConnection
      summary: Update provider connection metadata or replace credential
      description: >-
        Updates metadata or replaces the linked credential; the owner scope is immutable. INSTANCE
        rows are shared defaults, so only cap:instance:admin (CAP_INSTANCE_ADMIN) may update, rotate
        (credentialId or apiKey), disable or re-point them - any other caller answers 403 and the row
        is unchanged. Revision CAS, connectionKey immutability and label uniqueness are enforced
        regardless of scope. The replacement secret is write-only and is never echoed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnectionUpdateRequest' } } }
      responses:
        '200':
          description: Updated connection
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnection' } } }
        '400':
          description: 'PROVIDER_CONNECTION_INVALID / PROVIDER_CONNECTION_KEY_INVALID / PROVIDER_API_TYPE_UNSUPPORTED. PLAN-0555/0563: label errors carry field=label; the label is trimmed, limited to 40 code points, and must not contain control characters.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: 'FORBIDDEN - RFC 9457 ProblemDetails with code "FORBIDDEN". INSTANCE rows require cap:instance:admin (CAP_INSTANCE_ADMIN); a non-admin write changes nothing and the body never carries key material.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'PROVIDER_CONNECTION_KEY_IMMUTABLE, CONNECTION_REVISION_CHANGED, or PROVIDER_CONNECTION_LABEL_CONFLICT (field=label; label uniqueness is per owner + provider, case-insensitive and trimmed).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    delete:
      tags: [provider]
      operationId: deleteProviderConnection
      summary: Disable and remove a provider connection
      description: >-
        PLAN-0505: single-transaction cascade - clears providerModelBindings[connectionId]
        (cross-user user-layer rows), connectionDefaultTemplates[connectionId] and
        llm-provider.profile rows pointing at the connection; template bodies are untouched; counts
        go to the audit log. Rejected while sessions reference the connection. Deleting an INSTANCE
        row removes the whole-deployment shared default for every consumer and requires
        cap:instance:admin (CAP_INSTANCE_ADMIN); non-admin callers answer 403.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '403':
          description: 'FORBIDDEN - RFC 9457 ProblemDetails with code "FORBIDDEN". Deleting an INSTANCE row requires cap:instance:admin (CAP_INSTANCE_ADMIN); non-admin callers change nothing.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: CONNECTION_IN_USE - sessionCount reports the referencing session rows (including delete-requested ones)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ConnectionInUseProblem' } } }
  /api/v1/provider-connections/{connectionId}/verify:
    post:
      tags: [provider]
      operationId: verifyProviderConnection
      summary: Verify a persisted provider connection
      description: >-
        Management operation: probes the stored credential against the provider and updates the
        connection status. INSTANCE rows require cap:instance:admin (CAP_INSTANCE_ADMIN) - the
        verification uses the shared credential without ever returning it; non-admin callers answer
        403.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Verification finished and connection status updated
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderConnectionVerifyResponse' } } }
        '403':
          description: 'FORBIDDEN - RFC 9457 ProblemDetails with code "FORBIDDEN". INSTANCE rows require cap:instance:admin (CAP_INSTANCE_ADMIN).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /internal/v1/provider-leases/redeem:
    post:
      tags: [service-misc]
      operationId: redeemProviderCredentialLease
      summary: Redeem a short-lived provider credential lease
      description: 'Service-to-service only. The response contains an in-memory credential and must never be logged or returned to a browser. PLAN-0622 — admission is gated by the resource governor (connection/model inflight, queue depth, window token budget); an over-limit request is refused fast with 429 RESOURCE_EXHAUSTED + Retry-After, and the lease is released on every terminal path.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredentialLeaseRedeemRequest' } } }
      responses:
        '200':
          description: In-memory credential grant
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredentialLeaseGrant' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/ResourceExhausted' }
  /internal/v1/credentials/rotation/status:
    get:
      tags: [service-misc]
      operationId: getCredentialRotationStatus
      summary: Credential key-ring rotation status
      description: 'PLAN-0495 M3: service-to-service only. Reports ring versions, the current version and per-version row counts (retirement evidence); never a value or ciphertext.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rotation status
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRotationStatus' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /internal/v1/credentials/rotation/runs:
    post:
      tags: [service-misc]
      operationId: runCredentialRotationBatch
      summary: Re-encrypt one batch of credentials under the current key version
      description: 'PLAN-0495 M3: service-to-service only. Decrypt/encrypt with compare-and-set write-back; batches are resumable; a concurrent replace is never overwritten. Response carries counts only.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRotationBatchRequest' } } }
      responses:
        '200':
          description: Batch result
          content: { application/json: { schema: { $ref: '#/components/schemas/CredentialRotationBatchResult' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /internal/v1/chat/runs/{runId}/guidance/pending:
    get:
      tags: [service-misc]
      operationId: getPendingChatRunGuidance
      summary: Pending Guidance for the Agent runner at the tool-batch boundary
      description: |
        PLAN-0528: service-to-service pending read for the consuming Agent (sequence order).
        Source Run isolation: a continuation (new ChatRun) never sees the source Run's guidance.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pending items
          content: { application/json: { schema: { $ref: '#/components/schemas/GuidancePendingView' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/chat/runs/{runId}/guidance/{guidanceId}/consume:
    post:
      tags: [service-misc]
      operationId: consumeChatRunGuidance
      summary: Acknowledge Guidance as injected into the next planning step
      description: |
        PLAN-0528: pending → consumed. Idempotent: repeat consume returns the same consumed record.
        `firstConsumption` is `true` only for the transition winner and `false` on every later replay
        (the database row decides the winner, so concurrent consumers see exactly one `true`).
        Consuming a terminal-expired item returns `409 GUIDANCE_ALREADY_TERMINAL_EXPIRED` — the agent
        must stop retrying and must not inject.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: guidanceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/GuidanceConsumeRequest' } } }
      responses:
        '200':
          description: Consumed (first or idempotent replay)
          content: { application/json: { schema: { $ref: '#/components/schemas/GuidanceConsumeResult' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/health:
    get: { tags: [system], operationId: health, summary: Liveness probe, security: [], responses: { '200': { description: Healthy } } }
  /api/v1/status:
    get: { tags: [system], operationId: serviceStatus, summary: Service status, security: [{ bearerAuth: [] }], responses: { '200': { description: Service status } } }
  /api/v1/version:
    get:
      tags: [system]
      operationId: deploymentVersion
      summary: Deployment identity and module versions
      description: |
        PLAN-0534 identity surface. Reports the stack id, release channel, CP process
        start time, CP commit, and the cached cp/agent/runtime module versions.
        `modules.ui` is intentionally absent; the UI displays its own build version.
        An unreachable Agent or Runtime yields 200 with that module's version/commit null.
        Auth matches `GET /api/v1/status`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Version identity snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stackId, releaseChannel, startedAt, commit, modules]
                properties:
                  stackId: { type: string, pattern: '^stack-[1-8]$' }
                  releaseChannel: { type: string, enum: [stable, beta, dev] }
                  startedAt: { type: string, format: date-time }
                  commit: { type: [string, 'null'] }
                  modules:
                    type: object
                    additionalProperties: false
                    required: [cp, agent, runtime]
                    properties:
                      cp:
                        type: object
                        additionalProperties: false
                        required: [version, commit]
                        properties:
                          version: { type: [string, 'null'] }
                          commit: { type: [string, 'null'] }
                      agent:
                        type: object
                        additionalProperties: false
                        required: [version, commit, framework]
                        properties:
                          version: { type: [string, 'null'] }
                          commit: { type: [string, 'null'] }
                          framework: { type: [string, 'null'] }
                      runtime:
                        type: object
                        additionalProperties: false
                        required: [version, commit]
                        properties:
                          version: { type: [string, 'null'] }
                          commit: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/logs:
    post: { tags: [system], operationId: ingestLogs, summary: Ingest a client-side log bundle, security: [{ bearerAuth: [] }], responses: { '200': { description: Accepted } } }
  /api/v1/telemetry/logs:
    post:
      tags: [system]
      operationId: ingestTelemetry
      summary: Ingest telemetry events
      security: [{ bearerAuth: [] }]
      description: >
        Client telemetry ingress (PLAN-0522). The batch is validated against server-side caps and
        written to the local {XIHE_LOG_DIR}/telemetry.log sink; 200 {"status":"ok"} acknowledges
        only that local sink. Entries carrying an explicit structured eventId/eventType are
        additionally relayed best-effort to the shared TLM service when the instance
        logging.centralTelemetryEnabled gate is "true" and XIHE_TLM_URL/XIHE_TLM_INGEST_TOKEN are
        configured; message/data/free text are never relayed, and relay failures never change
        this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchId: { type: string, maxLength: 64 }
                deviceId: { type: string, maxLength: 64 }
                entries:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      timestamp: { type: integer }
                      level: { type: string, enum: [debug, info, warn, error] }
                      message: { type: string, maxLength: 8192 }
                      data: { description: 'Local sink only; never relayed to TLM' }
                      eventId: { type: string, maxLength: 64 }
                      eventType: { type: string, maxLength: 64 }
                      errorCode: { type: string, maxLength: 128 }
                      serviceVersion: { type: string, maxLength: 64 }
                      releaseChannel: { type: string, enum: [stable, beta, dev] }
                      osFamily: { type: string, enum: [windows, macos, linux, ios, android, other] }
                      browserFamily: { type: string, enum: [chrome, edge, firefox, safari, other] }
                      lang: { type: string, maxLength: 16 }
                      screenBucket: { type: string, enum: [xs, sm, md, lg, xl] }
                      anonSessionId: { type: string, maxLength: 64 }
      responses:
        '200': { description: 'Local sink accepted the batch ({"status":"ok"}); central relay is best-effort and server-side' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/config/{domain}:
    get:
      tags: [config]
      operationId: getConfig
      summary: Get config of one domain (merged effective, or one explicit layer)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - in: query
          name: layer
          required: false
          schema: { type: string, enum: [instance, user, workspace, workspace-default] }
          description: 'Omit to read the merged effective view (env > workspace > workspace-default > user > instance > code defaults); set it to read one raw layer. workspace-default is the shared workspace default layer (PLAN-0766 / D-928): one deployment-wide row set per key that applies to every workspace without an explicit value, readable by any authenticated caller. Raw-layer reads apply the same layer×domain gate as writes: a domain outside the writable set of that layer answers 403 FORBIDDEN on GET (D-1122 49A makes this true for the four model domains at workspace / workspace-default); the merged effective read without layer is unaffected. DEPRECATED value: workspace is retired from the target contract (2026-11-10 user ruling, PLAN-0763 task-250 / D-800); CP still accepts it until the UI stops calling it (task-253).'
        - { in: query, name: includeMeta, required: false, schema: { type: boolean, default: false } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: >-
            Resolved configuration. Without includeMeta the body is a flat key -> string map of the
            selected/merged view; with includeMeta=true it is GetConfigWithMeta ({domain, entries,
            envOverridden}), where envOverridden lists env-effective locked values (decision #22).
            D-919 / D-906 (1): the merged read (no layer) is the authority of the user-preference
            default chain - read it for the effective default and use layer=user to detect whether
            the user has an override. PLAN-0554: non-admin layer=instance is 403 except explicit-only
            template domains; non-admin effective reads omit INSTANCE_ONLY_KEYS and instance-only
            domains, and filter envOverridden.
          content:
            application/json:
              schema:
                oneOf:
                  - { type: object, additionalProperties: { type: string } }
                  - { $ref: '#/components/schemas/GetConfigWithMeta' }
        '400':
          description: 'INVALID_DOMAIN when {domain} is not in the schema-backed domain set (json carries field structure, enum carries the domain list); INVALID_REQUEST when agent-templates / context-templates / api-request-templates are read without an explicit layer.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config/{domain}/meta:
    get:
      tags: [config]
      operationId: getConfigMeta
      summary: Read per-key config provenance for one layer (PLAN-0554)
      description: >-
        Returns per-key provenance for one layer: key/source/locked/writable/reason/instanceEligible/
        defaultPresent/overridable plus PLAN-0556 adminLocked/lockReason. No values are returned.
        locked means an env overlay wins; adminLocked means an administrator pinned the instance
        value (env still outranks it) and reason becomes ADMIN_LOCKED.

        Ceiling keys: the 12 instance-only agent-runtime keys (PLAN-0764 M0 guardrail gloss) are
        instructions, runMaxTurnsCeiling, runMaxElapsedSecondsCeiling, runMaxTokensCeiling,
        loopRepeatEscalateCeiling, loopErrorRunEscalateCeiling, loopStaleResultEscalateCeiling,
        loopWindowSizeCeiling, wakeChainMaxDepth, maxConcurrentRunsPerSession,
        delegationMaxCountCeiling and delegationMaxDepthCeiling. They appear only on the instance
        layer, with writable=true and overridable=false; the user/workspace layers omit them entirely
        (CP filters instance-only keys before assembling the per-layer list). Therefore
        overridable=false on the instance layer is the contracted signal for "instance-only ceiling:
        cannot be inherited by the user layer"; a client must use that flag instead of maintaining
        its own ceiling key list. Per-key bounds and units (min/max/unit) are NOT machine-readable in
        this contract: CP's meta view does not return them today (CP 待实现) - clients must not infer
        bounds from this document.

        layer=instance is ADMIN only; user/workspace/workspace-default are layer-filtered and
        exclude instance-only keys. workspace-default (PLAN-0766 / task-183; narrowed by D-1122
        49A) is writable on exactly its four WORKSPACE_WRITABLE ∩ UI_DOMAINS behavior domains —
        job-policy, approval-policy, agent-runtime, agent-templates — via the
        MANAGE_WORKSPACE_DEFAULT_CONFIG action atom; context-templates is a service-only domain
        with no generic config API face and is excluded (400 DOMAIN_NOT_WORKSPACE_WRITABLE).
        The four model domains (llm-provider, context-policy, embedding, rag) are not writable
        at any workspace-scoped layer: writes answer 400 DOMAIN_NOT_WORKSPACE_WRITABLE and
        raw-layer reads (layer=workspace / layer=workspace-default) answer 403 FORBIDDEN under
        the same layer×domain gate.
        Only the 12 UI domains are accepted; service-only context-templates/pricing return
        INVALID_DOMAIN. workspace layer requires workspaceId or X-Workspace-Id.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: query, name: layer, required: true, schema: { type: string, enum: [instance, user, workspace, workspace-default] }, description: 'DEPRECATED value: workspace is retired from the target contract (2026-11-10 user ruling, PLAN-0763 task-250 / D-800); CP still accepts it until the UI stops calling it (task-253).' }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Map of {domain, layer, keys[]} with no config values', content: { application/json: { schema: { $ref: '#/components/schemas/ConfigMetaView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config/instance/{domain}:
    put:
      tags: [config]
      operationId: putInstanceConfig
      summary: Write instance-layer config of one domain
      description: >-
        Body replaces the listed keys of the instance layer for this domain; values are strings. A
        unit domain serializes its whole unit as one JSON string: llm-provider profile / imageProfile /
        imageProvider / modelParams, embedding profile, agent-templates templates and
        api-request-templates templates / connectionDefaultTemplates / providerModelBindings.
        imageProfile is instance-layer only - a write outside the instance layer answers 400
        INVALID_REQUEST. embedding accepts exactly the whole profile unit on each layer (other key
        sets answer 400 INVALID_REQUEST) and an empty body clears the layer profile so the layer
        inherits again; blank llm-provider unit values clear that layer row (whole-unit clear
        semantics). Omitted keys are untouched.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Written
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigWriteResult' } } }
        '400':
          description: 'INVALID_REQUEST - unknown domain, malformed unit JSON, schema validation failure, or an imageProfile write outside the instance layer.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: 'FORBIDDEN (action-atom gate) or CONFIG_OWNERSHIP_VIOLATION (provider credentials belong to provider_connections).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: 'CONFIG_ENV_LOCKED for env-mapped keys; CONFIG_KEY_LOCKED when an administrator locked the key (PLAN-0556) - locked values are writable only through /api/v1/config-locks.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/config/instance/{domain}/{key}:
    delete:
      tags: [config]
      operationId: deleteInstanceConfig
      summary: Clear one instance-layer default (PLAN-0554)
      description: 'ADMIN only. Deletes the instance row and falls back to the code default. Idempotent when the row does not exist. Env-locked keys return 409 CONFIG_ENV_LOCKED; administrator-locked keys return 409 CONFIG_KEY_LOCKED (unlock with clearValue instead, PLAN-0556).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: path, name: key, required: true, schema: { type: string } }
      responses:
        '200': { description: Cleared }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/config/workspace-default/{domain}:
    put:
      tags: [config]
      operationId: putWorkspaceDefaultConfig
      summary: Write the shared workspace-default layer of one domain
      description: >-
        PLAN-0766 (D-928 / D-931, narrowed by task-183): one deployment-wide row set per key that
        applies to every workspace without an explicit value; database precedence is workspace >
        workspace-default > user > instance, with env overlays and administrator lock pins still
        above every database layer and code defaults last. Writable on exactly the four
        behavior domains job-policy, approval-policy, agent-runtime and agent-templates (D-1122
        49A narrowed the former eight: the model domains llm-provider, context-policy, embedding
        and rag answer 400 DOMAIN_NOT_WORKSPACE_WRITABLE here; contract-first — CP enforces the
        narrowed set in the removal batch) through the
        MANAGE_WORKSPACE_DEFAULT_CONFIG action atom (capability evaluation, no role-name check;
        default grant set is the instance admin role and can be extended by explicit grants);
        context-templates is a service-only domain with no generic config API face (its own
        dedicated template API owns it) and is therefore NOT writable here, exactly like
        api-request-templates; other domains answer 400 DOMAIN_NOT_WORKSPACE_WRITABLE. Same body,
        unit-value and whole-unit clear rules as putInstanceConfig (empty body clears an
        EXPLICIT_ONLY whole unit; blank llm-provider unit values clear that layer row). Omitted
        keys are untouched.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Written
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigWriteResult' } } }
        '400':
          description: 'DOMAIN_NOT_WORKSPACE_WRITABLE (domain outside the four writable behavior domains — job-policy, approval-policy, agent-runtime, agent-templates; the model domains llm-provider/context-policy/embedding/rag, context-templates and api-request-templates are all excluded), INVALID_REQUEST (unknown domain, malformed unit JSON, schema validation failure, or an imageProfile write outside the instance layer), or CONFIG_OWNERSHIP_VIOLATION (provider credentials belong to provider_connections).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '403':
          description: 'FORBIDDEN - the caller does not hold the MANAGE_WORKSPACE_DEFAULT_CONFIG action atom.'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: 'CONFIG_ENV_LOCKED for env-mapped keys; CONFIG_KEY_LOCKED when an administrator locked the key (PLAN-0556).'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/config/workspace-default/{domain}/{key}:
    delete:
      tags: [config]
      operationId: deleteWorkspaceDefaultConfig
      summary: Clear one workspace-default-layer row so the chain inherits again
      description: 'Deletes the workspace-default row of one key and falls back to the next layer (user, then instance, then code default). Idempotent when the row does not exist. Holds the MANAGE_WORKSPACE_DEFAULT_CONFIG action atom. A domain outside the four writable behavior domains (job-policy, approval-policy, agent-runtime, agent-templates) answers 400 DOMAIN_NOT_WORKSPACE_WRITABLE — the model domains llm-provider/context-policy/embedding/rag included since D-1122 49A, plus context-templates and api-request-templates (task-183). Env-locked keys return 409 CONFIG_ENV_LOCKED; administrator-locked keys return 409 CONFIG_KEY_LOCKED (unlock with clearValue instead, PLAN-0556).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: path, name: key, required: true, schema: { type: string } }
      responses:
        '200': { description: Cleared }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/config/workspace/{domain}:
    put:
      tags: [config]
      operationId: putWorkspaceConfig
      deprecated: true
      summary: (deprecated) Write one workspace-layer config domain
      description: 'DEPRECATED (2026-11-10 user ruling — PLAN-0763 task-250 / D-800): the workspace config layer is no longer part of the global configuration API; workspace-scoped settings move inside each workspace once that design lands (task-247 / task-253). CP still registers this route, so it stays in the contract marked deprecated instead of being deleted — a delete here would claim behaviour CP does not have. Removal prerequisites: (1) no UI consumer calls the workspace layer (task-253), (2) the workspace settings redesign is live. Distinct from this retired per-workspace layer, PLAN-0766 (D-928 / D-931) adds the shared workspace-default layer (wire value workspace-default): one deployment-wide row set per key that applies to every workspace without an explicit value; database precedence is workspace > workspace-default > user > instance, with env overlays and administrator lock pins still above every database layer and code defaults last. It is writable on exactly the four behavior domains job-policy, approval-policy, agent-runtime and agent-templates (D-1122 49A narrowed the former eight — the model domains llm-provider, context-policy, embedding and rag answer 400 DOMAIN_NOT_WORKSPACE_WRITABLE at both workspace-scoped layers, this deprecated workspace layer included; context-templates is service-only with no generic config API face and is excluded, task-183) through the MANAGE_WORKSPACE_DEFAULT_CONFIG action atom (capability evaluation, no role-name check; default grant set is the instance admin role and can be extended by explicit grants); writes on other domains answer 400 DOMAIN_NOT_WORKSPACE_WRITABLE, a caller without the atom answers 403 FORBIDDEN, and env-locked / administrator-locked keys answer 409 CONFIG_ENV_LOCKED / CONFIG_KEY_LOCKED like every other layer. Whole-unit (EXPLICIT_ONLY) domains keep whole-layer write semantics. The write routes are PUT /api/v1/config/workspace-default/{domain} and DELETE /api/v1/config/workspace-default/{domain}/{key} below, registered in the same batch as this contract (PLAN-0766 M2 / task-159). The layer is also readable through GET /api/v1/config/{domain}?layer=workspace-default and surfaces in effective per-key provenance (source=workspace-default).'
      x-removal-plan: 'Delete this path together with ConfigController.java:394 in one batch once (1) task-253 has removed every UI workspace-layer call and (2) the workspace settings redesign is live; until then the config read/write routes keep accepting layer=workspace and say so in their own descriptions.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: query, name: workspaceId, required: true, schema: { type: string, format: uuid }, description: 'Required while the deprecated workspace layer is still served; the instance and user layers ignore it.' }
      responses:
        '200': { description: Updated }
        '400': { description: 'DOMAIN_NOT_WORKSPACE_WRITABLE — 模型 4 域已退出工作区层（T2.4 / D-1122 49A）' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/config/user/{domain}:
    put:
      tags: [config]
      operationId: putUserConfig
      summary: Write user-layer config of one domain
      description: >-
        Same body, unit-value and whole-unit clear rules as putInstanceConfig; the row is owned by
        the authenticated caller. imageProfile is rejected on this layer (400 INVALID_REQUEST).
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: domain, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Written
          content: { application/json: { schema: { $ref: '#/components/schemas/ConfigWriteResult' } } }
