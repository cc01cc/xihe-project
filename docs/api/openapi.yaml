  /api/v1/user-questions:
    get:
      tags: [chat]
      operationId: listUserQuestions
      summary: The caller's own inbound questions (the asker's inbox)
      description: 'PLAN-0660 T5.10. **Addressee-only list**: rows where `addressee_user_id` = the caller — not every question in sessions the caller can see. `pendingCount` is computed with the *same* filter as `items` (badge and list can never disagree) and is derived from rows, never stored. No workspace context is required (the same shape as `GET /api/v1/user-events`). `state` currently accepts only `pending`: any other value is 400 rather than silently ignored. An oversized `limit` is clamped to 100, `limit < 1` is 400.'
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: state
          required: false
          schema: { type: string, enum: [pending], default: pending }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, default: 20, maximum: 100 }
      responses:
        '200':
          description: The caller's questions plus the pending count of the same filter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserQuestionListResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/user-questions/{id}:
    get:
      tags: [chat]
      operationId: getUserQuestion
      summary: One question — addressee, or a session-visible reader (read-only)
      description: 'PLAN-0660 T5.10. Readable by the addressee, and additionally by a session-visible reader (session owner / invited enabled HUMAN participant — the frozen SessionReadAccess read rule, PLAN-0668 D1/D1b). Both get the **same projection**; the reader is never granted the answer right. Everybody else gets the *same* 404 `QUESTION_NOT_FOUND` as a nonexistent id: there is no 403 branch, and a malformed (non-UUID) id is a 404 too, never a 400.'
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The question projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserQuestionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/user-questions/{id}/answer:
    post:
      tags: [chat]
      operationId: answerUserQuestion
      summary: Answer a pending question (addressee only)
      description: 'PLAN-0660 T5.10/T5.12. Addressee only: any other caller — including a session-visible reader — gets the uniform 404 `QUESTION_NOT_FOUND`, and visibility is decided *before* body validation so the route cannot be used as a validation oracle. On success the response is the **settled projection** (`state=answered` plus the `settledAt` stamp), not an empty body. The answer is durable only if the waiting run received it: a failed CP→Agent callback is `502 AGENT_QUESTION_DELIVERY_FAILED` and the row stays `pending` (fail-closed, retryable). Conflicts keep their frozen codes: `409 QUESTION_ALREADY_SETTLED`, `409 QUESTION_EXPIRED`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserQuestionAnswerRequest' }
      responses:
        '200':
          description: The settled projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserQuestionView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/v1/approvals/pending:
    get:
      tags: [chat]
      operationId: listPendingApprovals
      summary: Cross-session live actionable approval/retry indicator (counts only)
      description: |
        PLAN-0328 M1 T1.16 (spec/ui-ux §1.2): one entry per session with at least one of the
        live actionable approval/retry states (`pending` or `dispatch_unknown`) for the authenticated
        user in the current workspace. `dispatching` remains in-flight and is not counted.
        Counts and timestamps only — never tool arguments, approval details or rule text
        (spec/approval.md §15).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pending approval summaries, oldest session first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingApprovalSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/policy/mode:
    get:
      tags: [config]
      operationId: getPolicyMode
      summary: Get the session-scoped policy mode
      description: |
        BL-299 read access: the session owner or an enabled invited HUMAN participant (managers are
        excluded); everyone else gets 404 SESSION_NOT_FOUND. The POST below stays owner-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current session policy mode and session rule count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyModeState' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [config]
      operationId: setPolicyMode
      summary: Set the session-scoped policy mode
      description: |
        Persists `manual` / `auto` on the session row (PLAN-0337 V24), so the choice survives a CP
        restart; a workspace-level default comes from the `approval-policy` config domain. An
        unsupported mode is rejected with `400 INVALID_REQUEST`. BL-299: this is a write face and
        stays owner-only (the GET sibling is the only widened read).

        BL-309 — the refusal has **two intentionally different codes**, decided by the caller's
        workspace write role (the codes answer different questions; unifying them would either leak
        session existence or hide the actionable reason):
        - **`403 WORKSPACE_READ_ONLY`**: the caller is a `VIEWER` of the workspace. The workspace
          write gate rejects any non-GET verb before the controller runs, e.g.
          `{"code":"WORKSPACE_READ_ONLY","detail":"Viewer cannot modify this workspace"}`.
        - **`404 SESSION_NOT_FOUND`**: the caller is a write-capable workspace member (`EDITOR`)
          who is not the session owner, so the session owner-only guard answers the single
          not-区分 404 and the face is not an existence oracle.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyModeUpdateRequest' }
      responses:
        '200':
          description: Updated session policy mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyModeUpdateResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { description: 'WORKSPACE_READ_ONLY — the caller is a VIEWER workspace member; the workspace write gate rejects the verb before the session guard runs', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'SESSION_NOT_FOUND — the caller is a write-capable (EDITOR) workspace member but not the session owner; owner-only not-区分 404 (no existence oracle)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/policy/domains:
    get:
      tags: [config]
      operationId: listPolicyDomains
      summary: List action-class domains with their effective layer
      description: |
        PLAN-0328 M1 (spec/ui-ux §3.3): per-domain (`actionClass`) view of the persisted policy
        layers. `effectiveLayer` is the highest layer that configures the domain, or `builtin`
        when only built-in defaults apply. `ruleCounts` lists only layers that hold at least one
        rule. Domains are the built-in action classes plus every action class configured by
        persisted instance/user/workspace-default/workspace rules.
        **Known gap (PLAN-0766, next phase)**: the shared `workspace-default` layer is enumerated
        here for forward compatibility, but this view (the legacy `policy_rules` table) has no
        producer for it yet — the default layer currently lands only through the config surface's
        `approval-policy` domain (`PUT /api/v1/config/workspace-default/approval-policy`), which
        CP's runtime policy context already honours. Wiring the rules-table view to that layer is a
        PLAN-0766 follow-up item, not a promise of this response.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Domain views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyDomainView' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
  # /api/v1/policy/rules (GET/POST/DELETE + /conflicts) retired by PLAN-0407 T2.8:
  # rule adjudication and the authorization rules CRUD are gone; authorization is the grant
  # lookup and the approval trigger is the approval-policy ask list.
  /api/v1/policy/tool-faces:
    get:
      tags: [config]
