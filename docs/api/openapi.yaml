      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OperationStartResponse' } } } }, '200': { description: Idempotent replay of an existing operation, content: { application/json: { schema: { $ref: '#/components/schemas/OperationStartResponse' } } } }, '409': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' } }
