        available: { type: boolean }
        unavailableReason: { type: [string, 'null'], description: Stable reason when available=false. }
        reason: { type: [string, 'null'], description: Legacy probe key kept in sync with unavailableReason. }
    SafePolicySummary:
      type: object
      additionalProperties: false
      description: >-
        Safe verdict snapshot attached to the MCP invocation: why the call
        was allowed or blocked. Raw tool arguments, MCP request bodies and free-form exception text
        are never included; legacy V19-absent rows omit the whole `policy` object. `reused` is the
        T1.7 reuse annotation: true when the dispatch reused an exact session grant, null when reuse
        is not applicable (legacy V19 snapshots parse as null).
      required: [effect, sourceLayer, matchedRule, reason, mode, allowedBy, actionClass, shape, reused]
      properties:
        effect: { type: string, enum: [allow, ask, deny] }
        sourceLayer: { type: string, enum: [builtin, instance, user, workspace, session, per_call] }
        matchedRule: { type: [string, 'null'], minLength: 1 }
        reason: { type: string, minLength: 1 }
        mode: { type: [string, 'null'], enum: [manual, auto] }
        allowedBy:
          type: [string, 'null']
          description: Lower-cased automatic-allow marker (e.g. `auto@session`) when the allow came from a mode rather than a rule.
        actionClass: { type: string, minLength: 1 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
        reused:
          type: [boolean, 'null']
          description: T1.7 reuse annotation — `true` only for an exact session-fingerprint dispatch; `null` when reuse is not applicable; never fabricated.
    McpApprovalRequiredError:
      type: object
      additionalProperties: false
      description: >-
        JSON-RPC 2.0 error frame returned with HTTP 409 by the MCP gate when no valid approval grant
        or session fingerprint exists (PLAN-0328 T1.7/T1.9). The safe extension travels as
        `error.data` because MCP transports discard non-JSON-RPC response bodies. The durable pending
        approval referenced by `approvalRequestId` is created or reused (same session + tool +
        canonical arguments hash) before this response is emitted.
      required: [jsonrpc, id, error]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: { type: [integer, string, 'null'], description: Echoes the JSON-RPC request id; null when the request carried none. }
        error:
          type: object
          additionalProperties: false
          required: [code, message, data]
          properties:
            code: { type: integer, enum: [-32003] }
            message: { type: string, enum: [APPROVAL_REQUIRED] }
            data: { $ref: '#/components/schemas/McpApprovalRequiredData' }
    McpApprovalRequiredData:
      type: object
      additionalProperties: false
      description: Safe approval extension (never contains tool arguments).
      required: [status, code, approvalRequestId, tool, expiresAt, retryHeader]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [APPROVAL_REQUIRED] }
        approvalRequestId: { type: string, minLength: 1, maxLength: 128, description: Durable ChatApproval request id; the Agent keys its waiter on it and retries with the grant header. }
        tool: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        retryHeader: { type: string, enum: ['X-Xihe-Approval-Request-Id'] }
        statusUrl:
          type: [string, 'null']
          description: Run recovery route (`/api/v1/chat/runs/{runId}`) for the originating run; present only when the call carried a run context. Informational for the Agent (user auth required).
        policy: { $ref: '#/components/schemas/ApprovalPolicySummary' }
    AuditEntry:
      type: object
      required: [type, id, status, createdAt]
      description: >-
        PLAN-0466 T1.1/T2.2 user-tier audit entry — one row of the `v_audit_entries`
        view. The user projection never includes userId, idempotencyKey, requestId,
        runtimeJobId, argumentsPreview or history payload text, and never carries
        prompt content or credentials.
      properties:
        type: { type: string, enum: [chat_run, workspace_job, mcp_invocation, approval] }
        id: { type: string, format: uuid, description: 'Domain primary key: chat_runs.id / workspace_jobs.id / mcp_invocations.id / approval_requests.request_id' }
        sessionId: { type: [string, 'null'], format: uuid }
        workspaceId: { type: [string, 'null'], format: uuid }
        runId: { type: [string, 'null'], format: uuid }
        status: { type: string, description: 'Native domain status/state vocabulary (unknown values are displayed as recorded)' }
        summary: { type: [string, 'null'], description: 'Non-sensitive list title: chat_run → model, mcp_invocation → tool name, approval → tool, workspace_job → null' }
        source: { type: [string, 'null'], description: 'Native provenance column: chat_runs.origin / workspace_jobs.source / mcp_invocations.source / approval_requests.origin' }
        errorCode: { type: [string, 'null'] }
        scope: { type: [string, 'null'], description: 'workspace_job scope (run/session/workspace)' }
        cancelReason: { type: [string, 'null'] }
        toolCallId: { type: [string, 'null'], format: uuid }
        approvalRequestId: { type: [string, 'null'], format: uuid }
        terminalOutcome: { type: [string, 'null'], description: 'chat_run terminal outcome; null for other types' }
        createdAt: { type: string, format: date-time, readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        finishedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        policy: { $ref: '#/components/schemas/SafePolicySummary', description: 'Safe verdict snapshot on mcp_invocation/approval details; omitted when the stored snapshot is unreadable (never guessed).' }
        approved: { type: [boolean, 'null'], description: 'Approval detail only.' }
        decisionKind: { type: [string, 'null'], description: 'Approval detail only.' }
    InternalAuditEntry:
      description: >-
        PLAN-0466 internal tier: the user tier plus identity/correlation references
        (userId/idempotencyKey/requestId/runtimeJobId). Prompt content, credentials
        and raw arguments stay excluded in this tier as well.
      allOf:
        - $ref: '#/components/schemas/AuditEntry'
        - type: object
          required: [userId]
          properties:
            userId: { type: [string, 'null'], format: uuid }
            idempotencyKey: { type: [string, 'null'] }
            requestId: { type: [string, 'null'], format: uuid }
            runtimeJobId: { type: [string, 'null'] }
    AuditTimelineEvent:
      type: object
      required: [sequence, eventType, createdAt]
      description: >-
        Uniform projection of one row of the four append-only history tables
        (chat_run_history / workspace_job_history / mcp_dispatch_history /
        approval_history). Columns a source table does not have are omitted —
        workspace_job_history has no actor_type, approval_history carries
        approved/decisionKind instead — and the free-form `payload` TEXT column is
        never projected.
      properties:
        sequence: { type: integer, format: int64, readOnly: true }
        eventType: { type: string, description: 'Native event vocabulary (terminal/cancel/recovery/restore, start/running/settle/cancel/orphaned/interrupted, invocation.*/attempt.*, requested/dispatching/decided/expired/dispatch_unknown)' }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: [string, 'null'] }
        actorType: { type: [string, 'null'] }
        terminalOutcome: { type: [string, 'null'], description: 'chat_run_history only' }
        cancelReason: { type: [string, 'null'], description: 'workspace_job_history only' }
        errorCode: { type: [string, 'null'] }
        attemptId: { type: [string, 'null'], format: uuid, description: 'mcp_dispatch_history only' }
        approved: { type: [boolean, 'null'], description: 'approval_history only' }
        decisionKind: { type: [string, 'null'], description: 'approval_history only' }
        createdAt: { type: string, format: date-time, readOnly: true }
    AuditAttempt:
      type: object
      required: [id, stage, status]
      description: 'Owner-facing attempt projection of an mcp_invocation detail; no httpStatus, no resultRef.'
      properties:
        id: { type: string, format: uuid, readOnly: true }
        invocationId: { type: [string, 'null'], format: uuid, readOnly: true }
        stage: { type: string, readOnly: true }
        retryNo: { type: [integer, 'null'], readOnly: true }
        module: { type: [string, 'null'], readOnly: true }
        status: { type: string, enum: [started, succeeded, failed, timed_out, cancelled, unknown, late_confirmed], readOnly: true }
        errorCode: { type: [string, 'null'], readOnly: true }
        durationMs: { type: [integer, 'null'], readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        finishedAt: { type: [string, 'null'], format: date-time, readOnly: true }
    InternalAuditAttempt:
      description: 'Internal attempt projection: the user tier plus the transport/result references.'
      allOf:
        - $ref: '#/components/schemas/AuditAttempt'
        - type: object
          properties:
            httpStatus: { type: [integer, 'null'], readOnly: true }
            resultRef: { type: [string, 'null'], readOnly: true, description: 'Internal trace view only.' }
    AuditEntryListResponse:
      type: object
      required: [entries, page, size, totalElements, totalPages]
      description: One page of the audit view; newest first (created_at DESC, entry_id DESC).
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, minimum: 0, description: '0 when the filtered set is empty' }
    AuditEntryDetailResponse:
      type: object
      required: [entry, timeline, attempts]
      description: >-
        Owner-facing detail: the entry (user tier) plus that domain's history
        timeline and, for mcp_invocation, its attempts. `timeline` is empty for a
        row without history (pre-V50/V51/V53 shapes) — the entry still shows current
        status, terminal outcome and finishedAt instead of invented events.
      properties:
        entry: { $ref: '#/components/schemas/AuditEntry' }
        timeline: { type: array, items: { $ref: '#/components/schemas/AuditTimelineEvent' } }
        attempts: { type: array, items: { $ref: '#/components/schemas/AuditAttempt' }, description: 'Only mcp_invocation entries carry attempts; empty for the other types.' }
    InternalAuditEntryDetailResponse:
      type: object
      required: [entry, timeline, attempts]
      description: 'Service-Bearer detail: internal field tier (userId/idempotencyKey/requestId/runtimeJobId, attempt httpStatus/resultRef).'
      properties:
        entry: { $ref: '#/components/schemas/InternalAuditEntry' }
        timeline: { type: array, items: { $ref: '#/components/schemas/AuditTimelineEvent' } }
        attempts: { type: array, items: { $ref: '#/components/schemas/InternalAuditAttempt' } }
