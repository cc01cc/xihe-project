        generatedAt: { type: string, format: date-time }
        session: { $ref: '#/components/schemas/SessionMonitorSession' }
        activity: { type: array, items: { $ref: '#/components/schemas/SessionMonitorActivityItem' } }
        history: { $ref: '#/components/schemas/SessionMonitorHistory' }
