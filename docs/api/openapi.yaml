  /api/v1/plugin-bindings/{bindingId}/authorization:
    get:
      tags: [plugin]
      operationId: getPluginBindingAuthorization
      summary: Explain what a binding currently grants (PLAN-0691 T1.2)
      description: 'Three sets: `requestedAtoms` come from the installed manifest, `grantedAtoms` from the binding row, and `effectiveAtoms` is their intersection — an atom the manifest never asked for can never be effective. `sources` attributes each effective atom to `default` (the builtin workspace default set) or `plugin_binding` (an explicit grant), so "why does this plugin hold this atom" is answerable without reading the manifest. PLAN-0691 T1.3 is delivered: binding write paths are gated by the plugin policy engine (missing `PLUGIN_BIND` answers `403 PLUGIN_GRANT_DENIED`); this read-only explanation endpoint stays authentication-only (workspace-scoped disclosure).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Requested vs granted vs effective atoms', content: { application/json: { schema: { $ref: '#/components/schemas/PluginAuthorizationSummary' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/plugins:
    get:
      tags: [plugin]
      operationId: listSessionPlugins
      summary: List the plugin bindings attached to a session (PLAN-0691 T1.2)
      description: 'Only active attachments are returned. Each row projects the frozen snapshot taken at attach time (bindingId, pluginId, version, digest, state) plus its revision — the snapshot is what the running turn sees, so a later binding edit does not rewrite history. A session in another workspace answers 404 PLUGIN_NOT_FOUND rather than 403, so the route is not an existence oracle.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Active attachments', content: { application/json: { schema: { $ref: '#/components/schemas/SessionPluginListResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [plugin]
      operationId: attachSessionPlugin
      summary: Attach a binding to a session (PLAN-0691 T1.2)
      description: 'Takes the snapshot server-side; the client sends only the binding id. Attaching an already-active pair is idempotent and does not spend a revision (the running turn''s snapshot did not move); re-attaching a detached pair increments the revision. A `pending` or `disabled` binding answers 409 PLUGIN_CONFLICT. `catalogVersion` is the per-session revision high-water mark today; T1.6 replaces it with the catalog sequence.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginAttachRequest' } } }
      responses:
        '201': { description: 'Attachment (created or unchanged)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginAttachResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/plugins/{bindingId}:
    delete:
      tags: [plugin]
      operationId: detachSessionPlugin
      summary: Detach a binding from a session (PLAN-0691 T1.2)
      description: 'Marks the attachment detached (detached_at); the binding itself and other sessions are untouched. Idempotent: detaching a pair that is not attached answers 204 — the caller''s intent already holds.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Detached (or already detached)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  # --- PLAN-0691 T1.1: plugin catalog + lifecycle (D-66 flag-gated) ---
  /api/v1/plugins:
    get:
      tags: [plugin]
      operationId: listPlugins
      summary: List installed plugins (PLAN-0691 T1.1)
      description: 'Catalog read face: one PluginView per installed plugin, current version only. `source` and `state` are exact-match filters applied in the service — a value that matches nothing is a 200 with an empty list, never a 400, and an unknown value is not rejected either. D-66: every plugin route exists only while `cp.plugin.enabled=true`; with the flag off these paths answer 404 as if the build had no plugin feature (never 400). Authorization in T1.1 is authentication-only (`isAuthenticated()`); the `plugin:manage` atom lands with T1.3, so today every authenticated caller sees the same catalog.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: source, required: false, schema: { type: string, enum: [builtin, third-party] }, description: 'Plugin source: builtin = packaged under plugins/official, third-party = plugins/local' }
        - { in: query, name: state, required: false, schema: { type: string, enum: [enabled, disabled] }, description: 'Lifecycle state of the current version' }
      responses:
        '200': { description: 'Installed plugins', content: { application/json: { schema: { $ref: '#/components/schemas/PluginListResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/plugins/{pluginId}:
    get:
      tags: [plugin]
      operationId: getPlugin
      summary: Get one installed plugin (PLAN-0691 T1.1)
      description: 'Current version of one plugin, projected from the stored manifest (the raw jsonb manifest never surfaces on the wire). `digest` content-addresses the installed package, and a workspace binding is pinned to its (pluginId, digest) pair. An id that is not installed answers 404 PLUGIN_NOT_FOUND.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: pluginId, required: true, schema: { type: string } }
      responses:
        '200': { description: PluginView, content: { application/json: { schema: { $ref: '#/components/schemas/PluginView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [plugin]
      operationId: uninstallPlugin
      summary: Uninstall a plugin (PLAN-0691 T1.1)
      description: 'Deletes every stored version of the plugin. Refuses while any workspace binding still references it: 409 PLUGIN_CONFLICT names the binding count and requires deleting those bindings first (D-65 3 — no silent cascade, no tombstone state). Not installed answers 404 PLUGIN_NOT_FOUND. Success is 204 with no body, and the removal is audited as `plugin.uninstall`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: pluginId, required: true, schema: { type: string } }
      responses:
        '204': { description: Uninstalled }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/plugins/install:
    post:
      tags: [plugin]
      operationId: installPlugin
      summary: Install a plugin package (PLAN-0691 T1.1)
      description: 'Resolves `packagePath` under the plugin package root (`cp.plugin.package-root`, default `plugins`; the path must stay inside it), validates `manifest.json` and stores the version row. The installed version becomes current but stays `disabled` — install never auto-enables in T1.1. Conflicts: the same digest again is 409 PLUGIN_DIGEST_EXISTS; installing a second version of an already installed plugin is 409 PLUGIN_CONFLICT, because install must not replace a version (upgrade is the only replacement path). A blank packagePath is 400 INVALID_REQUEST; a path outside the root, a missing directory or manifest, an unreadable manifest and every manifest validation failure are 422 PLUGIN_MANIFEST_INVALID. Audited as `plugin.install`.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginPackageRequest' } } }
      responses:
        '201': { description: 'Installed (PluginView, state=disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/plugins/{pluginId}/upgrade:
    post:
      tags: [plugin]
      operationId: upgradePlugin
      summary: Upgrade a plugin to a newer version (PLAN-0691 T1.1)
      description: 'Installs a newer version of the same plugin and makes it current; the previous version row stays in the catalog (so bindings pinned to the old digest are not rewritten). The package must name the same plugin id as the route, keep the installed source, and carry a strictly newer version — all three answer 422 PLUGIN_MANIFEST_INVALID, the same code package validation uses, so a client cannot distinguish them from a malformed package. Unknown plugin: 404 PLUGIN_NOT_FOUND. Same digest again: 409 PLUGIN_DIGEST_EXISTS. Blank packagePath: 400 INVALID_REQUEST. Audited as `plugin.upgrade`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: pluginId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginPackageRequest' } } }
      responses:
        '200': { description: 'Upgraded (PluginView of the new current version)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/plugins/{pluginId}/enable:
    post:
      tags: [plugin]
      operationId: enablePlugin
      summary: Enable a plugin (PLAN-0691 T1.1)
      description: 'Flips the current version to `enabled`. This is the plugin-level switch only: whether a workspace or session may actually invoke the plugin is decided by its binding (`state` plus `grantedAtoms`), so enabling a plugin widens no binding. Unknown plugin: 404 PLUGIN_NOT_FOUND. Idempotent — enabling an already enabled plugin answers 200 with the same view. Audited as `plugin.enable`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: pluginId, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Enabled (PluginView)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/plugins/{pluginId}/disable:
    post:
      tags: [plugin]
      operationId: disablePlugin
      summary: Disable a plugin (PLAN-0691 T1.1)
      description: 'Flips the current version to `disabled`. Existing bindings keep their rows, but a disabled plugin cannot be invoked (the binding side reports 409 while attaching one, and the data plane refuses its tokens), so this is the kill switch for a suspect package. Unknown plugin: 404 PLUGIN_NOT_FOUND. Idempotent. Audited as `plugin.disable`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: pluginId, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Disabled (PluginView)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  # --- PLAN-0691 T1.5: plugin data plane (kv + records), binding-scoped token only (SEC-1) ---
  /internal/v1/plugin-bindings/{bindingId}/kv/{namespace}:
    get:
      tags: [service-misc]
      operationId: listPluginKv
      summary: List a plugin KV namespace (PLAN-0691 T1.5 API-4)
      description: 'Prefix listing with an opaque cursor — `nextCursor` is the last key of this page and must be passed back verbatim; it is null on the last page. `limit` defaults to 200 and must be 1..200 (400 INVALID_REQUEST otherwise); an unparsable cursor is also 400 INVALID_REQUEST, because the cursor is only ever produced here. Credential (SEC-1): this data plane accepts exactly one token — the binding-scoped plugin token (`Authorization: Bearer`, TTL 300 s) — and every request re-reads the live binding row before touching data, so a token minted for another binding or another plugin version is 403 PLUGIN_GRANT_DENIED, a binding that is not `enabled` (or whose plugin version was uninstalled) is 403 PLUGIN_BINDING_INACTIVE, and the global internal service token is refused on the same check. Missing token: 401 AUTHORIZATION_REQUIRED. D-66: with `cp.plugin.enabled=false` this path answers 404.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: namespace, required: true, schema: { type: string, maxLength: 64 } }
        - { in: query, name: prefix, required: false, schema: { type: string }, description: 'Only keys starting with this prefix are listed' }
        - { in: query, name: cursor, required: false, schema: { type: string }, description: 'Opaque nextCursor of the previous page; clients must not parse it' }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200 }, description: 'Page size, default 200' }
      responses:
        '200': { description: 'One page of items', content: { application/json: { schema: { $ref: '#/components/schemas/PluginKvPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
  /internal/v1/plugin-bindings/{bindingId}/kv/{namespace}/{key}:
    get:
      tags: [service-misc]
      operationId: readPluginKv
      summary: Read one plugin KV key (PLAN-0691 T1.5 API-1)
      description: 'Returns the stored item with its current `version` and `expiresAt` (null when the key was written without a TTL). An expired row is reported as absent (404 PLUGIN_NOT_FOUND) — expiry is evaluated on read, so a caller cannot observe a stale value. Credential and binding checks are the ones documented on the namespace listing (SEC-1/SEC-2): 403 PLUGIN_GRANT_DENIED or 403 PLUGIN_BINDING_INACTIVE before any data statement runs, 401 AUTHORIZATION_REQUIRED without a token. `namespace` is capped at 64 characters and `key` at 256 (400 INVALID_REQUEST).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: namespace, required: true, schema: { type: string, maxLength: 64 } }
        - { in: path, name: key, required: true, schema: { type: string, maxLength: 256 } }
      responses:
        '200': { description: 'One item', content: { application/json: { schema: { $ref: '#/components/schemas/PluginKvItem' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
    put:
      tags: [service-misc]
      operationId: writePluginKv
      summary: Write one plugin KV key with CAS (PLAN-0691 T1.5 API-2/API-9)
      description: 'Create-or-overwrite reported as 200 with the stored item, so the next CAS can reuse the returned `version`; there is deliberately no create/update split and therefore no 201. Preconditions (API-9): a brand-new key may omit them; overwriting an existing key without one is 412 PLUGIN_PRECONDITION_REQUIRED; a stale version is 412 PLUGIN_PRECONDITION_FAILED; `If-Match: *` forces an overwrite. The header `If-Match` and the body `ifMatch` may each carry the version but must agree when both are present (400 INVALID_REQUEST), and `If-Match: *` cannot be combined with a body `ifMatch` (400 INVALID_REQUEST). `value` is required and stored verbatim as JSON (400 INVALID_REQUEST when absent); more than 262144 UTF-8 bytes is 413 PLUGIN_VALUE_TOO_LARGE. `ttlSeconds` absent means no expiry, 0 or negative is 400 INVALID_REQUEST, and more than 7776000 s (90 days) is 429 PLUGIN_KV_QUOTA_EXCEEDED. A create race that still cannot be resolved is 409 CONCURRENT_MODIFICATION.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: namespace, required: true, schema: { type: string, maxLength: 64 } }
        - { in: path, name: key, required: true, schema: { type: string, maxLength: 256 } }
        - { in: header, name: If-Match, required: false, schema: { type: string }, description: 'Expected `version` as a bare number (surrounding quotes tolerated), or `*` to force the overwrite' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginKvPutRequest' } } }
      responses:
        '200': { description: 'Stored item (new version, expiresAt)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginKvItem' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
    delete:
      tags: [service-misc]
      operationId: deletePluginKv
      summary: Delete one plugin KV key (PLAN-0691 T1.5 API-3/API-9)
      description: '204 with no body. Optional `If-Match` guards the delete: a stale version is 412 PLUGIN_PRECONDITION_FAILED (also when the row changes between the read and the delete), and deleting a key that does not exist answers 404 PLUGIN_NOT_FOUND rather than a success. Credential and binding checks follow the namespace listing (SEC-1/SEC-2).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: namespace, required: true, schema: { type: string, maxLength: 64 } }
        - { in: path, name: key, required: true, schema: { type: string, maxLength: 256 } }
        - { in: header, name: If-Match, required: false, schema: { type: string }, description: 'Expected `version` as a bare number; omit to delete unconditionally' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
  /internal/v1/plugin-bindings/{bindingId}/records/{collection}:
    get:
      tags: [service-misc]
      operationId: listPluginRecords
      summary: Query one plugin records collection (PLAN-0691 T1.5 API-6/API-12)
      description: 'Pages one manifest-declared collection. `filter` uses the declarative syntax `op(field,literal)` joined by `and`; `sort` is `<field>:<asc|desc>`; `limit` is 1..200 and defaults to 200; `cursor` is the previous page `nextCursor` and is bound to this binding, collection and sort order. Anything the compiler rejects — an undeclared field, an unknown operator, a cursor from another binding, collection or sort — is 400 INVALID_FILTER, except a cursor issued for another binding, which is 403 PLUGIN_GRANT_DENIED because the binding check is the security decision and runs first. A collection the manifest does not declare is 404 PLUGIN_NOT_FOUND. The global service token is refused here exactly like on the KV surface (SEC-1).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: collection, required: true, schema: { type: string } }
        - { in: query, name: filter, required: false, schema: { type: string }, description: 'Declarative filter, e.g. `eq(status,"open") and gt(score,3)`' }
        - { in: query, name: sort, required: false, schema: { type: string }, description: '`<field>:<asc|desc>`; defaults to the collection declaration' }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200 }, description: 'Page size, default 200' }
        - { in: query, name: cursor, required: false, schema: { type: string }, description: 'Opaque nextCursor of the previous page' }
      responses:
        '200': { description: 'One page of records', content: { application/json: { schema: { $ref: '#/components/schemas/PluginRecordPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
    post:
      tags: [service-misc]
      operationId: createPluginRecord
      summary: Create one plugin record (PLAN-0691 T1.5 API-5)
      description: 'CP mints the record id and answers 201 with the stored item. The body wraps the document as `{doc: {...}}` so the document has a name on the wire; `doc` must be a JSON object (400 INVALID_REQUEST otherwise) and is stored verbatim. A document over 1048576 bytes is 413 PLUGIN_VALUE_TOO_LARGE; a collection already holding 200000 records is 429 PLUGIN_RECORDS_QUOTA_EXCEEDED. The records surface has no conditional writes by design — no If-Match, never a 412 (API-9). A collection the manifest does not declare is 404 PLUGIN_NOT_FOUND.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: collection, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginRecordWriteRequest' } } }
      responses:
        '201': { description: 'Created record (id minted by CP)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginRecordItem' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
  /internal/v1/plugin-bindings/{bindingId}/records/{collection}/{id}:
    get:
      tags: [service-misc]
      operationId: readPluginRecord
      summary: Read one plugin record (PLAN-0691 T1.5 API-6)
      description: 'Returns the record with its `version` and `updatedAt`. Absent record or undeclared collection: 404 PLUGIN_NOT_FOUND. Credential and binding checks follow the KV surface (SEC-1/SEC-2): 403 PLUGIN_GRANT_DENIED or 403 PLUGIN_BINDING_INACTIVE before any data statement runs.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: collection, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 'One record', content: { application/json: { schema: { $ref: '#/components/schemas/PluginRecordItem' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
    put:
      tags: [service-misc]
      operationId: upsertPluginRecord
      summary: Upsert one plugin record (PLAN-0691 T1.5 API-5/API-10)
      description: 'Upserts the record and increments `version` (API-10), answering 200 with the stored item. The body is the same `{doc: {...}}` wrapper as create, and `doc` must be a JSON object (400 INVALID_REQUEST). Unlike KV there is no If-Match and no 412: last write wins by design (API-9). Document size 413 PLUGIN_VALUE_TOO_LARGE; a concurrent conflict on the same key is 409 PLUGIN_RECORD_CONFLICT. Undeclared collection: 404 PLUGIN_NOT_FOUND.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: collection, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginRecordWriteRequest' } } }
      responses:
        '200': { description: 'Stored record (new version)', content: { application/json: { schema: { $ref: '#/components/schemas/PluginRecordItem' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }
    delete:
      tags: [service-misc]
      operationId: deletePluginRecord
      summary: Delete one plugin record (PLAN-0691 T1.5 API-7)
      description: '204 with no body. Removing a record that does not exist is 404 PLUGIN_NOT_FOUND rather than a silent success; there is no conditional delete (never a 412). Credential and binding checks follow the KV surface (SEC-1/SEC-2).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: collection, required: true, schema: { type: string } }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/PluginRateLimited' }

  /api/v1/conversation-threads:
    post:
      tags: [session]
      operationId: createConversationThread
      summary: Create a conversation thread
      security: [{ bearerAuth: [] }]
      description: 'PLAN-0646 MVP (D-671): create a conversation thread. scopeType is user|agent|workspace; workspace passes the DB CHECK but fails closed in the MVP (V4 deferred).'
      parameters:
        - { in: header, name: X-Workspace-Id, required: false, schema: { type: string, format: uuid }, description: 'PLAN-0559: workspace context of the request.' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationThreadCreateRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationThread' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'THREAD_SCOPE_UNRESOLVED (workspace half-scope) or THREAD_WRITE_FORBIDDEN (scope not owned)', content: { application/json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/conversation-threads/{threadId}:
    get:
      tags: [session]
      operationId: readConversationThread
      summary: Read one conversation thread
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: threadId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Workspace-Id, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationThread' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'THREAD_SCOPE_UNRESOLVED (workspace half-scope)', content: { application/json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'THREAD_NOT_FOUND (absent or not visible)', content: { application/json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/conversation-threads/{threadId}/sessions:
    post:
      tags: [session]
      operationId: attachConversationThreadSession
      summary: Attach a session to a conversation thread
      security: [{ bearerAuth: [] }]
      description: 'Owner-only attach; same thread again is an idempotent 200 (changed=false), a different thread overwrites without cascading.'
      parameters:
        - { in: path, name: threadId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Workspace-Id, required: false, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationThreadAttachRequest' } } } }
      responses:
        '200': { description: 'Idempotent attach', content: { application/json: { schema: { $ref: '#/components/schemas/ConversationThreadAttachResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'THREAD_WRITE_FORBIDDEN (not the session owner) or THREAD_SCOPE_UNRESOLVED', content: { application/json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'THREAD_NOT_FOUND or SESSION_NOT_FOUND', content: { application/json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/org-units:
    get:
      tags: [admin]
      operationId: listOrgUnits
      summary: List org-unit nodes (tree top, lazy-loaded children, or name search)
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch A; D-1115). Org units are a single-parent tree on the **subject
        side** (`org_units.path`, ltree). They are **not** a scope and carry **no** workspace:
        org and workspace are parallel containers (design §4.5 Q1), so nothing here filters a
        workspace and no `org_unit_id` column is consulted on the workspace side.

        Two gates, **in this order** (the order is load-bearing, not stylistic):

        1. **Scope.** The caller must be a member of some unit (`org_unit_members`,
           `member_kind='human'`, `member_id` = caller) ⇒ the visible tree is **that unit's
           subtree** (`target.path <@ own.path`, one index query, no recursion). A caller who
           holds `READ_ORG_UNIT_MEMBERS` at **instance** scope with **no** membership row is an
           instance-level reader and sees the whole tree (design §4.2: the instance admin default
           grant is instance-scope). A caller with **neither** gets `404 ORG_UNIT_NOT_FOUND` —
           deliberately not 403: a non-member must not learn whether a unit exists (design §4.3,
           `tasks.md` M2-11 判据③).
        2. **Atom.** `READ_ORG_UNIT_MEMBERS` (design §4.2). A member without the atom gets
           `403 FORBIDDEN`. The atom gate runs **after** scope resolution precisely so the 404
           above stays a 404 instead of collapsing into a 403 for everybody.

        Paging shape: `parentId` absent ⇒ the **top** of the visible tree (the caller's own unit
        for a member; every root — `parent_id IS NULL` — for an instance-level reader).
        `parentId` present ⇒ its **direct children** (lazy loading), and each node carries
        `hasChildren` so the UI can decide whether an expand is worth a request.

        `q` filters by name inside the visible subtree and **ignores `parentId`** (it searches
        the subtree, not one level) — a lazy tree cannot answer a name search one node at a time.

        Nodes never carry member detail; that is `GET /api/v1/org-units/{unitId}/members`.
      parameters:
        - { in: query, name: parentId, required: false, schema: { type: string, format: uuid }, description: 'List the direct children of this unit. Absent ⇒ the top of the caller''s visible tree.' }
        - { in: query, name: q, required: false, schema: { type: string, minLength: 1, maxLength: 120 }, description: 'Case-insensitive name search (ILIKE %q%) inside the visible subtree; ignores parentId.' }
      responses:
        '200': { description: Org-unit nodes, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitNodeListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — a member without READ_ORG_UNIT_MEMBERS, or a parentId outside the caller''s subtree', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'ORG_UNIT_NOT_FOUND — no visibility for the caller (non-member) or a parentId that is not visible', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [admin]
      operationId: createOrgUnit
      summary: Create an org unit (a root when parentId is null)
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch B; D-1115). The writer maintains `path` and `depth` in the
        same transaction as `parent_id` (design §3.1: `path` is a materialized index,
        `parent_id` is the truth). Each path label is a UUID **with the hyphens removed**
        (D-1116) — on this PG major the database would accept the hyphenated form, so the V163
        CHECK is what keeps one spelling, not the type itself.

        Gates: the same scope resolution as the read face, then `MANAGE_ORG_UNITS` (design §4.2).
        Sibling names are unique per parent (`NULLS NOT DISTINCT`, so two roots cannot share a
        name) ⇒ a clash is `409`, never a silent second row (D-1116: a UI hint cannot repair two
        units with one name).
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Not part of org-unit addressing; accepted only so a shared client header can be echoed. Ignored server-side (org units carry no workspace).' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitCreateRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitCreatedResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — no MANAGE_ORG_UNITS within the caller''s scope', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'ORG_UNIT_NOT_FOUND — parentId not visible to the caller', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'ORG_UNIT_NAME_CONFLICT — a sibling of that parent already uses this name', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/org-units/{unitId}/members:
    get:
      tags: [admin]
      operationId: listOrgUnitMembers
      summary: List the humans and agent principals attached to one org unit
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch A; D-1115). Same two gates and same order as
        `GET /api/v1/org-units`: scope (member subtree / instance-level reader), then the atom
        `READ_ORG_UNIT_MEMBERS`. A **non-member** gets `404 ORG_UNIT_NOT_FOUND` for any unit
        id, existing or not (design §4.3 — no existence leak); a **member** reading outside their
        subtree gets `403 FORBIDDEN` (a sibling unit is known to exist to a member, and the
        design says 403 there, not 404).

        `includeDescendants=false` (default) lists members whose `org_unit_members.org_unit_id`
        is that unit; `true` lists the whole subtree (`path <@ unit.path`) — equivalent because
        `P ∈ subtree(U) ⇔ P.unit.path <@ U.path` (design §4.1.1).

        Humans and agent principals are **one table** (`member_kind` tells them apart, M3-2). This
        endpoint never returns a workspace, a role or a permission: a subject's atoms are visible
        only through `GET /api/v1/me/permissions` for that subject's own caller.
      parameters:
        - { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: includeDescendants, required: false, schema: { type: boolean, default: false }, description: 'true ⇒ members of the whole subtree (path <@ unit.path), false ⇒ that unit only.' }
      responses:
        '200': { description: Members of the unit, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitMemberListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — a member without READ_ORG_UNIT_MEMBERS, or a unit outside the caller''s subtree', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'ORG_UNIT_NOT_FOUND — no visibility (non-member) or an unknown unit id', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/org-units/{unitId}:
    patch:
      tags: [admin]
      operationId: renameOrgUnit
      summary: Rename an org unit
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch B; D-1115). Rename only — a rename does not touch `path`
        (labels are UUIDs, not names, so the tree shape is untouched by construction). Gates:
        scope + `MANAGE_ORG_UNITS`; sibling-name uniqueness as on create ⇒ `409`.
      parameters:
        - { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitRenameRequest' } } } }
      responses:
        '200': { description: Renamed node, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitNode' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'ORG_UNIT_NOT_FOUND — unknown or not visible', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'ORG_UNIT_NAME_CONFLICT — a sibling already uses this name', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/org-units/{unitId}/parent:
    put:
      tags: [admin]
      operationId: moveOrgUnit
      summary: Move an org unit under a new parent (rejects rings with 422)
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch B; D-1115). The move rewrites `parent_id`, `path` (every
        descendant's prefix) and `depth` (every descendant's depth) in one transaction: `path`
        is a materialized index, so a move that forgets the subtree leaves a tree whose queries
        and its own rows disagree.

        A ring is refused **twice**, and the two refusals are not equivalent: the V165 trigger
        (`trg_org_units_reject_cycle`) raises SQLSTATE `XH001` inside the same statement, so a
        ring cannot be committed by a code path that forgot the check; the service then translates
        that trigger refusal into `422 ORG_UNIT_CYCLE`. The service-side pre-check exists only to
        keep the message readable — it never replaces the trigger.
      parameters:
        - { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitMoveRequest' } } } }
      responses:
        '200': { description: Moved node, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitNode' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'ORG_UNIT_NOT_FOUND — unknown or not visible', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'ORG_UNIT_NAME_CONFLICT — the destination parent already has a child of this name', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '422': { description: 'ORG_UNIT_CYCLE — the destination is this unit or one of its descendants (refused by trg_org_units_reject_cycle, never committed)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/org-units/{unitId}/members/{memberId}:
    put:
      tags: [admin]
      operationId: moveOrgUnitMember
      summary: "Add or move one human/agent into an org unit (G1: affected workspaces + audit + confirmation)"
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 batch C + M2-10b G1 (D-1115, D-1089). One row moves; nothing else is
        written. Because "the permission follows the person" is an accepted consequence
        (design §4.6), a move can silently change what atoms the subject holds — and every
        `WS_OWNER` workspace it owns stays byte-identical, so the drift is invisible unless the
        response says so.

        Therefore **G1**: the response always carries `affectedWorkspaceIds` (the workspaces
        where that subject is `WS_OWNER`); the field **must appear even when the array is empty**
        (a missing field and an empty array are indistinguishable to a client that JSON-decodes
        structurally, and "no affected workspaces" is a real answer, not an absence). When the
        array is **non-empty**, the call requires `confirmAffected: true`; without it the
        endpoint answers `409 ORG_UNIT_MOVE_CONFIRMATION_REQUIRED` and **nothing changed** —
        the `org_unit_members` row is untouched and the `audit_logs` row count is unchanged
        (`verify.md` V2-11 ③). The audit row (`org_membership_moved`, fields `memberId` /
        `fromOrgUnitId` / `toOrgUnitId` / `affectedWorkspaceIds`) is written **in the same
        transaction** as the move: a move that is not audited cannot happen.
      parameters:
        - { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: memberId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: memberKind, required: true, schema: { type: string, enum: [human, agent_principal] }, description: 'org_unit_members.member_kind of the member being placed.' }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitMemberMoveRequest' } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitMemberMoveResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'ORG_UNIT_NOT_FOUND — unit not visible to the caller', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'ORG_UNIT_MOVE_CONFIRMATION_REQUIRED — affectedWorkspaceIds is non-empty and confirmAffected was not true; the member row and the audit count are unchanged', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [admin]
      operationId: removeOrgUnitMember
      summary: Remove one human/agent from an org unit
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch C; D-1115). Deletes the `org_unit_members` row; the subject keeps
        every grant it holds through other subjects (bindings are never rewritten here). Gates:
        scope + `MANAGE_ORG_UNIT_MEMBERS`. Removing a member who is not in this unit is
        `404 ORG_UNIT_MEMBER_NOT_FOUND` (the pair is the identity), not a silent 204.
      parameters:
        - { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: memberId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: memberKind, required: true, schema: { type: string, enum: [human, agent_principal] } }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'ORG_UNIT_NOT_FOUND or ORG_UNIT_MEMBER_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/org-units/{unitId}/role-bindings:
    put:
      tags: [admin]
      operationId: replaceOrgUnitRoleBindings
      summary: Replace an org unit's role bindings as one set
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0773 M2-11 (batch C; D-1115, D-1118). Whole-set write (`org_unit_role_bindings`):
        the body is the complete role set of that unit, not a delta — a delta cannot express
        "remove everything", and two clients sending deltas would each see the other's rows.

        **Fail closed on non-governance roles**: org-unit grants are projected as *instance*-scope
        grants (design §4.1.1), so a role carrying a workspace-content atom would spread to every
        workspace the member can reach. Roles whose atom set is not inside the governance whitelist
        are therefore refused with `409 ORG_SCOPE_ROLE_FORBIDDEN` — and an **unknown** role is
        refused too (unknown is not empty, and an empty set would silently grant nothing while
        looking like a stored binding).
      parameters:
        - { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitRoleBindingReplaceRequest' } } } }
      responses:
        '200': { description: Stored set, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUnitRoleBindingListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'ORG_UNIT_NOT_FOUND — unit not visible to the caller', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { $ref: '#/components/responses/OrgScopeRoleForbidden' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    WorkspaceContextRequired:
      description: '409 WORKSPACE_CONTEXT_REQUIRED — the caller is authenticated but no workspace context was resolved (no active workspace yet after a blank start, or several workspaces and none named via X-Workspace-Id or the path). This is a request-state conflict, never a 401: credential failures keep answering 401 AUTHORIZATION_REQUIRED.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Problem:
      description: RFC 9457 Problem Details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    PluginRateLimited:
      description: '429 from the plugin data plane (PLAN-0691 T1.5). PLUGIN_RATE_LIMITED means a per-binding limit refused the call (the binding rate/burst/concurrency governor, or on the records face a statement that exceeded the plugin statement timeout QUOTA-13), and it carries Retry-After; PLUGIN_KV_QUOTA_EXCEEDED and PLUGIN_RECORDS_QUOTA_EXCEEDED mean the binding is at its key, TTL or document budget. The backend is healthy — the caller is over a per-binding limit, so it is never a 503.'
      headers:
        Retry-After:
          description: Seconds before the caller should retry (set on PLUGIN_RATE_LIMITED)
          schema: { type: integer, minimum: 1 }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    RateLimited:
      description: AUTH_RATE_LIMITED — too many attempts; retry after the header delay
      headers:
        Retry-After:
          description: Seconds before the caller should retry
          schema: { type: integer, minimum: 1 }
        Cache-Control:
          description: Always no-store for a throttle response
          schema: { type: string, enum: [no-store] }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    ResourceExhausted:
      description: 'RESOURCE_EXHAUSTED — the resource governor refused admission (connection/model concurrency, queue depth or window token budget). Fast refusal, never a queue wait and never a 503: the backend is healthy, the caller is over its limit. Retry after the Retry-After delay or use another connection. The Retry-After header and body.retryAfterSeconds always carry the same value.'
      headers:
        Retry-After:
          description: Seconds before the caller should retry (same value as body.retryAfterSeconds)
          schema: { type: integer, minimum: 1 }
        Cache-Control:
          description: Always no-store for a throttle response
          schema: { type: string, enum: [no-store] }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ResourceExhaustedProblem' } } }
    OrgScopeRoleForbidden:
      description: >-
        409 ORG_SCOPE_ROLE_FORBIDDEN — the role's action-atom set is not inside the org-unit
        governance whitelist, so the binding is refused (fail closed: an unknown role is not an
        empty one) — D-1118. Referenced by `PUT /api/v1/org-units/{unitId}/role-bindings` (PLAN-0773 M2-11 batch C).
        The refusal is fail closed on the role's atom set, never a role-name special case (D-1118).
        It is declared here so a client can branch on status + code (never on detail text) before
        that endpoint exists.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    OrgUnitNode:
      type: object
      additionalProperties: false
      required: [id, name, parentId, depth, hasChildren]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        parentId: { type: [string, 'null'], format: uuid, description: 'null for a root unit.' }
        depth: { type: integer, minimum: 0, description: '0 for a root, parent depth + 1 otherwise (org_units.depth, a materialized index beside parent_id).' }
        hasChildren: { type: boolean, description: 'true when at least one unit has parent_id = this id — lets a tree UI decide whether expanding is worth a request.' }
    OrgUnitNodeListResponse:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes: { type: array, items: { $ref: '#/components/schemas/OrgUnitNode' } }
    OrgUnitMemberView:
      type: object
      additionalProperties: false
      required: [memberKind, memberId, orgUnitId, displayName]
      properties:
        memberKind: { type: string, enum: [human, agent_principal], description: 'org_unit_members.member_kind. Humans and agent principals share one table and are told apart by this tag (M3-2).' }
        memberId: { type: string, format: uuid }
        orgUnitId: { type: string, format: uuid, description: 'The unit the member sits in; org_unit_members rows are unique per (memberKind, memberId), so one subject sits in at most one unit.' }
        displayName: { type: [string, 'null'], description: 'Human: users.username (email when the username is blank); agent principal: agent_principals.name. null when the referenced subject row is gone (the membership row is not cascaded away).' }
    OrgUnitMemberListResponse:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members: { type: array, items: { $ref: '#/components/schemas/OrgUnitMemberView' } }
    OrgUnitCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: 'Trimmed server-side; the trimmed value is what the sibling uniqueness rule sees.' }
        parentId: { type: [string, 'null'], format: uuid, description: 'null or absent ⇒ a root unit.' }
    OrgUnitCreatedResponse:
      type: object
      additionalProperties: false
      required: [id, path]
      properties:
        id: { type: string, format: uuid }
        path: { type: string, description: 'The de-hyphenated ltree path (D-1116). A materialized index, not a second source of truth: parent_id decides the shape and the writer keeps them agreeing.' }
    OrgUnitRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    OrgUnitMoveRequest:
      type: object
      additionalProperties: false
      required: [parentId]
      properties:
        parentId: { type: [string, 'null'], format: uuid, description: 'New parent; null promotes the unit to a root. This unit or one of its descendants ⇒ 422 ORG_UNIT_CYCLE.' }
    OrgUnitMemberMoveRequest:
      type: object
      additionalProperties: false
      properties:
        confirmAffected: { type: boolean, default: false, description: 'Required true when affectedWorkspaceIds is non-empty: the caller states it understands the subject''s WS_OWNER workspaces are affected by the move. Absent or false with a non-empty list ⇒ 409 ORG_UNIT_MOVE_CONFIRMATION_REQUIRED and no write.' }
    OrgUnitMemberMoveResponse:
      type: object
      additionalProperties: false
      required: [memberId, fromOrgUnitId, toOrgUnitId, affectedWorkspaceIds, auditEvent]
      properties:
        memberId: { type: string, format: uuid }
        fromOrgUnitId: { type: [string, 'null'], format: uuid, description: 'null when the subject was not in any unit before this call (a first placement, not a move).' }
        toOrgUnitId: { type: string, format: uuid }
        affectedWorkspaceIds: { type: array, items: { type: string, format: uuid }, description: 'G1: workspaces where this subject holds WS_OWNER. **Always present, empty array included** — an empty array is an answer ("no workspace is affected"), a missing field is a contract break.' }
        auditEvent: { type: string, enum: [org_membership_moved], description: 'The audit action written in the same transaction as the move.' }
    OrgUnitRoleBindingReplaceRequest:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        roleIds: { type: array, items: { type: string, format: uuid }, description: 'The complete role set of the unit; an empty array clears it (this is why the write is a whole-set PUT).' }
    OrgUnitRoleBindingListResponse:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        roleIds: { type: array, items: { type: string, format: uuid }, description: 'The stored set, ordered by role id so two reads of unchanged data are byte-identical.' }
    ConversationThreadCreateRequest:
      type: object
      required: [scopeType, scopeId]
      additionalProperties: false
      properties:
        scopeType: { type: string, enum: [user, agent, workspace] }
        scopeId: { type: string, format: uuid }
        title: { type: [string, 'null'], maxLength: 255 }
    ConversationThreadAttachRequest:
      type: object
      required: [sessionId]
      additionalProperties: false
      properties:
        sessionId: { type: string, format: uuid }
    ConversationThreadSession:
      type: object
      required: [id, title, workspaceId, userId, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        workspaceId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ConversationThread:
      type: object
      required: [id, scopeType, scopeId, createdByUserId, createdAt, updatedAt, sessions]
      properties:
        id: { type: string, format: uuid }
        scopeType: { type: string, enum: [user, agent, workspace] }
        scopeId: { type: string, format: uuid }
        createdByUserId: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sessions: { type: array, items: { $ref: '#/components/schemas/ConversationThreadSession' } }
    ConversationThreadAttachResult:
      allOf:
        - { $ref: '#/components/schemas/ConversationThread' }
        - type: object
          required: [attachedSessionId, changed]
          properties:
            attachedSessionId: { type: string, format: uuid }
            changed: { type: boolean }
    ContextFingerprintView:
      type: object
      description: |
        PLAN-0666 read-side envelope (assertion A1). `available=false` means no stored document
        exists — it is never re-encoded as `disabled`/`error`.
      required: [runId, available]
      properties:
        runId: { type: string, format: uuid }
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [pre_plan, not_dispatched]
          description: Present iff `available=false`. `not_dispatched` is read-side only.
        fingerprint:
          oneOf: [{ $ref: '#/components/schemas/ContextFingerprint' }, {type: 'null'}]
    ContextFingerprint:
      type: object
      description: |
        Stored document (assertion A1): `status` is exactly one of `ok`/`disabled`/`error`;
        `disabled` is the only state with `enabled=false`; `error` stays enabled (fail-open).
      required: [enabled, status]
      properties:
        enabled: { type: boolean }
        status: { type: string, enum: [ok, disabled, error] }
        reason: { type: [string, 'null'], enum: [workspace_disabled] }
        reasonCode: { type: [string, 'null'], description: 'Closed set, e.g. HASH_FAILED.' }
        algo: { type: string, example: sha256 }
        dispatchAttempt: { type: integer, minimum: 1, description: 'v1 is always 1 (first dispatch only).' }
        layers:
          type: object
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/ContextFingerprintLayer'
              - $ref: '#/components/schemas/ContextFingerprintUnavailableLayer'
        outbound:
          oneOf:
            - $ref: '#/components/schemas/ContextFingerprintLayer'
            - $ref: '#/components/schemas/ContextFingerprintUnavailableLayer'
    ContextFingerprintLayer:
      type: object
      required: [hash, count, bytes]
      properties:
        hash: { type: string, description: sha256 hex over canonical JSON. }
        count: { type: integer }
        bytes: { type: integer }
        templateId: { type: string }
        version: { type: integer }
        layer: { type: string }
    ContextFingerprintUnavailableLayer:
      type: object
      required: [unavailable]
      properties:
        unavailable: { type: string, description: 'Closed reasons: agent_side | not_provided.' }
    ContextFingerprintDiffView:
      type: object
      required: [againstRunId, runId, status]
      properties:
        againstRunId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        status: { type: string, enum: [comparable, unavailable] }
        sides:
          type: array
          items:
            type: object
            properties:
              side: { type: string, enum: [against, current] }
              reason: { type: [string, 'null'] }
              status: { type: [string, 'null'] }
        layers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ContextFingerprintLayerDiff' }
        outbound:
          type: object
          properties:
            status: { type: string, enum: [unchanged, changed, added, removed, unavailable, absent] }
            bytesDelta: { type: integer }
        dispatchAttempt:
          type: object
          properties:
            against: { type: integer }
            current: { type: integer }
        summary:
          type: object
          properties:
            changedLayers: { type: array, items: { type: string } }
            unavailableLayers: { type: array, items: { type: string } }
    ContextFingerprintLayerDiff:
      type: object
      required: [layer, status]
      description: 'Assertion A2: unavailable is never downgraded to unchanged.'
      properties:
        layer: { type: string }
        status:
          type: string
          enum: [unchanged, 'changed(sameShape)', 'changed(grew)', 'changed(shrank)', added, removed, unavailable, absent]
        countDelta: { type: integer }
        bytesDelta: { type: integer }
        againstReason: { type: [string, 'null'] }
        currentReason: { type: [string, 'null'] }
    ProviderRequestFingerprintView:
      type: object
      description: |
        PLAN-0679 read-side envelope (design D5). `available=false` means no row was ever
        persisted — it is reported as `not_captured`, never re-encoded as `disabled`/`error`.
      required: [runId, available]
      properties:
        runId: { type: string, format: uuid }
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [not_captured]
          description: Present iff `available=false`; read-side synthetic state.
        fingerprint:
          oneOf:
            - $ref: '#/components/schemas/ProviderRequestFingerprintDocument'
            - $ref: '#/components/schemas/ProviderRequestFingerprintErrorMarker'
            - {type: 'null'}
        request:
          oneOf: [{ $ref: '#/components/schemas/ProviderRequestFingerprintMetadata' }, {type: 'null'}]
    ProviderRequestFingerprintDocument:
      type: object
      description: |
        Stored six-layer diagnostic (design 4.2), verbatim as the Agent produced it. Only
        hash/count/bytes per layer plus the outbound calibration — never prompt content.
      required: [algo, dispatchAttempt, providerStep, layers, outbound]
      properties:
        algo: { type: string, enum: [sha256] }
        dispatchAttempt: { type: integer, minimum: 1, description: 'v1 is always 1 (first dispatch only, design D2).' }
        providerStep: { type: integer, minimum: 1, description: 'v1 is always 1; per-step rows are v2 (B-6).' }
        layers:
          type: object
          description: Keys are the fixed layer set systemTemplate/history/userInput/toolSchema/config.
          additionalProperties: { $ref: '#/components/schemas/ProviderRequestFingerprintLayer' }
        outbound: { $ref: '#/components/schemas/ProviderRequestFingerprintLayer' }
    ProviderRequestFingerprintLayer:
      type: object
      required: [hash, bytes]
      properties:
        hash: { type: string, description: 'sha256 hex over canonical JSON (Python-side, design D3).' }
        bytes: { type: integer }
        count:
          type: [integer, 'null']
          description: Present only where a count is meaningful (history, toolSchema, outbound).
    ProviderRequestFingerprintErrorMarker:
      type: object
      description: |
        Agent fail-open marker stored when the payload exceeded the 8 KB cap (design 4.3). The
        read side reports it as `unavailable` with `reasonCode`, never as `unchanged`.
      required: [status]
      properties:
        status: { type: string, enum: [error] }
        reasonCode: { type: string, description: 'Closed set, e.g. FINGERPRINT_TOO_LARGE.' }
    ProviderRequestFingerprintMetadata:
      type: object
      description: |
        Request metadata persisted next to the document (design 4.3). Diagnostic counts and
        identity only — measured by the Agent, never re-derived by CP; no prompt content.
      required: [apiTypeId, model, messageCount, toolCount, bytesTotal]
      properties:
        apiTypeId: { type: string, example: openai-chat-completions }
        apiTypeVersion: { type: [integer, 'null'] }
        model: { type: string, description: 'Agent-resolved model actually dispatched (incl. overrides).' }
        messageCount: { type: integer }
        toolCount: { type: integer }
        bytesTotal: { type: integer, format: int64 }
        dispatchAttempt: { type: integer, minimum: 1 }
        providerStep: { type: integer, minimum: 1 }
        roleHistogram:
          type: object
          description: 'Count per textual role only (e.g. {"user":2}); never message bodies.'
          additionalProperties: { type: integer }
        systemSources:
          type: object
          description: 'Source summary (template id/version, slot fill state, component counts).'
    ProviderRequestFingerprintDiffView:
      type: object
      required: [againstRunId, runId, status]
      properties:
        againstRunId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        status: { type: string, enum: [comparable, unavailable] }
        against: { $ref: '#/components/schemas/ProviderRequestFingerprintMetadata' }
        current: { $ref: '#/components/schemas/ProviderRequestFingerprintMetadata' }
        sides:
          type: array
          items:
            type: object
            properties:
              side: { type: string, enum: [against, current] }
              reason: { type: [string, 'null'], description: 'Present when the side has no row (not_captured).' }
              status: { type: [string, 'null'] }
              reasonCode: { type: [string, 'null'] }
        layers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ProviderRequestFingerprintLayerDiff' }
        outbound: { $ref: '#/components/schemas/ProviderRequestFingerprintLayerDiff' }
        dispatchAttempt:
          type: object
          properties:
            against: { type: integer }
            current: { type: integer }
        summary:
          type: object
          properties:
            changedLayers: { type: array, items: { type: string } }
            unavailableLayers: { type: array, items: { type: string } }
    ProviderRequestFingerprintLayerDiff:
      type: object
      required: [status]
      description: 'Design 4.4: an unavailable side is never downgraded to unchanged.'
      properties:
        layer: { type: [string, 'null'] }
        status:
          type: string
          enum: [unchanged, 'changed(sameShape)', 'changed(grew)', 'changed(shrank)', added, removed, unavailable, absent]
        countDelta: { type: [integer, 'null'], description: Present only when both sides carry a count. }
        bytesDelta: { type: [integer, 'null'] }
        againstReason: { type: [string, 'null'] }
        currentReason: { type: [string, 'null'] }
    UserCapabilities:
      type: object
      description: 'PLAN-0610 W3-2b: binding-backed capability projection that replaces the retired role string (decision #22).'
      properties:
        isInstanceAdmin: { type: boolean }
        isInstanceSuper: { type: boolean }
        workspaceAdminOf: { type: array, items: { type: string, format: uuid } }
    MePermissionsAtom:
      type: object
      description: 'task-415 (RBAC P1-1): one effective atom, grouped by (actionClass, resource) — before task-415 the projection emitted one entry per grant row, so the same atom could appear twice. Every grant that produces it is listed in sources (the hit-source audit the permission-face rule asks for).'
      properties:
        actionClass: { type: string }
        resource: { type: string, description: '"*" when the atom is wildcard-scoped' }
        sources: { type: array, items: { $ref: '#/components/schemas/MePermissionsAtomSource' }, description: 'Every materialized grant row that yields this atom, in evaluation order. Never empty for a listed atom.' }
    MePermissionsAtomSource:
      type: object
      description: 'task-415: where one effective atom came from. source is the grant provenance (role / spawn / template / credential_binding / agent_default); roleName is the bound role for source=role; grantId addresses the durable row for audit.'
      properties:
        source: { type: string }
        roleName: { type: [string, 'null'] }
        scopeType: { type: string, enum: [instance, workspace] }
        scopeId: { type: [string, 'null'], format: uuid }
        grantId: { type: string, format: uuid }
    MePermissionsWorkspace:
      type: object
      properties:
        workspaceId: { type: string, format: uuid }
        workspaceRole: { type: [string, 'null'] }
        workspaceAdmin: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/MePermissionsAtom' } }
    MePermissions:
      type: object
      properties:
        userId: { type: string, format: uuid }
        instanceCapabilities: { type: array, items: { type: string }, description: 'capability atoms such as instance:super / instance:admin' }
        instancePermissions: { type: array, items: { $ref: '#/components/schemas/MePermissionsAtom' } }
        workspaces: { type: array, items: { $ref: '#/components/schemas/MePermissionsWorkspace' } }
    GetConfigWithMeta:
      type: object
      required: [domain, entries, envOverridden]
      properties:
        domain: { type: string }
        entries: { type: object, additionalProperties: { type: string }, description: 'Key -> string value of the selected/merged view; unit-domain values (llm-provider / embedding / agent-templates / api-request-templates) are JSON strings.' }
        envOverridden: { type: object, additionalProperties: { type: string }, description: 'Key -> env-effective value for keys an env overlay wins.' }
    ConfigMetaView:
      type: object
      required: [domain, layer, keys]
      properties:
        domain: { type: string }
        layer: { type: string, enum: [instance, user, workspace, workspace-default] }
        keys: { type: array, items: { $ref: '#/components/schemas/ConfigKeyMeta' } }
    ConfigKeyMeta:
      type: object
      required: [key, source, locked, writable, reason, instanceEligible, defaultPresent, overridable, adminLocked]
      properties:
        key: { type: string }
        source: { type: string, description: 'Resolved provenance of the value (instance|user|workspace-default|workspace|env|default).' }
        locked: { type: boolean }
        writable: { type: boolean }
        reason: { type: [string, 'null'], enum: [ENV_LOCKED, ADMIN_LOCKED, LAYER_NOT_WRITABLE, null], description: 'Why a key is not writable in this layer; null when writable. CP also defines INSTANCE_ONLY internally, but instance-only keys are filtered out of non-instance layers, so that value is not observable today.' }
        instanceEligible: { type: boolean, description: 'Only meaningful on the instance layer: true when the domain is not an instance-dedicated domain.' }
        defaultPresent: { type: boolean }
        overridable: { type: boolean, description: 'Instance layer only: false => the key is INSTANCE_ONLY (ceiling) or the domain is instance-only, so the user/workspace layer cannot override it.' }
        adminLocked: { type: boolean, description: 'PLAN-0556 administrator lock.' }
        lockReason: { type: [string, 'null'] }
    ConfigWriteResult:
      type: object
      required: [status, keys]
      properties:
        status: { type: string, enum: [ok] }
        keys: { type: integer, minimum: 0, description: 'Number of top-level keys written.' }
    ConfigImportReport:
      type: object
      required: [status, imported, skipped, warnings]
      properties:
        status: { type: string, enum: [ok] }
        imported: { type: integer, description: 'Number of values imported.' }
        skipped: { type: integer, description: 'Number of values skipped (env-locked keys and invalid entries).' }
        warnings: { type: array, items: { type: string } }
    AuthUser:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        name: { type: [string, 'null'] }
        workspaceId: { type: [string, 'null'], format: uuid, description: 'First active workspace of the account, or null while it has none (PLAN-0614 decision #2).' }
        capabilities: { $ref: '#/components/schemas/UserCapabilities' }
    UserAdminView:
      type: object
      description: 'PLAN-0581 admin view of an account (list rows and detail share the shape). Deliberately carries no password_hash, token_version or session_version.'
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string }
        name: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/UserCapabilities' }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        deletedAt: { type: [string, 'null'], format: date-time, description: 'non-null only on a soft-deleted row' }
        createdAt: { type: string, format: date-time }
    UserAdminPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserAdminView' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    UserCreateRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        username: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z\u4e00-\u9fff][A-Za-z0-9\u4e00-\u9fff]*$', description: 'optional; v29 (2026-11-04) name rule shared with agent subject names: letters any case / Chinese characters / digits, must not start with a digit, no spaces or symbols, 1-32 chars; derived from the email when absent; invalid shape is 400 USERNAME_INVALID' }
        password: { type: string, description: 'optional; when absent the server generates a one-time password' }
        name: { type: string }
    UserCreatedResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserAdminView' }
        temporaryPassword: { type: string, description: 'present exactly once, and only when the caller did not supply a password' }
    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
    UserPasswordResetResponse:
      type: object
      properties:
        temporaryPassword: { type: string, description: 'one-time plaintext; never logged, audited or persisted' }
    InstanceOwnerView:
      type: object
      description: 'PLAN-0580 owner pointer. Deliberately carries no account identifiers (no username/email/name): the users surface is ADMIN-only.'
      properties:
        ownerUserId: { type: [string, 'null'], format: uuid, description: 'null when the instance has no ADMIN yet' }
        assignedAt: { type: [string, 'null'], format: date-time, description: 'ISO-8601 instant; null together with ownerUserId' }
        isCurrentUser: { type: boolean, description: 'true when the requesting principal is the current owner' }
    InstanceOwnerTransferRequest:
      type: object
      required: [targetUserId, password]
      properties:
        targetUserId: { type: string, format: uuid }
        password: { type: string, description: 'The current owner''s login password (re-authentication, never stored or logged)' }
        reason: { type: string, maxLength: 200, description: 'PLAN-0767 M1-5: required only on the emergency face (unowned instance or unusable owner pointer); audited verbatim as part of instance_owner_emergency_transferred and ignored on the normal owner-to-owner transfer.' }
    InstanceIdentityView:
      type: object
      additionalProperties: false
      required: [instanceId, createdAt]
      description: 'PLAN-0767 M1 (D-935): the immutable deployment identity. instanceId is the anchor for instance-layer resources, createdAt is its first-boot instant, schemaVersion is the nullable Flyway schema version (null during M1, filled from M2). Module versions come from GET /api/v1/version; ownerPrincipalId and the boot-time env override state are deliberately absent (spec §5 / §8.3).'
      properties:
        instanceId: { type: string, format: uuid, description: 'Immutable UUID; the database row is the authority (env only seeds the first boot)' }
        createdAt: { type: string, format: date-time, description: 'First-boot instant when the identity row was written' }
        schemaVersion: { type: [string, 'null'], description: 'Flyway schema version; null during M1 (not reported yet) and filled from M2 — null is not an error' }
    RoleAtomView:
      type: object
      description: 'PLAN-0610 W3-2a: one permission atom of the access-role vocabulary, projected from PermissionAtomCatalog (the SSOT). scopeClass=instance atoms may only be bound at instance scope; scopeClass=both atoms are bindable in either scope (decision #27).'
      properties:
        name: { type: string }
        scopeClass: { type: string, enum: [instance, both] }
        capability: { type: boolean, description: 'true for instance:super / instance:admin / workspace:admin — resolved as cap:<atom> authorities, never materialized (decision #23)' }
        resource: { type: string, description: 'Canonical resource pattern of a wildcard atom (* or credential:*)' }
        displayName: { type: string, description: 'PLAN-0651 D51-37: human label resolved server-side from ?locale (zh-CN default, en-US supported). Always non-empty; the UI renders this instead of the wire name so it keeps no atom vocabulary of its own.' }
        agentPrincipalForbidden: { type: boolean, description: 'task-415 (RBAC P0-1): true when AGENT_FORBIDDEN_ATOMS contains this atom, i.e. it can never be bound to an agent principal (the only-subtract cap). PermissionAtomCatalog already computed it; before task-415 the view dropped it, so a binding UI could offer a role the CP would refuse. The UI pre-disables instead of walking into the refusal.' }
    RoleCatalogView:
      type: object
      required: [atoms, scopes, defaultGrants]
      description: 'PLAN-0610 W3-2a + task-415 (RBAC P1-2): the atom vocabulary, the bindable scopes, and the built-in default grant sets (SystemAccessRoleCatalog.roleSeeds) so the page can answer "who gets a new atom by default" without reading code.'
      properties:
        atoms: { type: array, items: { $ref: '#/components/schemas/RoleAtomView' } }
        scopes: { type: array, items: { type: string, enum: [instance, workspace] } }
        defaultGrants: { type: array, items: { $ref: '#/components/schemas/RoleDefaultGrantView' }, description: 'The seeded default grant set per built-in role, in catalog order (instance tier first). These are the code-level seeds, not the live DB rows: /roles lists the rows, this lists what a fresh install grants.' }
    RoleDefaultGrantView:
      type: object
      required: [roleName, displayName, atoms]
      properties:
        roleName: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        atoms: { type: array, items: { type: string }, description: 'Atom names of the seed set (capability atoms included), in seed order.' }
    RoleView:
      type: object
      description: 'PLAN-0610 W3-2a: a role definition with its atom set and how many bindings reference it.'
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        system: { type: boolean, description: 'Seeded by V87; only the display name is editable' }
        atoms: { type: array, items: { $ref: '#/components/schemas/RoleAtomView' } }
        bindingCount: { type: integer, minimum: 0 }
    RoleCreateRequest:
      type: object
      required: [name, atoms]
      properties:
        name: { type: string, description: 'Matches ^[A-Z][A-Z0-9_]{1,63}$ (V87 ck_roles_name_format); 400 INVALID_ROLE_NAME otherwise' }
        displayName: { type: [string, 'null'], description: 'Defaults to name; 1..200 characters' }
        description: { type: [string, 'null'] }
        atoms: { type: array, minItems: 1, items: { type: string } }
    RoleUpdateRequest:
      type: object
      description: 'Every field is optional; null/absent means unchanged. On a system role only displayName may be present.'
      properties:
        name: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        atoms: { type: array, minItems: 1, items: { type: string } }
    BindingView:
      type: object
      description: 'PLAN-0610 W3-2a: one role binding row with the role name resolved.'
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [user] }
        subjectId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        grantedBy: { type: [string, 'null'], format: uuid }
        grantedAt: { type: string, format: date-time }
    BindingSetView:
      type: object
      required: [scopeType, bindings]
      properties:
        scopeType: { type: string, enum: [instance, workspace] }
        scopeId: { type: [string, 'null'], format: uuid, description: 'Null for the instance scope' }
        bindings: { type: array, items: { $ref: '#/components/schemas/BindingView' } }
    BindingReplaceRequest:
      type: object
      required: [bindings]
      description: 'The complete desired set for the scope; send an empty array to clear it.'
      properties:
        bindings:
          type: array
          items:
            type: object
            required: [subjectId, roleId]
            properties:
              subjectType: { type: string, enum: [user], description: 'Optional; must be user when present' }
              subjectId: { type: string, format: uuid }
              roleId: { type: string, format: uuid }
    ContextEventReadView:
      type: object
