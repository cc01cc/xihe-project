        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: Paginated user operations (redacted), content: { application/json: { schema: { $ref: '#/components/schemas/UserOperationListResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
