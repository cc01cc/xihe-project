      type: object
      additionalProperties: false
      required: [sessionId, mode, sessionRules]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
        sessionRules: { type: integer, minimum: 0 }
    PolicyModeUpdateRequest:
      type: object
      required: [sessionId, mode]
      properties:
        sessionId: { type: string, format: uuid }
