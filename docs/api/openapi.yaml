            spawnedFromSessionId: { type: string, format: uuid, description: Lineage only; not an authorization root. }
            spawnedFromRunId: { type: string, format: uuid, description: Lineage only; not an authorization root. }
            spawnedAt: { type: string, format: date-time }
    SessionCreateRequest: { type: object, required: [agentPrincipalId], properties: { title: { type: [string, 'null'] }, modelProvider: { type: [string, 'null'] }, modelName: { type: [string, 'null'] }, providerConnectionId: { type: [string, 'null'] }, agentPrincipalId: { type: string, format: uuid }, contextTemplateLayer: { type: string, enum: [instance, user, workspace], description: Optional explicit Context Template selection; all three fields must be supplied together, otherwise the server applies its default resolution. }, contextTemplateId: { type: string, format: uuid }, contextTemplateVersion: { type: integer, minimum: 1 } } }
    SessionForkRequest: { type: object, additionalProperties: false, required: [sourceBranchId, anchorMessageId], properties: { sourceBranchId: { type: string, format: uuid }, anchorMessageId: { type: string, format: uuid } } }
    SessionBranchCreateRequest: { type: object, additionalProperties: false, required: [sourceBranchId, anchorMessageId], properties: { sourceBranchId: { type: string, format: uuid, description: Selected branch path used to validate anchor visibility. }, anchorMessageId: { type: string, format: uuid } } }
    SessionBranchListResponse: { type: object, additionalProperties: false, required: [sessionId, items], properties: { sessionId: { type: string, format: uuid }, items: { type: array, items: { $ref: '#/components/schemas/SessionBranch' } } } }
