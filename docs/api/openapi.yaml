        shape: { type: string, enum: [structured, interpreter, opaque] }
    ChatApprovalRequest:
      type: object
      additionalProperties: false
      description: CP-owned durable approval envelope used by live/replayed SSE events and ChatRun recovery. Details is a bounded preview; raw tool arguments are never included. Legacy rows may omit argumentsHash and state; when present they are preserved as emitted. `origin` is the durable creation provenance and is null for rows predating V25.
      required: [requestId, runId, sessionId, workspaceId, tool, action, details, expiresAt, replayed]
      properties:
        requestId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        tool: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        details: { type: string, minLength: 1 }
