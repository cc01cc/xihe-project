    AgentPrincipalCreateRequest: { type: object, additionalProperties: false, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z\u4e00-\u9fff][A-Za-z0-9\u4e00-\u9fff]*$', description: 'Agent subject name. 2026-11-03 name-format ruling: letters / Chinese characters (U+4E00-U+9FFF) / digits only, must not start with a digit, no spaces or symbols; any other shape is rejected with 400 INVALID_NAME_FORMAT (not the generic INVALID_REQUEST).' }, templateId: { type: [string, 'null'], format: uuid }, roleIds: { type: [array, 'null'], items: { type: string, format: uuid }, description: 'PLAN-0629 task-12 + D-174/V127: the roles the new principal is bound to. Absent or null means the defaults (instance seed `AGENT_USER` = the human USER registration base set; the former agent-forbidden creation atom was removed by BL-312, 2026-11-09; a workspace binding additionally gets WS_EDITOR). Every id is validated once before the row is written: an unknown id, an instance-administrator role (any atom in PermissionAtomCatalog.agentPrincipalForbiddenAtoms, e.g. ADMIN/SUPER_ADMIN), or a role wider than the caller itself holds is refused with 403 ROLE_NOT_GRANTABLE / 403 PRIVILEGE_ESCALATION — never a generic 400. The built-in delegation role for agent principals is AGENT_DELEGATOR (workspace scope, single atom SPAWN_AGENT, V109); WS_OWNER/WS_EDITOR deliberately do not carry SPAWN_AGENT.' }, defaultModelProvider: { type: [string, 'null'], description: 'Model intent only; the principal never holds a provider connection.' }, defaultModelName: { type: [string, 'null'] }, allowedModels: { type: [array, 'null'], items: { $ref: '#/components/schemas/AgentModelRef' }, description: 'null = unrestricted.' }, hooks: { type: [object, 'null'], description: 'PLAN-0625 M2 (D25-12/14): hook subscriptions {advisors:[{kind,on:[actionClass]}]}; on must hit the frozen action-class whitelist (today: approval.ask) or the write is rejected 400. A preset guard (origin=SYSTEM_PRESET) refuses subscription changes with 403 GUARD_HOOKS_IMMUTABLE.' } } }
    AgentPrincipalCreateView: { type: object, required: [principalId, createdAt, ownerUserId, defaultModelProvider, defaultModelName, allowedModels, roleIds], properties: { roleIds: { type: array, items: { type: string, format: uuid }, description: 'The bindings that were actually written (echo, so the caller does not have to re-read).' }, principalId: { type: string, format: uuid }, templateId: { type: [string, 'null'], format: uuid }, templateName: { type: [string, 'null'] }, ownerUserId: { type: [string, 'null'], format: uuid, description: 'D-174: the owner column (legacy owned rows keep their owner; creation never auto-owns) — null for owner-less shared rows.' }, defaultModelProvider: { type: [string, 'null'] }, defaultModelName: { type: [string, 'null'] }, allowedModels: { type: [array, 'null'], items: { $ref: '#/components/schemas/AgentModelRef' } }, createdAt: { type: string, format: date-time }, hooks: { type: [object, 'null'], description: 'PLAN-0625 M2: the stored subscription document {advisors:[{kind,on:[actionClass]}]} (null = none) — serialised as plain JSON (Gap J).' }, contextPolicy: { type: [object, 'null'], description: 'PLAN-0629 M1 (D29-21): the memory policy of the new principal (null = off). A create never sets it — the subject starts with memory off — but the view carries it so the caller sees the state immediately.' } } }
    AgentPrincipalView: { type: object, required: [principalId, name, createdAt, ownerUserId, defaultModelProvider, defaultModelName, allowedModels], properties: { principalId: { type: string, format: uuid }, name: { type: string }, templateId: { type: [string, 'null'], format: uuid }, templateName: { type: [string, 'null'] }, ownerUserId: { type: [string, 'null'], format: uuid }, defaultModelProvider: { type: [string, 'null'] }, defaultModelName: { type: [string, 'null'] }, allowedModels: { type: [array, 'null'], items: { $ref: '#/components/schemas/AgentModelRef' } }, createdAt: { type: string, format: date-time }, disabledAt: { type: [string, 'null'], format: date-time }, hooks: { type: [object, 'null'], description: 'PLAN-0625 V96/D25-09: the subscription document {advisors:[{kind,on:[actionClass]}]} — copied from the template at creation, mutable via PATCH /api/v1/agent-principals/{principalId}; null = no subscriptions. The runtime single-read surface for the approval gate.' }, contextPolicy: { type: [object, 'null'], description: 'PLAN-0629 M1 (D29-21/D29-25): the subject memory policy {memory:{enabled,writeMode,types}} stored in agent_principals.context_policy; null = no policy (memory off). See the PATCH /api/v1/agent-principals/{principalId} description for the frozen v1 shape and value rules.' }, delegationPolicy: { type: [object, 'null'], description: 'PLAN-0630 M1 + PLAN-0648 ruling A1: the delegation budget {maxCount,maxDepth} stored in agent_principals.delegation_policy (V100); null = code defaults (8/3). maxCount=0 means delegation disabled (every spawn_agent under this principal is refused with reason delegation_disabled); maxDepth stays >= 1. Only the root subject of a delegation tree is read at spawn time.' } } }
    AgentPrincipalListResponse: { type: object, required: [principals], properties: { principals: { type: array, items: { $ref: '#/components/schemas/AgentPrincipalView' } } } }
    AgentPrincipalUpdateRequest: { type: object, additionalProperties: false, minProperties: 1, description: 'PLAN-0625 M2 (D25-14) + PLAN-0629 M1 (D29-21) + PLAN-0630 M1: the subject-document update body. Every key is optional, at least one is required, and an explicit null clears that document while an absent key leaves it untouched. task-413 (G1 edit half): the model-intent triple is writable on this same PATCH. defaultModelProvider and defaultModelName are both-or-neither on the MERGED result (present key replaces, absent key keeps the stored value, explicit null clears), so changing only the model name is legal while clearing one half alone answers 400 INVALID_AGENT_PRINCIPAL. allowedModels is an array of {provider, model} (every entry needs both halves; an empty array clears the list). A preset guard (origin=SYSTEM_PRESET) refuses with 403 GUARD_MODEL_INTENT_IMMUTABLE, the same system-asset reasoning as its hooks/cap. No new authority: the write gate is unchanged.', properties: { defaultModelProvider: { type: [string, 'null'], description: 'task-413: model intent provider half; both-or-neither with defaultModelName on the merged result. null clears (only legal together with defaultModelName null).' }, defaultModelName: { type: [string, 'null'], description: 'task-413: model intent model half; both-or-neither with defaultModelProvider on the merged result. null clears (only legal together with defaultModelProvider null).' }, allowedModels: { type: [array, 'null'], items: { type: object, required: [provider, model], additionalProperties: false, properties: { provider: { type: string }, model: { type: string } } }, description: 'task-413: optional allow-list of {provider, model}; every entry needs both halves, an empty array or null clears the column. The principal declares intent only and never holds a connection (PLAN-0622 §2).' }, hooks: { type: [object, 'null'], description: 'D25-12: {advisors:[{kind,on:[actionClass]}]} or null (clears every subscription). Each advisors[].kind is a non-blank open string (implementing HookAdvisor is the plugin contract) and each advisors[].on value must hit the frozen action-class whitelist (today approval.ask) — otherwise the write is rejected 400 INVALID_REQUEST instead of storing a subscription that can never fire.' }, contextPolicy: { type: [object, 'null'], description: 'PLAN-0629 D29-25/D29-26 memory policy {memory:{enabled?,writeMode?,passive?,types?}} or null (clears the column). enabled: boolean (default false = no memory until the user switches it on). writeMode: off|tool; judge is reserved for M2 and answers 400 with an explicit detail. passive: off|summary|judge (default off) = the system-side write path; summary derives one memory from the existing compaction summary, judge additionally asks the existing judge seam, and both only ever land status=candidate (never injected, never listed as active until an explicit channel promotes the content). types: subset of profile|fact (empty array = no type, i.e. memory effectively off); the passive writer additionally requires fact in types. Unknown keys at either level are 400 (additionalProperties:false). There is no auto write channel that takes effect: D29-24 rejected auto-summarising writes, and the durable origin enum is tool|ui|cli plus the candidate-only passive.summary|passive.judge.' }, delegationPolicy: { type: [object, 'null'], description: 'PLAN-0630 M1: the delegation budget {maxCount:int>=1,maxDepth:int>=1} stored in agent_principals.delegation_policy (V100), or null (clears it -> code defaults 8/3). 0 is NOT unlimited: each present value must be >= 1 and unknown keys are 400 (additionalProperties:false). Only the ROOT subject of a delegation tree is ever read; a sub-agent own limits are inert as a subagent.' } } }
    AgentPrincipalUpdateView: { type: object, required: [principalId, hooks, contextPolicy, delegationPolicy, defaultModelProvider, defaultModelName, allowedModels], description: 'PLAN-0625 M2 + PLAN-0629 M1 + PLAN-0630 M1 + task-413: every persisted document and the model-intent triple are echoed (read back from the row), never the caller raw input. An untouched field reports its stored value, not a stale null.', properties: { principalId: { type: string, format: uuid }, defaultModelProvider: { type: [string, 'null'], description: 'The stored model intent provider; null when unset / after a clear.' }, defaultModelName: { type: [string, 'null'], description: 'The stored model intent model; null when unset / after a clear.' }, allowedModels: { type: [array, 'null'], items: { type: object, properties: { provider: { type: string }, model: { type: string } } }, description: 'The stored allow-list, normalized (trimmed, empty list stored as null).' }, hooks: { type: [object, 'null'], description: 'The stored subscription document; null when none / after a clear.' }, contextPolicy: { type: [object, 'null'], description: 'The stored memory policy; null when none / after a clear.' }, delegationPolicy: { type: [object, 'null'], description: 'The stored delegation budget; null when none / after a clear (code defaults then apply).' } } }
    ModelLimit: { type: object, additionalProperties: false, required: [provider, model], properties: { provider: { type: string, minLength: 1 }, model: { type: string, minLength: 1 }, maxInflight: { type: [integer, 'null'], minimum: 1, description: 'null = inherit the connection limit.' }, windowTokenBudget: { type: [integer, 'null'], format: int64, minimum: 1 }, windowSeconds: { type: [integer, 'null'], minimum: 1 } } }
    ResourceExhaustedProblem: { type: object, allOf: [{ $ref: '#/components/schemas/ProblemDetails' }, { type: object, required: [code, retryAfterSeconds], properties: { code: { type: string, enum: [RESOURCE_EXHAUSTED] }, retryAfterSeconds: { type: integer, minimum: 1, description: 'Mirrors the Retry-After header.' }, resourceKind: { type: string, enum: [CONNECTION, MODEL, FILE_WRITE, PROCESS, JOB, MCP], description: 'PLAN-0622: which resource class refused admission.' }, scope: { type: string, description: 'Resource key scope (for example connection:<uuid> or workspace:<uuid>/server:<id>).' } } }] }
    WorkspaceAgentCapView: { type: object, required: [principalId, workspaceId, permissions, capSource], properties: { principalId: { type: string, format: uuid }, workspaceId: { type: string, format: uuid }, permissions: { type: array, items: { $ref: '#/components/schemas/WorkspaceAgentPermission' } }, capSource: { type: string, enum: [baseline, explicit], description: 'D-1109 guard 1: how the stored cap came to be. explicit = the caller sent the permissions array (an empty array means a zero cap); baseline = the caller omitted it and the cap was derived from the principal''s role baseline in this Workspace. Persisted on workspace_agents.cap_source so "the field was forgotten" stays distinguishable from "inherit on purpose".' } } }
