  # PLAN-0384 T1.3/V2: public capability preflight so the create/import UI can
  # show the real execution backend before a Workspace is persisted.
  /api/v1/workspaces/capabilities/preflight:
    post:
      operationId: preflightWorkspaceCapability
      summary: Preflight the execution backend capability before creating a Workspace
      description: |
        Probes the Runtime direct-attach backend so the create/import UI can show the real
        execution capability before any Workspace is persisted. `storageMode` defaults to and
        must be `direct_attach`; any other storage/execution combination is `400`. A reachable
        Runtime always answers `200`, including `available:false` with its `reason` (for example
        `MXC_EXECUTABLE_MISSING`) — that is a valid result, not an error. Only an unreachable
        Runtime or invalid JSON maps to `502 RUNTIME_UNAVAILABLE`, reusing Problem Details.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCapabilityPreflightRequest' }
      responses:
        '200':
          description: 'Backend capability snapshot plus checkedAt (available:false is a valid 200 result)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BackendCapabilitySnapshot'
                  - type: object
                    properties:
                      checkedAt: { type: string, format: date-time, description: CP read timestamp (ISO-8601). }
        '400':
          description: 'INVALID_STORAGE_MODE / INVALID_EXECUTION_MODE / INVALID_REQUEST (storageMode must be direct_attach; hostPath is required)'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '502':
          description: 'RUNTIME_UNAVAILABLE (Runtime unreachable or invalid JSON)'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/workspaces/{workspaceId}/jobs:
    get: { operationId: listWorkspaceJobs, description: 'Workspace-scoped durable Job response (PLAN-0390 + PLAN-0465 T2.1); canonical identity is `jobId` (= `workspace_jobs.id`, decision #7). Each item carries the full WorkspaceJob response view.', security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace-scoped durable Job response, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkspaceJob' } } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
    post:
      operationId: startWorkspaceJob
      summary: Start a Workspace-scoped durable Job
      description: |
        Creates a Workspace Job domain row and dispatches execution. `Idempotency-Key` is required.
        Replaying the same key returns the existing Job with `200` and never starts a second process;
        the same key with a different command/args/cwd/timeoutSecs returns `409 JOB_IDEMPOTENCY_CONFLICT`.
        `windows-host` and `windows-mxc` direct-attach workspaces dispatch through the Runtime Job engine.
        A Runtime probe/launcher response of `501 JOB_BACKEND_LAUNCH_PENDING` is fail-closed and never
        falls back to another backend. When Runtime dispatch cannot be confirmed the durable state
        becomes `interrupted` (never replayed) and the call answers `502 RUNTIME_UNAVAILABLE`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string } }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
          description: Required. Replays the same request to the existing Job response; a different command/args/cwd/timeoutSecs returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceJobStartRequest' }
      responses:
        '202':
          description: Job accepted and dispatched; body is the Job response
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceJob' } } }
        '200':
          description: Idempotent replay of the existing Job response for the same Idempotency-Key
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceJob' } } }
        '400':
          description: 'IDEMPOTENCY_KEY_REQUIRED (header missing) or INVALID_REQUEST (command missing)'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: WORKSPACE_NOT_FOUND (missing or no Workspace access; no 403 leak)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409': { description: JOB_IDEMPOTENCY_CONFLICT (same key, different command/args/cwd/timeoutSecs), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '501': { description: JOB_BACKEND_LAUNCH_PENDING (Runtime launcher/probe unavailable; no fallback and no new process), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '502':
          description: RUNTIME_UNAVAILABLE (dispatch unconfirmed; durable Job state becomes interrupted)
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/workspaces/{workspaceId}/execution-mode:
     patch: { operationId: updateWorkspaceExecutionMode, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [executionMode], properties: { executionMode: { type: string, enum: [docker, windows-mxc, windows-host] } } } } } }, responses: { '200': { description: Updated execution mode }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } } }
