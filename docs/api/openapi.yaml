      properties:
        status: { type: string, enum: [UNVERIFIED, VERIFYING, READY, INVALID_CREDENTIALS, UNREACHABLE, DISABLED] }
        lastErrorCode: { type: [string, 'null'] }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
    SessionMonitorAgentFact:
      type: object
      additionalProperties: false
      required: [status, llmReady, configRevision]
      description: Agent-scoped readiness snapshot shared with `GET /api/v1/status`; may be stale while down — not a per-Session live probe
      properties:
        status: { type: string, enum: [up, down, unknown] }
        llmReady: { type: string }
        verifiedAt: { type: [string, 'null'], format: date-time }
        configRevision: { type: string }
    SessionMonitorLastObservedRun:
      type: object
      additionalProperties: false
      required: [runId]
      properties:
        runId: { type: string, format: uuid }
        terminalOutcome: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        terminalAt: { type: [string, 'null'], format: date-time }
    ChatTransportAggregate:
      type: object
      additionalProperties: false
      description: PLAN-0508 attempt counts over retained rows (running included); failed = error/timeout, partial = aborted/partial.
      required: [attemptCount, failedCount, partialCount]
      properties:
        attemptCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        partialCount: { type: integer, minimum: 0 }
    RunTransportAttemptsResponse:
      type: object
      additionalProperties: false
      description: PLAN-0508 per-Run durable provider HTTP transport attempts in seq order.
      required: [runId, attempts, aggregate]
      properties:
        runId: { type: string, format: uuid }
        attempts: { type: array, items: { $ref: '#/components/schemas/ChatTransportAttempt' } }
        aggregate: { $ref: '#/components/schemas/ChatTransportAggregate' }
    RunTraceResponse:
      type: object
      additionalProperties: false
      description: PLAN-0509 read-only, bounded projection of privacy-safe durable Run facts.
      required: [runId, asOf, completeness, provenance, sources, events, nextCursor]
      properties:
        runId: { type: string, format: uuid }
        asOf: { type: string, format: date-time }
        completeness: { type: string, enum: [complete, partial, unknown] }
        provenance: { $ref: '#/components/schemas/RunTraceProvenance' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/RunTraceSource' }
        events:
          type: array
          items: { $ref: '#/components/schemas/RunTraceEvent' }
        nextCursor: { type: [string, 'null'], maxLength: 1024 }
    RunTraceProvenance:
      type: object
      additionalProperties: false
      description: >-
        PLAN-0509 allowlisted scalar provenance only. status is complete when all seven
        values are valid, partial when some are valid, and unknown when none are available.
        No template body, request template, credential, or connection secret is included.
      required: [status, providerConnectionId, connectionRevision, apiTypeId, apiTypeVersion, contextTemplateLayer, contextTemplateId, contextTemplateVersion]
      properties:
        status: { type: string, enum: [complete, partial, unknown] }
        providerConnectionId: { type: [string, 'null'], format: uuid }
        connectionRevision: { type: [integer, 'null'], format: int64, minimum: 0 }
        apiTypeId: { type: [string, 'null'], minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$' }
        apiTypeVersion: { type: [integer, 'null'], minimum: 1 }
        contextTemplateLayer: { type: [string, 'null'], enum: [instance, user, workspace, null] }
        contextTemplateId: { type: [string, 'null'], format: uuid }
        contextTemplateVersion: { type: [integer, 'null'], minimum: 1 }
    RunTraceSource:
      type: object
      additionalProperties: false
      required: [source, status]
      properties:
        source: { type: string, enum: [chat_run, context_event, provider_attempt, mcp_invocation, runtime_job] }
        status: { type: string, enum: [complete, unavailable, not_applicable, unknown] }
    RunTraceEvent:
      type: object
      additionalProperties: false
      description: >-
        Allowlisted durable fact. This projection never exposes prompts, message bodies,
        tool arguments/results, credentials, raw ContextEvent payloads, or Runtime state.
      required: [eventId, occurredAt, source, kind, status, durationMs, providerId, modelId, errorCode, usage, toolName, references]
      properties:
        eventId: { type: string, maxLength: 256 }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [chat_run, context_event, provider_attempt, mcp_invocation, runtime_job] }
        kind: { type: string, enum: [run.lifecycle, input.admitted, context.source, agent.tool, provider.attempt, mcp.invocation, runtime.job, usage.recorded] }
        status: { type: [string, 'null'], enum: [created, queued, running, awaiting_approval, completed, failed, cancelled, admitted, started, succeeded, pending, ambiguous, resolved, missing, rejected, stale, recorded, estimated, unknown, null] }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        providerId: { type: [string, 'null'], maxLength: 128 }
        modelId: { type: [string, 'null'], maxLength: 128 }
        errorCode: { type: [string, 'null'], maxLength: 64 }
        usage:
          oneOf:
            - { $ref: '#/components/schemas/RunTraceUsage' }
            - { type: 'null' }
        toolName: { type: [string, 'null'], maxLength: 128 }
        references:
          type: object
          additionalProperties: false
          properties:
            contextEventId: { type: string, format: uuid }
            toolCallId: { type: string, maxLength: 128 }
            attemptId: { type: string, format: uuid }
            mcpInvocationId: { type: string, format: uuid }
            runtimeJobId: { type: string, format: uuid }
      allOf:
        - if:
            required: [kind]
            properties: { kind: { const: input.admitted } }
          then:
            properties:
              source: { const: context_event }
              status: { const: admitted }
              durationMs: { type: "null" }
              toolName: { type: "null" }
              providerId: { type: "null" }
              modelId: { type: "null" }
              errorCode: { type: "null" }
              usage: { type: "null" }
              references:
                type: object
                additionalProperties: false
                required: [contextEventId]
                maxProperties: 1
                properties:
                  contextEventId: { type: string, format: uuid }
    RunTraceUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        totalTokens: { type: [integer, 'null'], minimum: 0 }
    ChatTransportAttempt:
      type: object
      additionalProperties: false
      description: |
        PLAN-0508 durable transport attempt (V68 row projection); provider/model/connection
        identity is projected from the immutable ChatRun snapshot. Terminal metrics come from
        the Agent summary only (null when absent); `lastProgressStage` / `lastProgressElapsedMs`
        are the last accepted bounded stage sample (static, never extrapolated); wire bytes are
        fixed null in v1 (unknown); the single `errorCode` slot carries the safe string code or
        the provider HTTP status.
      required: [attemptId, seq, status, outcome, provider, model, connectionId, connectionRevision, startedAt, endedAt, durationMs, errorCode, firstChunkMs, chunkCount, uploadBytes, downloadBytes, lastProgressStage, lastProgressElapsedMs]
      properties:
        attemptId: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        status: { type: string, enum: [running, terminal] }
        outcome:
          oneOf:
            - type: string
              enum: [success, error, timeout, aborted, partial]
            - type: 'null'
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        connectionId: { type: [string, 'null'] }
        connectionRevision: { type: [integer, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        errorCode:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        firstChunkMs: { type: [integer, 'null'], minimum: 0 }
        chunkCount: { type: [integer, 'null'], minimum: 0 }
        uploadBytes: { type: [integer, 'null'], description: 'Fixed null in v1 (unknown, never fabricated)' }
        downloadBytes: { type: [integer, 'null'], description: 'Fixed null in v1 (unknown, never fabricated)' }
        lastProgressStage: { type: [string, 'null'], enum: [attempt_started, first_chunk, streaming, attempt_finished] }
        lastProgressElapsedMs: { type: [integer, 'null'], minimum: 0 }
    ChatApprovalDecisionRequest:
      type: object
      additionalProperties: false
      description: |
        PLAN-0328 M1 approval decision. `decision` selects the grant tier (`once` | `session` |
        `saved`) or a rejection (`reject` | `reject_always`); the legacy `approved` boolean is
        still accepted and maps to once/reject. When both fields are supplied, `decision` takes
        precedence. `feedback` is reject-only; `layer`/`rule` apply to rule-granting decisions.
      properties:
        decision: { type: string, minLength: 1, enum: [once, session, saved, reject, reject_always] }
        approved: { type: boolean, description: Legacy boolean decision (maps to once/reject) }
        feedback: { type: string, minLength: 1, maxLength: 512, description: Rejection feedback carried to the model }
        layer: { type: string, minLength: 1, enum: [workspace, user], description: Target layer for saved/reject_always; default workspace }
        rule: { $ref: '#/components/schemas/ChatApprovalRuleSpec' }
      anyOf:
        - required: [decision]
        - required: [approved]
      allOf:
        - if:
            required: [feedback]
          then:
            anyOf:
              - required: [decision]
                properties: { decision: { enum: [reject, reject_always] } }
              - required: [approved]
                properties: { approved: { const: false } }
        - if:
            required: [layer]
          then:
            required: [decision]
            properties: { decision: { enum: [saved, reject_always] } }
        - if:
            required: [rule]
          then:
            required: [decision]
            properties: { decision: { enum: [session, saved, reject_always] } }
    ChatApprovalRuleSpec:
      type: object
      additionalProperties: false
      description: Optional narrowing of the granted rule; actionClass must equal the registry value (classification authority stays with the classification workflow).
      properties:
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 512 }
    ChatApprovalGrantedRule:
      type: object
      required: [layer, actionClass, resource, effect]
      properties:
        layer: { type: string, enum: [session, workspace, user] }
        actionClass: { type: string, minLength: 1 }
        resource: { type: string, minLength: 1 }
        effect: { type: string, enum: [allow, deny] }
    ChatApprovalDecisionResponse:
      type: object
      additionalProperties: false
      description: |
        PLAN-0328 M1 result of a Chat approval decision. Mirrors what
        `ApprovalService.decisionResponse` actually returns: the CP-only decision metadata is
        added here (Agent's own response carries none of it). `status` is always `accepted` —
        a repeated identical decision is idempotent and still answers `accepted` with
        `propagated: 0`, while a repeat with a *different* kind fails with 409
        `APPROVAL_DECISION_CONFLICT` and no body of this shape.
      required: [status, requestId, approved, decision, propagated]
      properties:
        status: { type: string, enum: [accepted] }
        requestId: { type: string, format: uuid }
        approved: { type: boolean, description: 'Derived from the resolved decision kind, not from the request field' }
        decision: { type: string, enum: [once, session, saved, reject, reject_always], description: Resolved decision kind; on an idempotent replay this is the recorded kind }
        propagated: { type: integer, minimum: 0, description: Number of sibling pending approvals re-solved in the same session after an allow; 0 on reject and on replay }
        modeAtGrant: { type: [string, 'null'], description: Effective session policy mode captured when the row was claimed; null when it could not be resolved }
        rule: { $ref: '#/components/schemas/ChatApprovalGrantedRule' }
    ChatRunStatusResponse:
      type: object
      additionalProperties: false
      required: [runId, sessionId, origin, status, terminalOutcome, leaseExpired, pendingApprovals]
      properties:
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        origin: { type: string, enum: [user_submission, spawn], readOnly: true }
        status: { type: string, enum: [accepted, queued, running, streaming, awaiting_approval, cancelling, dispatching, succeeded, failed, partial, ambiguous, cancelled] }
        terminalOutcome: { type: [string, 'null'], enum: [success, error, partial, ambiguous, cancelled] }
        leaseExpired: { type: boolean }
        pendingApprovals: { type: array, items: { $ref: '#/components/schemas/ChatApprovalRequest' } }
        skillsSnapshot:
          description: |
            PLAN-0628 M2a-③ (D28-42): the skills listing this Run was admitted with, frozen into
            `chat_runs.skills_snapshot` in the same transaction as `contextTemplateSnapshot`.
            **Source of the listing** (skill-wiring ruling 2026-11-04): `skill_bindings` — resolved for
            the Session's main Agent principal (and its owner), with `maxSkills`/`includeDescriptions`/
            `sort` taken from the template's `skill_catalog` component when it has one and from the
            frozen defaults otherwise. A template without that component (the built-in api-request
            template) is therefore the *normal* case, not "no listing".
            **Replay only**: the value participates in no decision, and the listing the model
            sees is rendered from this same document at dispatch (D28-39) — so this is what the
            model was shown, not a re-resolution against today's bindings. A binding added after
            admission is therefore absent here *by design*, and a continuation Run reports the
            parent's listing with `snapshotSource: inherited`.
            `null` means the Run captured nothing: a Run admitted before M2a, a Run without a
            resolvable subject, or a Run whose subject had no live binding at admission (the column
            keeps its `{}` default rather than forging an "empty capture"). Its listing is resolved
            live from the current bindings (D28-40), and that resolution is not replayable. `null`
            never means "this Run had no skills" — that is `status: empty` inside the object.
          oneOf:
            - $ref: '#/components/schemas/ChatRunSkillsSnapshot'
            - type: 'null'
    ChatRunSkillsSnapshot:
      type: object
      additionalProperties: false
      description: |
        PLAN-0628 M2a-③: the skills listing a Run was admitted with (D28-35), replayed read-only.
        It stores the listing itself — display names, descriptions, versions, content hashes — and
        never a skill body: bodies are read on demand by the Agent, so freezing them would inflate
        the row by ~100× without adding replayable truth. Storing the listing (rather than a
        reference to the bindings) is what makes a Run reproducible: an edit during the Run cannot
        change what its model saw.
        A field added by a newer Control Plane is dropped by this projection; `version` tells a
        reader which document shape it is looking at.
      required: [version, status, source, snapshotSource, maxSkills, truncated, diagnostics, items]
      properties:
        version:
          type: integer
          minimum: 1
          description: Snapshot document schema version.
        status:
          type: string
          description: |
            Listing outcome frozen at admission: `ready`, `truncated` (the `maxSkills` bound was
            reached), `empty` (nothing resolvable was bound) or `failed` (resolution produced an
            error record; the Run still ran — a listing problem never blocks a Run).
            Free-form on purpose: a newer Control Plane may report a state this client does not
            know, and a closed enum here would make a diagnostic unreadable.
        source:
          type: string
          description: The live table the listing was projected from (`skill_bindings`).
        capturedAt:
          type: [string, 'null']
          format: date-time
          description: Admission instant of the freeze; `null` only for a malformed legacy document.
        snapshotSource:
          type: string
          enum: [frozen, inherited]
          description: |
            `frozen` = computed at this Run's admission; `inherited` = copied verbatim from the
            parent Run of a continuation (D28-39 ②), so a binding added while the parent ran is
            absent from both.
        maxSkills:
          type: integer
          minimum: 0
          maximum: 200
          description: The listing count bound this Run was admitted with (from the template component).
        truncated:
          type: boolean
          description: True when `maxSkills` cut the listing; the model was told so separately.
        diagnostics:
          type: array
          items: { type: string }
          description: |
            Admission-time codes that explain the frozen trade-offs, e.g.
            `skill_catalog_max_skills_reached`, `skill_catalog_name_collision`,
            `skill_catalog_empty`, `skill_catalog_resolve_failed`, `skill_snapshot_too_large`,
            `skill_snapshot_multiple_components`.
        items:
          type: array
          items: { $ref: '#/components/schemas/ChatRunSkillsSnapshotItem' }
    ChatRunSkillsSnapshotItem:
      type: object
      additionalProperties: false
      description: |
        One frozen listing entry. The body is deliberately absent (it is read on demand), and
        `contentHash` is what lets a later comparison answer "was the skill I see now the skill this
        Run was admitted with".
      required: [name, version, oversize]
      properties:
        skillId: { type: [string, 'null'], format: uuid }
        qualifiedName:
          type: [string, 'null']
          description: |
            The three-segment `<subject>:<scope>:<definitionScope>:<name>` address (D28-31); it is
            always the full form even when the rendered listing line used the bare name. A personal
            row renders `user` in that segment, and only the session owner's own user rows can appear
            in one run's listing, so the address stays unambiguous.
        name: { type: string }
        description: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        contentHash: { type: [string, 'null'] }
        oversize:
          type: boolean
          description: The skill's own body exceeded its size bound at import time (D28-15).
        tier:
          oneOf:
            - $ref: '#/components/schemas/ChatRunSkillsSnapshotTier'
            - type: 'null'
    ChatRunSkillsSnapshotTier:
      type: object
      additionalProperties: false
      description: Which binding axis put this entry in the listing (D28-14's two axes). `definitionScopeType` is which library the definition itself lives in (instance | workspace | user); the axes are independent, so a personal definition can appear in a run's listing while the binding that put it there is instance- or workspace-scoped.
      required: [subjectType, scopeType, definitionScopeType]
      properties:
        subjectType: { type: string, enum: [agent_principal, user] }
        scopeType: { type: string, enum: [instance, workspace] }
        definitionScopeType: { type: string, enum: [instance, workspace, user] }
    PendingApprovalSummary:
      type: object
      required: [sessionId, workspaceId, count, oldestRequestedAt]
      properties:
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        count: { type: integer, minimum: 1 }
        oldestRequestedAt: { type: string, format: date-time }
    AgentApprovalDecisionRequest:
      type: object
      required: [requestId, approved]
      additionalProperties: false
      properties:
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
        decision: { type: string, minLength: 1, enum: [once, session, saved, reject, reject_always, propagated_allow, propagated_reject] }
        feedback: { type: string, minLength: 1, maxLength: 512 }
    AgentApprovalDecisionResponse:
      type: object
      additionalProperties: false
      description: Raw Agent response to an approval decision. CP-only decision metadata is not returned by Agent.
      required: [status, requestId, approved]
      properties:
        status: { type: string, enum: [accepted, already_decided] }
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
    AgentApprovalStatus:
      type: object
      additionalProperties: false
      description: Raw Agent coordinator status. This internal response does not include the CP policy summary, CP approval state, replay marker, or modeAtGrant.
      required: [status, requestId]
      properties:
        status: { type: string, enum: [pending, approved, rejected, expired] }
        requestId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        tool: { type: string }
        action: { type: string }
        details: { type: string }
        argumentsHash: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        approved: { type: [boolean, 'null'] }
    PolicyMode:
      type: string
      enum: [manual, auto]
    PolicyModeState:
      type: object
      additionalProperties: false
      required: [sessionId, mode, sessionRules]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
        sessionRules: { type: integer, minimum: 0 }
    PolicyModeUpdateRequest:
      type: object
      required: [sessionId, mode]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
    PolicyModeUpdateResponse:
      type: object
      additionalProperties: false
      required: [sessionId, mode, scope]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
        scope: { type: string, enum: [session] }
    Tier1ChainStatus:
      type: object
      additionalProperties: false
      description: |
        PLAN-0407 T3.1 Tier-1 response — exactly the spec §5 field set; content fields are
        never present.
      required: [sessionId, runId, state, at]
      properties:
        sessionId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        state: { type: string, description: ChatRun status of the target's latest run }
        at: { type: string, format: date-time, description: Timestamp of that run state }
