        '201': { description: Member added, content: { application/json: { schema: { $ref: '#/components/schemas/MemberView' } } } }
        '400': { description: 'INVALID_REQUEST (missing/illegal role; role is limited to EDITOR|VIEWER)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'WORKSPACE_FORBIDDEN (non-OWNER) / WORKSPACE_READ_ONLY (VIEWER with X-Workspace-Id)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'WORKSPACE_NOT_FOUND / USER_NOT_FOUND (username not registered; UI copy「该用户不存在，请对方先注册」)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: MEMBER_ALREADY_EXISTS, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/members/{userId}:
    patch:
      tags: [workspace]
      operationId: updateWorkspaceMemberRole
      summary: Change one member's role (PLAN-0565)
