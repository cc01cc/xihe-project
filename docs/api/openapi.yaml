  /internal/v1/oauth/token:
    post:
      tags: [service-misc]
      operationId: brokerOAuthToken
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthTokenRequest' } } } }
      responses: { '200': { description: 'OAuth token response (access_token / token_type / expires_in / scope)' }, '400': { $ref: '#/components/responses/Problem' }, '401': { description: 'OAUTH_REAUTH_REQUIRED: missing credential, non-AUTHORIZED status, scope mismatch, or provider rejected the refresh (4xx / OAuth error)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '403': { $ref: '#/components/responses/Problem' }, '503': { description: 'OAUTH_TOKEN_UNAVAILABLE (provider unreachable / timeout / 5xx) or OPERATION_LOCK_TIMEOUT (PLAN-0346 lock wait was bounded)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } } }
  /api/v1/mcp:
    post:
      tags: [mcp]
      operationId: mcpPost
      summary: MCP JSON-RPC endpoint (tools/list, tools/call, discovery)
      description: |
        Agent-facing MCP gateway. The Gateway-public built-in mutation `apply_patch` is exposed
        through the normal approval path. `tools/call` is policy-gated: ALLOW dispatches, ASK requires an
        exact approval grant or session fingerprint. A run-scoped ASK without either creates (or
        reuses) the durable pending approval and answers `409` with a JSON-RPC error frame carrying
        the safe extension in `error.data`; a call without run context falls back to the legacy
        `application/problem+json` body (no extension — the Agent registers no waiter and fails
        closed).
        `tools/list` item shape (PLAN-0691 T2.1): a plugin tool may carry the optional provenance
        keys `pluginId`/`version`/`digest`; the item shape of existing (non-plugin) tools is
        unchanged. When the request carries `X-Chat-Run-Id`, CP serves only plugin tools licensed
        by that Run's frozen plugin snapshot (T1.6b `chat_runs.plugin_snapshot`) — an unlicensed
        or unprovable plugin tool is dropped, non-plugin tools are never touched; without a run
        identity the catalogue is returned unchanged. With `cp.plugin.enabled=false` (shipped
        default, D-66) the plugin surface does not exist and this filter is a no-op.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: MCP JSON-RPC response }
        '400':
          description: 'UNKNOWN_TOOL — the system tool catalog was fetched successfully but the requested name is absent (audit action unknown_tool).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: 'RUNTIME_UNAVAILABLE — Runtime unreachable, timed out, rejected the service credential, or returned an unusable catalog. Problem Details carries dependency=runtime, reason (unreachable|timeout|auth_failed|upstream_error) and retryable; audit action dependency_unavailable.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403':
          description: MCP_SESSION_INVALID — the logical MCP endpoint is stateless and does not accept mcp-session-id (PLAN-0537)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: "https://xihe.dev/problems/mcp-session-invalid", title: "MCP session is invalid", status: 403, code: "MCP_SESSION_INVALID", detail: "The logical MCP endpoint is stateless and does not accept mcp-session-id", requestId: "req-..." }
        '409':
          description: APPROVAL_REQUIRED — no valid approval grant / session fingerprint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpApprovalRequiredError' }
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: "https://xihe.dev/problems/approval-required", title: "Approval required", status: 409, code: "APPROVAL_REQUIRED", detail: "Tool execution requires approval before dispatch", requestId: "req-..." }
    get: { tags: [mcp], operationId: mcpStream, summary: Open the MCP event stream, security: [{ bearerAuth: [] }], responses: { '200': { description: MCP SSE stream, content: { text/event-stream: {} } } } }
    delete: { tags: [mcp], operationId: mcpDisconnect, summary: Disconnect the MCP stream, security: [{ bearerAuth: [] }], responses: { '204': { description: Disconnected } } }
  /internal/v1/attachments/{attachmentId}/content:
    get:
      tags: [service-misc]
      operationId: internalAttachmentContent
      summary: Stream one attachment's stored bytes to the Agent (internal, run-bound)
      description: 'PLAN-0605 — the byte channel the Agent uses to render image content parts (BL-320 批 1：此前缺失）。Service-authenticated (`/internal/v1/**`, Bearer) and **run-bound**: `runId` must own the attachment (an unrelated/unknown run answers 404, never a 403 oracle). The response body is the stored bytes only — no metadata beyond `Content-Type`/`Content-Length`, `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`; never cached, never re-encoded, no redirect.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: attachmentId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: runId, required: true, schema: { type: string, format: uuid }, description: 'Run that owns the attachment; the binding is checked, not trusted.' }
        - { in: header, name: X-Workspace-Id, required: false, schema: { type: string, format: uuid }, description: 'Optional workspace echo; when present it must match the attachment workspace.' }
      responses:
        '200':
          description: 'Raw attachment bytes in the stored content type'
          content:
            '*/*':
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/config/effective/{domain}:
    get:
      tags: [service-misc]
      operationId: getEffectiveConfig
      summary: Resolve effective config for a domain (env > lock > workspace > user > instance > defaults); no layer exposure
      description: |
        PLAN-0590 (spec/run-config-snapshot.md): the Agent resolves one frozen
        effective snapshot per `(workspaceId, userId)` run and reads its run
        config from that snapshot. Both identity query parameters are optional;
        when `workspaceId` is absent no workspace layer is read. The endpoint
        does not check membership between `userId` and `workspaceId` — callers
        are service-authenticated (`INTERNAL_SERVICE`) and the Agent always
        passes identity keys taken from the CP run payload.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: domain, required: true, schema: { type: string } }
        - { in: query, name: userId, required: false, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
      responses: { '200': { description: Effective configuration (entries/revision/source) }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' } }
  /internal/v1/queries/tier1/status:
    get:
      tags: [service-misc]
      operationId: tier1ChainStatus
      summary: Tier-1 provenance-chain status metadata (grant-free, downward only)
      description: |
        PLAN-0407 T3.1 (spec §5). Returns the target session's latest-run metadata as exactly
        `{sessionId, runId, state, at}` with no content fields. Access requires the requester
        session to be the target itself or one of its provenance ancestors in the same
        workspace — the single downward direction along the reference edge, with no grant
        check. Reverse direction (target is an ancestor of the requester), out-of-chain,
        cross-workspace, dangling and cyclic provenance fail closed with 403. Content is never
        served here; workspace-file reads keep using the existing workspace file channel.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: requesterSessionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: targetSessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Target session latest-run status metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tier1ChainStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/queries/tier2/access:
    get:
      tags: [service-misc]
      operationId: tier2ContentAccess
      summary: Tier-2 content access decision through the single grant kernel
      description: |
        PLAN-0407 T3.1 (spec §5, evaluation-kernel uniqueness). After the same downward
        provenance chain rules as Tier-1, the decision runs through the shared authorization
        kernel (`GrantAuthorizationService.allows`: principal grants ∩ binding cap ∩ session
        caps) for a `read` on the target session. 200 `{allowed: true}` only with an explicit
        grant; without one, or on any chain violation, 403. A decision only — content is read
        by the caller's own channel; workspace-file content keeps the existing file channel.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: requesterSessionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: targetSessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Access allowed by an explicit grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tier2Access' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/workspaces/{workspaceId}/stdio-servers:
    get:
      tags: [service-misc]
      operationId: getInternalWorkspaceStdioServers
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      responses: { '200': { description: Stdio servers with generation/hash }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/sessions/{sessionId}/participants:
    get:
      tags: [session]
      operationId: listSessionParticipants
      summary: List the session participants (PLAN-0623 M0 contract; wired in M1)
      description: |
        PLAN-0623 R2/R7: the participant list is the union of HUMAN and AGENT principals with their
        role, order_index, wake/respond policies and read cursor. Cursors are read-only in 0623
        (R7): the server advances them off the event stream, client reporting lands in 0624.
        A participant view deliberately carries **no** cap snapshot — the cap is resolved live via
        `resolveCapFor(principalId, workspaceId)` (Lead ruling 2026-11-02, D23-20 follow-up).
        D-1247 (task-399): a workspace-less session (workspace_id null) is roster-readable by its owner
        or an enabled HUMAN participant regardless of the caller workspace context; the manager tier
        does not apply to it (there is no workspace to manage). Workspace-bound rows keep the shipped
        owner / invited / manager roster rule and the workspace equality check.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Participants ordered by orderIndex
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionParticipantListResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [session]
      operationId: addSessionParticipant
      summary: Add a member or guard participant (PRIMARY is created with the session, never here)
      description: |
        D23-13: the PRIMARY participant is unique, cannot be removed and cannot be transferred — a
        second PRIMARY is rejected with 409 `PARTICIPANT_PRIMARY_EXISTS`. The default policies come
        from R3 (MEMBER/GUARD: wake=MENTION, respond=WHEN_MENTIONED); callers may override them.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionParticipantCreateRequest' }
      responses:
        '201':
          description: Participant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionParticipantView' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'PARTICIPANT_ALREADY_EXISTS | PARTICIPANT_PRIMARY_EXISTS | PARTICIPANT_ORDER_CONFLICT'
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } }
  /api/v1/sessions/{sessionId}/participants/{participantId}/cursor:
    patch:
      tags: [session]
      operationId: advanceParticipantCursor
      summary: Advance the caller's own read cursor for this session
      description: |
        PLAN-0660 T5.1 (contract `spec/session/user-channel.md` §2): advance-only
        (`max(current, requested)`), clamped to the Session's current max `context_events.sequence`.
        Self-only — the row must be a HUMAN participant whose `principal_id` is the caller;
        otherwise **403 `CURSOR_SELF_ONLY`**. No counter is written: the response's
        `readCursor.mentionCount` is derived from `wake_dispatch` notify rows past the pointer (§3).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
        - { in: path, name: participantId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadEventSeq]
              properties:
                lastReadEventSeq: { type: integer, minimum: 0, description: 'Target read position; advance-only + clamped to the session max sequence.' }
      responses:
        '200':
          description: The updated cursor view (same CursorView shape the list endpoint returns)
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastReadEventSeq: { type: integer }
                  mentionCount: { type: integer, description: 'DERIVED from wake_dispatch notify rows past the pointer (PLAN-0660 T5.2); not a stored column.' }
                  updatedAt: { type: string, format: date-time }
        '400':
          description: Body missing or lastReadEventSeq not an integer (400 INVALID_REQUEST)
        '403':
          description: Not the row's own human participant (403 CURSOR_SELF_ONLY)
        '404':
          description: Session or participant not found (404 SESSION_NOT_FOUND / PARTICIPANT_NOT_FOUND)

  /api/v1/sessions/{sessionId}/participants/{participantId}:
    patch:
      tags: [session]
      operationId: updateSessionParticipant
      summary: Change a participant's wake/respond policy or disable it
      description: |
        D23-13: policy changes are allowed, removal/transfer of the PRIMARY is not (409
        `PARTICIPANT_PRIMARY_IMMUTABLE`). Disabling keeps the row and its cursor for audit/history
        (`disabled_at`), which is why "remove" is a soft disable in 0623.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
        - { in: path, name: participantId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionParticipantUpdateRequest' }
      responses:
        '200':
          description: Updated participant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionParticipantView' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [session]
      operationId: removeSessionParticipant
      summary: Remove a member/guard participant (the PRIMARY is not removable)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
        - { in: path, name: participantId, required: true, schema: { type: string } }
      responses:
        '204': { description: 'Participant soft-disabled (D23-26): the row, its order_index and its cursor are kept, GET keeps returning it with disabledAt set, and a second DELETE is an idempotent 204.' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: 'PARTICIPANT_PRIMARY_IMMUTABLE — the PRIMARY can only be replaced by a new session'
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } }
  /api/v1/chat:
    post:
      tags: [chat]
      operationId: chat
      summary: Enqueue a chat turn (requires active SSE)
      description: |
        Accepts a user message for the given session and enqueues an async relay to the Agent.
        The caller must already hold an active `GET /api/v1/events?sessionId=` subscription for the same session;
        otherwise the request is rejected with `409 SSE_SUBSCRIPTION_REQUIRED`.
        Each request must identify its selected branch with `branchId`; the branch is validated before durable Run/Message creation and remains bound through Run ID recovery.
        A session admits up to `maxConcurrentRunsPerSession` (default 2) concurrent runs (PLAN-0645 M0/M1); only when that cap is already full is the next submission rejected with `409 CHAT_IN_PROGRESS`.
        PLAN-0665 M1: an explicit `toParticipantIds` selection (1..N AGENT participants) makes every selected target answer with its own run. The FIRST target owns this submission's `user_submission` run (`runId` = `runIds[0]`); the remaining targets are created as derived runs whose wake audit carries `triggerSource="to"`. Their `origin` is whatever the wake carrier classifies the run as (real stack 2026-11-05: `scheduled`) and `parent_run_id` stays NULL on purpose, so **read sides must not infer "same message" from `origin`** — group by runId / the durable `SessionMessage.delivery` / `trigger_source`. Explicit TO outranks `@`-mention suppression: the run answers instead of being terminalized as `suppressed_no_responder`. Targets beyond the concurrency cap are dispatched as starts become available; a target that cannot start is audited rather than silently dropped. Human TO targets answer `400 INVALID_REQUEST` until a later plan (blocked on BL-238). The sorted TO set and `asParticipantId` are part of the Idempotency-Key hash.
        Rollback: set `agent-runtime.maxConcurrentRunsPerSession` back to `1` to restore the frozen single-flight behaviour (PLAN-0645 V3 equivalence) — no code change is needed.
        The accepted run streams `token` events followed by a terminal `done` over the persistent session SSE —
        `done` ends the run, not the SSE connection. The SSE remains reusable for the next chat.
        A new run is rejected with `403 AGENT_PRINCIPAL_MISSING` unless the persisted Session resolves to an active Agent principal
        bound to the current Workspace (PLAN-0750 / G8 task-155: dedicated code, not a bare FORBIDDEN —
        the UI branches to "bind one in Workspace settings" guidance); identity is never inferred from the Session owner or request fields.
        The Chat request contract no longer defines `agentPrincipalId` (removed by PLAN-0689); a stray field is silently ignored with 200 during the BL-444 deprecation window.
        The responder identity is resolved server-side from the Session PRIMARY participant; it is never inferred from request fields.
        Historical/user-operation/tool-event Sessions keep their existing identity rules.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: header, name: Idempotency-Key, required: false, schema: { type: string, maxLength: 128 }, description: 'Reuses an existing run for the same request hash, including branchId; conflicting payloads return 409.' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '202':
          description: Accepted — run enqueued, progress via SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRunResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem', description: 'BACKEND_DISABLED — the session belongs to a workspace on the frozen docker execution backend; the run is refused before dispatch (PLAN-0618 / BL-178). Any other unavailability is reported as an RFC 9457 Problem Details response (same shape as responses.Problem).' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: |
            Workspace access denied, Session lacks an active Workspace-bound Agent principal
            (403 AGENT_PRINCIPAL_MISSING, PLAN-0750 / G8 task-155), or asParticipantId was supplied
            without the participant-speak authorization (403 PARTICIPANT_CAP_DENIED, PLAN-0623 D23-08)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: SSE subscription missing, run already active, or idempotency key reused with a different branch/request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: "https://xihe.dev/problems/sse-subscription-required", title: "SSE subscription required", status: 409, code: "SSE_SUBSCRIPTION_REQUIRED", detail: "An active SSE subscription is required", requestId: "req-..." }
  /api/v1/chat/runs/{sourceRunId}/continue:
    post:
      tags: [chat]
      operationId: continueChatRun
      summary: Continue an eligible ChatRun from its latest safe graph checkpoint
      description: |
        Creates a new child ChatRun from an eligible `ambiguous/CP_RESTARTED` source.
        Terminology: a ChatRun is one execution (UI calls it a turn, 回合); continuing
        creates a child run, so one turn may span several runs.
        `resume_pending` resumes without adding a user message; `append_user_turn`
        appends exactly one new message to the checkpoint. The source Run remains
        terminal and immutable. CP rechecks the authenticated tenant, source owner,
        Session, branch cursor and side-effect eligibility under the Session lock.
        Same key and canonical request hash return the existing child; a different
        hash returns `409 IDEMPOTENCY_KEY_REUSED`. Internal checkpoint identifiers
        and completed tool-call IDs are never returned by this public route.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sourceRunId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/ChatRunResumePendingRequest' }
                - { $ref: '#/components/schemas/ChatRunAppendUserTurnRequest' }
      responses:
        '202':
          description: Accepted continuation child Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRunContinuationResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Source is ineligible/stale, a side effect needs reconciliation, or the idempotency key conflicts
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/chat/runs/{runId}:
    get:
      tags: [chat]
      operationId: getChatRunStatus
      summary: Get a ChatRun status and its pending approvals
      description: |
        Returns the authenticated user's ChatRun status for the current workspace.
        `pendingApprovals` contains the CP-owned durable approval envelope, not the
        raw Agent approval status. The envelope is also used for reconnect/reload
        recovery and contains only the bounded approval preview and safe policy metadata.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ChatRun recovery status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRunStatusResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/runs/{runId}/cancel:
    post:
      tags: [chat]
      operationId: cancelChatRun
      summary: Cancel a ChatRun (PLAN-275 M1 T1.3)
      description: |
        Claims the Run for cancellation (conditional update, the same row-lock discipline as
        spawn), settles the root Run and stops `kind=spawn` propagation with a bounded wait.
        An explicit workspace context (`X-Workspace-Id`) is required; without it the call
        answers 409 WORKSPACE_CONTEXT_REQUIRED. The body is optional — `{"reason": "..."}`
        defaults to `user_requested`. The call is idempotent for a Run that is already
        cancelling (`cancel_accepted`); a terminal Run answers 409 RUN_NOT_CANCELLABLE.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Cancellation claimed, or already in progress
          content:
            application/json:
              schema:
                type: object
                required: [status, runId]
                properties:
                  status: { type: string, enum: [cancel_accepted] }
                  runId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: RUN_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409':
          description: 'WORKSPACE_CONTEXT_REQUIRED (no workspace context) / RUN_NOT_CANCELLABLE (Run is already terminal)'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /api/v1/chat/runs/{runId}/attempts:
    get:
      tags: [chat]
      operationId: getChatRunAttempts
      summary: List a ChatRun's durable provider HTTP transport attempts
      description: |
        PLAN-0508: per-Run durable transport attempt rows (`chat_run_transport_attempts`, V68)
        in `seq` order, plus the same-count aggregate as the session monitor. Duration /
        first-chunk / chunk metrics come from the Agent terminal summary only; a running or
        reconciled-partial row without summary keeps them null (never derived from cross-process
        wall-clock subtraction). `lastProgressStage` / `lastProgressElapsedMs` carry the last
        accepted bounded stage sample (static observation, no extrapolation). `uploadBytes` /
        `downloadBytes` are fixed null in v1 (unknown, never fabricated) and the single
        `errorCode` slot carries the safe string code or the provider HTTP status.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Run transport attempts in seq order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunTransportAttemptsResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/runs/{runId}/trace:
    get:
      tags: [chat]
      operationId: getChatRunTrace
      summary: Read a bounded, privacy-safe timeline of durable ChatRun facts
      description: |
        PLAN-0509: projects only allowlisted durable facts from the ChatRun,
        ContextEvent, provider-attempt, MCP-invocation, and Runtime-job sources.
        The response never contains prompts, message bodies, tool arguments/results,
        credential values, template bodies, or raw payloads. Configuration provenance
        contains only provider-connection/API-type/template identity and revision scalars;
        `prompt.admitted` is projected as a separate content-free `input.admitted` event.
        `asOf` is fixed by the first page and
        embedded in the opaque cursor so later pages use the same watermark.
        Events are ordered by occurredAt/source/sourceRecordId. Missing or unmappable
        source facts yield `completeness: partial` rather than fabricated data. A
        same-Session unlinked Runtime-job candidate only marks runtime coverage and
        overall completeness `unknown`; it is never attributed to this Run or returned
        as an event.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1024 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: A stable page of safe Run Trace facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunTraceResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/runs/{runId}/context-fingerprint:
    get:
      tags: [chat]
      operationId: getChatRunContextFingerprint
      summary: Read a run's context fingerprint, optionally diffed against another run
      description: |
        PLAN-0666 (BL-269): returns the layered fingerprint recorded when this run was
        **first dispatched** (`dispatchAttempt: 1`). A context-overflow re-dispatch of the
        same run produces a second outbound document that is **not** recorded; attempt-level
        fingerprints are v2. `tools` is not observable from CP and is always
        `{"unavailable":"agent_side"}` (v2: reported by the Agent).

        **Two-level model (assertion A1):** a stored document has `status` in exactly
        `ok|disabled|error`; `not_dispatched` is a read-side synthetic state and is never
        stored. A run with no document returns `available=false + reason`, and that absence
        must **never** be mapped to `disabled` or `error` (`pre_plan` = row predates the plan;
        `not_dispatched` = never dispatched). **Assertion A2:** a layer that is unavailable is
        reported as `unavailable`, never downgraded to `unchanged`.

        With `against`, both runs must belong to the same Session (`409 DIFF_SESSION_MISMATCH`).
        Authorization reuses the run-trace path (run identity + current Session); no new bypass.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: against, required: false, description: Baseline run id (same Session only)., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fingerprint envelope, or fingerprint diff when `against` is supplied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ContextFingerprintView'
                  - $ref: '#/components/schemas/ContextFingerprintDiffView'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/runs/{runId}/provider-request-fingerprint:
    get:
      tags: [chat]
      operationId: getChatRunProviderRequestFingerprint
      summary: Read a run's provider-request fingerprint, optionally diffed against another run
      description: |
        PLAN-0679 (design D6): returns the layered fingerprint of the **final provider request**
        for this run's first provider step (`providerStep: 1`), recorded by the Agent at dispatch
        time and persisted write-once per run (`chat_run_provider_requests`). A context-overflow
        re-dispatch cannot replace the first document (design D2); per-step rows are v2 (B-6).

        **Zero prompt content:** the document carries only per-layer sha256 hash/count/bytes plus
        the outbound calibration hash/bytes; the `request` block carries diagnostic metadata
        (apiType, resolved model, message/tool counts, role histogram, source summary) measured
        by the Agent. Neither contains message bodies, tool schemas, or template bodies.

        **Two-level model (design D5):** absence of a row is a read-side synthetic state —
        `available=false + reason=not_captured` — and is never re-encoded as `disabled`/`error`.
        The only stored non-diagnostic shape is the Agent's fail-open error marker
        (`{status:"error", reasonCode:"FINGERPRINT_TOO_LARGE"}`), reported as `unavailable` in
        diffs, never as `unchanged`.

        With `against`, both runs must belong to the same Session
        (`409 DIFF_SESSION_MISMATCH`). Authorization reuses the run-trace path (run identity +
        current Session); no new permission atom (design D6).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: against, required: false, description: Baseline run id (same Session only)., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fingerprint envelope, or fingerprint diff when `against` is supplied
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProviderRequestFingerprintView'
                  - $ref: '#/components/schemas/ProviderRequestFingerprintDiffView'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/runs/{runId}/guidance:
    post:
      tags: [chat]
      operationId: submitChatRunGuidance
      summary: Submit in-run Guidance (same-Run steering) for an active ChatRun
      description: |
        PLAN-0528: Run-scoped user Guidance, separate from Message, Follow-up Queue and EventStore.
        Author is derived from TenantContext (request body never carries sourceKind; server pins `user`).
        Requires `Idempotency-Key`. A same-key replay returns the original record with `200`, but only
