    post:
      operationId: runtimeCaptureCheckpointSlice
      description: 'Captures one workspace slice at Run termination, abnormal recovery, or C0 bootstrap. A tree equal to the chain tail returns `noChange=true` without writing a new ref. The response uses `predecessor`; CP projects it as `predecessorRef`.'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeCheckpointCaptureRequest' } } } }
      responses:
        '200': { description: Capture result, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeCheckpointCaptureResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/runtime/workspaces/{workspaceId}/checkpoints/gc:
    post:
      operationId: runtimeCheckpointGc
      description: 'Runs the newest-50 plus 30-day TTL slice retention sweep. Abnormal slices participate in the same count.'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      responses:
        '200': { description: Retention counts, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeCheckpointGcResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/v1/runtime/workspaces/{workspaceId}/checkpoints/cleanup:
    post:
      operationId: runtimeCheckpointCleanup
