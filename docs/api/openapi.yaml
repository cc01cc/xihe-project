openapi: 3.1.0
info:
  title: Xihe API
  version: 1.0.0
  description: |
    Canonical HTTP contract for Xihe public and service APIs.
    PLAN-0559 workspace context: workspace-scoped user requests carry `X-Workspace-Id` (uuid).
    The header wins over the legacy access-token claim; missing header falls back to the legacy claim, then the caller's default workspace.
    Invalid header -> 400 `INVALID_WORKSPACE_ID`; non-member/deleted workspace -> 403 `WORKSPACE_FORBIDDEN`;
    VIEWER writes -> 403 `WORKSPACE_READ_ONLY`; non-OWNER workspace lifecycle -> 403 `WORKSPACE_FORBIDDEN`.
    Roles: OWNER (read/write/manage), EDITOR (read/write), VIEWER (read-only); legacy ADMIN/MEMBER map to EDITOR.
    Workspace context is a request-state conflict, not an authentication failure: an authenticated caller with **no resolved workspace context** (blank start with no workspace yet, or several workspaces and none named via `X-Workspace-Id`/path) gets **409 `WORKSPACE_CONTEXT_REQUIRED`**. `401 AUTHORIZATION_REQUIRED` is reserved for missing/invalid credentials. (BL-181: the previous 401 made clients force a logout.)
    Context guards that find **no principal** (`@PreAuthorize` already guarantees one) are invariant fuses: they answer **403 `FORBIDDEN`** and log a warning with the request id, never 401 (BL-182).
servers:
  - url: /
x-owner-conventions: |-
  'x-owner' on a path item names the service that implements its server side. It is written only where the URL prefix would mislead: 7 paths under /internal/v1/agent* are served by CP (the Agent is their client), so they carry 'x-owner: cp'. Unannotated paths follow the prefix convention: /api/v1/** -> CP; /internal/v1/agent/** -> Agent; /internal/v1/runtime/** -> Runtime; other /internal/v1/** -> CP.
tags:
  - name: auth
    description: "Authentication, the caller's own identity (/me) and the OAuth device/callback flow"
  - name: admin
    description: "Instance administration: users, roles, permission grants, bindings and the audit log"
  - name: workspace
    description: "Workspace lifecycle, members, roots, checkpoints, git state and runtime materialization"
  - name: agent
    description: "Agent principals (and their templates), incl. per-workspace agent management and memories"
  - name: session
    description: "Sessions, conversation threads, transcripts and session-scoped operations"
  - name: chat
    description: "Chat runs, live monitoring, approvals and agent-to-user questions"
  - name: event
    description: "Workspace and session event streams"
  - name: config
    description: "Layered configuration: domains, keys, locks, policy, models, API input types and evaluation context"
  - name: provider
    description: "Model provider connections and the provider catalog"
  - name: credential
    description: "Credential lifecycle: create, rotate, reveal, references and audit trail"
  - name: mcp
    description: "MCP servers: workspace server registry, stdio servers and MCP configuration"
  - name: plugin
    description: "Plugins and plugin bindings (install, upgrade, enable/disable, per-session binding)"
  - name: skill
    description: "Skills and skill bindings"
  - name: rag
    description: "Retrieval-augmented generation: ingest, search, documents and stats"
  - name: attachment
    description: "Uploaded files and session attachments"
  - name: job
    description: "Long-running workspace jobs and scheduled tasks"
  - name: system
    description: "Operational endpoints: health, status, version, logs and telemetry"
  - name: service-agent
    description: "Service-to-service API used by the Agent service (internal only)"
  - name: service-runtime
    description: "Service-to-service API used by the Runtime service (internal only)"
  - name: service-misc
    description: "Remaining service-to-service API (OAuth token exchange, credential rotation, leases, queries, ...)"
x-tagGroups:
  - name: public
    tags: [auth, admin, workspace, agent, session, chat, event, config, provider, credential, mcp, plugin, skill, rag, attachment, job, system]
  - name: internal
    tags: [service-agent, service-runtime, service-misc]
paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user account
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '400': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and obtain an access token
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '401': { $ref: '#/components/responses/Problem' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Refresh an expired access token
      security: []
      parameters:
        - { in: header, name: X-Workspace-Id, required: false, schema: { type: string, format: uuid }, description: 'PLAN-0559: optional workspace to echo in workspaceId. Access tokens are user-level; this header never rebinds a token.' }
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' } }
  /api/v1/me/permissions:
    get:
      tags: [auth]
      operationId: myPermissions
      summary: Effective capabilities of the caller (PLAN-0610 W3-2b)
      description: 'Instance-scope materialized atoms plus one entry per active workspace membership. Read-only self service: the data source is the caller''s role bindings plus the materialized grants union (users.role is never read). task-415 (RBAC P1-1): atoms are grouped by (actionClass, resource) and each carries sources — the hit-source audit (which grant / role / scope produced it), so a permission face can explain itself instead of only listing names.'
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Self permission summary', content: { application/json: { schema: { $ref: '#/components/schemas/MePermissions' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: currentUser
      summary: Get the current authenticated user
      description: >-
        Returns the account view plus the coarse capability projection. The authoritative per-atom
        projection is GET /api/v1/me/permissions; this object only carries isInstanceAdmin /
        isInstanceSuper / workspaceAdminOf. The retired role string is never returned (PLAN-0610
        W3-2b decision #22).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthUser' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/bootstrap-status:
    get:
      tags: [auth]
      operationId: authBootstrapStatus
      summary: Check whether the instance still needs bootstrap
      security: []
      responses: { '200': { description: 'Onboarding status {initialized} (always 200, ungated)' } }
  /api/v1/workspaces/current:
    get: { tags: [workspace], operationId: getCurrentWorkspace, summary: Get the caller's current workspace, security: [{ bearerAuth: [] }], responses: { '200': { description: Current workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces:
    get: { tags: [workspace], operationId: listWorkspaces, summary: List workspaces visible to the caller, security: [{ bearerAuth: [] }], responses: { '200': { description: Active workspaces for current user, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Workspace' } } } } }, '401': { $ref: '#/components/responses/Problem' } } }
    post:
      tags: [workspace]
      operationId: createWorkspace
      summary: Create a new workspace
      security: [{ bearerAuth: [] }]
      parameters: [{ in: header, name: Idempotency-Key, required: false, schema: { type: string, maxLength: 128 } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { description: 'BACKEND_DISABLED (effective storageMode=managed_import needs the frozen docker backend; create direct_attach with hostPath + windows-host/windows-mxc) or another create conflict' } }
  /api/v1/workspaces/{workspaceId}:
    get: { tags: [workspace], operationId: getWorkspace, summary: Get one workspace by id, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { tags: [workspace], operationId: updateWorkspace, summary: Update workspace settings, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUpdateRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    delete: { tags: [workspace], operationId: deleteWorkspace, summary: Delete a workspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '204': { description: Logically deleted }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces/{workspaceId}/nested-repos:
    get:
      tags: [workspace]
      operationId: listWorkspaceNestedRepos
      summary: Nested git repositories discovered in a workspace (PLAN-0641 T2.3, TTL-cached)
      description: |
        PLAN-0641 M1 discovery read face (contract F2): `{path,type,declared}` items,
        depth-ascending. CP keeps a 30 s TTL cache (contract §3) warmed by the
        classify-only path after primary-root captures; declaring a root evicts the
        cache so `declared` labels re-project immediately. `type` =
        nested|gitdir|submodule|bare|symlink.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Nested repositories, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceNestedRepos' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { description: RUNTIME_UNAVAILABLE (Runtime unreachable for the read-only probe) }
  /api/v1/workspaces/{workspaceId}/roots:
    post:
      tags: [workspace]
      operationId: addWorkspaceRoot
      summary: Add a root to a multi-root workspace (PLAN-0639 D39-3)
      description: |
        PLAN-0639 M1: runtime root CRUD. The new root is available immediately
        (file access, authorization, watcher). Shadow repo is created lazily on
        first checkpoint capture. Nested roots (fully contained) are allowed;
        partial overlap → 400 INVALID_ROOT_OVERLAP. Requires workspace owner
        or cap:workspace:admin. PLAN-0641 M2 T3.2 (conservative ruling): while any
        run of the workspace is still non-terminal the declaration is refused with
        409 ROOT_IN_USE — the new root changes the root set of every later capture,
        so the in-flight run's rollback target would be incomplete.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceRootCreateRequest' }
      responses:
        '201': { description: 'Root created; projection returned, position appended. Shadow repo not yet created (lazy on first capture).', content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceRoot' } } } }
        '400': { description: 'Three causes, three codes (P-189 structure): a batch larger than 64 items fails the whole request with SKILL_IMPORT_TOO_LARGE (nothing is written, no item is processed — this is the live implementation, SkillImportValidator:105); a personal-layer (type=user) item whose object carries the trusted member fails the whole request with INVALID_REQUEST before any item is processed (P-189-1); any other malformed body answers INVALID_REQUEST.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'ROOT_PATH_CONFLICT (an active root already exists at that path) or ROOT_IN_USE (a workspace run is still non-terminal; declare after it finishes)' }
  /api/v1/workspaces/{workspaceId}/roots/{rootId}:
    patch:
      tags: [workspace]
      operationId: updateWorkspaceRoot
      summary: Update root alias or position (PLAN-0639 D39-3)
      description: |
        PLAN-0639 M1: body {alias?, position?}. Position change triggers
        sequential shift of sibling roots (soft-deleted rows do not
        participate). Does not change root path or id.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: rootId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceRootPatchRequest' }
      responses:
        '200': { description: Root updated., content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceRoot' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [workspace]
      operationId: deleteWorkspaceRoot
      summary: Soft-delete a root (PLAN-0639 D39-3)
      description: |
        PLAN-0639 M1: soft-delete (deleted_at set). Shadow repo is archived
        in-place (directory preserved, no longer written). Historical slices
        remain readable (diff/preview) but execute-revert → 409 ROOT_DELETED.
        Re-adding the same path creates a new rootId unconnected to old
        history. If any non-terminal run has slices attributed to this root,
        → 409 ROOT_IN_USE with reason (run ids). The primary root
        (rootId == workspaceId, position 0) cannot be deleted → 409
        PRIMARY_ROOT_IMMUTABLE: it equals the workspace itself, and every
        capture keeps it first (task-17 ruling).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: rootId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Root soft-deleted. Shadow repo archived in-place. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/agents:
    get:
      tags: [agent]
      operationId: listWorkspaceAgents
      summary: List the Agent principals a Workspace can use
      description: |
        D-174 (tier and `source` badge removed): the list merges the reach a
        Workspace member may use — principals bound here (`workspace_agents` row
        or a workspace-scoped agent role binding) unioned with the caller's own
        owned rows, which appear with `bound: false` until a cap binding exists.
        The row shape carries `permissionsSnapshot/bound/disabled/hooks/contextPolicy/roleIds`
        and no longer a `source` or `scope` field. Non-members get 403
        WORKSPACE_FORBIDDEN; prompts and provider secrets are never returned.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Agent principals usable in this Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceAgentListResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/agents/{principalId}:
    put:
      tags: [agent]
      operationId: setWorkspaceAgentCap
      summary: Add or update one Workspace Agent binding cap
      description: >-
        Requires the independent MANAGE_WORKSPACE_AGENTS grant scoped to this Workspace. An explicit
        atom must be within both the actor's current grants and the Agent principal's grants, or the
        call is refused with 403 AGENT_PERMISSION_SCOPE_EXCEEDED (never silently truncated to the
        baseline); only this Workspace binding is changed. Omitting `permissions` (body empty or
        only other keys absent) inherits the principal's ROLE BASELINE in this Workspace and stores
        `capSource='baseline'`; sending an array stores `capSource='explicit'`. An empty array is
        an explicit ZERO cap, never "inherit". The stored `capSource` keeps "the caller forgot the
        field" auditable apart from "the caller chose to inherit" (D-1109).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                permissions:
                  type: array
                  items: { $ref: '#/components/schemas/WorkspaceAgentPermission' }
                  description: >-
                    Optional (D-1109). Absent = inherit the role baseline; present (including [])
                    = this exact cap, frozen as `capSource='explicit'`.
            examples:
              explicitCap:
                summary: Caller pins the cap (stored as capSource=explicit)
                value:
                  permissions:
                    - { actionClass: read, resource: '*' }
              inheritBaseline:
                summary: Caller inherits the role baseline (stored as capSource=baseline)
                value: {}
      responses:
        '200': { description: Current Workspace binding cap, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceAgentCapView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [agent]
      operationId: unbindWorkspaceAgent
      summary: Remove one Workspace Agent binding
      description: Requires MANAGE_WORKSPACE_AGENTS; removes only this Workspace binding and preserves the principal and its other Workspace bindings.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Binding removed }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/agents/{principalId}/memories:
    get:
      tags: [agent]
      operationId: listWorkspaceAgentMemories
      deprecated: true
      summary: "[DEPRECATED] List one agent's memory (subject-level route preferred)"
      description: |
        PLAN-0629 M1-4 (C) + M1-5: the memory tab of the workspace agent dialog. Returns the subject's
        memory rows scoped to exactly this `(principal, workspace)` pair (candidates are never listed),
        pinned/updated first. V106 removed the `profile`/`fact` classification, so a row is an assertion
        plus its channel (`origin`) — not a typed fact.
        Archive ruling (Lead 2026-11-03): "删除" is an **archive**: the write delete is the V99 soft delete
        (`deleted_at`), so `status=active` (the default) is "what is in effect now", `status=retired`
        returns the archived rows and `status=all` both — every row carries `archived`/`deletedAt` so the
        UI can say 归档 instead of 删除. An unknown value is a 400, never a silent fallback.
        Authorization reuses the workspace agent list gate — a caller who cannot see the principal in
        this workspace gets the same 404 as an unknown principal (no existence leak).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, required: false, schema: { type: string, enum: [active, retired, all], default: active }, description: 'PLAN-0629 M1-5 (Lead 2026-11-03): active = in effect (default), retired = archived (soft-deleted) only, all = both. Unknown values are rejected with 400 INVALID_REQUEST.' }
      responses:
        '200': { description: 'Active memory rows (frozen envelope {memories:[…]})', content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND (also for a principal the caller cannot see)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [agent]
      operationId: createWorkspaceAgentMemory
      deprecated: true
      summary: "[DEPRECATED] Write one agent memory assertion (subject-level route preferred)"
      description: |
        PLAN-0629 M1-5: the write face of agent memory. `origin` and `source_ref` are injected by CP
        (`ui` + the caller's user id) and can never come from the body; `content_sha256` is always
        computed server-side.
        Authorization is the `MEMORY_WRITE` **action atom** evaluated in this workspace by
        `RequesterAuthority` — not a role name. V99 seeds it into no default role, so a normal account
        cannot write memory until an explicit grant (`SUPER_ADMIN` holds every atom by definition).
        The atom is checked before the visibility lookup, so a caller without it learns nothing about
        which principals exist; a caller with it gets the read face's 404 for a principal outside this
        workspace.
        Dedupe (D29-32, V106): writing the same normalized content again is not an error — the key is `(principal, workspace, content_sha256)`, so
        it returns the existing row with a refreshed `updatedAt` (one row per assertion, whatever the channel).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryCreateRequest' } } }
      responses:
        '201': { description: 'The stored (or dedupe-hit) memory row', content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryResponse' } } } }
        '400': { description: 'INVALID_REQUEST / MEMORY_CONTENT_TOO_LONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (MEMORY_WRITE not held in this workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND (also for a principal the caller cannot see)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/agents/{principalId}/memories/{memoryId}:
    patch:
      tags: [agent]
      operationId: updateWorkspaceAgentMemory
      deprecated: true
      summary: "[DEPRECATED] Edit one agent memory assertion (subject-level route preferred)"
      description: |
        PATCH semantics: send `content`, `pinned`, or both. Omitted fields are left alone, so pinning
        cannot accidentally rewrite the content hash. The row keeps its identity and provenance
        (`created_at`, `origin`, `source_ref`); `content_sha256` is recomputed server-side when the
        normalized content changes.
        Only live, `status='active'` rows are addressable: a `candidate` is invisible to listing and
        injection, so it answers the same 404 as a missing id.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryUpdateRequest' } } }
      responses:
        '200': { description: 'The updated memory row', content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryResponse' } } } }
        '400': { description: 'INVALID_REQUEST / MEMORY_CONTENT_TOO_LONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (MEMORY_WRITE not held in this workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'MEMORY_NOT_FOUND / AGENT_PRINCIPAL_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'MEMORY_DUPLICATE (the edit would collide with another live assertion)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [agent]
      operationId: deleteWorkspaceAgentMemory
      deprecated: true
      summary: "[DEPRECATED] Archive (soft-delete) one agent memory assertion (subject-level route preferred)"
      description: |
        Archive, not erase (Lead ruling 2026-11-03): the row keeps its identity, its audit trail
        (`memory_deleted`) and its history, while injection and the default listing stop returning it
        and the dedupe key is freed (the same content may be written again later). Read it back with
        `GET …/memories?includeArchived=true` (`archived=true`, `deletedAt` set).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Archived' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (MEMORY_WRITE not held in this workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'MEMORY_NOT_FOUND / AGENT_PRINCIPAL_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-principals/{principalId}/memories:
    get:
      tags: [agent]
      operationId: listAgentMemories
      summary: List one agent's memory (subject-level, V107)
      description: |
        V107 (user ruling 2026-11-04): memory belongs to the **agent principal**, not to a workspace, so
        the same principal reads one memory set in every workspace it is bound to. `workspaceId` is a
        **required** query parameter and is used only as the authorization context: the workspace agent
        visibility gate is evaluated there and the read returns identical rows for any workspace the
        principal is bound to. A missing `workspaceId` is a 400 `INVALID_REQUEST` (never an implicit
        "all workspaces" read).
        Candidates are never listed; `status=active` (default) is what is in effect, `status=retired` is
        the archived (soft-deleted) rows and `status=all` is both. An unknown value is a 400, never a
        silent fallback.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: true, schema: { type: string, format: uuid }, description: "Authorization context only (V107): the workspace in which the caller's visibility of this principal is evaluated. It is not part of the memory key." }
        - { in: query, name: status, required: false, schema: { type: string, enum: [active, retired, all], default: active }, description: "active = in effect (default), retired = archived (soft-deleted) only, all = both. Unknown values are rejected with 400 INVALID_REQUEST." }
      responses:
        '200': { description: 'Memory rows (frozen envelope {memories:[…]})', content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND (also for a principal the caller cannot see in the authorizing workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [agent]
      operationId: createAgentMemory
      summary: Write one agent memory assertion (subject-level, V107)
      description: |
        The write face of subject-level memory. `origin` and `source_ref` are injected by CP (`ui` + the
        caller's user id) and can never come from the body; `content_sha256` is always computed
        server-side. Dedupe key is `(principal_id, content_sha256)`: the same normalized assertion written
        from any workspace is one row (a re-write returns the existing row with a refreshed `updatedAt`).
        Authorization is the `MEMORY_WRITE` action atom evaluated in the `workspaceId` workspace (never a
        role name), checked **before** the visibility lookup so a caller without the atom learns nothing
        about which principals exist (403), while a caller with it gets the read face's 404 for a
        principal outside the authorizing workspace.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: true, schema: { type: string, format: uuid }, description: "Authorization context only (V107): the workspace whose grant is evaluated for MEMORY_WRITE and against which the audit row is filed." }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryCreateRequest' } } }
      responses:
        '201': { description: 'The stored (or dedupe-hit) memory row', content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryResponse' } } } }
        '400': { description: 'INVALID_REQUEST (missing workspaceId / bad body) or MEMORY_CONTENT_TOO_LONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (MEMORY_WRITE not held in the authorizing workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'AGENT_PRINCIPAL_NOT_FOUND (also for a principal the caller cannot see)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/agent-principals/{principalId}/memories/{memoryId}:
    patch:
      tags: [agent]
      operationId: updateAgentMemory
      summary: Edit one agent memory assertion (subject-level, V107)
      description: |
        PATCH semantics: send `content`, `pinned`, or both. Omitted fields are left alone, so pinning
        cannot accidentally rewrite the content hash. The row keeps its identity and provenance
        (`created_at`, `origin`, `source_ref`); `content_sha256` is recomputed when the normalized content
        changes. Only live, `status=active` rows are addressable: a candidate answers the same 404 as a
        missing id, and an id belonging to another principal is indistinguishable from a missing one.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: true, schema: { type: string, format: uuid }, description: "Authorization context only (V107)." }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryUpdateRequest' } } }
      responses:
        '200': { description: 'The updated memory row', content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryResponse' } } } }
        '400': { description: 'INVALID_REQUEST (missing workspaceId / bad body) or MEMORY_CONTENT_TOO_LONG', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (MEMORY_WRITE not held in the authorizing workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'MEMORY_NOT_FOUND / AGENT_PRINCIPAL_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'MEMORY_DUPLICATE (the edit would collide with another live assertion of this subject)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      tags: [agent]
      operationId: deleteAgentMemory
      summary: Archive (soft-delete) one agent memory assertion (subject-level, V107)
      description: |
        Archive, not erase: the row keeps its identity, its audit trail (`memory_deleted`) and its
        history, while injection and the default listing stop returning it and the dedupe key is freed
        (the same content may be written again later). Read it back with `GET …?status=retired|all`.
        The risk of a mis-delete is bounded by the subject: an id of another principal is a 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: memoryId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, required: true, schema: { type: string, format: uuid }, description: "Authorization context only (V107)." }
      responses:
        '204': { description: 'Archived' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (MEMORY_WRITE not held in the authorizing workspace)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'MEMORY_NOT_FOUND / AGENT_PRINCIPAL_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [workspace]
      operationId: listWorkspaceMembers
      summary: List workspace members (PLAN-0565)
      description: |
        PLAN-0565 (contract plans/PLAN-0565 spec §3): member list for
        OWNER/EDITOR (ruling #2: EDITOR read-only view, VIEWER 403). Items are
        `MemberView` (canonical role; legacy ADMIN/MEMBER project as EDITOR).
        Instance ADMIN (ruling #3) may read the list even without membership;
        non-members get 403 WORKSPACE_FORBIDDEN.
