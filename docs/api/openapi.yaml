        PLAN-0366: cancel the durable background job anchored on this operation item
        (owner-only, same key as job-output). Cancelling a job never changes the run or
        conversation terminal state. Idempotent for terminal archives: 200 with the
        original status and `changed=false`. `changed` only reports whether this call
        moved a `running` archive to a terminal state. 502 JOB_CANCEL_UNCONFIRMED means
        the Runtime could not confirm termination and the archive is unchanged; 502
        RUNTIME_UNAVAILABLE means the Runtime call failed and the archive is unchanged.
        Runtime 404 (job missing) archives the job as `orphaned` (fail-closed).
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: 'Cancel outcome: itemId/jobId/status/changed', content: { application/json: { schema: { $ref: '#/components/schemas/JobCancelResult' } } } }, '400': { $ref: '#/components/responses/Problem' }, '404': { description: 'OPERATION_ITEM_NOT_FOUND (not owner or missing; no 403) or JOB_ARCHIVE_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '502': { description: 'JOB_CANCEL_UNCONFIRMED (termination unconfirmed; archive unchanged) or RUNTIME_UNAVAILABLE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } } }
  /internal/v1/operations:
    post:
      operationId: startOperation
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationStartRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OperationStartResponse' } } } }, '200': { description: Idempotent replay of an existing operation, content: { application/json: { schema: { $ref: '#/components/schemas/OperationStartResponse' } } } }, '409': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' }, '503': { description: OPERATION_LOCK_TIMEOUT — bounded database lock wait exceeded; safe to retry } }
  /internal/v1/operations/{operationId}/trace:
    get:
      operationId: getInternalOperationTrace
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: operationId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Full operation trace (references only; artifact contents are never returned), content: { application/json: { schema: { $ref: '#/components/schemas/InternalOperationTrace' } } } }, '404': { $ref: '#/components/responses/Problem' }, '401': { $ref: '#/components/responses/Problem' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    RegisterRequest: { type: object, required: [email, password, name], properties: { email: { type: string }, password: { type: string }, name: { type: string } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
    AuthResponse: { type: object, properties: { accessToken: { type: string }, refreshToken: { type: string }, user: { type: object }, workspaceId: { type: string } } }
    Workspace: { type: object, required: [id, name, ownerId, storageBackend, storageRef, generation], properties: { id: { type: string }, name: { type: string }, description: { type: [string, 'null'] }, ownerId: { type: string }, storageBackend: { type: string }, storageRef: { type: string }, generation: { type: integer }, createdAt: { type: [string, 'null'], format: date-time }, updatedAt: { type: [string, 'null'], format: date-time } } }
    WorkspaceCreateRequest: { type: object, properties: { name: { type: string }, description: { type: [string, 'null'] }, profile: { type: string, enum: [strict, coding, isolated], default: coding, description: 'Sandbox profile for the initial ExecutionSpec. Unknown values are rejected with 400 INVALID_PROFILE.' }, image: { type: string, description: 'Sandbox image for the initial ExecutionSpec. Must be allowlisted; v1 only accepts xihe/workspace:latest. Unknown values are rejected with 400 INVALID_IMAGE.' } } }
    WorkspaceUpdateRequest: { type: object, properties: { name: { type: string }, description: { type: [string, 'null'] } } }
    CheckpointChangedFile:
       type: object
       additionalProperties: false
       required: [status, path]
       properties:
         status: { type: string, enum: [M, A, D] }
         path: { type: string }
    CheckpointRevertBookkeeping:
       type: object
       additionalProperties: false
       required: [state, at, counts, ref, attemptCount]
       properties:
         state: { type: string, enum: [none, rolled_back, partial, failed] }
         at: { type: [string, 'null'], format: date-time }
         counts: { type: [object, 'null'], additionalProperties: true }
         ref: { type: [string, 'null'], description: Restored slice ref recorded for the attempt }
         attemptCount: { type: integer, minimum: 0 }
    CheckpointSlice:
       type: object
       additionalProperties: false
       required: [id, sliceRef, capturedAt, sourceRunId, sourceSessionId, predecessorRef, changedFiles, changedCount, opaqueNestedRepos, state, unrollableReason, revert]
       properties:
         id: { type: string, format: uuid }
         sliceRef: { type: [string, 'null'], description: Null only for a degraded capture projection without a slice }
         capturedAt: { type: [string, 'null'], format: date-time }
         sourceRunId: { type: [string, 'null'] }
         sourceSessionId: { type: [string, 'null'] }
         predecessorRef: { type: [string, 'null'] }
         changedFiles: { type: array, items: { $ref: '#/components/schemas/CheckpointChangedFile' } }
         changedCount: { type: integer, minimum: 0 }
         truncated: { type: boolean, description: True when the bounded changedFiles list is incomplete }
         opaqueNestedRepos: { type: array, items: { type: string } }
         state: { type: string, enum: [captured, abnormal-captured, degraded, expired] }
         unrollableReason: { type: [string, 'null'], enum: [UNAVAILABLE, null] }
         revert: { $ref: '#/components/schemas/CheckpointRevertBookkeeping' }
    CheckpointRevertPreviewRequest:
       type: object
       additionalProperties: false
       required: [sliceRef]
       properties: { sliceRef: { type: string } }
    CheckpointRevertRequest:
       type: object
       additionalProperties: false
       required: [sliceRef, acknowledgeTypeChanges]
       properties:
         sliceRef: { type: string }
         acknowledgeTypeChanges: { type: array, items: { type: string }, description: Type-change paths confirmed from the preview }
    CheckpointRevertPreviewEntry:
       type: object
       additionalProperties: false
       required: [path, action, state]
       properties:
         path: { type: string }
         action: { type: string, enum: [restore, delete] }
         state: { type: string, enum: [execute, noop, type_conflict] }
         reason: { type: [string, 'null'] }
    CheckpointRevertPreviewResponse:
       type: object
       additionalProperties: false
       required: [sliceRef, counts, entries, truncated, opaqueNestedRepos]
       properties:
         sliceRef: { type: string }
         counts: { type: object, required: [restore, delete, typeConflict], properties: { restore: { type: integer }, delete: { type: integer }, typeConflict: { type: integer } } }
         entries: { type: array, items: { $ref: '#/components/schemas/CheckpointRevertPreviewEntry' } }
         truncated: { type: boolean }
         opaqueNestedRepos: { type: array, items: { type: string } }
    CheckpointRevertEntry:
       type: object
       additionalProperties: false
       required: [path, outcome]
       properties:
         path: { type: string }
         outcome: { type: string, enum: [restored, deleted, failed, suspect] }
         reason: { type: [string, 'null'] }
    CheckpointRevertResponse:
       type: object
       additionalProperties: false
       required: [sliceRef, counts, entries, durationMs, suspects]
       properties:
         sliceRef: { type: string }
         counts: { type: object, required: [restored, deleted, failed], properties: { restored: { type: integer }, deleted: { type: integer }, failed: { type: integer } } }
         entries: { type: array, items: { $ref: '#/components/schemas/CheckpointRevertEntry' } }
         durationMs: { type: integer, minimum: 0 }
         suspects: { type: array, items: { type: string } }
    CheckpointCleanupRequest:
       type: object
       additionalProperties: false
       required: [acknowledge]
       properties: { acknowledge: { type: boolean, const: true } }
    CheckpointCleanupResponse:
       type: object
       additionalProperties: false
       required: [removed]
       properties: { removed: { type: boolean } }
    RuntimeCheckpointCaptureRequest:
       type: object
       additionalProperties: false
       required: [runId, actor, callId]
       properties:
         runId: { type: string }
         actor: { type: string }
         callId: { type: string }
         abnormal: { type: boolean, default: false }
    RuntimeCheckpointCaptureResponse:
       type: object
       additionalProperties: false
       required: [runId, noChange, sliceRef, commit, capturedAt, state, changedFiles, opaqueNestedRepos, predecessor]
       properties:
         runId: { type: string }
         noChange: { type: boolean }
         sliceRef: { type: [string, 'null'] }
         commit: { type: [string, 'null'] }
         capturedAt: { type: [string, 'null'], format: date-time }
         state: { type: string, enum: [captured, abnormal-captured] }
         changedFiles: { type: array, items: { $ref: '#/components/schemas/CheckpointChangedFile' } }
         opaqueNestedRepos: { type: array, items: { type: string } }
         predecessor: { type: [string, 'null'] }
    RuntimeCheckpointGcResponse:
       type: object
       additionalProperties: false
       required: [counts]
       properties:
         counts: { type: object, required: [deleted, kept], properties: { deleted: { type: integer }, kept: { type: integer } } }
    Session: { type: object, required: [id, workspaceId, title, archived], properties: { id: { type: string }, workspaceId: { type: string }, title: { type: [string, 'null'] }, modelProvider: { type: [string, 'null'] }, modelName: { type: [string, 'null'] }, providerConnectionId: { type: [string, 'null'], readOnly: true }, connectionRevision: { type: [integer, 'null'], readOnly: true }, archived: { type: boolean }, createdAt: { type: [string, 'null'], format: date-time }, updatedAt: { type: [string, 'null'], format: date-time } } }
    SessionCreateRequest: { type: object, properties: { title: { type: [string, 'null'] }, modelProvider: { type: [string, 'null'] }, modelName: { type: [string, 'null'] }, providerConnectionId: { type: [string, 'null'] } } }
    SessionUpdateRequest: { type: object, properties: { title: { type: [string, 'null'] }, modelProvider: { type: [string, 'null'] }, modelName: { type: [string, 'null'] }, providerConnectionId: { type: [string, 'null'] } } }
    ChatRequest: { type: object, required: [sessionId, content], properties: { sessionId: { type: string }, content: { type: string }, provider: { type: string, description: 'Legacy display hint; CP resolves the server-side Session connection.' }, model: { type: string, description: 'Legacy display hint; CP resolves the server-side Session connection.' }, toolMode: { type: string, enum: [none, workspace], default: none }, attachments: { type: array, items: { type: string } }, toolTimeouts: { type: object, description: 'PLAN-0308 T1.9/T3.1: optional per-tool timeout request (per-call), the highest-priority input to the CP-computed tool budget. Values are positive integer seconds, max 30 (code constant MAX_BUDGET_SECONDS, shared with the DB config ceiling); invalid or oversized values are rejected with 400 INVALID_REQUEST (never silently clamped); sync waits >30s belong to async jobs.', additionalProperties: { type: integer, minimum: 1, maximum: 30 }, example: { execute_command: 20 } } } }
    ChatRunResponse: { type: object, required: [status, sessionId, runId], properties: { status: { type: string, enum: [accepted, queued, running, streaming, awaiting_approval, succeeded, failed, partial, ambiguous, cancelled] }, sessionId: { type: string }, messageId: { type: string }, runId: { type: string }, operationId: { type: string, format: uuid, readOnly: true, description: Durable Operation Ledger root for this ChatRun }, providerConnectionId: { type: [string, 'null'], readOnly: true }, connectionRevision: { type: [integer, 'null'], readOnly: true }, outcome: { type: string, enum: [success, error, partial, ambiguous] }, errorCode: { type: string }, reason: { type: string } } }
    ChatApprovalDecisionRequest:
      type: object
      additionalProperties: false
      description: |
        PLAN-0328 M1 approval decision. `decision` selects the grant tier (`once` | `session` |
        `saved`) or a rejection (`reject` | `reject_always`); the legacy `approved` boolean is
        still accepted and maps to once/reject. When both fields are supplied, `decision` takes
        precedence. `feedback` is reject-only; `layer`/`rule` apply to rule-granting decisions.
      properties:
        decision: { type: string, minLength: 1, enum: [once, session, saved, reject, reject_always] }
        approved: { type: boolean, description: Legacy boolean decision (maps to once/reject) }
        feedback: { type: string, minLength: 1, maxLength: 512, description: Rejection feedback carried to the model }
        layer: { type: string, minLength: 1, enum: [workspace, user], description: Target layer for saved/reject_always; default workspace }
        rule: { $ref: '#/components/schemas/ChatApprovalRuleSpec' }
      anyOf:
        - required: [decision]
        - required: [approved]
      allOf:
        - if:
            required: [feedback]
          then:
            anyOf:
              - required: [decision]
                properties: { decision: { enum: [reject, reject_always] } }
              - required: [approved]
                properties: { approved: { const: false } }
        - if:
            required: [layer]
          then:
            required: [decision]
            properties: { decision: { enum: [saved, reject_always] } }
        - if:
            required: [rule]
          then:
            required: [decision]
            properties: { decision: { enum: [session, saved, reject_always] } }
    ChatApprovalRuleSpec:
      type: object
      additionalProperties: false
      description: Optional narrowing of the granted rule; actionClass must equal the registry value (classification authority stays with the classification workflow).
      properties:
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 512 }
    ChatApprovalGrantedRule:
      type: object
      required: [layer, actionClass, resource, effect]
      properties:
        layer: { type: string, enum: [session, workspace, user] }
        actionClass: { type: string, minLength: 1 }
        resource: { type: string, minLength: 1 }
        effect: { type: string, enum: [allow, deny] }
    ChatRunStatusResponse:
      type: object
      additionalProperties: false
      required: [runId, sessionId, status, terminalOutcome, leaseExpired, pendingApprovals]
      properties:
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [accepted, queued, running, streaming, awaiting_approval, cancelling, dispatching, succeeded, failed, partial, ambiguous, cancelled] }
        terminalOutcome: { type: [string, 'null'], enum: [success, error, partial, ambiguous, cancelled] }
        leaseExpired: { type: boolean }
        pendingApprovals: { type: array, items: { $ref: '#/components/schemas/ChatApprovalRequest' } }
    ChatApprovalDecisionResponse:
      type: object
      required: [status, requestId, approved]
      properties:
        status: { type: string, enum: [accepted, already_decided] }
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
        decision: { type: string, enum: [once, session, saved, reject, reject_always] }
        propagated: { type: integer, minimum: 0, description: Same-session pending requests resolved by propagation }
        modeAtGrant:
          oneOf:
            - $ref: '#/components/schemas/PolicyMode'
            - type: 'null'
          description: Effective session mode captured before Agent notification; legacy rows may omit it or return null.
        rule: { $ref: '#/components/schemas/ChatApprovalGrantedRule' }
    PendingApprovalSummary:
      type: object
      required: [sessionId, workspaceId, count, oldestRequestedAt]
      properties:
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        count: { type: integer, minimum: 1 }
        oldestRequestedAt: { type: string, format: date-time }
    AgentApprovalDecisionRequest:
      type: object
      required: [requestId, approved]
      additionalProperties: false
      properties:
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
        decision: { type: string, minLength: 1, enum: [once, session, saved, reject, reject_always, propagated_allow, propagated_reject] }
        feedback: { type: string, minLength: 1, maxLength: 512 }
    AgentApprovalDecisionResponse:
      type: object
      additionalProperties: false
      description: Raw Agent response to an approval decision. CP-only decision metadata is not returned by Agent.
      required: [status, requestId, approved]
      properties:
        status: { type: string, enum: [accepted, already_decided] }
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
    AgentApprovalStatus:
      type: object
      additionalProperties: false
      description: Raw Agent coordinator status. This internal response does not include the CP policy summary, CP approval state, replay marker, or modeAtGrant.
      required: [status, requestId]
      properties:
        status: { type: string, enum: [pending, approved, rejected, expired] }
        requestId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        tool: { type: string }
        action: { type: string }
        details: { type: string }
        argumentsHash: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        approved: { type: [boolean, 'null'] }
    PolicyMode:
      type: string
      enum: [manual, auto]
    PolicyModeState:
      type: object
      additionalProperties: false
      required: [sessionId, mode, sessionRules]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
        sessionRules: { type: integer, minimum: 0 }
    PolicyModeUpdateRequest:
      type: object
      required: [sessionId, mode]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
    PolicyModeUpdateResponse:
      type: object
      additionalProperties: false
      required: [sessionId, mode, scope]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
        scope: { type: string, enum: [session] }
    PolicyDomainView:
      type: object
      additionalProperties: false
      required: [actionClass, effectiveLayer, configuredLayers, ruleCounts]
      properties:
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        effectiveLayer: { type: string, enum: [builtin, instance, user, workspace] }
        configuredLayers:
          type: array
          items: { type: string, enum: [instance, user, workspace] }
        ruleCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    PolicyRuleView:
      type: object
      additionalProperties: false
      description: |
        Persisted authorization rule. `effective` reports whether this rule's layer is the
        domain's effective layer (configured by the highest layer); it is not a runtime match
        result. `conflict` carries the server's static conflict note (for example an allow
        shadowed by a more specific deny) or null when the row has none.
      required: [id, layer, ownerId, actionClass, resource, effect, priority, locked, effective, conflict]
      properties:
        id: { type: string, format: uuid }
        layer: { type: string, enum: [instance, user, workspace] }
        ownerId: { type: [string, 'null'] }
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 512 }
        effect: { type: string, enum: [allow, ask, deny] }
        priority: { type: integer }
        locked: { type: boolean }
        effective: { type: boolean }
        conflict: { type: [string, 'null'] }
    PolicyRuleCreateRequest:
      type: object
      additionalProperties: false
      required: [layer, actionClass, resource, effect]
      properties:
        layer: { type: string, enum: [instance, user, workspace] }
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 512 }
        effect: { type: string, enum: [allow, ask, deny] }
        priority: { type: integer, default: 0 }
        locked: { type: boolean, default: false, description: ADMIN only, and only with deny/ask. }
    ToolFaceView:
      type: object
      additionalProperties: false
      description: |
        Tool classification entry. Catalog built-ins use a nullable id and ownerId and the
        literal response scope `builtin`; persisted instance/workspace rows retain their UUID
        and owner. An unclassified tool is not a catalog entry and is represented at approval
        time as actionClass `unclassified` with shape `opaque` and effect `ask`.
      required: [id, scope, ownerId, tool, actionClass, shape]
      properties:
        id: { type: [string, 'null'], format: uuid, readOnly: true }
        scope: { type: string, enum: [builtin, instance, workspace], readOnly: true }
        ownerId: { type: [string, 'null'], readOnly: true }
        tool: { type: string, minLength: 1, readOnly: true }
        actionClass: { type: string, minLength: 1, readOnly: true }
        shape: { type: string, enum: [structured, interpreter, opaque], readOnly: true }
    ToolFaceUpsertRequest:
      type: object
      additionalProperties: false
      required: [scope, tool, actionClass, shape]
      properties:
        scope: { type: string, enum: [instance, workspace] }
        tool: { type: string, minLength: 1, maxLength: 128 }
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
    ChatApprovalRequest:
      type: object
      additionalProperties: false
      description: CP-owned durable approval envelope used by live/replayed SSE events and ChatRun recovery. Details is a bounded preview; raw tool arguments are never included. Legacy rows may omit argumentsHash and state; when present they are preserved as emitted.
      required: [requestId, runId, sessionId, workspaceId, tool, action, details, expiresAt, replayed]
      properties:
        requestId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        tool: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        details: { type: string, minLength: 1 }
        argumentsHash: { type: [string, 'null'], description: Hash of the canonical arguments; the arguments themselves are not included. }
        expiresAt: { type: string, format: date-time }
        state: { type: string, enum: [pending, dispatching, dispatch_unknown, approved, rejected, expired] }
        replayed: { type: boolean }
        modeAtGrant: { $ref: '#/components/schemas/PolicyMode', description: Fallback top-level placement used only when no policy summary is available. }
        policy: { $ref: '#/components/schemas/ApprovalPolicySummary' }
    ApprovalPolicySummary:
      type: object
      additionalProperties: false
      description: Safe, display-only policy metadata. Raw tool arguments are never included.
      required: [effect, sourceLayer, matchedRule, reason, mode, actionClass, shape]
      properties:
        effect: { type: string, enum: [allow, ask, deny] }
        sourceLayer: { type: string, enum: [builtin, instance, user, workspace, session, per_call] }
        matchedRule: { type: [string, 'null'], minLength: 1 }
        reason: { type: string, minLength: 1 }
        mode: { type: [string, 'null'], enum: [manual, auto] }
        actionClass: { type: string, minLength: 1 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
        modeAtGrant:
          oneOf:
            - $ref: '#/components/schemas/PolicyMode'
            - type: 'null'
          description: Effective session mode captured by the atomic decision claim; legacy rows may omit it or return null.
    ProviderCatalogResponse:
       type: object
       required: [catalogRevision, providers]
       properties:
         catalogRevision: { type: string }
         providers: { type: array, items: { $ref: '#/components/schemas/ProviderDefinition' } }
    ProviderDefinition:
       type: object
       required: [id, displayName, adapter, modelDiscovery, credential, supports]
       properties:
         id: { type: string, pattern: '^[a-z0-9][a-z0-9._:-]{1,127}$' }
         displayName: { type: string }
         category: { type: string, enum: [recommended, other, custom] }
         adapter: { type: string, enum: [native-litellm, openai-compatible, manual-model] }
         litellmProvider: { type: [string, 'null'] }
         defaultBaseUrl: { type: [string, 'null'], format: uri }
         modelDiscovery: { type: string, enum: [remote-models, litellm-catalog, curated, manual] }
         credential: { $ref: '#/components/schemas/ProviderCredentialDefinition' }
         supports: { $ref: '#/components/schemas/ProviderSupports' }
    ProviderCredentialDefinition:
       type: object
       required: [type, required]
       properties:
         type: { type: string, enum: [api-key, none] }
         required: { type: boolean }
         placeholder: { type: [string, 'null'] }
    ProviderSupports:
       type: object
       required: [customBaseUrl, streaming]
       properties:
         customBaseUrl: { type: boolean }
         streaming: { type: boolean }
         tools: { type: boolean }
         vision: { type: boolean }
    ProviderConnectionListResponse:
       type: object
       required: [connections]
       properties:
         connections: { type: array, items: { $ref: '#/components/schemas/ProviderConnection' } }
    ProviderConnection:
       type: object
       required: [id, providerId, label, scope, hasKey, enabled, status, revision]
       properties:
         id: { type: string, format: uuid, readOnly: true }
         providerId: { type: string }
         label: { type: string, maxLength: 128 }
         scope: { type: string, enum: [USER, WORKSPACE, SYSTEM], readOnly: true }
         workspaceId: { type: [string, 'null'], readOnly: true }
         baseUrl: { type: [string, 'null'], format: uri }
         hasKey: { type: boolean, readOnly: true }
         maskedKey: { type: [string, 'null'], readOnly: true }
         enabled: { type: boolean }
         status: { type: string, enum: [unverified, verifying, ready, invalid_credentials, unreachable, disabled] }
         lastVerifiedAt: { type: [string, 'null'], format: date-time, readOnly: true }
