      summary: List built-in and persisted tool classifications
      description: |
        Returns the effective tool-face catalog for the requested `instance` or `workspace`
        scope. Built-in entries are returned with `id: null`, `scope: builtin`, and
        `ownerId: null`. Persisted instance entries override built-ins; workspace entries
        override both for a workspace request. Unknown third-party tools are intentionally
        absent until their first approval request and explicit classification. Authorization
        is enforced server-side from the authenticated TenantContext.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string, enum: [instance, workspace] }
          description: Effective catalog scope to list; `builtin` is response metadata only.
      responses:
        '200':
          description: Effective tool-face catalog, sorted by tool name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ToolFaceView' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [config]
      operationId: upsertPolicyToolFace
      summary: Classify a tool face
      description: |
        Creates or updates an explicit instance or workspace classification. Built-in faces
        cannot be written as a scope. Instance writes require the server-side ADMIN guard;
        workspace writes require the server-side workspace owner/admin guard.
      security: [{ bearerAuth: [] }]
      requestBody:
