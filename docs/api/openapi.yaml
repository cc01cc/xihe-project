  /api/v1/events:
    get:
      operationId: chatEvents
      summary: Subscribe to session-scoped persistent SSE
      description: |
        Session-scoped **persistent** Server-Sent Events connection.
        * One active emitter per `sessionId` (v1). A new `GET /api/v1/events?sessionId=` replaces any prior emitter for the same session; the old emitter's completion/timeout/error callbacks are identity-checked and must not delete the new emitter (`stale_cleanup_ignored`).
        * `done` terminates a **run**, not the session SSE. The connection stays open across multiple `POST /api/v1/chat` turns and only closes on client disconnect, session deletion, or explicit server termination.
        * The server sends a `heartbeat` comment/event every 15s to keep the connection observable. Heartbeat never enters the message bubble nor resets the run's token count.
        * Connection authorization is bounded by the access-token lifetime; v1 closes the SSE before token expiry and the UI enters a recoverable authenticated state (no silent credential leak).
        * `derived_state_changed` is sent on the parent Session channel after a child terminal commits. Its JSON is exactly `{sessionId,runId,state,at}`: `sessionId` and `runId` identify the child, `at` equals durable `chat_runs.terminal_at`; it is best-effort only and the parent page re-reads its own `GET /api/v1/sessions/{sessionId}/derived-state` for authoritative state.
        * PLAN-0338/0339: the session channel also carries `run_checkpoint` — `{runId, sessionId, sliceRef?, capturedAt?, state, changedCount, unrollableReason?, revert?}` — after a slice capture, a degraded capture, or a completed restore (`revert` = `{state, at, counts, ref, attemptCount}`). The event only annotates lifecycle; the workspace slice list remains the durable source on reload.
        * PLAN-0508: bounded provider transport telemetry rides this same session channel as `transport_progress` (`{requestId,runId,attemptId,seq,stage,startedAt,elapsedMs}`; at most four stage transitions per attempt: `attempt_started`/`first_chunk`/`streaming`/`attempt_finished`) and `transport_attempt` (`{requestId,runId,attemptId,seq,startedAt,endedAt,durationMs,outcome,errorCode,firstChunkMs,chunkCount,uploadBytes,downloadBytes}`; exactly once per attempt, `outcome` ∈ `success|error|timeout|aborted`). CP persists the durable attempt row before relaying; ordering between telemetry and other events is not guaranteed and `GET /api/v1/chat/runs/{runId}/attempts` is the authoritative source. The events are diagnostic side-channel state and never change run semantics.
          * Event order per run is `connected` (once per SSE open) → `status`/`thinking` (optional) → `approval_request` (optional) → approval decision via the CP public route → `tool_result` (approval gate) → downstream `tool_call`/`tool_result` and `token` (only after approval) → `done` (exactly one, may carry `errorCode`/`synthetic`). Tool events carry `toolCallId` and `origin` (`local` or `mcp`) for canonical tool-call correlation and source attribution; `request_approval` itself is represented by the approval request and approval-history record and does not emit a duplicate tool event. Approval live/replay envelopes are built from the durable row only and include `state`, the durable creation `origin` (`cp_gate` for CP-gate rows, `agent_relay` for model-initiated `request_approval`, null for rows predating V25) plus `replayed=false/true`; at creation, the display-only `policy` summary is persisted when it can be captured: `effect`, `sourceLayer`, `matchedRule`, `reason`, `mode`, `actionClass`, and `shape`. The policy summary never contains raw tool arguments. After the atomic decision claim, `policy.modeAtGrant` records the effective session mode at that decision and is never rewritten by a retry; replay uses the stored snapshot, and descriptor failure omits only policy metadata without blocking delivery. On rejection/expiry, no downstream sensitive tool call is allowed and a terminal `error` + `done` is sent. The session SSE is retained unless the emitter itself is unwritable. A failed, parseable command result may carry an optional `diagnostics` bundle (`{items, total, confidence}`; `items` is the Top-N slice of `total`) on `tool_result` data — structured facts copied from the Agent tool-message artifact channel and relayed unchanged by CP; the model-visible `<diagnostics>` block stays inside the untrusted envelope.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
          description: Session to subscribe to (must belong to current workspace/user)
      responses:
        '200':
          description: 'SSE stream — one event per line `event: <name>` + `data: <json>`'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"sessionId":"sess-123","type":"connected"}

                event: token
                data: {"content":"hello ","type":"token","runId":"run-abc"}

                event: token
                data: {"content":"world","type":"token","runId":"run-abc"}

                event: tool_call
                data: {"tool":"write_file","toolCallId":"call-1","origin":"mcp","type":"tool_call","runId":"run-abc"}

                event: tool_result
                data: {"tool":"write_file","toolCallId":"call-1","origin":"mcp","type":"tool_result","runId":"run-abc","result":"ok"}

                event: tool_result
                data: {"tool":"execute_command","toolCallId":"call-2","origin":"mcp","type":"tool_result","runId":"run-abc","result":"...","diagnostics":{"items":[{"file":"src/app.ts","line":12,"column":3,"severity":"error","kind":"compile","message":"TS2345: Argument of type 'string' is not assignable to parameter of type 'number'","confidence":"high"}],"total":5,"confidence":"high"}}

                event: usage
                data: {"usage":{"inputTokens":372,"outputTokens":56,"totalTokens":428,"estimatedInputTokens":351,"source":"real","providerUnknownFields":["cache_read_input_tokens"],"windowTokens":131072,"model":"deepseek/deepseek-v4-flash","cost":0.1620,"costCurrency":"USD","costSource":"price_table","costNote":null}}

                event: done
                data: {"type":"done","runId":"run-abc"}

                event: run_checkpoint
                data: {"runId":"run-abc","sessionId":"sess-123","sliceRef":"refs/xihe/slices/1757980000000-ab12cd","state":"captured","changedCount":3,"revert":null}

                event: transport_progress
                data: {"requestId":"req-123","runId":"run-abc","attemptId":"0b0f1f3e-8a2d-4f3a-9d6c-2f0c1e5a7b41","seq":1,"stage":"first_chunk","startedAt":"2026-10-14T08:00:00Z","elapsedMs":83}

                event: transport_attempt
                data: {"requestId":"req-123","runId":"run-abc","attemptId":"0b0f1f3e-8a2d-4f3a-9d6c-2f0c1e5a7b41","seq":1,"startedAt":"2026-10-14T08:00:00Z","endedAt":"2026-10-14T08:00:02Z","durationMs":2000,"outcome":"success","errorCode":null,"firstChunkMs":83,"chunkCount":5,"uploadBytes":null,"downloadBytes":null}

                event: heartbeat
                data: {"type":"heartbeat","connectionGeneration":2}

                event: derived_state_changed
                data: {"sessionId":"child-session-uuid","runId":"child-run-uuid","state":"success","at":"2026-09-27T04:00:00Z"}
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/events:
    get:
      operationId: workspaceEvents
      summary: Subscribe to workspace-scoped file and lifecycle SSE
      description: |
        Workspace-scoped Server-Sent Events for users who can access the Workspace,
        including Workspaces without a Session. The stream carries compact `file_changed` hints;
        file contents and directory listings are always re-read through the existing Workspace HTTP/MCP APIs.
        Scheduled-task state changes (PLAN-0489 T1.5) are broadcast on the same stream as a coarse
        `kind: scheduled_tasks_changed` invalidation hint with no per-row payload; on receipt the
        client refetches `GET /api/v1/workspaces/{workspaceId}/scheduled-tasks`.
        Each event has a Workspace-local sequence. v1 keeps no replay log: a gap or reconnect may require
        an HTTP/MCP refresh. An overflow, or a stale `Last-Event-ID` gap, is signalled with
        `kind: snapshot_required` plus a `reason` (`overflow` for a Runtime buffer overflow,
        `sequence_gap` for a reconnect past the retained sequence); it carries no `snapshotVersion`,
        so the client must re-read state through the Workspace HTTP/MCP APIs rather than apply a
        partial replay.
        Heartbeats are transport-only and do not represent file changes.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema: { type: string }
        - in: header
          name: Last-Event-ID
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Last received Workspace-local event sequence.
      responses:
        '200':
          description: 'SSE stream — compact Workspace event hints'
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: 12
                event: file_changed
                data: {"workspaceId":"ws-123","sequence":12,"kind":"file_changed","path":"src/app.ts","changeType":"modified","source":"runtime"}

                id: 13
                event: scheduled_tasks_changed
                data: {"workspaceId":"ws-123","sequence":13,"kind":"scheduled_tasks_changed","source":"control-plane"}

                event: heartbeat
                data: {"workspaceId":"ws-123","sequence":13,"type":"heartbeat"}
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
