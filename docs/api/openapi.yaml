  /api/v1/workspaces/{workspaceId}/checkpoints/cleanup:
      post:
        operationId: cleanupWorkspaceCheckpoints
        summary: Physically clear all workspace checkpoint history
        description: |
          After explicit acknowledgement, asks Runtime to remove the shadow repository and then clears
          the CP checkpoint slice record rows. The operation is idempotent; capture or restore in progress returns
          `409 CHECKPOINT_BUSY` and CP rows are not removed before Runtime cleanup succeeds.
        security: [{ bearerAuth: [] }]
        parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointCleanupRequest' } } }
        responses:
          '200':
            description: Cleanup result
            content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointCleanupResponse' } } }
          '400': { $ref: '#/components/responses/Problem' }
          '401': { $ref: '#/components/responses/Problem' }
          '403': { $ref: '#/components/responses/Problem' }
          '404': { $ref: '#/components/responses/Problem' }
          '409': { $ref: '#/components/responses/Problem' }
          '503': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/git-status:
    get:
      operationId: getWorkspaceGitStatus
      summary: User-repository git status (dual-diff "待提交" side)
      description: |
        Read-only view of the workspace's own `.git` porcelain status, used next to the
        shadow-checkpoint slice diff (the two are independent histories and may legitimately disagree).
        Non-Git workspaces answer `isRepository: false` with an empty entry list; a missing/below-minimum
