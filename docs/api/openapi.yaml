      properties:
        runId: { type: string, format: uuid }
        attempts: { type: array, items: { $ref: '#/components/schemas/ChatTransportAttempt' } }
        aggregate: { $ref: '#/components/schemas/ChatTransportAggregate' }
    RunTraceResponse:
      type: object
      additionalProperties: false
      description: PLAN-0509 read-only, bounded projection of privacy-safe durable Run facts.
      required: [runId, asOf, completeness, provenance, sources, events, nextCursor]
      properties:
        runId: { type: string, format: uuid }
        asOf: { type: string, format: date-time }
        completeness: { type: string, enum: [complete, partial, unknown] }
        provenance: { $ref: '#/components/schemas/RunTraceProvenance' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/RunTraceSource' }
        events:
          type: array
          items: { $ref: '#/components/schemas/RunTraceEvent' }
        nextCursor: { type: [string, 'null'], maxLength: 1024 }
    RunTraceProvenance:
      type: object
      additionalProperties: false
      description: >-
        PLAN-0509 allowlisted scalar provenance only. status is complete when all seven
        values are valid, partial when some are valid, and unknown when none are available.
        No template body, request template, credential, or connection secret is included.
      required: [status, providerConnectionId, connectionRevision, apiTypeId, apiTypeVersion, contextTemplateLayer, contextTemplateId, contextTemplateVersion]
      properties:
        status: { type: string, enum: [complete, partial, unknown] }
        providerConnectionId: { type: [string, 'null'], format: uuid }
        connectionRevision: { type: [integer, 'null'], format: int64, minimum: 0 }
        apiTypeId: { type: [string, 'null'], minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$' }
        apiTypeVersion: { type: [integer, 'null'], minimum: 1 }
        contextTemplateLayer: { type: [string, 'null'], enum: [instance, user, workspace, null] }
        contextTemplateId: { type: [string, 'null'], format: uuid }
        contextTemplateVersion: { type: [integer, 'null'], minimum: 1 }
    RunTraceSource:
      type: object
      additionalProperties: false
      required: [source, status]
      properties:
        source: { type: string, enum: [chat_run, context_event, provider_attempt, mcp_invocation, runtime_job] }
        status: { type: string, enum: [complete, unavailable, not_applicable, unknown] }
    RunTraceEvent:
      type: object
      additionalProperties: false
      description: >-
        Allowlisted durable fact. This projection never exposes prompts, message bodies,
        tool arguments/results, credentials, raw ContextEvent payloads, or Runtime state.
      required: [eventId, occurredAt, source, kind, status, durationMs, providerId, modelId, errorCode, usage, toolName, references]
      properties:
        eventId: { type: string, maxLength: 256 }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [chat_run, context_event, provider_attempt, mcp_invocation, runtime_job] }
        kind: { type: string, enum: [run.lifecycle, input.admitted, context.source, agent.tool, provider.attempt, mcp.invocation, runtime.job, usage.recorded] }
        status: { type: [string, 'null'], enum: [created, queued, running, awaiting_approval, completed, failed, cancelled, admitted, started, succeeded, pending, ambiguous, resolved, missing, rejected, stale, recorded, estimated, unknown, null] }
        durationMs: { type: [integer, 'null'], minimum: 0 }
        providerId: { type: [string, 'null'], maxLength: 128 }
        modelId: { type: [string, 'null'], maxLength: 128 }
        errorCode: { type: [string, 'null'], maxLength: 64 }
        usage:
          oneOf:
            - { $ref: '#/components/schemas/RunTraceUsage' }
            - { type: 'null' }
        toolName: { type: [string, 'null'], maxLength: 128 }
        references:
          type: object
          additionalProperties: false
          properties:
            contextEventId: { type: string, format: uuid }
            toolCallId: { type: string, maxLength: 128 }
            attemptId: { type: string, format: uuid }
            mcpInvocationId: { type: string, format: uuid }
            runtimeJobId: { type: string, format: uuid }
      allOf:
        - if:
            required: [kind]
            properties: { kind: { const: input.admitted } }
          then:
            properties:
              source: { const: context_event }
              status: { const: admitted }
              durationMs: { type: "null" }
              toolName: { type: "null" }
              providerId: { type: "null" }
              modelId: { type: "null" }
              errorCode: { type: "null" }
              usage: { type: "null" }
              references:
                type: object
                additionalProperties: false
                required: [contextEventId]
                maxProperties: 1
                properties:
                  contextEventId: { type: string, format: uuid }
    RunTraceUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens: { type: [integer, 'null'], minimum: 0 }
        outputTokens: { type: [integer, 'null'], minimum: 0 }
        totalTokens: { type: [integer, 'null'], minimum: 0 }
    ChatTransportAttempt:
      type: object
      additionalProperties: false
      description: |
        PLAN-0508 durable transport attempt (V68 row projection); provider/model/connection
        identity is projected from the immutable ChatRun snapshot. Terminal metrics come from
        the Agent summary only (null when absent); `lastProgressStage` / `lastProgressElapsedMs`
        are the last accepted bounded stage sample (static, never extrapolated); wire bytes are
        fixed null in v1 (unknown); the single `errorCode` slot carries the safe string code or
        the provider HTTP status.
      required: [attemptId, seq, status, outcome, provider, model, connectionId, connectionRevision, startedAt, endedAt, durationMs, errorCode, firstChunkMs, chunkCount, uploadBytes, downloadBytes, lastProgressStage, lastProgressElapsedMs]
      properties:
        attemptId: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        status: { type: string, enum: [running, terminal] }
        outcome:
          oneOf:
            - type: string
              enum: [success, error, timeout, aborted, partial]
            - type: 'null'
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        connectionId: { type: string, nullable: true }
        connectionRevision: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, minimum: 0, nullable: true }
        errorCode:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        firstChunkMs: { type: integer, minimum: 0, nullable: true }
        chunkCount: { type: integer, minimum: 0, nullable: true }
        uploadBytes: { type: integer, nullable: true, description: Fixed null in v1 (unknown, never fabricated) }
        downloadBytes: { type: integer, nullable: true, description: Fixed null in v1 (unknown, never fabricated) }
        lastProgressStage: { type: string, nullable: true, enum: [attempt_started, first_chunk, streaming, attempt_finished] }
        lastProgressElapsedMs: { type: integer, minimum: 0, nullable: true }
    ChatApprovalDecisionRequest:
      type: object
      additionalProperties: false
      description: |
        PLAN-0328 M1 approval decision. `decision` selects the grant tier (`once` | `session` |
        `saved`) or a rejection (`reject` | `reject_always`); the legacy `approved` boolean is
        still accepted and maps to once/reject. When both fields are supplied, `decision` takes
        precedence. `feedback` is reject-only; `layer`/`rule` apply to rule-granting decisions.
      properties:
        decision: { type: string, minLength: 1, enum: [once, session, saved, reject, reject_always] }
        approved: { type: boolean, description: Legacy boolean decision (maps to once/reject) }
        feedback: { type: string, minLength: 1, maxLength: 512, description: Rejection feedback carried to the model }
        layer: { type: string, minLength: 1, enum: [workspace, user], description: Target layer for saved/reject_always; default workspace }
        rule: { $ref: '#/components/schemas/ChatApprovalRuleSpec' }
      anyOf:
        - required: [decision]
        - required: [approved]
      allOf:
        - if:
            required: [feedback]
          then:
            anyOf:
              - required: [decision]
                properties: { decision: { enum: [reject, reject_always] } }
              - required: [approved]
                properties: { approved: { const: false } }
        - if:
            required: [layer]
          then:
            required: [decision]
            properties: { decision: { enum: [saved, reject_always] } }
        - if:
            required: [rule]
          then:
            required: [decision]
            properties: { decision: { enum: [session, saved, reject_always] } }
    ChatApprovalRuleSpec:
      type: object
      additionalProperties: false
      description: Optional narrowing of the granted rule; actionClass must equal the registry value (classification authority stays with the classification workflow).
      properties:
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 512 }
    ChatApprovalGrantedRule:
      type: object
      required: [layer, actionClass, resource, effect]
      properties:
        layer: { type: string, enum: [session, workspace, user] }
        actionClass: { type: string, minLength: 1 }
        resource: { type: string, minLength: 1 }
        effect: { type: string, enum: [allow, deny] }
    ChatRunStatusResponse:
      type: object
      additionalProperties: false
      required: [runId, sessionId, origin, status, terminalOutcome, leaseExpired, pendingApprovals]
      properties:
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        origin: { type: string, enum: [user_submission, spawn], readOnly: true }
        status: { type: string, enum: [accepted, queued, running, streaming, awaiting_approval, cancelling, dispatching, succeeded, failed, partial, ambiguous, cancelled] }
        terminalOutcome: { type: [string, 'null'], enum: [success, error, partial, ambiguous, cancelled] }
        leaseExpired: { type: boolean }
        pendingApprovals: { type: array, items: { $ref: '#/components/schemas/ChatApprovalRequest' } }
    ChatApprovalDecisionResponse:
      type: object
      required: [status, requestId, approved]
      properties:
        status: { type: string, enum: [accepted, already_decided] }
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
        decision: { type: string, enum: [once, session, saved, reject, reject_always] }
        propagated: { type: integer, minimum: 0, description: Same-session pending requests resolved by propagation }
        modeAtGrant:
          oneOf:
            - $ref: '#/components/schemas/PolicyMode'
            - type: 'null'
          description: Effective session mode captured before Agent notification; legacy rows may omit it or return null.
        rule: { $ref: '#/components/schemas/ChatApprovalGrantedRule' }
    PendingApprovalSummary:
      type: object
      required: [sessionId, workspaceId, count, oldestRequestedAt]
      properties:
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        count: { type: integer, minimum: 1 }
        oldestRequestedAt: { type: string, format: date-time }
    AgentApprovalDecisionRequest:
      type: object
      required: [requestId, approved]
      additionalProperties: false
      properties:
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
        decision: { type: string, minLength: 1, enum: [once, session, saved, reject, reject_always, propagated_allow, propagated_reject] }
        feedback: { type: string, minLength: 1, maxLength: 512 }
    AgentApprovalDecisionResponse:
      type: object
      additionalProperties: false
      description: Raw Agent response to an approval decision. CP-only decision metadata is not returned by Agent.
      required: [status, requestId, approved]
      properties:
        status: { type: string, enum: [accepted, already_decided] }
        requestId: { type: string, format: uuid }
        approved: { type: boolean }
    AgentApprovalStatus:
      type: object
      additionalProperties: false
      description: Raw Agent coordinator status. This internal response does not include the CP policy summary, CP approval state, replay marker, or modeAtGrant.
      required: [status, requestId]
      properties:
        status: { type: string, enum: [pending, approved, rejected, expired] }
        requestId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        tool: { type: string }
        action: { type: string }
        details: { type: string }
        argumentsHash: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        approved: { type: [boolean, 'null'] }
