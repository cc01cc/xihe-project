      summary: Run the Runtime retention sweep for one workspace
      description: |
        Proxies the Runtime slice sweep (newest N=50 + TTL 30 days) and returns its counts. The sweep
        is best-effort; expired slices are omitted from the public timeline.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Retention sweep counts
          content:
