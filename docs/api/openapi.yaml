        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertPreviewRequest' } } }
        responses:
          '200':
            description: Restore plan for the selected slice
            content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertPreviewResponse' } } }
          '400': { $ref: '#/components/responses/Problem' }
          '401': { $ref: '#/components/responses/Problem' }
          '403': { $ref: '#/components/responses/Problem' }
          '404': { $ref: '#/components/responses/Problem' }
          '409': { $ref: '#/components/responses/Problem' }
          '503': { $ref: '#/components/responses/Problem' }
