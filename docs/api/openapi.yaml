        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: createUser
      summary: Admin account creation (PLAN-0581)
      description: 'ADMIN only; the only account source when XIHE_AUTH_REGISTRATION_POLICY=closed. Body {email, username?, password?, name?}. When password is omitted the server generates a strong one and returns it once as temporaryPassword (never logged, never audited). 409 EMAIL_TAKEN / USERNAME_TAKEN, 400 USERNAME_INVALID (v29 name rule: letters any case / Chinese characters / digits, must not start with a digit, no spaces or symbols, 1-32 chars). Audited as user_created.'
