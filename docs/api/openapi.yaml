  /api/v1/roles/catalog:
    get:
      tags: [admin]
      operationId: getRoleCatalog
      summary: Access-role atom catalog (PLAN-0610 W3-2a; labels PLAN-0651 D51-37)
      description: 'The permission vocabulary of the access-role model: 31 atoms = 28 action atoms + 3 capability atoms (PLAN-0651 adds N1–N10; PLAN-0673 M2 adds GRANT_ANY_ATOM, instance-only). scope_class (instance|both) is the SSOT of PermissionAtomCatalog — the API projects it and never carries its own table (R2-10); capability=true marks the three atoms that become cap:<atom> authorities (instance:super, instance:admin, workspace:admin) and are never materialized into grants (decision #23). Each atom carries displayName resolved server-side from the explicit locale (zh-CN default, en-US supported, unknown ⇒ zh-CN) so the UI keeps no vocabulary of its own (D51-19/D51-37). Gate: MANAGE_ROLES — an action atom, evaluated from the grant rows because only capability atoms are authorities (R2-5). Since migration V125 (PLAN-0673 D-168) the built-in ADMIN role holds MANAGE_ROLES as well.'
      parameters:
        - name: locale
          in: query
          required: false
          description: 'Display-label locale for atom displayName (zh-CN default, en-US supported; any other value falls back to zh-CN).'
          schema: { type: string, enum: [zh-CN, en-US] }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Atom catalog', content: { application/json: { schema: { $ref: '#/components/schemas/RoleCatalogView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: List access-role definitions (PLAN-0610 W3-2a; PLAN-0667 gap-1 read path)
      description: |
        Two views share this endpoint. A caller holding `MANAGE_ROLES` gets every role definition
        (PLAN-0610 admin view, unchanged). A caller who may manage an agent's bindings
        (`MANAGE_WORKSPACE_AGENTS` in the `workspaceId` context, or the instance-tier
        `MANAGE_AGENT_PRINCIPALS`) gets the **agent-bindable subset**: roles carrying any
        `agentPrincipalForbidden` atom are omitted, because binding them would always answer 409
        (Lead ruling 2026-11-05, real-stack gap 1: the OWNER previously received 403 and the
        binding picker had no candidates). Role definitions are instance-wide — scope lives on the
        binding — so no workspace-owned role can leak through this filter. Rows keep the same
        RoleView shape (system roles first, then by name, atoms + bindingCount included).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Authorization context for the agent-binding view: MANAGE_WORKSPACE_AGENTS is evaluated in this workspace. Ignored by the MANAGE_ROLES admin view. A workspace-tier caller cannot read candidates without it (403).' }
      responses:
        '200': { description: 'Role definitions', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoleView' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: createRole
      summary: Create a custom access role (PLAN-0610 W3-2a)
      description: 'Gate: MANAGE_ROLES (ADMIN and SUPER_ADMIN hold it since V125). name must match ^[A-Z][A-Z0-9_]{1,63}$ — the V87 ck_roles_name_format check constraint is the single source of truth; illegal names are refused with 400 INVALID_ROLE_NAME instead of reaching the INSERT (500) — and be unique (409 ROLE_NAME_EXISTS); atoms must be a non-empty set of catalog atoms (400 INVALID_ROLE_ATOMS / 400 UNKNOWN_ACTION_CLASS), duplicates are removed. Grant-side subset rule (PLAN-0673 M1): a role DEFINITION may only contain atoms the caller holds in some scope — otherwise 403 PRIVILEGE_ESCALATION naming the exceeding atoms (that is the grantor gate; it is NOT the target-cap 409). The bypass atom GRANT_ANY_ATOM (instance-only, default SUPER_ADMIN) skips the subset check and is audited with the skipped atom list. A custom role may combine any atoms; whether an atom may be bound at a given scope is decided by the binding API (400 ROLE_SCOPE_MISMATCH there), not here. Audited as access_role_created.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleCreateRequest' } } }
      responses:
        '201': { description: 'Created role', content: { application/json: { schema: { $ref: '#/components/schemas/RoleView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (endpoint gate MANAGE_ROLES) or PRIVILEGE_ESCALATION (an atom outside the caller''s own set — detail names it; bypassed only by GRANT_ANY_ATOM)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/roles/{roleId}:
    patch:
      tags: [admin]
      operationId: updateRole
      summary: Update an access role (PLAN-0610 W3-2a)
      description: 'Gate: MANAGE_ROLES. A custom role may change name (same ^[A-Z][A-Z0-9_]{1,63}$ V87 format, 400 INVALID_ROLE_NAME / 409 ROLE_NAME_EXISTS), displayName, description and atoms; an atom change re-materializes every holder in the same transaction (source=role rows reconciled, capability cache invalidated immediately and after completion, token_version + 1 per holder whose set changed). Atom changes obey the same grant-side subset rule as create: 403 PRIVILEGE_ESCALATION names any atom outside the caller''s own set (GRANT_ANY_ATOM bypasses, audited with the skipped atom list). A system role accepts ONLY displayName — any other field answers 409 SYSTEM_ROLE_IMMUTABLE. Audited as access_role_updated, which includes the holder count.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleUpdateRequest' } } }
      responses:
        '200': { description: 'Updated role', content: { application/json: { schema: { $ref: '#/components/schemas/RoleView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (endpoint gate MANAGE_ROLES) or PRIVILEGE_ESCALATION (atom change outside the caller''s own set — detail names it; bypassed only by GRANT_ANY_ATOM)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Delete a custom access role (PLAN-0610 W3-2a)
      description: 'Gate: MANAGE_ROLES. 204 on success; a system role answers 409 SYSTEM_ROLE_IMMUTABLE, a role that still has bindings answers 409 ROLE_IN_USE (unbind first through PUT /bindings). The atom rows are deleted with the role. Audited as access_role_deleted.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roleId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Deleted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (endpoint gate MANAGE_ROLES)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/bindings:
    get:
      tags: [admin]
      operationId: listRoleBindings
      summary: Read the binding set of one scope (PLAN-0610 W3-2a)
      description: 'Gate: MANAGE_ROLES; a workspace scope additionally requires MANAGE_WORKSPACE_AGENTS in that workspace (403 FORBIDDEN). Returns the complete user binding set of the scope. scope=instance must not carry scopeId (400 INVALID_SCOPE); scope=workspace requires an existing, non-deleted workspace (400 INVALID_SCOPE / 404 WORKSPACE_NOT_FOUND).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scope, required: false, schema: { type: string, enum: [instance, workspace], default: instance } }
        - { in: query, name: scopeId, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Binding set', content: { application/json: { schema: { $ref: '#/components/schemas/BindingSetView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      operationId: replaceRoleBindings
      summary: Replace the binding set of one scope (PLAN-0610 W3-2a)
      description: 'Full replacement, not a delta: the body is the complete desired set, absent rows are deleted and new pairs inserted, so a retry with the same body is a true no-op (no epoch bump, no audit row, no re-materialization). Gates: MANAGE_ROLES (endpoint; ADMIN holds it since V125/D-168) and, for a workspace scope, MANAGE_WORKSPACE_AGENTS in that workspace. Validation before the first write, in order: subject exists (404 USER_NOT_FOUND) and is not soft-deleted (409 USER_DELETED), subjectType must be user (400 INVALID_BINDING), role exists (404 ROLE_NOT_FOUND), atom scope compatibility for the added pairs (400 ROLE_SCOPE_MISMATCH), grant-side subset rule for the added pairs (403 PRIVILEGE_ESCALATION — the caller must hold every handed-out atom in the TARGET scope: instance rows cover every workspace, a workspace row never covers instance; capability atoms are compared against the caller capabilities). GRANT_ANY_ATOM (instance-only, SUPER_ADMIN default) bypasses the subset check and is audited with the skipped atom list. 409 on this endpoint is NOT the target-cap gate: it is USER_DELETED / LAST_SUPER_ADMIN / LAST_OWNER / CONCURRENT_MODIFICATION. The agent-cap 409 ROLE_BINDING_EXCEEDS_CAP belongs to the agent-principal binding endpoint (BL-287). Removing the last usable SUPER_ADMIN instance binding answers 409 LAST_SUPER_ADMIN and removing the last usable WS_OWNER binding of a workspace answers 409 LAST_OWNER (both change nothing). Every affected subject is re-materialized in the same transaction; an instance-tier change also bumps the subject token_version, a workspace-tier change only invalidates the capability cache (W3-3: the access token carries no workspace role, so bumping would log the subject out for a claim it never had). A concurrent deadlock/serialization failure answers 409 CONCURRENT_MODIFICATION (retryable). Lock order: instance_owner -> users. Audited as role_bindings_replaced (scope, added, removed, subject count).'

      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scope, required: false, schema: { type: string, enum: [instance, workspace], default: instance } }
        - { in: query, name: scopeId, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BindingReplaceRequest' } } }
      responses:
        '200': { description: 'Resulting binding set', content: { application/json: { schema: { $ref: '#/components/schemas/BindingSetView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (endpoint gate MANAGE_ROLES, or MANAGE_WORKSPACE_AGENTS for a workspace scope) or PRIVILEGE_ESCALATION (an added pair carries an atom the caller does not hold in the TARGET scope — detail names the atoms; GRANT_ANY_ATOM bypasses, audited with the skipped atom list)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'USER_DELETED / LAST_SUPER_ADMIN / LAST_OWNER / CONCURRENT_MODIFICATION — NOT the agent-cap gate (that one is 409 ROLE_BINDING_EXCEEDS_CAP on the agent-principal role-binding endpoint)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/skills/import:
    post:
      tags: [skill]
      operationId: importSkills
      summary: Import skill definitions (PLAN-0628 D28-17)
      description: 'Manual import, the only writer of skill definitions. Every bookkeeping field is server-computed and never read from the body: contentHash (sha256 over name/description/body/canonical attachments), bodyTokensEst (codePointCount//2, mirrored by the Agent), oversize (D28-15: above 5000 tokens is MARKED, never rejected and never truncated) and version (bumped only when the content changes). Idempotent by the qualified identity (name + definitionScope): re-importing identical content answers action=unchanged with no write and no version bump, which is what makes "re-import the whole directory" cheap. Item-level problems appear in rejected[] with a stable code and the rest of the batch still applies; only a batch larger than 64 items, a caller without write rights, or a personal-layer item carrying `trusted`, fails the whole request. Gates, one per definition scope: type=instance requires instance administration, type=workspace requires workspace manage rights or instance administration, and type=user requires MANAGE_PERSONAL_SKILLS — the only write atom of the personal layer: instance administration (cap:instance:admin, or being ADMIN) deliberately does NOT cover it, D-1007 forbids a second discriminator, and the atom authorizes the caller''s own rows only (definition_scope_id is written from the token, never from the body; there is no member to name another user). MANAGE_PERSONAL_SKILLS is granted to every authenticated user by default — it is a revocable capability grant, not a role test — so personal import works out of the box and a revocation turns it into 403 SKILL_IMPORT_FORBIDDEN. A caller missing it fails the whole request with 403 SKILL_IMPORT_FORBIDDEN and nothing is written, exactly like a non-writer on the other two layers. trusted=true may only be imported by an instance administrator (D28-09 rule 1) and is otherwise reported as SKILL_TRUSTED_FORBIDDEN, item-level, so the rest of the batch still applies — that holds on the instance and workspace layers. The personal layer is stricter (ruling P-189-1, 2026-11-12): a type=user import does not accept the `trusted` member at all — any item whose object carries that key, even false, fails the whole request with 400 INVALID_REQUEST before any item is processed and nothing is written, and a personal row is always stored with trusted=false, so SKILL_TRUSTED_FORBIDDEN never appears for type=user. Rationale: trusted feeds the trust-gated consumption surface (auto-injection / approval bypass); letting a user mark their own row trusted would be the user issuing themselves a bypass, which is an approval-semantics decision and outside the personal layer''s remit (can I manage my own skills). Only an instance administrator may ever set trusted=true on a personal row, and this endpoint has no shape for it.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillImportRequest' } } }
      responses:
        '200': { description: 'Per-skill outcomes, the rejected rows, and a summary', content: { application/json: { schema: { $ref: '#/components/schemas/SkillImportResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'SKILL_IMPORT_FORBIDDEN (no write rights for the target definition scope — the whole request fails and nothing is written) or SKILL_TRUSTED_FORBIDDEN (per-item, trustworthy flag without instance administration; unreachable for type=user, where carrying the key is 400 INVALID_REQUEST instead)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/skills:
    get:
      tags: [skill]
      operationId: listSkills
      summary: List the skill definitions the caller may see (PLAN-0628)
      description: 'Instance-scope definitions are visible to every authenticated caller; a workspace-scope definition is visible only to callers who can see that workspace; a user-scope definition is visible only to its owner, and `definitionScope` selects exactly one layer, so this listing returns exactly the caller''s own user rows for that layer and never another user''s (no parameter can ask for them). The default (`instance`) listing therefore never contains personal rows: a personal definition cannot leak into the shared library view. The body is never included here (see GET /api/v1/skills/{skillId}?includeBody=true).'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: definitionScope, required: false, schema: { type: string, enum: [instance, workspace, user], default: instance }, description: 'Defaults to the instance library. A workspace listing requires workspaceId; a user listing takes no id (the caller is the owner) and must not carry workspaceId (400 INVALID_REQUEST). A workspace listing answers an empty set (not 403) when the caller is not a member, so the endpoint is not an existence probe; a user listing never answers another user''s rows at all.' }
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid }, description: 'Required when definitionScope=workspace' }
      responses:
        '200': { description: 'Visible definitions', content: { application/json: { schema: { $ref: '#/components/schemas/SkillListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/skills/{skillId}:
    get:
      tags: [skill]
      operationId: getSkill
      summary: Read one skill definition (PLAN-0628)
      description: 'The body is omitted by default because it is the largest column; ?includeBody=true returns it. Visibility is per definition scope: a workspace-scope definition is answered 404 SKILL_NOT_FOUND rather than 403 to a caller who cannot see that workspace, a user-scope definition answers 404 SKILL_NOT_FOUND to everyone but its owner, and a missing id answers the same code, so the endpoint does not become an existence probe. Reading one''s own user-scope definition needs authentication only, not MANAGE_PERSONAL_SKILLS: ownership is the read boundary, the atom gates writes.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: skillId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: includeBody, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: 'The definition', content: { application/json: { schema: { $ref: '#/components/schemas/SkillView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [skill]
      operationId: deleteSkill
      summary: Delete a skill definition and its bindings (PLAN-0628)
      description: 'Removes the definition; its bindings cascade (V101 ON DELETE CASCADE). Same write gate as importing into that definition scope — and for the user scope that gate is MANAGE_PERSONAL_SKILLS alone: instance administration does not substitute, because a personal row is never an instance resource. Another user''s user-scope definition answers 404 SKILL_NOT_FOUND (never 403, never 204), the same answer as an unknown id, so the write face does not disclose which personal rows exist. Deleting a definition that is still bound is allowed on purpose: the bindings are the subject of the change, not an obstacle.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: skillId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Deleted' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/skills/{skillId}/bindings:
    get:
      tags: [skill]
      operationId: listSkillBindings
      summary: List the bindings of one skill (PLAN-0628)
      description: 'Returns the 2×2 rows (subjectType × scopeType) of one definition. Same visibility rule as reading the definition itself.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: skillId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Bindings of that definition', content: { application/json: { schema: { $ref: '#/components/schemas/SkillBindingListResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/skill-bindings:
    post:
      tags: [skill]
      operationId: createSkillBinding
      summary: Bind a skill to a subject at a scope (PLAN-0628 D28-14)
      description: 'Two independent axes: subject (user | agent_principal) × scope (instance | workspace). subjectId is always required — v1 has no "shared with everyone" tier, because role_bindings has the same shape (V87 subject_id NOT NULL). Validation order is fixed and deliberate: existence (404 SKILL_NOT_FOUND) → shape (400 SKILL_BINDING_SCOPE_INVALID) → definition visibility (400 SKILL_DEFINITION_OUT_OF_SCOPE: a workspace-private definition may only be bound inside its own workspace, otherwise it would leak through the binding) → authorization (403 SKILL_BINDING_FORBIDDEN) → subject validity (400 SKILL_BINDING_SUBJECT_INVALID) → duplicate (409 SKILL_BINDING_EXISTS). Authorization deliberately precedes subject validity: otherwise an unauthorized caller could probe whether a user or principal exists (or is disabled) from the difference between two error codes. Gates: instance scope requires instance administration; workspace scope requires workspace manage rights or instance administration; binding another user requires instance administration (binding yourself does not). The definition-visibility rule generalizes to the personal layer: a user-scope definition may only be bound inside its own visibility domain (subjectType=user with subjectId equal to its owner) and otherwise answers 400 SKILL_DEFINITION_OUT_OF_SCOPE — a binding must never carry a personal definition to someone else, or to an agent principal whose prompts another caller can drive.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillBindingCreateRequest' } } }
      responses:
        '201': { description: 'Created binding', content: { application/json: { schema: { $ref: '#/components/schemas/SkillBindingView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/skill-bindings/{bindingId}:
    delete:
      tags: [skill]
      operationId: deleteSkillBinding
      summary: Remove one binding (PLAN-0628)
      description: 'Same gate as creating a binding at that row''s scope. Missing rows answer 404 SKILL_BINDING_NOT_FOUND.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Removed' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/plugin-bindings:
    get:
      tags: [plugin]
      operationId: listPluginBindings
      summary: List the plugin bindings of the current workspace (PLAN-0691 T1.2)
      description: 'Workspace-scoped (X-Workspace-Id). D-66: every plugin route exists only while `cp.plugin.enabled=true`; with the flag off these paths answer 404 as if the build had no plugin feature. A binding is one workspace''s decision to use one installed plugin version — the version row is pinned by (pluginId, digest) and the same plugin may be bound by another workspace independently.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: state, required: false, schema: { type: string, enum: [pending, enabled, degraded, suspended, disabled] }, description: 'Filter by the five-state vocabulary; omitted returns every state' }
      responses:
        '200': { description: 'Bindings of this workspace, oldest first', content: { application/json: { schema: { $ref: '#/components/schemas/PluginBindingListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [plugin]
      operationId: createPluginBinding
      summary: Bind an installed plugin to the current workspace (PLAN-0691 T1.2)
      description: 'Validation order is fixed: workspace context (403 PLUGIN_GRANT_DENIED) → plugin installed (404 PLUGIN_NOT_FOUND) → duplicate (409 PLUGIN_CONFLICT) → grant shape (403 PLUGIN_GRANT_DENIED for a third-party plugin without an explicit grant; 422 PLUGIN_MANIFEST_INVALID for an atom the manifest never requested). A builtin plugin defaults to the workspace default atom set (`grantedAtoms` omitted ⇒ grant source `default`); a third-party plugin must be granted explicitly. The initial state mirrors the plugin: a disabled plugin yields a `pending` binding that cannot be attached to a session until both are enabled.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginBindingCreateRequest' } } }
      responses:
        '201': { description: 'Created binding', content: { application/json: { schema: { $ref: '#/components/schemas/PluginBindingView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/plugin-bindings/{bindingId}:
    get:
      tags: [plugin]
      operationId: getPluginBinding
      summary: Read one binding of the current workspace (PLAN-0691 T1.2)
      description: 'A binding that belongs to another workspace answers 403 PLUGIN_GRANT_DENIED before existence is disclosed; an unknown or malformed id answers 404 PLUGIN_NOT_FOUND.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'The binding', content: { application/json: { schema: { $ref: '#/components/schemas/PluginBindingView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [plugin]
      operationId: updatePluginBinding
      summary: Change a binding''s state or granted atoms (PLAN-0691 T1.2)
      description: 'Only the operator half of the five-state machine is writable (`enabled`, `disabled`). `pending`/`degraded`/`suspended` are CP-owned and answer 400 INVALID_REQUEST when written directly, as does a body carrying neither field. Enabling a binding whose plugin is disabled answers 409 PLUGIN_CONFLICT — the caller must enable the plugin first. An explicit grantedAtoms list is re-validated against the manifest (422 PLUGIN_MANIFEST_INVALID) and switches the grant source to `plugin_binding`.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginBindingUpdateRequest' } } }
      responses:
        '200': { description: 'Updated binding', content: { application/json: { schema: { $ref: '#/components/schemas/PluginBindingView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [plugin]
      operationId: deletePluginBinding
      summary: Remove a binding from the workspace (PLAN-0691 T1.2)
      description: 'Explicit removal: the session attachments of that binding cascade (DP-6), each deletion is audited, and the plugin can be uninstalled afterwards. Until the last binding is gone, `DELETE /api/v1/plugins/{pluginId}` keeps answering 409 PLUGIN_CONFLICT (D-65 ③). This is deliberately not a state flip — there is no `removed` tombstone state.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bindingId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Removed' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
