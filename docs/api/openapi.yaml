    ChatRequest: { type: object, required: [sessionId, branchId, content], properties: { sessionId: { type: string }, branchId: { type: string, format: uuid, description: Required selected branch; included in Chat idempotency request hash. }, content: { type: string }, toParticipantIds: { type: array, items: { type: string, format: uuid }, description: 'PLAN-0665 M1: explicit TO selection — 1..N AGENT session participants; every selected target answers with its own run. The FIRST target owns this submission''s user_submission run (runId = runIds[0]); the remaining targets are created as derived runs whose wake audit carries triggerSource="to" (their origin is the wake carrier''s own classification — real stack 2026-11-05: scheduled — and parent_run_id stays NULL; read sides MUST NOT group messages by origin; group by runId/delivery/trigger_source). Omitted/empty keeps the legacy single-responder path. Human targets answer 400 INVALID_REQUEST (later plan; blocked on BL-238). The sorted set and asParticipantId are part of the Idempotency-Key request hash (PLAN-0665 D6).' }, asParticipantId: { type: [string, 'null'], format: uuid, description: 'PLAN-0623 D23-08: speak as an added participant — the Run and its messages answer under that identity. Adding a member never grants this; the caller must own the conversation and may only speak as themselves (HUMAN) or as an AGENT they own. Unauthorized use answers 403 PARTICIPANT_CAP_DENIED.' }, cc: { type: array, items: { type: string, format: uuid }, description: 'PLAN-0630 M5b (D30-14): optional composer cc observer list — session participantIds. Semantics = 旁听名单: each observer gets a notify signal (wake_dispatch outcome=notify, which is the only source of the derived readCursor.mentionCount; the mention_count column was dropped by V112) but never a Run of their own; an agent observer still answers when actually @-mentioned (WHEN_MENTIONED equivalent). Non-UUID entries are rejected with 400 INVALID_REQUEST; ids that are not enabled session participants are ignored (fail-closed, same as mentions). Notify-only: cc is NOT part of the idempotency request hash.' }, provider: { type: string, description: 'Legacy display hint; CP resolves the server-side Session connection.' }, model: { type: string, description: 'Legacy display hint; CP resolves the server-side Session connection.' }, toolMode: { type: string, enum: [none, workspace], default: none }, attachments: { type: array, items: { type: string } }, toolTimeouts: { type: object, description: 'PLAN-0308 T1.9/T3.1: optional per-tool timeout request (per-call), the highest-priority input to the CP-computed tool budget. Values are positive integer seconds, max 30 (code constant MAX_BUDGET_SECONDS, shared with the DB config ceiling); invalid or oversized values are rejected with 400 INVALID_REQUEST (never silently clamped); sync waits >30s belong to async jobs.', additionalProperties: { type: integer, minimum: 1, maximum: 30 }, example: { execute_command: 20 } } } }
