    patch: { tags: [session], operationId: updateSessionApiRequestTemplate, summary: Set the API request template override of one session, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApiRequestTemplateBindingRequest' } } } }, responses: { '200': { description: Session with the updated pinned API request template binding, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '400': { $ref: '#/components/responses/Problem' }, '409': { description: 'API_TYPE_TEMPLATE_MISMATCH / API_TYPE_REBIND_REQUIRED / CONNECTION_REVISION_CHANGED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '404': { description: API_REQUEST_TEMPLATE_NOT_FOUND for an unknown layer/revision, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } } } }
  /api/v1/sessions/{sessionId}/commands:
    get:
      tags: [session]
      operationId: listSessionCommands
      summary: List commands recorded in one session
      description: |
        PLAN-0635 M3 (D35-02 ruling A): the session command registry. Availability is decided on
        the server by reusing the ordinary policy engine through an existing tool face; the
        carrier name is never exposed on the wire. Each row is name/source/available/reason.
        reason is null when available, otherwise one of approval_required, denied,
        policy_unavailable, branch_locked. The browser renders this list plus its two local-only
        commands (/clear and /help) and never filters availability itself.
        BL-299 read access: the session owner or an enabled invited HUMAN participant (managers are
        excluded); everyone else gets 404 SESSION_NOT_FOUND. Read only — this route has no write face.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Command registry for this session
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items:
                      type: object
                      required: [name, source, available]
                      properties:
                        name: { type: string, description: 'Slash command including its leading slash, e.g. /export' }
                        source: { type: string, enum: [builtin] }
                        available: { type: boolean }
                        reason: { type: [string, 'null'], enum: [approval_required, denied, policy_unavailable, branch_locked] }
                      additionalProperties: false
                additionalProperties: false
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/export:
    get:
      tags: [session]
      operationId: exportSessionMarkdown
      summary: Export one session as Markdown
      description: |
        PLAN-0635 M3: the real /export. Generates a Markdown document from the existing session
        message read surface (no Agent, no provider, no run). Export is a **bounded artifact**, not
        an error face: at most 2000 visible messages, 20000 characters per message and 2000000
        characters per document; every cut is disclosed in the document header via
        messagesTruncated and contentTruncated, and the response is always 200 for an authorised
        session/branch. BL-295: the former 413 EXPORT_TOO_LARGE precheck was removed — it counted
        ALL session rows (every branch/visibility) and wrongly refused a small branch of a large
        session; the streaming read keeps memory independent of the session's total size.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: branchId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Markdown export (truncation disclosed in the document header; 413 was removed by BL-295)
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/derived-state:
    get:
      tags: [session]
      operationId: getSessionDerivedState
      summary: Get derived state of one session
      description: 'D-1247 (task-399): a workspace-less session (workspace_id null) belongs to its user, so it is reachable regardless of the caller workspace context — the interceptor resolves an ambient workspace from membership even without a header. Workspace-bound sessions keep the original rule: a non-blank, accessible, matching workspace is required (409 WORKSPACE_CONTEXT_REQUIRED / 404 SESSION_NOT_FOUND). Read = owner or enabled HUMAN participant.'
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Authorized active-child and terminal-notice response view, content: { application/json: { schema: { $ref: '#/components/schemas/SessionDerivedStateResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/sessions/{sessionId}/delegation-spawn:
    post:
      tags: [session]
      operationId: delegateSpawn
      summary: Human delegation — create a budgeted child Session owned by an agent principal (PLAN-0655)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationSpawnRequest' }
      responses:
        '201':
          description: Child delegation Session created; its first Run admitted (auto-allow, or the replay carries a reused grant).
          headers:
            Location: { required: true, schema: { type: string }, description: Child Session URL }
          content: { application/json: { schema: { $ref: '#/components/schemas/DelegationSpawnResponse' } } }
        '202':
          description: >-
            SPAWN_AGENT sits in the approval-policy ask set and no grant exists — a pending ChatApproval was created
            or reused (same session + tool + canonical arguments hash). The client renders the existing approval flow
            (statusUrl) and re-POSTs with the same Idempotency-Key after grant; the replay then answers 201.
          content: { application/json: { schema: { $ref: '#/components/schemas/DelegationSpawnAccepted' } } }
        '400': { description: IDEMPOTENCY_KEY_REQUIRED / INVALID_REQUEST, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: AGENT_SPAWN_DENIED — the caller lacks the SPAWN_AGENT capability atom for this workspace (capability evaluation; no role-name checks), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: SESSION_NOT_FOUND / AGENT_PRINCIPAL_NOT_FOUND, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'IDEMPOTENCY_KEY_CONFLICT / DELEGATION_LIMIT_EXCEEDED (depth_exceeded | count_exceeded | delegation_disabled — maxCount=0) / DELEGATION_POLICY_INVALID (unreadable stored policy or broken tree, fail-closed) / SESSION_DELETING', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/sessions/{sessionId}/delegation-usage:
    get:
      tags: [session]
      operationId: getSessionDelegationUsage
      summary: Read-only delegation budget view for the Session's delegation root (PLAN-0655); the SAME evaluation point as the budget gate — never a second reader.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Effective budget usage of the root this Session delegates under, content: { application/json: { schema: { $ref: '#/components/schemas/DelegationUsageView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: DELEGATION_POLICY_INVALID — the stored subject policy is unreadable; the read face fails closed instead of silently substituting defaults, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }

  /api/v1/sessions/{sessionId}/compact:
    post:
      tags: [session]
      operationId: compactSessionContext
      summary: Compact the context of one session
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
