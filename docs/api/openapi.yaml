      type: object
      additionalProperties: false
      required: [sessionId, mode, scope]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/PolicyMode' }
        scope: { type: string, enum: [session] }
    Tier1ChainStatus:
      type: object
      additionalProperties: false
      description: |
        PLAN-0407 T3.1 Tier-1 response — exactly the spec §5 field set; content fields are
        never present.
      required: [sessionId, runId, state, at]
      properties:
        sessionId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        state: { type: string, description: ChatRun status of the target's latest run }
        at: { type: string, format: date-time, description: Timestamp of that run state }
    Tier2Access:
      type: object
      additionalProperties: false
      description: PLAN-0407 T3.1 Tier-2 decision (denial is an RFC 9457 403, not a body flag).
      required: [allowed]
      properties:
        allowed: { type: boolean, enum: [true] }
    PolicyDomainView:
      type: object
      additionalProperties: false
      required: [actionClass, effectiveLayer, configuredLayers, ruleCounts]
      properties:
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        effectiveLayer: { type: string, enum: [builtin, instance, user, workspace] }
        configuredLayers:
          type: array
          items: { type: string, enum: [instance, user, workspace] }
        ruleCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    # PolicyRuleView / PolicyRuleCreateRequest retired with /api/v1/policy/rules (PLAN-0407 T2.8).
    ToolFaceView:
      type: object
      additionalProperties: false
      description: |
        Tool classification entry. Catalog built-ins use a nullable id and ownerId and the
        literal response scope `builtin`; persisted instance/workspace rows retain their UUID
        and owner. An unclassified tool is not a catalog entry and is represented at approval
        time as actionClass `unclassified` with shape `opaque` and effect `ask`.
      required: [id, scope, ownerId, tool, actionClass, shape]
      properties:
        id: { type: [string, 'null'], format: uuid, readOnly: true }
        scope: { type: string, enum: [builtin, instance, workspace], readOnly: true }
        ownerId: { type: [string, 'null'], readOnly: true }
        tool: { type: string, minLength: 1, readOnly: true }
        actionClass: { type: string, minLength: 1, readOnly: true }
        shape: { type: string, enum: [structured, interpreter, opaque], readOnly: true }
    ToolFaceUpsertRequest:
      type: object
      additionalProperties: false
      required: [scope, tool, actionClass, shape]
      properties:
        scope: { type: string, enum: [instance, workspace] }
        tool: { type: string, minLength: 1, maxLength: 128 }
        actionClass: { type: string, minLength: 1, maxLength: 64 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
    ChatApprovalRequest:
      type: object
      additionalProperties: false
      description: CP-owned durable approval envelope used by live/replayed SSE events and ChatRun recovery. Details is a bounded preview; raw tool arguments are never included. Legacy rows may omit argumentsHash and state; when present they are preserved as emitted. `origin` is the durable creation provenance and is null for rows predating V25.
      required: [requestId, runId, sessionId, workspaceId, tool, action, details, expiresAt, replayed]
      properties:
        requestId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        tool: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        details: { type: string, minLength: 1 }
        argumentsHash: { type: [string, 'null'], description: Hash of the canonical arguments; the arguments themselves are not included. }
        expiresAt: { type: string, format: date-time }
        state: { type: string, enum: [pending, dispatching, dispatch_unknown, approved, rejected, expired] }
        origin: { type: [string, 'null'], enum: [cp_gate, agent_relay], description: Durable creation provenance (PLAN-0371); null for rows predating V25. Display metadata only — clients must not infer an origin when absent or null. }
        replayed: { type: boolean }
        modeAtGrant: { $ref: '#/components/schemas/PolicyMode', description: Fallback top-level placement used only when no policy summary is available. }
        policy: { $ref: '#/components/schemas/ApprovalPolicySummary' }
    ApprovalPolicySummary:
      type: object
      additionalProperties: false
      description: Safe, display-only policy metadata. Raw tool arguments are never included.
      required: [effect, sourceLayer, matchedRule, reason, mode, actionClass, shape]
      properties:
        effect: { type: string, enum: [allow, ask, deny] }
        sourceLayer: { type: string, enum: [builtin, instance, user, workspace, session, per_call] }
        matchedRule: { type: [string, 'null'], minLength: 1 }
        reason: { type: string, minLength: 1 }
        mode: { type: [string, 'null'], enum: [manual, auto] }
        actionClass: { type: string, minLength: 1 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
        modeAtGrant:
          oneOf:
            - $ref: '#/components/schemas/PolicyMode'
            - type: 'null'
          description: Effective session mode captured by the atomic decision claim; legacy rows may omit it or return null.
