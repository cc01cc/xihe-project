         connectionRevision: { type: integer, minimum: 1 }
    UserQuestionAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 2000, description: 'The human answer. Blank/whitespace-only is 400 INVALID_REQUEST. Untrusted text: shown in the projection, never written to a log, audit detail or problem detail.' }
    UserQuestionView:
      type: object
      required: [id, sessionId, runId, state, prompt, createdAt]
      description: 'PLAN-0660 T5.10: one question. The same shape for the addressee and for a session-visible reader; `answer` is only non-null for `answered` (spec/session/user-channel.md §6).'
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        state: { type: string, enum: [pending, answered, expired, cancelled] }
        prompt: { type: string, description: 'The question body (untrusted).' }
        answer: { type: [string, 'null'], description: 'Only set by the pending → answered transition.' }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'null = blocking ask; otherwise the askTimed deadline.' }
        createdAt: { type: string, format: date-time }
        firstDeliveredAt: { type: [string, 'null'], format: date-time, description: 'Reserved: first time the pending hint reached the addressee. CURRENTLY ALWAYS null — the relay path has no write point yet (T5.25 reconciliation, tracked as drift); do not build UI logic on it.' }
        settledAt: { type: [string, 'null'], format: date-time, description: 'Terminal stamp; the "answered at" instant for an answered question (frozen column settled_at).' }
    UserQuestionListResponse:
      type: object
      required: [items, pendingCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UserQuestionView' } }
        pendingCount: { type: integer, description: 'Count of rows under the same filter as items (derived, never stored).' }
    UserQuestionRespondRequest:
      type: object
      required: [questionId, sessionId, runId, answer]
      description: 'PLAN-0660 T5.12: CP → Agent delivery of one human answer to the blocked ask_user wait. Internal only (service Bearer); the browser never calls this route. A non-2xx or transport failure is fail-closed on the CP side: the durable question stays pending and no answer is recorded.'
      properties:
        questionId: { type: string, format: uuid, description: 'The durable question id (user_questions.id); the Agent matches its wait on it.' }
        sessionId: { type: string, format: uuid }
        runId: { type: string, format: uuid, description: 'The root run that asked; the Agent rejects a wait it does not own.' }
        answer: { type: string, description: 'The human answer. Untrusted text: CP keeps it out of logs, audit detail and problem detail.' }
    AgentChatRequest:
      type: object
      required: [runId, sessionId, content, stream, provider, model, providerConnectionId, connectionRevision, credentialLease, contextTemplateSnapshot]
      properties:
        runId: { type: string, format: uuid }
        sessionId: { type: string }
        content: { type: string }
        parentRunId: { type: [string, 'null'], format: uuid, description: 'PLAN-0660 T5.16 (LD-16=A), additive and OPTIONAL: present only when CP dispatches a **spawned** run, carrying the parent run id (same value as `chat_runs.parent_run_id`). A root run omits the key entirely, so a pre-T5.16 reader stays compatible. The Agent uses it as the root-run gate: `ask_user` refuses a child run at the door with `code=SUBAGENT_QUESTION_REFUSED` before publishing anything.' }
        pathMentions:
          type: array
          description: |
            PLAN-0635 M2: additive and OPTIONAL — absent when the user message `@`-mentions no
            workspace path. CP resolves `@文件/目录` tokens (participant-first: a token the session
            roster already resolves is never a path; path rules reuse PLAN-0627's normalizer, and
            reads reuse the ordinary read_file/list_directory policy) and hands the Agent the
            targets. The Agent owns token counting and the run-scoped injection ledger; CP only
            bounds each read at 64 KiB and flags `truncated` so the model is told the body is
            partial. `kind=directory` carries bounded top-level entry names, not a file body.
          items:
            type: object
            required: [path, kind]
            properties:
              path: { type: string, description: 'Workspace-relative normalized path.' }
              kind: { type: string, enum: [file, directory] }
              content:
                type: string
                description: 'Bounded body (file) or newline-joined entry names (directory).'
              truncated:
                type: boolean
                description: 'CP cut the read at 64 KiB or the listing at its entry cap.'
        instructions: { type: string, minLength: 1, description: 'CP-authorized nonempty Agent baseline only. Missing/blank/non-string values fail before lease redemption or Chat provider dispatch with BASELINE_UNAUTHORIZED; no process-level fallback. AgentPrincipal IDs and permission snapshots are forbidden on this wire.' }
        contextTemplateSnapshot: { $ref: '#/components/schemas/ContextTemplateSnapshot' }
        embeddingProfile:
          type: object
          description: 'PLAN-0416: CP-resolved non-secret 0485 profile. Present only when the original API-native template contains an unescaped xh.rag_context data slot. Includes authenticated workspace/owner, connection identity/revision, API Type/version, model and dimension; callers cannot select these authority fields.'
          additionalProperties: true
        embeddingCredentialLease:
          type: string
          writeOnly: true
          description: 'Separate one-use embedding lease bound to this runId; never reuse the Chat credentialLease. Unavailable profile/lease fails the Run before Chat provider dispatch; empty successful retrieval renders an empty data string.'
        componentSources:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ContextComponentSource' }
        stream: { type: boolean, default: true }
        provider: { type: string }
        model: { type: string }
        toolMode: { type: string, enum: [none, workspace], default: none }
        credentialLease: { type: string, writeOnly: true }
        providerConnectionId: { type: string, format: uuid }
        connectionRevision: { type: integer, minimum: 1 }
        userOverrides:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
          description: "PLAN-0307 T2.7: run-scoped user-layer entries resolved by CP for Agent-consumed domains (llm-provider, agent-profile). Env-locked keys are omitted; Agent merges pulled effective -> user -> workspace without side effects. Layer concepts never cross this boundary."
        workspaceOverrides:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
          description: "PLAN-0307 T2.7: run-scoped workspace-layer entries resolved by CP (same contract as userOverrides; workspace wins over user)."
        toolWaits:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: "PLAN-0308 M1 (spec S2.1): CP-computed final Agent wait per tool (budget + 4s margin). The Agent only consumes it; it never computes."
        toolWaitOrigins:
          type: object
          additionalProperties: { type: string, enum: [per-call, config] }
          description: "PLAN-0308 M1: value nature per tool. `per-call` makes the Agent use the delivered wait even when its own XIHE_MCP_TOOL_TIMEOUT_S env is set (decision #27)."
        systemToolWait:
          type: number
          description: "PLAN-0308 M1: the single Agent wait covering all system tools (from the agent-runtime.systemToolTimeoutS config key); delivered without the per-tool map so cold caches still get a value."
        toolTimeouts:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 30 }
          description: "PLAN-0308 T1.9: raw per-call values (already validated by CP). The Agent attaches them per tool call as the inbound header X-Xihe-Tool-Timeout-Per-Call; CP validates again and forwards with valueOrigin=per-call."
        budgetCoverage:
          type: string
          enum: [full, partial]
          description: "PLAN-0308 M1 (decision #23): `partial` when the CP tool→server cache was cold at payload time, so some tools have no per-tool wait entry."
        attachments: { type: array, items: { type: object, additionalProperties: true } }
        continuation:
          $ref: '#/components/schemas/AgentChatContinuation'
    AgentChatContinuation:
      type: object
      additionalProperties: false
      description: >-
        CP-authenticated internal continuation descriptor. It is derived from
        locked ChatRun/checkpoint/lineage records and is never accepted from or
        returned to a public caller. completedToolCallIds contains only bounded
        opaque originating IDs; Agent must match each against a checkpoint-safe
        ToolMessage before graph execution, and must fail closed on any mismatch.
      required: [mode, sourceRunId, continuationRunId, lineageId, threadId, checkpointId, eventSequence, branchId, completedToolCallIds]
      properties:
        mode: { type: string, enum: [resume_pending, append_user_turn] }
        sourceRunId: { type: string, format: uuid }
        continuationRunId: { type: string, format: uuid }
        lineageId: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        checkpointId: { type: string, minLength: 1, maxLength: 128 }
        eventSequence: { type: integer, minimum: 0 }
        branchId: { type: string, format: uuid }
        completedToolCallIds:
          type: array
          maxItems: 8192
          items: { type: string, minLength: 1, maxLength: 128 }
    ContextTemplateSnapshot:
      type: object
      description: Exact admission snapshot; the historical carrier field name is retained, but legacy Markdown snapshots are audit-only.
      required: [layer, templateId, version, source, template, providerConnectionId, connectionRevision, apiTypeId, apiTypeVersion, connectionKey, connectionScope]
      properties:
        layer: { type: string, enum: [instance, user, workspace, workspace-default] }
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        source: { type: string }
        template: { $ref: '#/components/schemas/ApiRequestTemplate' }
        providerConnectionId: { type: string, format: uuid }
        connectionRevision: { type: integer, minimum: 1 }
        apiTypeId: { type: string }
        apiTypeVersion: { type: integer, minimum: 1 }
        connectionKey: { type: string }
        connectionScope: { type: string, enum: [USER, WORKSPACE, INSTANCE, SYSTEM] }
      additionalProperties: false
    ContextComponentSource:
      type: object
      required: [status, source, truncated, diagnostics]
      description: 'One per-run component source document, keyed by template instanceId. Two shapes share this schema, discriminated by `source`: the listing variant (runtime_workspace / agents_md_tree / skill_bindings) carries `items`; the memory variant (agent_memory, PLAN-0629 M1-4/M1-5) carries `entries` plus the bounds CP applied. The Agent renders `${xh.skill_catalog}` from the first and `${xh.agent_memory}` from the second.'
      properties:
        status: { type: string, enum: [ready, empty, missing, unavailable, unknown, truncated, failed, approval_required] }
        source: { type: string, description: 'Source-kind identifier: runtime_workspace | agents_md_tree | skill_bindings | agent_memory.' }
        items: { type: array, items: { type: string }, description: 'Listing variant only: workspace-relative paths (tree) or already-rendered listing lines (skills); no file contents.' }
        entries:
          type: array
          description: 'Memory variant only (source=agent_memory): the active rows CP selected for exactly this (principal, workspace) pair, already ordered pinned -> profile -> freshest. `candidate` and soft-deleted rows never appear.'
          items: { $ref: '#/components/schemas/AgentMemoryComponentEntry' }
        maxEntries: { type: integer, minimum: 1, description: 'Memory variant: entry cap CP applied to this document.' }
        maxTokens: { type: integer, minimum: 1, description: 'Memory variant: token cap CP applied, using the shared chars/2 estimate.' }
        usedTokens: { type: integer, minimum: 0, description: 'Memory variant: tokens CP counted for the returned entries.' }
        truncated: { type: boolean }
        diagnostics: { type: array, items: { type: string } }
      additionalProperties: false
    AgentMemoryComponentEntry:
      type: object
      required: [type, pinned, updatedAt, content, tokens]
      description: 'One memory row inside a component source document (PLAN-0629). Selection/ordering is CP-owned; the Agent only renders and charges it.'
      properties:
        type: { type: string, enum: [profile, fact] }
        pinned: { type: boolean }
        updatedAt: { type: string, description: 'ISO-8601 instant as stored by CP.' }
        content: { type: string, description: 'Normalized stored text (<= 8000 chars by DB CHECK); rendering/truncation is the Agent renderer''s job.' }
        tokens: { type: integer, minimum: 0, description: 'CP estimate (chars/2) so both sides charge the same number.' }
      additionalProperties: false
    AgentSummarizeRequest:
      type: object
      required: [credentialLease, text]
      description: "PLAN-0354 spec §8: CP → Agent summary hop. CP issues a short (2 min TTL) provider credential lease and strips [Constraints] from priorSummary (I3); the Agent redeems the lease and clamps output tokens to min(config.maxTokens, 2048). maxOutputTokens is not a request field."
      properties:
        sessionId: { type: string }
        runId: { type: string, description: "Empty for manual compaction (CP passes runId=null)." }
        provider: { type: string }
        model: { type: string }
        credentialLease: { type: string, writeOnly: true }
        providerConnectionId: { type: string, format: uuid }
        connectionRevision: { type: integer, minimum: 1 }
        text: { type: string, description: "role: content lines bounded by CP (per-message 4000 chars, pruneWindowChars budget; oldest dropped with an explicit omitted marker)." }
        priorSummary: { type: string, description: "Previous sectioned summary with [Constraints] stripped by CP." }
        workspaceId: { type: string, format: uuid, description: "PLAN-0590: run workspace identity; the Agent uses it (with userId) to resolve the request-scoped config snapshot. Optional — absent identity degrades to code defaults." }
        userId: { type: string, format: uuid, description: "PLAN-0590: run user identity for the request-scoped config snapshot. Optional." }
    AgentSummarizeResponse:
      type: object
      required: [summary, usage]
      properties:
        summary: { type: string, description: "Six sectioned summary ([Goal]/[Work State]/[Next Move]/[Files&Artifacts]/[Errors]/[Recent]); never carries [Constraints] (CP appends the code-extracted section)." }
        usage: { type: object, additionalProperties: true, description: "0343-named usage: inputTokens/outputTokens/totalTokens/estimatedInputTokens/source (real|estimated|fallback)/model (provider/model). Chat additionally carries cacheReadInputTokens and providerUnknownFields (PLAN-0416: estimatedInputTokens is the serialized native request body of the dispatched steps; a provider counter that was never returned is omitted and listed in providerUnknownFields instead of being reported as 0)." }
    OAuthBindingRequest: { type: object, required: [workspaceId, serverId], properties: { workspaceId: { type: string }, serverId: { type: string } } }
    OAuthTokenRequest: { type: object, required: [userId, workspaceId, serverId, scope], properties: { userId: { type: string }, workspaceId: { type: string }, serverId: { type: string }, scope: { type: string } } }
    StatusResponse: { type: object, required: [status], properties: { status: { type: string } }, additionalProperties: true }
    DeletedResponse: { type: object, required: [deleted], properties: { deleted: { type: boolean } } }
    RagIngestRequest: { type: object, required: [file, embeddingProfile, embeddingCredentialLease], properties: { file: { type: string, format: binary }, chunkSize: { type: integer, default: 1000 }, chunkOverlap: { type: integer, default: 200 }, embeddingProfile: { type: string, description: 'JSON string of the CP-resolved non-secret profile; the Agent partitions every stored row by its full identity tuple.' }, embeddingCredentialLease: { type: string, writeOnly: true } } }
    RagSearchRequest: { type: object, required: [query, embeddingProfile, embeddingCredentialLease], properties: { query: { type: string }, topK: { type: integer, default: 5 }, embeddingProfile: { type: string }, embeddingCredentialLease: { type: string, writeOnly: true } } }
    EmbeddingEffectiveProfile:
      type: object
      required: [contract, profile, profileScope, resolved]
      properties:
        contract: { type: object, required: [modelId, dimension], properties: { modelId: { type: string }, dimension: { type: integer } }, description: 'Pinned V1 embedding contract served by CP.' }
        profile: { type: ['object', 'null'], properties: { providerId: { type: string }, connectionKey: { type: string }, model: { type: string } } }
        profileScope: { type: ['string', 'null'], enum: [instance, user, workspace-default, workspace, null] }
        resolved: { type: ['object', 'null'], description: 'Non-secret owner view of the same-key READY embedding connection; null when absent or conflicting (code carries the stable conflict code).' }
        code: { type: string }
    EmbeddingTestResult:
      type: object
      required: [status, model, dimension, requestId]
      properties:
        status: { type: string, enum: [ok] }
        model: { type: string }
        dimension: { type: integer }
        requestId: { type: string }
    RagIngestResponse: { type: object, required: [status, chunks, docIds], properties: { status: { type: string }, chunks: { type: integer }, docIds: { type: array, items: { type: string } } } }
    RagStatsResponse: { type: object, required: [totalDocuments], properties: { totalDocuments: { type: integer } } }
    WorkspaceExecutionSpec: { type: object, required: [workspaceId, generation, sandboxSpecHash, sandboxSpec, storageBackend, storageRef, storageMode, executionMode], properties: { workspaceId: { type: string }, generation: { type: integer }, sandboxSpecHash: { type: string }, sandboxSpec: { type: object, additionalProperties: true }, storageBackend: { type: string }, storageRef: { type: string }, storageMode: { type: string, enum: [managed_import, direct_attach] }, hostPath: { type: [string, 'null'] }, roots: { type: array, description: 'PLAN-0639: ordered root list [{rootId, hostPath}]. Runtime hydrate reads this to register per-root canonical paths. hostPath == roots[0].hostPath (legacy compat).' }, executionMode: { type: string, enum: [docker, windows-mxc, windows-host] } } }
    WorkspaceRootCreateRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, description: 'Absolute host directory for the new root. Must not partially overlap existing roots; fully-nested roots are allowed.' }
        alias: { type: [string, 'null'], maxLength: 128, description: 'Optional display name; UI-only, not a path component.' }
    WorkspaceRootPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        alias: { type: [string, 'null'], maxLength: 128 }
        position: { type: integer, minimum: 0, description: 'New position in the ordered root list; triggers sequential shift of siblings.' }
    WorkspaceRoot:
      type: object
      required: [id, position]
      properties:
        id: { type: string, format: uuid, description: 'Root key. root[0].id == workspace.id (primary root invariant).' }
        alias: { type: [string, 'null'], maxLength: 128 }
        position: { type: integer, minimum: 0 }
        path: { type: [string, 'null'], description: 'PLAN-0641 B12: workspace-relative POSIX path (nullable). Null for the primary root, roots outside the workspace tree, and callers who cannot see host paths (same rule as Workspace.hostPath). Display only — rootId stays the key.' }
    WorkspaceNestedRepos:
      type: object
      required: [workspaceId, cachedAt, items]
      properties:
        workspaceId: { type: string, format: uuid }
        cachedAt: { type: string, format: date-time, description: 'When this answer was produced (contract F2).' }
        items: { type: array, items: { $ref: '#/components/schemas/NestedRepoItem' } }
    NestedRepoItem:
      type: object
      required: [path, type, declared]
      properties:
        path: { type: string, description: 'Workspace-relative POSIX path.' }
        type: { type: string, enum: [nested, gitdir, submodule, bare, symlink] }
        declared: { type: boolean, description: 'Whether the path is already a declared root of this workspace.' }
    WorkspaceEnvironment: { type: object, required: [workspaceId, status, storageBackend, storageRef, storageMode, executionMode, capability, jobCapability, runtime], properties: { workspaceId: { type: string }, status: { type: string }, storageBackend: { type: string }, storageRef: { type: string }, storageMode: { type: string, enum: [managed_import, direct_attach] }, hostPath: { type: [string, 'null'], description: 'Canonical host path only for the owner/admin; null for ordinary members.' }, executionMode: { type: string, enum: [docker, windows-mxc, windows-host] }, capability: { $ref: '#/components/schemas/BackendCapabilitySnapshot' }, jobCapability: { $ref: '#/components/schemas/WorkspaceJobCapability' }, executionSpec: { type: object, additionalProperties: true }, runtime: { type: object, additionalProperties: true, description: 'Runtime view. PLAN-0391 additive keys: activeJobCount (integer), releaseOperationId (string|null), reason (USER_RELEASED|AUTO_EVICT|DESTROYED|CLEANUP_FAILED|RUNTIME_UNAVAILABLE|null).' } } }
    WorkspaceJob:
      type: object
      description: 'Workspace-scoped durable Job response. `jobId` is `workspace_jobs.id`; `runtimeJobId` is the opaque Runtime backend handle. No Ledger identifiers are exposed. `succeeded`/`timeout`/`orphaned` retain the current Job status vocabulary.'
      required: [jobId, workspaceId, scope, status]
      properties:
        jobId: { type: string, format: uuid, description: 'Domain Job identity (`workspace_jobs.id`); the only key on `/api/v1/workspaces/{workspaceId}/jobs/{jobId}/*` routes.' }
        runtimeJobId: { type: [string, 'null'], description: 'Opaque Runtime backend job handle (was `jobId` before PLAN-0465); CP-internal target for output/status/cancel and container output-dir operations.' }
        workspaceId: { type: string }
        sessionId: { type: [string, 'null'] }
        runId: { type: [string, 'null'] }
        source: { type: string, enum: [ui, agent, runtime, system, mcp, scheduled] }
        scope: { type: string, enum: [run, session, workspace], default: session }
        status: { type: string, enum: [pending, running, succeeded, cancelled, timeout, orphaned, interrupted] }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        exitCode: { type: [integer, 'null'] }
        timeoutSecs: { type: [integer, 'null'] }
        cancelReason: { type: [string, 'null'], enum: [user_cancel, scope_run_end, scope_session_stop, workspace_destroy, runtime_restart, destroy_orphan, job_missing, null] }
        backendKind: { type: [string, 'null'], enum: [docker, windows-mxc, windows-host, null] }
        executionMode: { type: [string, 'null'], enum: [docker, windows-mxc, windows-host, null] }
        actorType: { type: [string, 'null'], enum: [user, agent, system, service, null] }
        createdAt: { type: [string, 'null'], format: date-time }
        cleanupStatus: { type: [string, 'null'], enum: [not_started, running, completed, failed, null] }
        errorCode: { type: [string, 'null'] }
    WorkspaceJobStartRequest:
      type: object
      required: [command]
      properties:
        command: { type: string }
        args: { type: array, items: { type: string }, default: [] }
        cwd: { type: string }
        timeoutSecs: { type: integer, format: int64, default: 0, description: '0 means unlimited; positive values bound cumulative runtime.' }
        scope: { type: string, enum: [run, session, workspace], default: session }
        sessionId: { type: [string, 'null'] }
        runId: { type: [string, 'null'] }
        source: { type: string, enum: [ui, agent, runtime, system, mcp, scheduled], default: ui }
        env: { type: object, additionalProperties: { type: string } }
    ScheduledTaskCreatedBy: { type: object, required: [name, type], properties: { name: { type: [string, 'null'], description: 'Principal display name (user name/email; agent principal name).' }, type: { type: string, enum: [human, agent] } } }
    ScheduledTask:
      type: object
      description: |
        PLAN-0489 T1.4 read DTO (PLAN-0486 spec §1/§4): 17 camelCase fields; wire never
        echoes snake_case or internal columns (`payload`, `cancel_reason` stay internal).
        List items truncate `prompt` to 120 characters; the detail route returns the
        full text. `createdBy` is projected from the creating principal
        (`agent_principal_id` when set → type `agent` + `agent_principals.name`,
        else `user_id` → type `human`; a deleted principal degrades to `human`).
      required: [id, triggerKind, timezone, targetKind, status, nextFireAt, missedCount, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        triggerKind: { type: string, enum: [delay_once, cron] }
        cronExpr: { type: [string, 'null'], description: 'cron only (5 fields, minute grain); always null for delay_once.' }
        timezone: { type: string, description: 'Creation-time snapshot (D3-A); never editable.' }
        targetKind: { type: string, enum: [session_wakeup, job_dispatch] }
        targetSessionId: { type: [string, 'null'], format: uuid, description: 'session_wakeup only; null after a hard session delete (target_gone).' }
        prompt: { type: [string, 'null'], description: 'session_wakeup payload; truncated to 120 chars in list items.' }
        status: { type: string, enum: [scheduled, firing, missed, expired, cancelled, completed] }
        nextFireAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'delay_once only: created_at + 7d TTL; cron is always null.' }
        missedCount: { type: integer, minimum: 0, description: 'Consecutive missed rounds (E1); cleared on user disposition.' }
        lastMissedAt: { type: [string, 'null'], format: date-time }
        missedReason: { type: [string, 'null'], enum: [target_gone, dispatch_failed, overdue_grace, null] }
        lastRunId: { type: [string, 'null'], format: uuid, description: 'Latest dispatch carrier (chat_run / workspace_job domain id).' }
        createdBy: { $ref: '#/components/schemas/ScheduledTaskCreatedBy' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScheduledTaskCreateRequest:
      type: object
      additionalProperties: false
      required: [triggerKind, targetKind]
      properties:
        triggerKind: { type: string, enum: [delay_once, cron] }
        cronExpr: { type: string, description: 'Required for cron; exactly 5 fields (minute grain, no seconds).' }
        timezone: { type: string, default: UTC, description: 'IANA zone snapshot; invalid zones answer 400 INVALID_TIMEZONE.' }
        targetKind: { type: string, enum: [session_wakeup, job_dispatch] }
        targetSessionId: { type: string, format: uuid, description: 'Required for session_wakeup; forbidden for job_dispatch.' }
        prompt: { type: string, description: 'Required for session_wakeup.' }
        payload: { type: object, additionalProperties: true, description: 'Required for job_dispatch: {command, args?, cwd?, timeoutSecs?}; dispatched with scope=workspace and source=scheduled.' }
        at: { type: string, format: date-time, description: 'Required for delay_once: future ISO-8601 UTC instant within the 7d TTL.' }
        agentPrincipalId: { type: string, format: uuid, description: 'Optional agent creator (0486 #9): grants are read from agent_principal and session_wakeup targets are limited to this principal.' }
    ScheduledTaskDisposeRequest: { type: object, additionalProperties: false, properties: { agentPrincipalId: { type: string, format: uuid, description: 'Optional agent actor marker; agent dispositions are explicitly marked in the audit record (0486 #10).' } } }
    ScheduledTaskPostponeRequest: { type: object, additionalProperties: false, required: [at], properties: { at: { type: string, format: date-time, description: 'Future ISO-8601 UTC instant; delay_once may not pass expiresAt.' }, agentPrincipalId: { type: string, format: uuid } } }
    ScheduledTaskListPage:
      type: object
      required: [workspaceId, page, size, tasks]
      properties:
        workspaceId: { type: string, format: uuid }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 200 }
        tasks: { type: array, items: { $ref: '#/components/schemas/ScheduledTask' } }
    ScheduledTaskDisposeResult:
      type: object
      required: [taskId, status, changed, task]
      properties:
        taskId: { type: string, format: uuid }
        status: { type: string, enum: [scheduled, firing, missed, expired, cancelled, completed] }
        changed: { type: boolean, description: 'false when the task was already cancelled (idempotent remove/delete).' }
        task: { $ref: '#/components/schemas/ScheduledTask' }
    DirectAttachProbeRequest: { type: object, required: [storageMode, hostPath, executionMode], properties: { storageMode: { type: string, enum: [direct_attach] }, hostPath: { type: string }, executionMode: { type: string, enum: [windows-mxc, windows-host] } } }
    WorkspaceCapabilityPreflightRequest: { type: object, required: [hostPath], properties: { storageMode: { type: string, enum: [direct_attach], default: direct_attach, description: Omitted defaults to direct_attach; managed_import is rejected with 400 INVALID_STORAGE_MODE. }, hostPath: { type: string, description: Absolute host directory to attach; invalid/missing values return 400 INVALID_REQUEST. }, executionMode: { type: string, enum: [windows-mxc, windows-host], default: windows-mxc, description: Omitted defaults to windows-mxc on direct_attach. } } }
    WorkspaceJobCapability:
      type: object
      description: |
        PLAN-0396: job availability for this workspace, proxied from the Runtime
        `jobs/capabilities` entry (single source of truth). Always additive to
        `executionMode`; a probe failure degrades this block only.
      properties:
        backendKind: { type: string, enum: [docker, windows-mxc, windows-host] }
        backendRevision: { type: string }
        maturity: { type: string }
        executionMode: { type: string, enum: [docker, windows-mxc, windows-host] }
        canStart: { type: boolean }
        canCancel: { type: boolean }
        canStreamOutput: { type: boolean }
        canIsolateFilesystem: { type: boolean, description: false for the unrestricted host backend; the UI must surface it. }
        available: { type: boolean }
        unavailableReason: { type: [string, 'null'], description: RUNTIME_UNREACHABLE / CONTAINER_JOBS_SERVED_BY_DOCKER / backend reason. }
        fileOperations: { $ref: '#/components/schemas/FileOperationsCapability' }
        checkedAt: { type: string, description: ISO-8601 read timestamp recorded by CP. }
    FileOperationsCapability:
      type: object
      required: [contractVersion, executionMode, maxMutationBytes, workerLifecycle, operations]
      properties:
        contractVersion: { type: string, enum: [v1] }
        executionMode: { type: string, enum: [docker, windows-mxc, windows-host] }
        maxMutationBytes: { type: integer, format: int64, minimum: 1, description: Workspace file-tool payload cap. }
        workerLifecycle: { type: string, enum: [per-operation] }
        operations: { type: object, additionalProperties: { $ref: '#/components/schemas/FileOperationCapability' } }
    FileOperationCapability:
      type: object
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason: { type: [string, 'null'] }
        cap: { type: [integer, 'null'], format: int64 }
    BackendCapabilitySnapshot: { type: object, required: [contractVersion, backendKind, backendRevision, maturity, executionMode, available], properties: { contractVersion: { type: string, enum: [v1] }, backendKind: { type: string }, backendRevision: { type: string }, maturity: { type: string, enum: [stable, experimental] }, executionMode: { type: string }, available: { type: boolean }, reason: { type: string }, diagnostics: { type: object, additionalProperties: true } } }
    PublishWorkspaceEventRequest: { type: object, required: [kind, source], properties: { kind: { type: string, enum: [file_changed, snapshot_required] }, path: { type: string, description: Workspace-relative POSIX path }, changeType: { type: string, enum: [created, modified, deleted] }, source: { type: string, enum: [runtime] }, reason: { type: string, enum: [overflow] } } }
    WorkspaceEventAccepted: { type: object, required: [accepted, workspaceId, sequence], properties: { accepted: { type: boolean }, workspaceId: { type: string }, sequence: { type: integer, format: int64 } } }
    RuntimeHeartbeatRequest: { type: object, required: [deviceId, status], properties: { deviceId: { type: string }, status: { type: string, enum: [ready, blocked] } } }
    SkillAttachment:
      type: object
      description: 'PLAN-0628 D28-21: a manifest entry only — bytes stay in the source tree.'
      required: [path, sizeBytes, sha256]
      properties:
        path: { type: string, maxLength: 512, description: 'Relative path inside the skill directory (no "..", no absolute path, no drive prefix)' }
        sizeBytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        kind: { type: string, enum: [reference, script, asset] }
      additionalProperties: false
    SkillDefinitionScope:
      type: object
      description: 'Where a definition lives: `instance` = the shared library every authenticated caller may see, `workspace` = one workspace, `user` = the caller''s personal library. Three rows may share a name across scopes (README frozen #4 "双存"); within one scope the name is unique, and for `user` that means unique per owner, so two users may each own a skill with the same name (V156 `uq_skills_qualified_name` is UNIQUE NULLS NOT DISTINCT over **four** columns (name, definition_scope_type, definition_scope_id, definition_scope_user_id) — the three-column V101 form was replaced when the personal layer landed).'
      required: [type]
      properties:
        type: { type: string, enum: [instance, workspace, user], description: '`user` = the personal layer. Its owner is the authenticated caller and is never taken from the body: this schema has no userId member, so no request can address another user''s library (an attempt to add one is rejected by additionalProperties, 400 INVALID_REQUEST).' }
        workspaceId: { type: string, format: uuid, description: 'Required exactly when type=workspace; must be absent when type=instance or type=user (400 INVALID_REQUEST otherwise). A user-scope row stores the caller''s userId in **`definition_scope_user_id`** — `definition_scope_id` keeps its foreign key to `workspaces` and stays NULL on user rows — so no id travels on the wire.' }
      additionalProperties: false
    SkillImportItem:
      type: object
      required: [name, description, body, sourcePath]
      properties:
        name:
          type: string
          maxLength: 64
          description: 'Frontmatter name: lowercase kebab-case matching ^[a-z0-9][a-z0-9._-]{0,63}$ and equal to the source directory name. ":" is reserved as the qualifier separator of the listing display name.'
        description: { type: string, maxLength: 1024, description: 'One line, no leading/trailing whitespace; line breaks and control characters are refused (one listing item must stay one prompt line).' }
        body: { type: string, maxLength: 262144, description: 'SKILL.md body with the frontmatter block removed; stored verbatim.' }
        sourcePath: { type: string, maxLength: 512, description: 'Workspace-relative path of the source file, compared against the definition directory name' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/SkillAttachment' }
        trusted: { type: boolean, default: false, description: 'D28-09 rule 1: only an instance administrator may set this to true. Not accepted at all when the request targets the personal layer: a type=user item carrying the key is 400 INVALID_REQUEST (whole request, nothing written) and personal rows are always stored trusted=false (P-189-1).' }
      additionalProperties: false
    SkillImportRequest:
      type: object
      required: [definitionScope, skills]
      properties:
        definitionScope: { $ref: '#/components/schemas/SkillDefinitionScope' }
        skills:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/SkillImportItem' }
      additionalProperties: false
    SkillImportResult:
      type: object
      required: [skillId, name, action, version, bodyTokensEst, oversize]
      properties:
        skillId: { type: string, format: uuid }
        name: { type: string }
        action: { type: string, enum: [created, updated, unchanged] }
        version: { type: integer, minimum: 1 }
        bodyTokensEst: { type: integer, minimum: 0 }
        oversize: { type: boolean, description: 'D28-15: marked only — the definition stays available' }
    SkillImportRejection:
      type: object
      required: [code]
      properties:
        sourcePath: { type: [string, 'null'] }
        code:
          type: string
          enum: [SKILL_NAME_INVALID, SKILL_DESCRIPTION_REQUIRED, SKILL_DESCRIPTION_TOO_LONG, SKILL_DESCRIPTION_EDGE_WHITESPACE, SKILL_DESCRIPTION_CONTROL_CHARACTER, SKILL_BODY_EMPTY, SKILL_BODY_TOO_LARGE, SKILL_ATTACHMENT_INVALID, SKILL_SOURCE_PATH_INVALID, SKILL_TRUSTED_FORBIDDEN]
        detail: { type: string }
    SkillImportSummary:
      type: object
      required: [created, updated, unchanged, rejected, oversize]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        oversize: { type: integer, minimum: 0 }
    SkillImportResponse:
      type: object
      required: [results, rejected, summary]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SkillImportResult' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/SkillImportRejection' }
        summary: { $ref: '#/components/schemas/SkillImportSummary' }
    SkillView:
      type: object
      required: [skillId, name, definitionScope, description, bodyTokensEst, oversize, trusted, sourcePath, contentHash, version, attachments, createdAt, updatedAt]
      properties:
        skillId: { type: string, format: uuid }
        name: { type: string }
        definitionScope: { $ref: '#/components/schemas/SkillDefinitionScope' }
        description: { type: string }
        bodyTokensEst: { type: integer, minimum: 0 }
        oversize: { type: boolean }
        trusted: { type: boolean }
        sourcePath: { type: string }
        contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        version: { type: integer, minimum: 1 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/SkillAttachment' }
        body: { type: string, description: 'Only present when ?includeBody=true' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SkillListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SkillView' }
    SkillBindingCreateRequest:
      type: object
      required: [skillId, subjectType, subjectId, scopeType]
      properties:
        skillId: { type: string, format: uuid }
        subjectType: { type: string, enum: [user, agent_principal] }
        subjectId: { type: string, format: uuid, description: 'Always required: v1 has no instance-wide shared tier (D28-14)' }
        scopeType: { type: string, enum: [instance, workspace] }
        scopeId: { type: string, format: uuid, description: 'Present exactly when scopeType=workspace' }
      additionalProperties: false
    SkillBindingView:
      type: object
      required: [bindingId, skillId, subjectType, subjectId, scopeType, createdAt]
      properties:
        bindingId: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        subjectType: { type: string, enum: [user, agent_principal] }
        subjectId: { type: string, format: uuid }
        scopeType: { type: string, enum: [instance, workspace] }
        scopeId: { type: [string, 'null'], format: uuid }
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    SkillBindingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SkillBindingView' }
    ProblemDetails:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
        runId: { type: string }
        provider: { type: string }
        model: { type: string }
        retryable: { type: boolean }
        dependency: { type: string, description: 'PLAN-0557: unavailable dependency (runtime|agent) on MCP/models proxy failures.' }
        reason: { type: string, description: 'PLAN-0557: frozen dependency failure reason (unreachable|timeout|auth_failed|upstream_error).' }
        outcome: { type: string, enum: [success, error, partial, ambiguous] }
    JobOutputChunk:
      type: object
      description: 'Durable Job output chunk. `jobId` is the Workspace Job domain identity and `runtimeJobId` is the backend handle. `nextOffset` is always a UTF-8 rune boundary; `truncated` means the output file hit the 1 MiB JOB_CAP.'
      required: [jobId, stream, offset, nextOffset, sizeBytes, truncated, data, jobStatus]
      properties:
        jobId: { type: string, format: uuid, description: Workspace Job domain identity. }
        runtimeJobId: { type: string, description: Runtime backend handle. }
        stream: { type: string, enum: [stdout, stderr] }
        offset: { type: integer, description: Actual byte offset (malformed input offsets are advanced to the nearest boundary) }
        nextOffset: { type: integer }
        sizeBytes: { type: integer }
        truncated: { type: boolean }
        data: { type: string }
        jobStatus: { type: string, enum: [running, succeeded, cancelled, timeout, orphaned] }
    RemoteOauth:
      type: object
      description: |
        PLAN-0759 / BL-548: server-level OAuth client configuration for a remote MCP server.
        Shared by every user of the workspace (unlike `oauth_credentials`, which holds the
        per-user tokens). All fields optional; a remote entry without any of them is a plain
        http endpoint. Field names match the UI's `RemoteMcpServer.oauth` shape verbatim.
      properties:
        clientId: { type: string, description: OAuth client_id registered with the authorization server }
        authorizationEndpoint: { type: string, description: Authorization endpoint (where the user is redirected to consent) }
        tokenEndpoint: { type: string, description: Token endpoint (where CP exchanges the code) }
        redirectUri: { type: string, description: Redirect URI registered for the client; defaults to the app origin when omitted }
        scope: { type: string, description: Space-separated scopes requested at authorization time }
    RemoteMcpServerEntry:
      type: object
      description: |
        PLAN-0759 / BL-548: one entry of the mixed `mcpServers` map on
        `/api/v1/workspaces/{workspaceId}/mcp-config`. Remote entries carry `url` +
        optional `oauth`; stdio entries carry `command`/`args`. A single entry must not
        mix both shapes (CP answers 400 INVALID_REQUEST).
      required: [url]
      properties:
        url: { type: string, description: Remote MCP endpoint (http or https) }
        type: { type: string, enum: [http], description: Wire marker; CP keeps emitting "http" for remote entries }
        oauth:
          allOf:
            - $ref: '#/components/schemas/RemoteOauth'
    McpServerStatusList:
      type: object
      description: PLAN-0366 stdio MCP session status list. Field names are the CP public camelCase mapping of the Runtime SessionSnapshot wire (server_id/last_error/since_ms); `state` keeps the Runtime lowercase literals, `sinceMs` is Unix milliseconds.
      required: [servers, count]
      properties:
        servers:
          type: array
          items:
            type: object
            required: [serverId, state, attempt, lastError, sinceMs, epoch]
            properties:
              serverId: { type: string }
              state: { type: string, enum: [starting, ready, restarting, failed, stopped] }
              attempt: { type: integer }
              lastError: { type: [string, 'null'] }
              sinceMs: { type: integer, description: Unix milliseconds when the current state was entered }
              epoch: { type: integer, description: Session generation counter }
        count: { type: integer }
    WorkspaceJobCancelResult:
      type: object
      description: Canonical single-job cancel outcome; `jobId` is the Workspace Job domain identity.
      required: [jobId, status, changed]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [succeeded, cancelled, timeout, orphaned] }
        changed: { type: boolean }
    RuntimeJobStartRequest:
      type: object
      required: [jobId, command]
      properties:
        jobId: { type: string, format: uuid, description: Canonical Workspace Job identity. }
        command: { type: string }
        args: { type: array, items: { type: string }, default: [] }
        timeoutSecs: { type: integer, format: int64, default: 0, description: '0 means unlimited.' }
        cwd: { type: string, description: Accepted but currently ignored by the Docker path. }
        env: { type: object, additionalProperties: { type: string }, description: Accepted but currently ignored by the Docker path. }
    RuntimeJobStartResponse:
      type: object
      required: [jobId, runtimeJobId, status, bootId]
      properties:
        jobId: { type: string, format: uuid, description: Echo of the canonical Workspace Job identity from the request. }
        runtimeJobId: { type: string, description: Runtime backend handle used for status/output/cancel calls. }
        status: { type: string, enum: [running] }
        bootId: { type: string, description: Runtime per-process boot id; a change makes unconfirmed Jobs interrupted without replay. }
    RuntimeJobHandleRequest:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, description: Canonical Workspace Job identity. }
    RuntimeJobOutputRequest:
      type: object
      required: [jobId, stream, offset, limit]
      properties:
        jobId: { type: string, description: Opaque Runtime job handle. }
        stream: { type: string, enum: [stdout, stderr] }
        offset: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, format: int64, minimum: 1, maximum: 1048576 }
    RuntimeJobCleanupResponse:
      type: object
      required: [outcome, processes]
      properties:
        jobId: { type: string }
        outcome: { type: string, enum: [completed, failed] }
        reason: { type: [string, 'null'], description: Failure reason for outcome=failed; omitted/null on success. }
        processes: { type: integer, minimum: 0, description: Processes reclaimed from the job object during this cleanup. }
    RuntimeJobCapabilityResponse:
      type: object
      required: [backendKind, canStart, canCancel, canStreamOutput, canIsolateFilesystem, available]
      properties:
        backendKind: { type: string, enum: [windows-mxc, windows-host] }
        backendRevision: { type: string }
        maturity: { type: string, description: Backend maturity marker (MXC stays experimental). }
        executionMode: { type: string, enum: [windows-mxc, windows-host] }
        canStart: { type: boolean }
        canCancel: { type: boolean }
        canStreamOutput: { type: boolean }
        canIsolateFilesystem: { type: boolean, description: true only for windows-mxc; windows-host is unrestricted by design. }
        available: { type: boolean }
        unavailableReason: { type: [string, 'null'], description: Stable reason when available=false. }
        reason: { type: [string, 'null'], description: Legacy probe key kept in sync with unavailableReason. }
    SafePolicySummary:
      type: object
      additionalProperties: false
      description: >-
        Safe verdict snapshot attached to the MCP invocation: why the call
        was allowed or blocked. Raw tool arguments, MCP request bodies and free-form exception text
        are never included; legacy V19-absent rows omit the whole `policy` object. `reused` is the
        T1.7 reuse annotation: true when the dispatch reused an exact session grant, null when reuse
        is not applicable (legacy V19 snapshots parse as null).
      required: [effect, sourceLayer, matchedRule, reason, mode, allowedBy, actionClass, shape, reused]
      properties:
        effect: { type: string, enum: [allow, ask, deny] }
        sourceLayer: { type: string, enum: [builtin, instance, user, workspace-default, workspace, session, per_call] }
        matchedRule: { type: [string, 'null'], minLength: 1 }
        reason: { type: string, minLength: 1 }
        mode: { type: [string, 'null'], enum: [manual, auto] }
        allowedBy:
          type: [string, 'null']
          description: Lower-cased automatic-allow marker (e.g. `auto@session`) when the allow came from a mode rather than a rule.
        actionClass: { type: string, minLength: 1 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
        reused:
          type: [boolean, 'null']
          description: T1.7 reuse annotation — `true` only for an exact session-fingerprint dispatch; `null` when reuse is not applicable; never fabricated.
    McpApprovalRequiredError:
      type: object
      additionalProperties: false
      description: >-
        JSON-RPC 2.0 error frame returned with HTTP 409 by the MCP gate when no valid approval grant
        or session fingerprint exists (PLAN-0328 T1.7/T1.9). The safe extension travels as
        `error.data` because MCP transports discard non-JSON-RPC response bodies. The durable pending
        approval referenced by `approvalRequestId` is created or reused (same session + tool +
        canonical arguments hash) before this response is emitted.
      required: [jsonrpc, id, error]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: { type: [integer, string, 'null'], description: Echoes the JSON-RPC request id; null when the request carried none. }
        error:
          type: object
          additionalProperties: false
          required: [code, message, data]
          properties:
            code: { type: integer, enum: [-32003] }
            message: { type: string, enum: [APPROVAL_REQUIRED] }
            data: { $ref: '#/components/schemas/McpApprovalRequiredData' }
    McpApprovalRequiredData:
      type: object
      additionalProperties: false
      description: Safe approval extension (never contains tool arguments).
      required: [status, code, approvalRequestId, tool, expiresAt, retryHeader]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [APPROVAL_REQUIRED] }
        approvalRequestId: { type: string, minLength: 1, maxLength: 128, description: Durable ChatApproval request id; the Agent keys its waiter on it and retries with the grant header. }
        tool: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        retryHeader: { type: string, enum: ['X-Xihe-Approval-Request-Id'] }
        statusUrl:
          type: [string, 'null']
          description: Run recovery route (`/api/v1/chat/runs/{runId}`) for the originating run; present only when the call carried a run context. Informational for the Agent (user auth required).
        policy: { $ref: '#/components/schemas/ApprovalPolicySummary' }
    AuditEntry:
      type: object
      required: [type, id, status, createdAt]
      description: >-
        PLAN-0466 T1.1/T2.2 user-tier audit entry — one row of the `v_audit_entries`
        view. The user projection never includes userId, idempotencyKey, requestId,
        runtimeJobId, argumentsPreview or history payload text, and never carries
        prompt content or credentials.
      properties:
        type: { type: string, enum: [chat_run, workspace_job, mcp_invocation, approval] }
        id: { type: string, format: uuid, description: 'Domain primary key: chat_runs.id / workspace_jobs.id / mcp_invocations.id / approval_requests.request_id' }
        sessionId: { type: [string, 'null'], format: uuid }
        workspaceId: { type: [string, 'null'], format: uuid }
        runId: { type: [string, 'null'], format: uuid }
        status: { type: string, description: 'Native domain status/state vocabulary (unknown values are displayed as recorded)' }
        summary: { type: [string, 'null'], description: 'Non-sensitive list title: chat_run → model, mcp_invocation → tool name, approval → tool, workspace_job → null' }
        source: { type: [string, 'null'], description: 'Native provenance column: chat_runs.origin / workspace_jobs.source / mcp_invocations.source / approval_requests.origin' }
        errorCode: { type: [string, 'null'] }
        scope: { type: [string, 'null'], description: 'workspace_job scope (run/session/workspace)' }
        cancelReason: { type: [string, 'null'] }
        toolCallId: { type: [string, 'null'], format: uuid }
        approvalRequestId: { type: [string, 'null'], format: uuid }
        terminalOutcome: { type: [string, 'null'], description: 'chat_run terminal outcome; null for other types' }
        createdAt: { type: string, format: date-time, readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        finishedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        policy: { $ref: '#/components/schemas/SafePolicySummary', description: 'Safe verdict snapshot on mcp_invocation/approval details; omitted when the stored snapshot is unreadable (never guessed).' }
        approved: { type: [boolean, 'null'], description: 'Approval detail only.' }
        decisionKind: { type: [string, 'null'], description: 'Approval detail only.' }
    InternalAuditEntry:
      description: >-
        PLAN-0466 internal tier: the user tier plus identity/correlation references
        (userId/idempotencyKey/requestId/runtimeJobId). Prompt content, credentials
        and raw arguments stay excluded in this tier as well.
      allOf:
        - $ref: '#/components/schemas/AuditEntry'
        - type: object
          required: [userId]
          properties:
            userId: { type: [string, 'null'], format: uuid }
            idempotencyKey: { type: [string, 'null'] }
            requestId: { type: [string, 'null'], format: uuid }
            runtimeJobId: { type: [string, 'null'] }
    AuditTimelineEvent:
      type: object
      required: [sequence, eventType, createdAt]
      description: >-
        Uniform projection of one row of the four append-only history tables
        (chat_run_history / workspace_job_history / mcp_dispatch_history /
        approval_history). Columns a source table does not have are omitted —
        workspace_job_history has no actor_type, approval_history carries
        approved/decisionKind instead — and the free-form `payload` TEXT column is
        never projected.
      properties:
        sequence: { type: integer, format: int64, readOnly: true }
        eventType: { type: string, description: 'Native event vocabulary (terminal/cancel/recovery/restore, start/running/settle/cancel/orphaned/interrupted, invocation.*/attempt.*, requested/dispatching/decided/expired/dispatch_unknown)' }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: [string, 'null'] }
        actorType: { type: [string, 'null'] }
        terminalOutcome: { type: [string, 'null'], description: 'chat_run_history only' }
        cancelReason: { type: [string, 'null'], description: 'workspace_job_history only' }
        errorCode: { type: [string, 'null'] }
        attemptId: { type: [string, 'null'], format: uuid, description: 'mcp_dispatch_history only' }
        approved: { type: [boolean, 'null'], description: 'approval_history only' }
        decisionKind: { type: [string, 'null'], description: 'approval_history only' }
        createdAt: { type: string, format: date-time, readOnly: true }
    AuditAttempt:
      type: object
      required: [id, stage, status]
      description: 'Owner-facing attempt projection of an mcp_invocation detail; no httpStatus, no resultRef.'
      properties:
        id: { type: string, format: uuid, readOnly: true }
        invocationId: { type: [string, 'null'], format: uuid, readOnly: true }
        stage: { type: string, readOnly: true }
        retryNo: { type: [integer, 'null'], readOnly: true }
        module: { type: [string, 'null'], readOnly: true }
        status: { type: string, enum: [started, succeeded, failed, timed_out, cancelled, unknown, late_confirmed], readOnly: true }
        errorCode: { type: [string, 'null'], readOnly: true }
        durationMs: { type: [integer, 'null'], readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        finishedAt: { type: [string, 'null'], format: date-time, readOnly: true }
    InternalAuditAttempt:
      description: 'Internal attempt projection: the user tier plus the transport/result references.'
      allOf:
        - $ref: '#/components/schemas/AuditAttempt'
        - type: object
          properties:
            httpStatus: { type: [integer, 'null'], readOnly: true }
            resultRef: { type: [string, 'null'], readOnly: true, description: 'Internal trace view only.' }
    AuditEntryListResponse:
      type: object
      required: [entries, page, size, totalElements, totalPages]
      description: One page of the audit view; newest first (created_at DESC, entry_id DESC).
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, minimum: 0, description: '0 when the filtered set is empty' }
    AuditEntryDetailResponse:
      type: object
      required: [entry, timeline, attempts]
      description: >-
        Owner-facing detail: the entry (user tier) plus that domain's history
        timeline and, for mcp_invocation, its attempts. `timeline` is empty for a
        row without history (pre-V50/V51/V53 shapes) — the entry still shows current
        status, terminal outcome and finishedAt instead of invented events.
      properties:
        entry: { $ref: '#/components/schemas/AuditEntry' }
        timeline: { type: array, items: { $ref: '#/components/schemas/AuditTimelineEvent' } }
        attempts: { type: array, items: { $ref: '#/components/schemas/AuditAttempt' }, description: 'Only mcp_invocation entries carry attempts; empty for the other types.' }
    InternalAuditEntryDetailResponse:
      type: object
      required: [entry, timeline, attempts]
      description: 'Service-Bearer detail: internal field tier (userId/idempotencyKey/requestId/runtimeJobId, attempt httpStatus/resultRef).'
      properties:
        entry: { $ref: '#/components/schemas/InternalAuditEntry' }
        timeline: { type: array, items: { $ref: '#/components/schemas/AuditTimelineEvent' } }
        attempts: { type: array, items: { $ref: '#/components/schemas/InternalAuditAttempt' } }
    # --- PLAN-0691 T1.2: plugin bindings + per-session attachments -----------------------------
    PluginBindingCreateRequest:
      type: object
      required: [pluginId]
      description: 'Bind an installed plugin version to the calling workspace. `grantedAtoms` omitted keeps the builtin workspace default set (grant source `default`); a third-party plugin requires it explicitly (403 PLUGIN_GRANT_DENIED otherwise) and every atom must appear in the manifest''s `requestedAtoms` (422 PLUGIN_MANIFEST_INVALID).'
      properties:
        pluginId: { type: string, minLength: 1, description: 'Registry id; the current version row is resolved server-side' }
        grantedAtoms: { type: array, items: { type: string }, description: 'Atoms to grant on this binding (S5 vocabulary)' }
    PluginBindingUpdateRequest:
      type: object
      description: 'At least one field is required (400 INVALID_REQUEST otherwise). Only the operator half of the state machine is writable here.'
      properties:
        state: { type: string, enum: [pending, enabled, degraded, suspended, disabled], description: 'Writable: enabled, disabled. pending/degraded/suspended are CP-owned and answer 400 INVALID_REQUEST when written directly.' }
        grantedAtoms: { type: array, items: { type: string }, description: 'Replaces the granted set; re-validated against the manifest and switches the grant source to `plugin_binding`' }
    PluginBindingView:
      type: object
      required: [bindingId, pluginId, workspaceId, source, state, version, digest, grantedAtoms, effectiveAtoms, createdAt, updatedAt]
      description: 'One workspace''s binding of one installed plugin version. `source` is the plugin source; `state` is the five-state machine; `effectiveAtoms` is the intersection of the granted set with the manifest''s requested atoms.'
      properties:
        bindingId: { type: string, format: uuid, readOnly: true }
        pluginId: { type: string, readOnly: true }
        workspaceId: { type: string, format: uuid, readOnly: true }
        source: { type: string, enum: [builtin, third-party], readOnly: true }
        state: { type: string, enum: [pending, enabled, degraded, suspended, disabled] }
        version: { type: string, readOnly: true }
        digest: { type: string, readOnly: true, description: 'Version digest pinned by the composite FK (pluginId, digest)' }
        grantedAtoms: { type: array, items: { type: string } }
        effectiveAtoms: { type: array, items: { type: string }, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    PluginBindingListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PluginBindingView' } }
    PluginAuthorizationSummary:
      type: object
      required: [bindingId, requestedAtoms, grantedAtoms, effectiveAtoms, sources]
      description: 'Three sets — manifest-requested, binding-granted, and their intersection — plus the grant source of every effective atom. PLAN-0691 T1.3 delivered the `PLUGIN_BIND` authorization takeover on binding write paths; this projection stays the read-only explanation surface (`effectiveAtoms` is `grantedAtoms ∩ requestedAtoms`).'
      properties:
        bindingId: { type: string, format: uuid, readOnly: true }
        requestedAtoms: { type: array, items: { type: string }, readOnly: true, description: 'From the installed manifest' }
        grantedAtoms: { type: array, items: { type: string }, readOnly: true, description: 'From the binding row' }
        effectiveAtoms: { type: array, items: { type: string }, readOnly: true, description: 'requestedAtoms ∩ grantedAtoms' }
        sources: { type: array, items: { $ref: '#/components/schemas/PluginAtomGrant' }, readOnly: true }
    PluginAtomGrant:
      type: object
      required: [atom, source]
      properties:
        atom: { type: string }
        source: { type: string, enum: [default, plugin_binding], description: 'S5 grant-source vocabulary; `default` = builtin workspace default set, `plugin_binding` = explicit grant on this binding' }
    SessionPluginView:
      type: object
      required: [bindingId, pluginId, version, digest, state, revision, attachedAt]
      description: 'One active attachment, projected from the snapshot frozen at attach time. The snapshot — not the live binding — is what the running turn sees.'
      properties:
        bindingId: { type: string, format: uuid, readOnly: true }
        pluginId: { type: string, readOnly: true }
        version: { type: string, readOnly: true }
        digest: { type: string, readOnly: true }
        state: { type: string, enum: [pending, enabled, degraded, suspended, disabled], readOnly: true, description: 'State at attach time' }
        revision: { type: integer, minimum: 1, readOnly: true }
        attachedAt: { type: string, format: date-time, readOnly: true }
    SessionPluginListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionPluginView' } }
    PluginAttachRequest:
      type: object
      required: [bindingId]
      description: 'The client sends only the binding; the snapshot is taken server-side.'
      properties:
        bindingId: { type: string, format: uuid }
    PluginAttachResult:
      type: object
      required: [bindingId, revision, catalogVersion, effectiveNextTurn]
      description: 'Result of an attach. Idempotent for an already-active pair (revision unchanged); a detached pair is revived with revision+1. `catalogVersion` is the per-session revision high-water mark today (T1.6 replaces it with the catalog sequence).'
      properties:
        bindingId: { type: string, format: uuid, readOnly: true }
        revision: { type: integer, minimum: 1, readOnly: true }
        catalogVersion: { type: integer, minimum: 0, readOnly: true }
        effectiveNextTurn: { type: boolean, readOnly: true, description: 'The next turn of the session sees this attachment' }
    # --- PLAN-0691 T1.1: plugin catalog views ---
    PluginActionView:
      type: object
      description: 'One action declared by the installed manifest, projected for the catalog. `actionClass` and `resourceType` are manifest vocabulary; T1.1 does not interpret them.'
      required: [name, actionClass]
      properties:
        name: { type: string }
        title: { type: [string, 'null'], description: 'Manifest title; null when the manifest omits it' }
        actionClass: { type: string }
        resourceType: { type: [string, 'null'], description: 'Manifest resource type; null when the manifest omits it' }
    PluginLimits:
      type: object
      description: 'Effective execution limits: manifest values, with the defaults 5000 ms and 4 concurrent calls applied when the manifest omits them.'
      required: [timeoutMs, maxConcurrency]
      properties:
        timeoutMs: { type: integer, minimum: 1 }
        maxConcurrency: { type: integer, minimum: 1 }
    PluginView:
      type: object
      description: 'One installed plugin version. The jsonb manifest never surfaces: actions, requestedAtoms and limits are the only projections. `digest` content-addresses the package, so bindings are pinned to a (pluginId, digest) pair. `state` is the plugin-level lifecycle switch and is independent of PluginBindingView.state.'
      required: [pluginId, version, digest, source, state, manifestVersion, actions, requestedAtoms, limits, createdAt, updatedAt]
      properties:
        pluginId: { type: string }
        version: { type: string }
        digest: { type: string, description: 'Content address of the installed package as written by the manifest' }
        source: { type: string, enum: [builtin, third-party] }
        state: { type: string, enum: [enabled, disabled] }
        manifestVersion: { type: string, description: 'Manifest schema version declared by the package; a string, never a number' }
        actions: { type: array, items: { $ref: '#/components/schemas/PluginActionView' } }
        requestedAtoms: { type: array, items: { type: string }, description: 'Atoms the manifest asks for; the binding decides which are granted' }
        limits: { $ref: '#/components/schemas/PluginLimits' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PluginListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PluginView' } }
    PluginPackageRequest:
      type: object
      description: 'Install and upgrade take the same body (B-3). `packagePath` is a directory under the plugin package root; blank is 400 INVALID_REQUEST and anything that does not resolve to a readable manifest is 422 PLUGIN_MANIFEST_INVALID.'
      required: [packagePath]
      properties:
        packagePath: { type: string, description: 'e.g. `official/<pluginId>` or `local/<pluginId>`; a leading `plugins/` prefix is accepted and stripped' }
    # --- PLAN-0691 T1.5: plugin KV + records wire shapes ---
    PluginKvItem:
      type: object
      description: 'One KV entry. `value` is the stored JSON document returned verbatim; `expiresAt` is null when the key was written without a TTL, and an expired row is already reported as 404.'
      required: [key, value, version]
      properties:
        key: { type: string }
        value: { description: 'Any JSON value; stored verbatim and returned unchanged' }
        version: { type: integer, minimum: 1, description: 'CAS version; send it as `If-Match` on the next write or delete' }
        expiresAt: { type: [string, 'null'], format: date-time }
    PluginKvPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PluginKvItem' } }
        nextCursor: { type: [string, 'null'], description: 'Opaque cursor for the next page; null on the last page' }
    PluginKvPutRequest:
      type: object
      description: 'API-2 body. The precondition may arrive as the `If-Match` header or as `ifMatch` here — when both are present they must agree, and `If-Match: *` cannot be combined with `ifMatch`.'
      required: [value]
      properties:
        value: { description: 'Any JSON value; required, stored verbatim, at most 262144 UTF-8 bytes' }
        ttlSeconds: { type: [integer, 'null'], minimum: 1, maximum: 7776000, description: 'Expiry in seconds; absent or null means no expiry, 0 or negative is a request error' }
        ifMatch: { type: [integer, 'null'], minimum: 1, description: 'Expected stored version (alternative to the If-Match header)' }
    PluginRecordItem:
      type: object
      description: 'One records document. `doc` is the stored JSON object; `version` increments on every upsert (API-10) and is informational only, because the records surface has no conditional writes.'
      required: [id, doc, version, updatedAt]
      properties:
        id: { type: string, description: 'Record id; minted by CP on create, echoed on upsert' }
        doc: { type: object, additionalProperties: true, description: 'The stored document, returned verbatim' }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    PluginRecordPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PluginRecordItem' } }
        nextCursor: { type: [string, 'null'], description: 'Opaque cursor for the next page; null on the last page' }
    PluginRecordWriteRequest:
      type: object
      description: 'API-5 body: the wrapper gives the document a name on the wire. `doc` must be a JSON object — an array or a scalar is 400 INVALID_REQUEST.'
      required: [doc]
      properties:
        doc: { type: object, additionalProperties: true, description: 'The record document; stored verbatim as jsonb, at most 1048576 bytes' }


