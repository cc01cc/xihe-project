        status: { type: string, enum: [accepted, queued, running, streaming, awaiting_approval, cancelling, dispatching, succeeded, failed, partial, ambiguous, cancelled] }
        terminalOutcome: { type: [string, 'null'], enum: [success, error, partial, ambiguous, cancelled] }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'], format: date-time }
        terminalAt: { type: [string, 'null'], format: date-time }
        waitingOnRunId:
          type: [string, 'null']
          format: uuid
          description: Parent run this spawn child waits on (PLAN-0464 waiting link; null outside spawn or for pre-V50 rows)
        waitingToolCallId:
          type: [string, 'null']
          format: uuid
          description: Parent `spawn_agent` tool call the wait belongs to
    SessionRunsResponse:
      type: object
      additionalProperties: false
      required: [sessionId, page, size, runs]
      properties:
        sessionId: { type: string, format: uuid }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        runs: { type: array, items: { $ref: '#/components/schemas/SessionRunSummary' } }
    SessionMonitorResponse:
      type: object
