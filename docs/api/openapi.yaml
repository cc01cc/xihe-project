    AgentPrincipalRoleBindingView: { type: object, additionalProperties: false, required: [bindingId, principalId, roleId, name, scopeType, isSystem, atomCount, atoms, grantedAt], description: 'PLAN-0667: one role binding of an agent principal. `name`/`displayName` identify the role, `scopeName` carries the workspace name for workspace-scope rows; `atoms` are localized short labels (PermissionAtomLabels, at most 12) and `atomCount` is the real distinct atom count, so the UI can show the first three plus 共 N 个 without exposing the whole permission set (D5). Labels follow `?locale=` (zh-CN default, en-US supported) or the Accept-Language header; machine atom names never leave the server.', properties: { bindingId: { type: string, format: uuid }, principalId: { type: string, format: uuid }, roleId: { type: string, format: uuid }, name: { type: string, description: 'roles.name, e.g. WS_EDITOR' }, displayName: { type: [string, 'null'] }, description: { type: [string, 'null'] }, scopeType: { type: string, enum: [instance, workspace] }, scopeId: { type: [string, 'null'], format: uuid }, scopeName: { type: [string, 'null'], description: 'workspace name when scopeType=workspace, else null' }, isSystem: { type: boolean, description: 'PLAN-0667 (Lead ruling 2026-11-05): true only for a **seed binding** — a default grant written by the seeding/creation path, immutable (DELETE answers 409 ROLE_BINDING_IMMUTABLE). It does NOT mean "the role is a system role": a user-created binding of WS_EDITOR/AGENT_DELEGATOR reports false and is deletable (204).' }, atomCount: { type: integer, description: 'distinct derived atom count of the role' }, atoms: { type: array, maxItems: 12, items: { type: string }, description: 'localized short labels (PermissionAtomLabels); slice(0,3) for display' }, grantedBy: { type: [string, 'null'], format: uuid }, grantedAt: { type: string, format: date-time } } }
