    post: { operationId: spawnMcpBridge, deprecated: true, description: 'Deprecated: reserved; live bridges are driven by the 30s config poll (PLAN-242).', security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '201': { description: Spawned } } }
