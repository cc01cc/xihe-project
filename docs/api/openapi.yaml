    get:
      operationId: getWorkspaceCheckpointRetention
      summary: Checkpoint retention constants and current slice/ref counts
      description: |
        Informational retention view. The fixed policy is the newest 50 slices plus a 30-day TTL;
        expired slices are collected and custom retention values are not configurable. The existing
        response field names `maxRuns`/`currentRuns` are retained while their values count slices.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Retention constants and current counts
          content:
            application/json:
              schema: { type: object, required: [maxRuns, ttlDays, unsealedNeverDeleted, currentRuns, currentRefs], properties: { maxRuns: { type: integer }, ttlDays: { type: integer }, unsealedNeverDeleted: { type: boolean }, currentRuns: { type: integer }, currentRefs: { type: integer } } }
