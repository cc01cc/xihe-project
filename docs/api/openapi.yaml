openapi: 3.1.0
info:
  title: Xihe API
  version: 1.0.0
  description: Canonical HTTP contract for Xihe public and service APIs.
servers:
  - url: /
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/workspaces/current:
    get: { operationId: getCurrentWorkspace, security: [{ bearerAuth: [] }], responses: { '200': { description: Current workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      security: [{ bearerAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/workspaces/{workspaceId}:
    get: { operationId: getWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: updateWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceUpdateRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteWorkspace, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '204': { description: Logically deleted }, '404': { $ref: '#/components/responses/Problem' } } }
  /api/v1/sessions:
    get: { operationId: listSessions, security: [{ bearerAuth: [] }], responses: { '200': { description: Sessions } } }
    post: { operationId: createSession, security: [{ bearerAuth: [] }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreateRequest' } } } }, responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '401': { $ref: '#/components/responses/Problem' } } }
  /api/v1/sessions/{sessionId}:
    get: { operationId: getSession, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    patch: { operationId: updateSession, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/SessionUpdateRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }, '404': { $ref: '#/components/responses/Problem' } } }
    delete: { operationId: deleteSession, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/oauth/sessions:
    post:
      operationId: startOAuthSession
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Created }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/oauth/callback:
    get:
      operationId: oauthCallback
      parameters: [{ in: query, name: state, required: true, schema: { type: string } }, { in: query, name: code, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/Problem' } }
  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthBindingRequest' }
      responses:
        '200':
          description: Revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /internal/v1/oauth/token:
    post:
      operationId: brokerOAuthToken
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthTokenRequest' } } } }
      responses: { '200': { description: OAuth token response }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/mcp:
    post: { operationId: mcpPost, security: [{ bearerAuth: [] }], responses: { '200': { description: MCP JSON-RPC response } } }
    get: { operationId: mcpStream, security: [{ bearerAuth: [] }], responses: { '200': { description: MCP SSE stream, content: { text/event-stream: {} } } } }
    delete: { operationId: mcpDisconnect, security: [{ bearerAuth: [] }], responses: { '204': { description: Disconnected } } }
  /internal/v1/config/{layer}/{domain}:
    get:
      operationId: getInternalConfig
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: layer, required: true, schema: { type: string } }, { in: path, name: domain, required: true, schema: { type: string } }]
      responses: { '200': { description: Configuration map }, '401': { $ref: '#/components/responses/Problem' } }
  /internal/v1/config/workspaces/{workspaceId}/mcp-config:
    get:
      operationId: getInternalWorkspaceMcpConfig
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      responses: { '200': { description: MCP configuration }, '401': { $ref: '#/components/responses/Problem' } }
  /api/v1/chat:
    post:
      operationId: chat
      summary: Enqueue a chat turn (requires active SSE)
      description: |
        Accepts a user message for the given session and enqueues an async relay to the Agent.
        The caller must already hold an active `GET /api/v1/events?sessionId=` subscription for the same session;
        otherwise the request is rejected with `409 SSE_SUBSCRIPTION_REQUIRED`.
        Only one in-flight run per session is allowed (`409 CHAT_IN_PROGRESS`).
        The accepted run streams `token` events followed by a terminal `done` over the persistent session SSE —
        `done` ends the run, not the SSE connection. The SSE remains reusable for the next chat.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 128 }
          description: Reuses an existing run for the same request hash; conflicting payloads return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '202':
          description: Accepted — run enqueued, progress via SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatRunResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: SSE subscription missing or run already active
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
              example: { type: "https://xihe.dev/problems/sse-subscription-required", title: "SSE subscription required", status: 409, code: "SSE_SUBSCRIPTION_REQUIRED", detail: "An active SSE subscription is required", requestId: "req-..." }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/events:
    get:
      operationId: chatEvents
      summary: Subscribe to session-scoped persistent SSE
      description: |
        Session-scoped **persistent** Server-Sent Events connection.
        * One active emitter per `sessionId` (v1). A new `GET /api/v1/events?sessionId=` replaces any prior emitter for the same session; the old emitter's completion/timeout/error callbacks are identity-checked and must not delete the new emitter (`stale_cleanup_ignored`).
        * `done` terminates a **run**, not the session SSE. The connection stays open across multiple `POST /api/v1/chat` turns and only closes on client disconnect, session deletion, or explicit server termination.
        * The server sends a `heartbeat` comment/event every 15s to keep the connection observable. Heartbeat never enters the message bubble nor resets the run's token count.
        * Connection authorization is bounded by the access-token lifetime; v1 closes the SSE before token expiry and the UI enters a recoverable authenticated state (no silent credential leak).
        * Event order per run is `connected` (once per SSE open) → `status`/`thinking` (optional) → `tool_call`/`tool_result` (optional) → `token` (one or more) → `done` (exactly one, may carry `errorCode`/`synthetic`). On provider error a single `error` + terminal `done(error)` is sent; the session SSE is retained unless the emitter itself is unwritable.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
          description: Session to subscribe to (must belong to current workspace/user)
      responses:
        '200':
          description: SSE stream — one event per line `event: <name>` + `data: <json>`
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: connected
                data: {"sessionId":"sess-123","type":"connected"}

                event: token
                data: {"content":"hello ","type":"token","run_id":"run-abc"}

                event: token
                data: {"content":"world","type":"token","run_id":"run-abc"}

                event: done
                data: {"type":"done","run_id":"run-abc"}

                event: heartbeat
                data: {"type":"heartbeat","connectionGeneration":2}
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/models:
    get:
      operationId: listModels
      summary: List verified provider models for Chat
      description: Returns provider status, reason codes, chat capabilities, verification time, and config revision without credentials or base URLs.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Provider/model catalog
          content:
            application/json:
              schema:
                type: object
                required: [providers, models]
                properties:
                  providers: { type: object, additionalProperties: true }
                  models: { type: object, additionalProperties: { type: array, items: { type: string } } }
                  configRevision: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/health:
    get: { operationId: health, responses: { '200': { description: Healthy } } }
  /api/v1/status:
    get: { operationId: serviceStatus, security: [{ bearerAuth: [] }], responses: { '200': { description: Service status } } }
  /api/v1/logs:
    post: { operationId: ingestLogs, security: [{ bearerAuth: [] }], responses: { '200': { description: Accepted } } }
  /api/v1/telemetry/logs:
    post: { operationId: ingestTelemetry, security: [{ bearerAuth: [] }], responses: { '200': { description: Accepted } } }
  /api/v1/config/{domain}:
    get: { operationId: getConfig, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: domain, required: true, schema: { type: string } }], responses: { '200': { description: Configuration map } } }
  /api/v1/config/admin/{domain}:
    put: { operationId: putAdminConfig, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: domain, required: true, schema: { type: string } }], responses: { '200': { description: Updated } } }
  /api/v1/config/user/{domain}:
    put: { operationId: putUserConfig, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: domain, required: true, schema: { type: string } }], responses: { '200': { description: Updated } } }
  /api/v1/config/import:
    post: { operationId: importConfig, security: [{ bearerAuth: [] }], responses: { '200': { description: Imported } } }
  /api/v1/config/export:
    get: { operationId: exportConfig, security: [{ bearerAuth: [] }], responses: { '200': { description: JSON configuration } } }
  /api/v1/providers:
    get: { operationId: listProviders, security: [{ bearerAuth: [] }], responses: { '200': { description: Providers } } }
    put: { operationId: updateProviders, security: [{ bearerAuth: [] }], responses: { '200': { description: Updated } } }
  /api/v1/models:
    get: { operationId: listModels, security: [{ bearerAuth: [] }], responses: { '200': { description: Models } } }
  /api/v1/sessions/{sessionId}/messages:
    get: { operationId: listMessages, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Messages } } }
  /api/v1/sessions/{sessionId}/messages/{messageId}:
    delete: { operationId: deleteMessage, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { in: path, name: messageId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/sessions/{sessionId}/attachments:
    post: { operationId: uploadAttachments, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Upload result } } }
  /api/v1/sessions/{sessionId}/attachments/{fileId}:
    get: { operationId: getAttachment, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { in: path, name: fileId, required: true, schema: { type: string } }], responses: { '200': { description: Attachment metadata } } }
    delete: { operationId: deleteAttachment, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }, { in: path, name: fileId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/files/{fileId}:
    get: { operationId: getFile, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: fileId, required: true, schema: { type: string } }], responses: { '200': { description: File content } } }
    delete: { operationId: deleteFile, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: fileId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/files/upload:
    post: { operationId: uploadFile, security: [{ bearerAuth: [] }], responses: { '201': { description: Uploaded } } }
  /api/v1/files/split-pdf:
    post: { operationId: splitPdf, security: [{ bearerAuth: [] }], responses: { '200': { description: Split result } } }
  /api/v1/rag/stats:
    get: { operationId: ragStats, security: [{ bearerAuth: [] }], responses: { '200': { description: RAG statistics } } }
  /api/v1/rag/ingest:
    post: { operationId: ragIngest, security: [{ bearerAuth: [] }], responses: { '200': { description: Ingest result } } }
  /api/v1/rag/search:
    post: { operationId: ragSearch, security: [{ bearerAuth: [] }], responses: { '200': { description: Search result } } }
  /api/v1/rag/documents/{docId}:
    delete: { operationId: ragDelete, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: docId, required: true, schema: { type: string } }], responses: { '204': { description: Deleted } } }
  /api/v1/workspaces/{workspaceId}/mcp-config:
     get: { operationId: getMcpConfig, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: MCP configuration } } }
     put: { operationId: putMcpConfig, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Updated } } }
  /api/v1/workspaces/{workspaceId}/environment:
     get: { operationId: getWorkspaceEnvironment, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Workspace environment status }, '401': { $ref: '#/components/responses/Problem' }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/context/{sessionId}/events:
    get: { operationId: readContextEvents, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Events } } }
    post: { operationId: appendContextEvent, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '201': { description: Appended } } }
  /internal/v1/runtime/workspaces/{workspaceId}/mcp:
    post: { operationId: runtimeMcp, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: MCP JSON-RPC response } } }
  /internal/v1/runtime/remote-mcp/{workspaceId}/{serverId}/call:
    post: { operationId: runtimeRemoteMcpCall, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }, { in: path, name: serverId, required: true, schema: { type: string } }], responses: { '200': { description: MCP response }, '401': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/agent/chat:
    post: { operationId: agentChat, security: [{ bearerAuth: [] }], responses: { '200': { description: SSE stream, content: { text/event-stream: {} } } } }
  /internal/v1/agent/rag/ingest:
    post: { operationId: agentRagIngest, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/RagIngestRequest' } } } }, responses: { '200': { description: RAG result, content: { application/json: { schema: { $ref: '#/components/schemas/RagIngestResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/agent/rag/search:
    post: { operationId: agentRagSearch, security: [{ bearerAuth: [] }], responses: { '200': { description: RAG result } } }
  /internal/v1/agent/rag/stats:
    get: { operationId: agentRagStats, security: [{ bearerAuth: [] }], responses: { '200': { description: RAG statistics, content: { application/json: { schema: { $ref: '#/components/schemas/RagStatsResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/agent/rag/documents/{docId}:
    delete: { operationId: agentRagDelete, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: docId, required: true, schema: { type: string } }], responses: { '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/DeletedResponse' } } } }, '401': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/agent/models:
    get: { operationId: agentModels, security: [{ bearerAuth: [] }], responses: { '200': { description: Models } } }
  /internal/v1/agent/embedding-models:
    get: { operationId: agentEmbeddingModels, security: [{ bearerAuth: [] }], responses: { '200': { description: Embedding models } } }
  /internal/v1/agent/health:
    get: { operationId: agentHealth, responses: { '200': { description: Agent health, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string }, mcpInitialized: { type: boolean }, toolsCount: { type: integer } }, additionalProperties: true } } } } } }
  /internal/v1/agent/tools:
    get: { operationId: agentTools, security: [{ bearerAuth: [] }], responses: { '200': { description: Agent tools, content: { application/json: { schema: { type: object, required: [tools], properties: { tools: { type: array, items: { type: object } }, customTools: { type: array, items: { type: object } } } } } } }, '401': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/agent/approval/respond:
    post: { operationId: respondApproval, security: [{ bearerAuth: [] }], responses: { '200': { description: Resolved } } }
  /internal/v1/agent/approval/pending:
    get: { operationId: pendingApprovals, security: [{ bearerAuth: [] }], responses: { '200': { description: Pending approvals } } }
  /internal/v1/agent/mcp/reinit:
    post: { operationId: reinitializeAgentMcp, security: [{ bearerAuth: [] }], responses: { '200': { description: Reinitialized } } }
  /internal/v1/agent/registry/workers:
    get: { operationId: listWorkers, security: [{ bearerAuth: [] }], responses: { '200': { description: Workers } } }
  /internal/v1/agent/registry/workers/{workerId}/enable:
    post: { operationId: enableWorker, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workerId, required: true, schema: { type: string } }], responses: { '200': { description: Enabled } } }
  /internal/v1/agent/registry/workers/{workerId}/disable:
    post: { operationId: disableWorker, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workerId, required: true, schema: { type: string } }], responses: { '200': { description: Disabled } } }
  /internal/v1/context/{sessionId}/snapshot:
    get: { operationId: contextSnapshot, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Snapshot } } }
  /internal/v1/context/{sessionId}/events/batch:
    post: { operationId: appendContextEvents, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '201': { description: Appended } } }
  /internal/v1/context/{sessionId}/events/latest:
    get: { operationId: latestContextSequence, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Sequence } } }
  /internal/v1/context/{sessionId}/refresh-sources:
    post: { operationId: refreshContextSources, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '202': { description: Accepted } } }
  /internal/v1/context/{sessionId}/replay:
    post: { operationId: replayContext, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Replayed } } }
  /internal/v1/context/{sessionId}/compact:
    post: { operationId: compactContext, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sessionId, required: true, schema: { type: string } }], responses: { '200': { description: Compacted } } }
  /internal/v1/context/{sourceSessionId}/fork:
    post: { operationId: forkContext, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: sourceSessionId, required: true, schema: { type: string } }], responses: { '201': { description: Forked } } }
  /internal/v1/runtime/workspaces:
    post: { operationId: registerRuntimeWorkspace, security: [{ bearerAuth: [] }], responses: { '200': { description: Registered } } }
  /internal/v1/runtime/workspaces/{workspaceId}/execution-spec:
    get: { operationId: getWorkspaceExecutionSpec, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Targeted workspace execution specification, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceExecutionSpec' } } } }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/runtime/workspaces/{workspaceId}/status:
    get: { operationId: getRuntimeWorkspaceStatus, security: [{ bearerAuth: [] }], parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }], responses: { '200': { description: Runtime workspace materialization status }, '404': { $ref: '#/components/responses/Problem' } } }
  /internal/v1/runtime/heartbeat:
