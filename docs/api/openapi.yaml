      description: 'PLAN-290 M0.3 / PLAN-0763: CP forwards a user cancel here before it settles the durable row. The endpoint attaches the cancel to the run registry entry and is fire-and-forget for CP (forwarding failures are logged, never surfaced to the caller). 202 accepted means the cancel attached; 404 unknown means this process does not know the run (or it already finished); 500 failed means the cancel action itself blew up. Implemented by packages/agent/src/xihe_agent/api/misc.py:57; caller is CP chat/ChatRunCancellationService.java:117.'
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid }, description: Chat run id; the wire path segment is the same value the Agent route declares as run_id. }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunCancelRequest' } } } }
      responses:
        '202': { description: 'Cancel attached to an active run', content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunCancelResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: 'unknown - runId not registered in this process, or the run already finished', content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunCancelResponse' } } } }
        '500': { description: 'failed - the cancel action itself failed (CANCEL_FAILED)', content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunCancelResponse' } } } }
  /internal/v1/agents/spawn:
    x-owner: cp
    post:
      tags: [service-agent]
      operationId: spawnAgentSession
      summary: Create an Agent spawn child Session from a durable parent run
      description: Internal CP service surface only; the Agent production caller uses the CP-owned spawn_agent tool through /api/v1/mcp.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentSpawnRequest' } } } }
      responses: { '200': { description: 'Child Session and spawn ChatRun created, or the same child idempotently replayed; authorization, waiting link, audit, and one-shot grant consumption commit atomically', content: { application/json: { schema: { $ref: '#/components/schemas/AgentSpawnResponse' } } } }, '400': { description: 'INVALID_REQUEST — body must contain exactly parentRunId and toolCallId as UUID strings; injected identity/grant fields or incomplete/truncated durable prompt arguments are rejected before any write', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { description: 'FORBIDDEN — no explicit SPAWN_AGENT grant, the MCP invocation is not an agent spawn_agent call of this parent run, or the parent Session has no active Workspace-bound Agent principal', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '404': { description: 'SPAWN_PARENT_RUN_NOT_FOUND or SPAWN_EVENT_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '409': { description: 'APPROVAL_REQUIRED, SPAWN_PARENT_RUN_NOT_ACTIVE, SPAWN_ARGUMENTS_CHANGED, IDEMPOTENCY_KEY_CONFLICT, DELEGATION_LIMIT_EXCEEDED (PLAN-0630 M1: the root subject delegation budget is exhausted - no Session/run/participant row and no approval consumption, only one agent_spawn_refused audit line and an MCP tool error), or DELEGATION_POLICY_INVALID (the stored delegation_policy of the ROOT subject is unreadable)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '503': { $ref: '#/components/responses/Problem' } }
  /api/v1/audit/entries:
    get:
