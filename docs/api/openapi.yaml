         modelDiscovery: { type: string, enum: [remote-models, litellm-catalog, curated, manual] }
         manualModels: { type: array, items: { type: string } }
    ScopedModelCatalogRequest:
       type: object
       required: [connections]
       properties:
         connections: { type: array, items: { $ref: '#/components/schemas/ScopedModelConnection' } }
    ScopedModelConnection:
       type: object
       required: [lease, runId, connectionId, providerId, connectionRevision]
       properties:
         lease: { type: string, writeOnly: true }
         runId: { type: string }
         connectionId: { type: string, format: uuid }
         providerId: { type: string }
         scope: { type: string, enum: [USER, WORKSPACE, SYSTEM] }
         displayName: { type: string }
         connectionRevision: { type: integer, minimum: 1 }
    AgentChatRequest:
      type: object
      required: [sessionId, content, stream]
      properties:
        sessionId: { type: string }
        content: { type: string }
        operationId: { type: string, format: uuid, readOnly: true }
        stream: { type: boolean, default: true }
        provider: { type: string }
        model: { type: string }
        toolMode: { type: string, enum: [none, workspace], default: none }
        credentialLease: { type: string, writeOnly: true }
        providerConnectionId: { type: string, format: uuid }
        connectionRevision: { type: integer, minimum: 1 }
        userOverrides:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
          description: "PLAN-0307 T2.7: run-scoped user-layer entries resolved by CP for Agent-consumed domains (llm-provider, agent-profile). Env-locked keys are omitted; Agent merges pulled effective -> user -> workspace without side effects. Layer concepts never cross this boundary."
        workspaceOverrides:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
          description: "PLAN-0307 T2.7: run-scoped workspace-layer entries resolved by CP (same contract as userOverrides; workspace wins over user)."
        toolWaits:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: "PLAN-0308 M1 (spec S2.1): CP-computed final Agent wait per tool (budget + 4s margin). The Agent only consumes it; it never computes."
        toolWaitOrigins:
          type: object
          additionalProperties: { type: string, enum: [per-call, config] }
          description: "PLAN-0308 M1: value nature per tool. `per-call` makes the Agent use the delivered wait even when its own XIHE_MCP_TOOL_TIMEOUT_S env is set (decision #27)."
        systemToolWait:
          type: number
          description: "PLAN-0308 M1: the single Agent wait covering all system tools (from the agent-runtime.systemToolTimeoutS config key); delivered without the per-tool map so cold caches still get a value."
        toolTimeouts:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 30 }
          description: "PLAN-0308 T1.9: raw per-call values (already validated by CP). The Agent attaches them per tool call as the inbound header X-Xihe-Tool-Timeout-Per-Call; CP validates again and forwards with valueOrigin=per-call."
        budgetCoverage:
          type: string
          enum: [full, partial]
          description: "PLAN-0308 M1 (decision #23): `partial` when the CP tool→server cache was cold at payload time, so some tools have no per-tool wait entry."
        attachments: { type: array, items: { type: object, additionalProperties: true } }
    AgentSummarizeRequest:
      type: object
      required: [credentialLease, text]
      description: "PLAN-0354 spec §8: CP → Agent summary hop. CP issues a short (2 min TTL) provider credential lease and strips [Constraints] from priorSummary (I3); the Agent redeems the lease and clamps output tokens to min(config.maxTokens, 2048). maxOutputTokens is not a request field."
      properties:
        sessionId: { type: string }
        runId: { type: string, description: "Empty for manual compaction (CP passes runId=null)." }
        provider: { type: string }
        model: { type: string }
        credentialLease: { type: string, writeOnly: true }
        providerConnectionId: { type: string, format: uuid }
        connectionRevision: { type: integer, minimum: 1 }
        text: { type: string, description: "role: content lines bounded by CP (per-message 4000 chars, pruneWindowChars budget; oldest dropped with an explicit omitted marker)." }
        priorSummary: { type: string, description: "Previous sectioned summary with [Constraints] stripped by CP." }
    AgentSummarizeResponse:
      type: object
      required: [summary, usage]
      properties:
        summary: { type: string, description: "Six sectioned summary ([Goal]/[Work State]/[Next Move]/[Files&Artifacts]/[Errors]/[Recent]); never carries [Constraints] (CP appends the code-extracted section)." }
        usage: { type: object, additionalProperties: true, description: "0343-named usage: inputTokens/outputTokens/totalTokens/estimatedInputTokens/source (real|estimated|fallback)/model (provider/model)." }
    OAuthBindingRequest: { type: object, required: [workspaceId, serverId], properties: { workspaceId: { type: string }, serverId: { type: string } } }
    OAuthTokenRequest: { type: object, required: [userId, workspaceId, serverId, scope], properties: { userId: { type: string }, workspaceId: { type: string }, serverId: { type: string }, scope: { type: string } } }
    StatusResponse: { type: object, required: [status], properties: { status: { type: string } }, additionalProperties: true }
    DeletedResponse: { type: object, required: [deleted], properties: { deleted: { type: boolean } } }
    RagIngestRequest: { type: object, required: [file], properties: { file: { type: string, format: binary }, chunkSize: { type: integer, default: 1000 }, chunkOverlap: { type: integer, default: 200 } } }
    RagIngestResponse: { type: object, required: [status, chunks, docIds], properties: { status: { type: string }, chunks: { type: integer }, docIds: { type: array, items: { type: string } } } }
    RagStatsResponse: { type: object, required: [totalDocuments], properties: { totalDocuments: { type: integer } } }
    WorkspaceExecutionSpec: { type: object, required: [workspaceId, generation, sandboxSpecHash, sandboxSpec, storageBackend, storageRef], properties: { workspaceId: { type: string }, generation: { type: integer }, sandboxSpecHash: { type: string }, sandboxSpec: { type: object, additionalProperties: true }, storageBackend: { type: string }, storageRef: { type: string } } }
    RuntimeHeartbeatRequest: { type: object, required: [deviceId, status], properties: { deviceId: { type: string }, status: { type: string, enum: [ready, blocked] } } }
    ProblemDetails:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
        runId: { type: string }
        provider: { type: string }
        model: { type: string }
        retryable: { type: boolean }
        outcome: { type: string, enum: [success, error, partial, ambiguous] }
    UserOperationSummary:
      type: object
      required: [id, kind, source, actorType, status, createdAt]
      description: Redacted user projection; never includes errorRef, resultRef or argumentsPreview.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        sessionId: { type: [string, 'null'], readOnly: true }
        workspaceId: { type: [string, 'null'], readOnly: true }
        runId: { type: [string, 'null'], readOnly: true }
        kind: { type: string, enum: [chat, tool_call, approval, job, workspace_lifecycle, system, other, llm_usage], readOnly: true }
        source: { type: string, enum: [ui, agent, runtime, system, mcp], readOnly: true }
        actorType: { type: string, enum: [user, agent, system, service], readOnly: true }
        status: { type: string, enum: [accepted, running, waiting_for_approval, completed, failed, cancelled, interrupted, ambiguous], readOnly: true }
        summary: { type: [string, 'null'], readOnly: true }
        errorCode: { type: [string, 'null'], readOnly: true }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        finishedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
    UserOperationListResponse:
      type: object
      required: [operations, page, size, totalElements, totalPages]
      properties:
        operations: { type: array, items: { $ref: '#/components/schemas/UserOperationSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    JobOutputChunk:
      type: object
      description: PLAN-0344 durable job output chunk. `nextOffset` is always a UTF-8 rune boundary; clients must pass it back as `offset`. `truncated` = the output file hit the 1 MiB JOB_CAP (head kept).
      required: [jobId, stream, offset, nextOffset, sizeBytes, truncated, data, jobStatus]
      properties:
        jobId: { type: string }
        stream: { type: string, enum: [stdout, stderr] }
        offset: { type: integer, description: Actual byte offset (malformed input offsets are advanced to the nearest boundary) }
        nextOffset: { type: integer }
        sizeBytes: { type: integer }
        truncated: { type: boolean }
        data: { type: string }
        jobStatus: { type: string, enum: [running, succeeded, cancelled, timeout, orphaned] }
    McpServerStatusList:
      type: object
      description: PLAN-0366 stdio MCP session status list. Field names are the CP public camelCase mapping of the Runtime SessionSnapshot wire (server_id/last_error/since_ms); `state` keeps the Runtime lowercase literals, `sinceMs` is Unix milliseconds.
      required: [servers, count]
      properties:
        servers:
          type: array
          items:
            type: object
            required: [serverId, state, attempt, lastError, sinceMs, epoch]
            properties:
              serverId: { type: string }
              state: { type: string, enum: [starting, ready, restarting, failed, stopped] }
              attempt: { type: integer }
              lastError: { type: [string, 'null'] }
              sinceMs: { type: integer, description: Unix milliseconds when the current state was entered }
              epoch: { type: integer, description: Session generation counter }
        count: { type: integer }
    JobCancelResult:
      type: object
      description: PLAN-0366 single-job cancel outcome. `changed` is true only when this call moved a `running` archive to a terminal state; terminal archives return 200 with the original status and changed=false.
      required: [itemId, jobId, status, changed]
      properties:
        itemId: { type: string, format: uuid }
        jobId: { type: string }
        status: { type: string, enum: [succeeded, cancelled, timeout, orphaned] }
        changed: { type: boolean }
    OperationItemView:
      type: object
      required: [id, operationId, sequence, kind, source, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        operationId: { type: string, format: uuid, readOnly: true }
        toolCallId: { type: [string, 'null'], readOnly: true }
        parentItemId: { type: [string, 'null'], readOnly: true }
        sequence: { type: integer, readOnly: true }
        kind: { type: string, enum: [chat, tool_call, approval, job, workspace_lifecycle, system, other, llm_usage], readOnly: true }
        toolName: { type: [string, 'null'], readOnly: true }
        source: { type: string, enum: [ui, agent, runtime, system, mcp], readOnly: true }
        policyDecision: { type: [string, 'null'], readOnly: true, description: 'Legacy coarse decision marker (allow/deny/pending/...); the typed safe verdict snapshot is `policy`.' }
        policy: { $ref: '#/components/schemas/OperationPolicySummary', description: 'Optional safe verdict snapshot for dispatched calls; omitted on legacy rows and non-dispatch items.' }
        approvalRequestId: { type: [string, 'null'], format: uuid, readOnly: true }
        status: { type: string, enum: [pending, running, waiting_for_approval, resolving, completed, failed, aborted, cancelled, ambiguous], readOnly: true }
        errorCode: { type: [string, 'null'], readOnly: true }
        resultRef: { type: [string, 'null'], readOnly: true, description: 'Internal trace projection only; omitted from user views.' }
        argumentsPreview: { type: [string, 'null'], readOnly: true, description: 'Internal trace projection only; omitted from user views.' }
        cwd: { type: [string, 'null'], readOnly: true, description: 'Internal trace projection only.' }
        startedAt: { type: [string, 'null'], format: date-time, readOnly: true }
        finishedAt: { type: [string, 'null'], format: date-time, readOnly: true }
    OperationPolicySummary:
      type: object
      additionalProperties: false
      description: >-
        Safe verdict snapshot attached to the dispatch ledger item (PLAN-0328 T1.15): why the call
        was allowed or blocked. Raw tool arguments, MCP request bodies and free-form exception text
        are never included; legacy V19-absent rows omit the whole `policy` object. `reused` is the
        T1.7 reuse annotation: true when the dispatch reused an exact session grant, null when reuse
        is not applicable (legacy V19 snapshots parse as null).
      required: [effect, sourceLayer, matchedRule, reason, mode, allowedBy, actionClass, shape, reused]
      properties:
        effect: { type: string, enum: [allow, ask, deny] }
        sourceLayer: { type: string, enum: [builtin, instance, user, workspace, session, per_call] }
        matchedRule: { type: [string, 'null'], minLength: 1 }
        reason: { type: string, minLength: 1 }
        mode: { type: [string, 'null'], enum: [manual, auto] }
        allowedBy:
          type: [string, 'null']
          description: Lower-cased automatic-allow marker (e.g. `auto@session`) when the allow came from a mode rather than a rule.
        actionClass: { type: string, minLength: 1 }
        shape: { type: string, enum: [structured, interpreter, opaque] }
        reused:
          type: [boolean, 'null']
          description: T1.7 reuse annotation — `true` only for an exact session-fingerprint dispatch; `null` when reuse is not applicable; never fabricated.
    McpApprovalRequiredError:
      type: object
      additionalProperties: false
      description: >-
        JSON-RPC 2.0 error frame returned with HTTP 409 by the MCP gate when no valid approval grant
        or session fingerprint exists (PLAN-0328 T1.7/T1.9). The safe extension travels as
        `error.data` because MCP transports discard non-JSON-RPC response bodies. The durable pending
        approval referenced by `approvalRequestId` is created or reused (same session + tool +
        canonical arguments hash) before this response is emitted.
      required: [jsonrpc, id, error]
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id: { type: [integer, string, 'null'], description: Echoes the JSON-RPC request id; null when the request carried none. }
        error:
          type: object
          additionalProperties: false
          required: [code, message, data]
          properties:
            code: { type: integer, enum: [-32003] }
            message: { type: string, enum: [APPROVAL_REQUIRED] }
            data: { $ref: '#/components/schemas/McpApprovalRequiredData' }
    McpApprovalRequiredData:
      type: object
      additionalProperties: false
      description: Safe approval extension (never contains tool arguments).
      required: [status, code, approvalRequestId, tool, expiresAt, retryHeader]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [APPROVAL_REQUIRED] }
        approvalRequestId: { type: string, minLength: 1, maxLength: 128, description: Durable ChatApproval request id; the Agent keys its waiter on it and retries with the grant header. }
        tool: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        retryHeader: { type: string, enum: ['X-Xihe-Approval-Request-Id'] }
        statusUrl:
          type: [string, 'null']
          description: Run recovery route (`/api/v1/chat/runs/{runId}`) for the originating run; present only when the call carried a run context. Informational for the Agent (user auth required).
        policy: { $ref: '#/components/schemas/ApprovalPolicySummary' }
