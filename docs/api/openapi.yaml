        '200': { description: Idempotent replay of the stored record (owner only), content: { application/json: { schema: { $ref: '#/components/schemas/GuidanceSubmitReplay' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [chat]
      operationId: getChatRunGuidance
      summary: Snapshot the run's Guidance records ordered by sequence
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Guidance snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/GuidanceSnapshot' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/WorkspaceContextRequired' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/chat/sessions/{sessionId}/runs:
