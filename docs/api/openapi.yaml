        '200': { description: Member list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MemberView' } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'WORKSPACE_FORBIDDEN (non-member or VIEWER) / WORKSPACE_READ_ONLY (VIEWER with X-Workspace-Id)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: 'WORKSPACE_NOT_FOUND (unknown/deleted workspace, authorized callers only)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      tags: [workspace]
      operationId: addWorkspaceMember
      summary: Add an existing account as a workspace member (PLAN-0565)
      description: |
        PLAN-0565 (spec §3/§4): workspace OWNER only; instance ADMIN cannot add
        (ruling #3). Looks up the account by unique username (ruling #7); insert-only
        (role changes go through PATCH). Duplicate add → 409 MEMBER_ALREADY_EXISTS;
        unknown username → 404 USER_NOT_FOUND. Audited (`workspace_member_added`).
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }]
