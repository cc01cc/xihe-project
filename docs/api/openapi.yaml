         opaqueNestedRepos: { type: array, items: { type: string } }
         state: { type: string, enum: [captured, abnormal-captured, degraded, expired] }
         unrollableReason: { type: [string, 'null'], enum: [UNAVAILABLE, null] }
         revert: { $ref: '#/components/schemas/CheckpointRevertBookkeeping' }
    CheckpointRevertPreviewRequest:
       type: object
       additionalProperties: false
       required: [sliceRef]
       properties: { sliceRef: { type: string } }
    CheckpointRevertRequest:
       type: object
       additionalProperties: false
       required: [sliceRef, acknowledgeTypeChanges]
       properties:
         sliceRef: { type: string }
         acknowledgeTypeChanges: { type: array, items: { type: string }, description: Type-change paths confirmed from the preview }
    CheckpointRevertPreviewEntry:
       type: object
       additionalProperties: false
       required: [path, action, state]
       properties:
         path: { type: string }
         action: { type: string, enum: [restore, delete] }
         state: { type: string, enum: [execute, noop, type_conflict] }
         reason: { type: [string, 'null'] }
    CheckpointRevertPreviewResponse:
       type: object
       additionalProperties: false
       required: [sliceRef, counts, entries, truncated, opaqueNestedRepos]
       properties:
         sliceRef: { type: string }
         counts: { type: object, required: [restore, delete, typeConflict], properties: { restore: { type: integer }, delete: { type: integer }, typeConflict: { type: integer } } }
         entries: { type: array, items: { $ref: '#/components/schemas/CheckpointRevertPreviewEntry' } }
         truncated: { type: boolean }
         opaqueNestedRepos: { type: array, items: { type: string } }
    CheckpointRevertEntry:
       type: object
       additionalProperties: false
       required: [path, outcome]
       properties:
         path: { type: string }
         outcome: { type: string, enum: [restored, deleted, failed, suspect] }
         reason: { type: [string, 'null'] }
    CheckpointRevertResponse:
       type: object
       additionalProperties: false
       required: [sliceRef, counts, entries, durationMs, suspects]
       properties:
         sliceRef: { type: string }
         counts: { type: object, required: [restored, deleted, failed], properties: { restored: { type: integer }, deleted: { type: integer }, failed: { type: integer } } }
         entries: { type: array, items: { $ref: '#/components/schemas/CheckpointRevertEntry' } }
         durationMs: { type: integer, minimum: 0 }
         suspects: { type: array, items: { type: string } }
    CheckpointCleanupRequest:
       type: object
       additionalProperties: false
       required: [acknowledge]
       properties: { acknowledge: { type: boolean, const: true } }
    CheckpointCleanupResponse:
       type: object
       additionalProperties: false
       required: [removed]
       properties: { removed: { type: boolean } }
    RuntimeCheckpointCaptureRequest:
       type: object
       additionalProperties: false
       required: [runId, actor, callId]
       properties:
         runId: { type: string }
         actor: { type: string }
         callId: { type: string }
         abnormal: { type: boolean, default: false }
    RuntimeCheckpointCaptureResponse:
       type: object
       additionalProperties: false
       required: [runId, noChange, sliceRef, commit, capturedAt, state, changedFiles, opaqueNestedRepos, predecessor]
       properties:
         runId: { type: string }
         noChange: { type: boolean }
         sliceRef: { type: [string, 'null'] }
         commit: { type: [string, 'null'] }
         capturedAt: { type: [string, 'null'], format: date-time }
         state: { type: string, enum: [captured, abnormal-captured] }
         changedFiles: { type: array, items: { $ref: '#/components/schemas/CheckpointChangedFile' } }
         opaqueNestedRepos: { type: array, items: { type: string } }
         predecessor: { type: [string, 'null'] }
    RuntimeCheckpointGcResponse:
       type: object
       additionalProperties: false
       required: [counts]
       properties:
         counts: { type: object, required: [deleted, kept], properties: { deleted: { type: integer }, kept: { type: integer } } }
    Session: { type: object, required: [id, workspaceId, title, archived, agentPrincipalId], properties: { id: { type: string }, workspaceId: { type: string }, agentPrincipalId: { type: [string, 'null'], format: uuid }, title: { type: [string, 'null'] }, modelProvider: { type: [string, 'null'] }, modelName: { type: [string, 'null'] }, providerConnectionId: { type: [string, 'null'], readOnly: true }, connectionRevision: { type: [integer, 'null'], readOnly: true }, contextTemplateLayer: { type: [string, 'null'], enum: [instance, user, workspace, null], readOnly: true, description: All three pin fields are present together or null; null requires explicit rebind. }, contextTemplateId: { type: [string, 'null'], format: uuid, readOnly: true }, contextTemplateVersion: { type: [integer, 'null'], readOnly: true }, archived: { type: boolean }, createdAt: { type: [string, 'null'], format: date-time }, updatedAt: { type: [string, 'null'], format: date-time } } }
    SessionForkResponse:
