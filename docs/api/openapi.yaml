    ChatRunResponse: { type: object, description: 'One execution (machine-readable run). UI terminology calls it a turn (回合); a turn may span several runs on continuation / wake / follow-up / retry.', required: [status, origin, sessionId, runId], properties: { agentPrincipalId: { type: [string, 'null'], readOnly: true, description: 'PLAN-0623 R1: the agent principal that responded in this run; null on runs admitted before V92' }, triggerSource: { type: string, readOnly: true, enum: [user, mention, schedule, judge, guard, chain], default: user, description: 'PLAN-0624 G-24: who triggered this run; runs admitted before V93 read as user' }, status: { type: string, enum: [accepted, queued, running, streaming, awaiting_approval, dispatching, cancelling, succeeded, failed, partial, ambiguous, cancelled] }, origin: { type: string, enum: [user_submission], readOnly: true, description: Public POST /chat only returns user_submission; spawn is visible through GET run status }, sessionId: { type: string }, messageId: { type: string }, runId: { type: string, description: 'PLAN-0665 Q1: the FIRST target run (= runIds[0]); older clients that only read runId keep working unchanged.' }, runIds: { type: array, items: { type: string }, description: 'PLAN-0665 Q1: every run created by this submission, in selection order (first element equals runId). Present only for toParticipantIds requests; absent on the legacy single-responder path.' }, failedTargets: { type: array, items: { type: object, required: [participantId, reason], properties: { participantId: { type: string }, reason: { type: string, description: 'Failure reason, e.g. skipped_muted / IllegalStateException / ConstraintViolationException. Deferred targets are NOT failures (BL-283) — they are reported in deferredTargets.' } } }, description: 'PLAN-0665 (2026-11-05 real-stack finding): TO targets that could NOT be dispatched at runtime because of a real error. Never silent: runIds.length + failedTargets.length + deferredTargets.length always equals the requested toParticipantIds count (BL-283 split queued out of failed). Pre-validation failures (unknown / unauthorized / disabled / non-AGENT target) still reject the whole request with 400/403 instead.' }, deferredTargets: { type: array, items: { type: object, required: [participantId, reason], properties: { participantId: { type: string }, reason: { type: string, description: 'Always deferred for now: the Session was at its run cap and the target was queued as a follow-up item.' } } }, description: 'BL-283 (Lead ruling 2026-11-05): TO targets that were QUEUED instead of started because the Session hit maxConcurrentRunsPerSession. The wake returns deferred as a value (never an exception), the follow-up item waits for a slot, and the wake_dispatch audit keeps outcome=deferred. Counting these as failed made concurrency-full indistinguishable from a real dispatch error.' }, providerConnectionId: { type: [string, 'null'], readOnly: true }, connectionRevision: { type: [integer, 'null'], readOnly: true }, outcome: { type: string, enum: [success, error, partial, ambiguous] }, errorCode: { type: string }, reason: { type: string } } }
