    AgentPrincipalSkillBindingView: { type: object, additionalProperties: false, required: [bindingId, principalId, skillId, name, scopeType, tokenEstimate, createdAt], x-breaking-note: '2026-11-12 (task-234 / D-1019 A2): BREAKING for clients that switch on the literal. `sourceType` used to be enum [workspace, personal] where `personal` meant THE INSTANCE LIBRARY, never the V156 user/personal skill layer (this face answers a user-scope definition with 404 SKILL_NOT_FOUND). The value is renamed to `instance`; `workspace` is unchanged. Old `personal` -> new `instance` is a 1:1 rename, not a new meaning.', description: 'PLAN-0680 (dual axis; supersedes the PLAN-0667 instance-only sentence): one skill binding of an agent principal. Two independent axes: `scopeType`/`scopeId`/`scopeName` is the binding activation scope, server-derived from the authorization context — `workspaceId` present ⇒ workspace scope with `scopeId` = that workspace and `scopeName` = its name, absent ⇒ instance scope with `scopeId`=null; request bodies only accept `skillId`, so a caller can never choose a scope. `sourceType`/`sourceName` is the skill definition home (workspace-private definition vs instance library), independent of the binding scope. A workspace-scope row is only usable inside its workspace; an instance-scope row is usable everywhere. tokenEstimate mirrors skills.body_tokens_est.', properties: { bindingId: { type: string, format: uuid }, principalId: { type: string, format: uuid }, skillId: { type: string, format: uuid }, name: { type: string }, description: { type: [string, 'null'] }, sourceType: { type: string, enum: [workspace, instance], description: 'Definition home: `workspace` = a workspace-private definition, `instance` = the shared instance library. Never the V156 user/personal layer: this face answers a user-scope definition with 404 SKILL_NOT_FOUND, so `user` cannot appear here. Renamed from the old literal `personal` (which always meant the instance library) on 2026-11-12 — see the schema-level x-breaking-note.' }, sourceName: { type: [string, 'null'], description: 'workspace name of the definition when sourceType=workspace, else null' }, scopeType: { type: string, enum: [instance, workspace], description: 'binding scope axis (PLAN-0680); required, never null' }, scopeId: { type: [string, 'null'], format: uuid, description: 'workspace id when scopeType=workspace, else null' }, scopeName: { type: [string, 'null'], description: 'workspace name when scopeType=workspace, else null' }, tokenEstimate: { type: integer }, createdBy: { type: [string, 'null'], format: uuid }, createdAt: { type: string, format: date-time } } }
    AgentPrincipalSkillBindingListResponse: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentPrincipalSkillBindingView' } } } }
