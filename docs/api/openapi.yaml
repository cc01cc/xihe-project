  /internal/v1/runtime/workspaces/{workspaceId}/jobs/start:
    post:
      tags: [service-runtime]
      operationId: startRuntimeWorkspaceJob
      description: |
        PLAN-0390: CP-facing Job start path. The Workspace backend decides whether the job can run;
        Windows Host/MXC direct-attach modes use the Runtime process Job engine. A backend probe or
        launcher failure answers `501 JOB_BACKEND_LAUNCH_PENDING` and starts nothing. `cwd`/`env`
        are consumed by Windows adapters and remain accepted by Docker compatibility paths.
        The caller (CP) is the single durable writer; this route only returns an execution fact.
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeJobStartRequest' }
      responses:
        '202':
          description: Job dispatched (jobId/status/bootId)
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeJobStartResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '501': { description: JOB_BACKEND_LAUNCH_PENDING (Runtime probe/launcher unavailable; no process started), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /internal/v1/runtime/workspaces/{workspaceId}/jobs/status:
    post:
      tags: [service-runtime]
      operationId: statusRuntimeWorkspaceJob
      description: Runtime Job status lookup. A missing handle is `404 JOB_NOT_FOUND`; reachable Runtime Problem Details retain code, reason and requestId.
