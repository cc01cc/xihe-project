  /api/v1/workspaces/{workspaceId}/checkpoints/revert/preview:
      post:
        tags: [workspace]
        operationId: previewWorkspaceCheckpointRevert
        summary: Preview restoring a workspace to a slice
        description: |
          Computes the complete set of changes between the selected slice and the current workspace.
          The bounded `entries` list is marked by `truncated`; counts always cover the full plan. The
          preview does not acquire the restore lock and does not mutate the workspace. Returns
          `409 RUN_ACTIVE` while a ChatRun is active in the workspace (checked before slice
          resolution), plus `CHECKPOINT_NOT_AVAILABLE` / `CHECKPOINT_TYPE_CHANGES_UNACKNOWLEDGED` /
          `CHECKPOINT_RESTORE_LOCKED` as applicable.
          The `nestedRepoAffected[]` block (PLAN-0641 M3) lists the undeclared nested repositories
          this plan touches, each with `repoPath` / `kind` / `dirty` / `headMoved`. It is
          informational on the preview face; the execute face enforces the matching gates.
        security: [{ bearerAuth: [] }]
        parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertPreviewRequest' } } }
        responses:
          '200':
            description: Restore plan for the selected slice
            content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertPreviewResponse' } } }
          '400': { $ref: '#/components/responses/Problem' }
          '401': { $ref: '#/components/responses/Problem' }
          '403': { $ref: '#/components/responses/Problem' }
          '404': { $ref: '#/components/responses/Problem' }
          '409': { $ref: '#/components/responses/Problem' }
          '503': { $ref: '#/components/responses/Problem' }
  /api/v1/workspaces/{workspaceId}/checkpoints/revert:
      post:
        tags: [workspace]
        operationId: executeWorkspaceCheckpointRevert
        summary: Restore a workspace to a slice
        description: |
          Executes the selected slice restore after explicit user confirmation. Only path type changes
          require acknowledgement; all changes after the target slice are intentionally included in the
          preview and may be discarded. The response reports each path and any concurrent-write suspects.
          Returns `409 RUN_ACTIVE` while a ChatRun is active in the workspace (checked before slice
          resolution).
          PLAN-0641 M3 risk grading over undeclared nested repositories: a dirty repo answers
          `409 NESTED_REPO_DIRTY` unless `force=true`; a head-drifted repo must be listed in
          `acknowledgeNestedRepos`, otherwise `409 NESTED_REPO_UNCONFIRMED`. Both nested-repo
          bodies carry `nestedRepos[]` (the affected workspace-relative repo roots), and a forced
          revert that actually covers dirty repos writes one `nested_repo_force_revert` audit row.
          PLAN-0641 M4: `409 CROSS_ROOT_LEGACY_SLICE` refuses a slice captured before a child root
          was declared — the slice still carries that child path flat, so restoring it would write
          into another root's directory. Its body adds `sliceCapturedAt` and
          `legacyRoots[{rootId, path, declaredAt}]` (path relative to the slice's root). The slice
          stays readable (list/diff/preview) and the manual rescue path is documented in the PLAN
          evidence. The boundary is derived from `workspace_roots.created_at` (declaration instant)
          vs `run_checkpoints.captured_at`: equal instants are treated as legacy (fail-closed).
        security: [{ bearerAuth: [] }]
        parameters: [{ in: path, name: workspaceId, required: true, schema: { type: string } }]
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertRequest' } } }
        responses:
          '200':
            description: Restore execution result
            content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointRevertResponse' } } }
          '400': { $ref: '#/components/responses/Problem' }
          '401': { $ref: '#/components/responses/Problem' }
          '403': { $ref: '#/components/responses/Problem' }
          '404': { $ref: '#/components/responses/Problem' }
          '409': { $ref: '#/components/responses/Problem' }
          '503': { $ref: '#/components/responses/Problem' }
