  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/output:
    get:
      operationId: getWorkspaceJobOutput
      security: [{ bearerAuth: [] }]
      description: 'PLAN-0465 T2.1 canonical durable job output resume (decision #7: path key = domain `jobId`). Byte-cursor pagination over the container-side job output file; UTF-8 boundaries are guaranteed by the Runtime. Access = Workspace membership; ownership is (jobId, workspaceId) double-keyed (foreign/missing collapse to 404 without leaking existence).'
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: jobId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: stream, schema: { type: string, enum: [stdout, stderr], default: stdout } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0, description: Byte cursor; pass the nextOffset returned by the previous read } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1048576, default: 65536 } }
      responses: { '200': { description: Job output chunk, content: { application/json: { schema: { $ref: '#/components/schemas/JobOutputChunk' } } } }, '400': { $ref: '#/components/responses/Problem' }, '404': { description: JOB_ARCHIVE_NOT_FOUND or WORKSPACE_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '409': { description: JOB_OUTPUT_LOST (job non-terminal but output gone) or JOB_OUTPUT_EXPIRED (terminal job output cleaned after TTL), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '502': { description: RUNTIME_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } } }
  /api/v1/workspaces/{workspaceId}/jobs/{jobId}/cancel:
    post:
      operationId: cancelWorkspaceJob
      security: [{ bearerAuth: [] }]
      description: |
        PLAN-0465 T2.1 canonical single-job cancel (decision #7: path key =
        domain `jobId`). Access = Workspace membership (not owner-only);
        (jobId, workspaceId) double-keyed, foreign/missing collapse to 404.
        Cancelling a job never
        changes the run or conversation terminal state; terminal archives are
        idempotent 200 with `changed=false`; 502 JOB_CANCEL_UNCONFIRMED and 502
        RUNTIME_UNAVAILABLE leave the archive unchanged; Runtime 404 archives the
        job as `orphaned` (`cancelReason=job_missing`, fail-closed); transition history
        is recorded in `workspace_job_history`.
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: jobId, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: 'Cancel outcome: jobId/status/changed (domain jobId)', content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceJobCancelResult' } } } }, '400': { $ref: '#/components/responses/Problem' }, '404': { description: 'WORKSPACE_NOT_FOUND (foreign or missing; no 403) or JOB_ARCHIVE_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '502': { description: 'JOB_CANCEL_UNCONFIRMED (termination unconfirmed; archive unchanged) or RUNTIME_UNAVAILABLE', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } } }
  /api/v1/workspaces/{workspaceId}/scheduled-tasks:
    get:
      operationId: listScheduledTasks
      summary: List workspace scheduled tasks (PLAN-0489 T1.4)
      description: |
        PLAN-0489 T1.4 (contract PLAN-0486 spec §4): workspace-scoped read of
        `scheduled_tasks`, newest-created first. Items are the 17-field read DTO
        (`ScheduledTask`); `prompt` is truncated to 120 characters in list items
        (the detail route returns the full text). `createdBy` projects the
        creating principal (name + type `human`/`agent`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Paged scheduled-task list
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskListPage' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: WORKSPACE_NOT_FOUND (missing or no Workspace access), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    post:
      operationId: createScheduledTask
      summary: Create a scheduled task (human or agent principal, PLAN-0489 T1.4)
      description: |
        PLAN-0489 T1.4 (contract PLAN-0486 spec §4, decisions #9/#10): creates one
        `delay_once` or `cron` task. Requires the `CREATE_SCHEDULED_TASK` grant
        (user grants for humans; agent-principal grants when `agentPrincipalId`
        is supplied — agent `session_wakeup` targets are limited to Sessions of
        the creating principal). `delay_once` schedules beyond the 7d TTL
        (`expires_at = created_at + 7d`) are rejected at creation. Quotas: 50
        active tasks per Workspace, 10 per principal (counted by `user_id`).
        Creation is audited (`scheduled_task_created`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskCreateRequest' } } }
      responses:
        '201':
          description: Created scheduled task (full-prompt read DTO)
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTask' } } }
        '400':
          description: 'INVALID_REQUEST (shape/at), INVALID_CRON_EXPR (field count, syntax, no future occurrence), or INVALID_TIMEZONE'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — missing CREATE_SCHEDULED_TASK grant, disabled/unbound agent principal, or agent wakeup target outside the creating principal', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: WORKSPACE_NOT_FOUND or SESSION_NOT_FOUND (target session missing/foreign), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'SCHEDULED_TASK_LIMIT (50 per Workspace) or SCHEDULED_TASK_PRINCIPAL_LIMIT (10 per principal)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/scheduled-tasks/{taskId}:
    get:
      operationId: getScheduledTask
      summary: Read one scheduled task (PLAN-0489 T1.4)
      description: Full-prompt 17-field read DTO; foreign/missing tasks collapse to 404 (CP convention).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scheduled task detail, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTask' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: 'SCHEDULED_TASK_NOT_FOUND (foreign or missing) or WORKSPACE_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    delete:
      operationId: deleteScheduledTask
      summary: Cancel a scheduled task (scheduled only; PLAN-0489 T1.4)
      description: |
        Equivalent removal path for `scheduled` tasks (`scheduled → cancelled`).
        Missed/expired tasks must use `POST .../remove` (this route answers
        `409 SCHEDULED_TASK_STATE` pointing there). An already `cancelled` task
        returns idempotent `200` with `changed: false`. Requires creator rights
        (0486 #10) or the `MANAGE_SCHEDULED_TASK` grant; audited
        (`scheduled_task_cancelled`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskDisposeRequest' } } }
      responses:
        '200': { description: 'Disposition outcome: taskId/status/changed + refreshed task view', content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskDisposeResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — non-creator without MANAGE_SCHEDULED_TASK', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: SCHEDULED_TASK_NOT_FOUND (foreign or missing), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: 'SCHEDULED_TASK_STATE — task is not `scheduled` (missed/expired use /remove)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/scheduled-tasks/{taskId}/rerun:
    post:
      operationId: rerunScheduledTask
      summary: Rerun a missed/expired scheduled task once (PLAN-0489 T1.4)
      description: |
        One-shot manual rerun of a `missed`/`expired` task (`completed`/`cancelled`
        answer `409 SCHEDULED_TASK_STATE`). Double-click protection = the
        `claimForRerun` CAS (a second request finds no claimable row) plus the
        dedicated retry idempotency key `sched:{task_id}:{fire_at_ms}:retry:{uuid}`
        on the dispatched job. On success cron tasks return to `scheduled` with a
        recomputed next fire; `delay_once` becomes `completed`. Audited
        (`scheduled_task_rerun`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskDisposeRequest' } } }
      responses:
        '200': { description: Refreshed task view after the rerun dispatch settles, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTask' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — non-creator without MANAGE_SCHEDULED_TASK', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: SCHEDULED_TASK_NOT_FOUND (foreign or missing), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: SCHEDULED_TASK_STATE (task not missed/expired), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/scheduled-tasks/{taskId}/remove:
    post:
      operationId: removeScheduledTask
      summary: Remove a missed/expired scheduled task (idempotent, PLAN-0489 T1.4)
      description: |
        `missed`/`expired → cancelled` disposition; `missed_count` is cleared
        with the row cancellation. Idempotent: an already `cancelled` task
        returns `200` with `changed: false`. `scheduled` tasks use DELETE;
        other states answer `409 SCHEDULED_TASK_STATE`. Audited
        (`scheduled_task_removed`; agent actors are explicitly marked).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskDisposeRequest' } } }
      responses:
        '200': { description: 'Disposition outcome: taskId/status/changed + refreshed task view', content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskDisposeResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — non-creator without MANAGE_SCHEDULED_TASK', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: SCHEDULED_TASK_NOT_FOUND (foreign or missing), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: SCHEDULED_TASK_STATE (task not missed/expired/cancelled), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/workspaces/{workspaceId}/scheduled-tasks/{taskId}/postpone:
    post:
      operationId: postponeScheduledTask
      summary: Postpone a scheduled task to a future instant (PLAN-0489 T1.4)
      description: |
        `missed`/`expired`/`scheduled → scheduled` with a new `nextFireAt`
        (`at` must be a future ISO-8601 UTC instant; `delay_once` may not pass
        `expiresAt`, else `400`). Cron tasks only re-set the next fire — the
        expression phase is untouched. Clears `missedCount`. Audited
        (`scheduled_task_postponed`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTaskPostponeRequest' } } }
      responses:
        '200': { description: Refreshed task view with the new nextFireAt, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledTask' } } } }
        '400': { description: 'INVALID_REQUEST — at missing, not future, or beyond delay_once expiresAt', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN — non-creator without MANAGE_SCHEDULED_TASK', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '404': { description: SCHEDULED_TASK_NOT_FOUND (foreign or missing), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
        '409': { description: SCHEDULED_TASK_STATE (task not missed/expired/scheduled), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /internal/v1/agents/spawn:
    post:
      operationId: spawnAgentSession
      summary: Create an Agent spawn child Session from a durable parent run
      description: Internal CP service surface only; the Agent production caller uses the CP-owned spawn_agent tool through /api/v1/mcp.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentSpawnRequest' } } } }
      responses: { '200': { description: 'Child Session and spawn ChatRun created, or the same child idempotently replayed; authorization, waiting link, audit, and one-shot grant consumption commit atomically', content: { application/json: { schema: { $ref: '#/components/schemas/AgentSpawnResponse' } } } }, '400': { description: 'INVALID_REQUEST — body must contain exactly parentRunId and toolCallId as UUID strings; injected identity/grant fields or incomplete/truncated durable prompt arguments are rejected before any write', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '401': { $ref: '#/components/responses/Problem' }, '403': { description: 'FORBIDDEN — no explicit SPAWN_AGENT grant, the MCP invocation is not an agent spawn_agent call of this parent run, or the parent Session has no active Workspace-bound Agent principal', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '404': { description: 'SPAWN_PARENT_RUN_NOT_FOUND or SPAWN_EVENT_NOT_FOUND', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '409': { description: 'APPROVAL_REQUIRED, SPAWN_PARENT_RUN_NOT_ACTIVE, SPAWN_ARGUMENTS_CHANGED, or IDEMPOTENCY_KEY_CONFLICT', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }, '503': { $ref: '#/components/responses/Problem' } }
  /api/v1/audit/entries:
    get:
      operationId: listAuditEntries
      security: [{ bearerAuth: [] }]
      description: >-
        PLAN-0466 T1.2: paged read of the four-domain audit view `v_audit_entries`
        (chat_run | workspace_job | mcp_invocation | approval), owner-scoped by the
        bearer user. Optional scope = sessionId/workspaceId/type/status; workspaceId
        must be accessible (404 WORKSPACE_NOT_FOUND). User field tier only: no
        userId/idempotencyKey/requestId/runtimeJobId, no prompt content, no raw
        arguments. Unknown `status` values return an empty set; unknown `type`
        values are 400 INVALID_REQUEST.
      parameters:
        - { in: query, name: sessionId, schema: { type: string, format: uuid } }
        - { in: query, name: workspaceId, schema: { type: string, format: uuid } }
        - { in: query, name: type, schema: { type: string, enum: [chat_run, workspace_job, mcp_invocation, approval] } }
        - { in: query, name: status, schema: { type: string, description: Native domain status/state vocabulary } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated audit entries (user tier), content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntryListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: WORKSPACE_NOT_FOUND (foreign or missing workspaceId), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /api/v1/audit/entries/{type}/{id}:
    get:
      operationId: getAuditEntryDetail
      security: [{ bearerAuth: [] }]
      description: >-
        PLAN-0466 T1.2: one entry projected from `v_audit_entries` plus that
        domain's append-only history timeline (chat_run_history |
        workspace_job_history | mcp_dispatch_history | approval_history) and, for
        mcp_invocation, its attempts. Wrong-owner and unknown ids are the same 404
        (AUDIT_ENTRY_NOT_FOUND) so existence never leaks.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [chat_run, workspace_job, mcp_invocation, approval] } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Audit entry detail (user tier), content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntryDetailResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: AUDIT_ENTRY_NOT_FOUND (unknown or foreign id), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  /internal/v1/audit/entries/{type}/{id}:
    get:
      operationId: getInternalAuditEntryDetail
      security: [{ bearerAuth: [] }]
      description: >-
        PLAN-0466 T1.2: service-Bearer detail — the internal field tier adds
        userId/idempotencyKey/requestId/runtimeJobId and attempt httpStatus/resultRef
        references. Prompt content, credentials and raw arguments stay excluded in
        this tier as well.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [chat_run, workspace_job, mcp_invocation, approval] } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Audit entry detail (internal tier), content: { application/json: { schema: { $ref: '#/components/schemas/InternalAuditEntryDetailResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { description: AUDIT_ENTRY_NOT_FOUND (unknown id), content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    ContextEventReadView:
      type: object
      additionalProperties: false
      required: [aggregate_id, sequence, type, payload, created_at, correlation_id, causation_id]
      properties:
        aggregate_id: { type: string, description: Session identifier; not the persisted event primary key }
        sequence: { type: integer, format: int64 }
        type: { type: string }
        payload: { type: object, additionalProperties: true, description: 'assistant.responded payload.message may use NativeAssistantHistoryMessage. Its Type/nativeRecords triple is atomic and replaces that Run ai/tool projection using correlation_id; it excludes admitted user input.' }
        created_at: { type: string, format: date-time }
        correlation_id: { type: [string, 'null'] }
        causation_id: { type: [string, 'null'] }
    NativeAssistantHistoryMessage:
      type: object
      required: [role, content, apiTypeId, apiTypeVersion, nativeRecords]
      description: 'Optional native carrier variant of assistant.responded.message. Preserve exact signatures/reasoning; bound tool arguments/results using existing policy. Serialized Type/nativeRecords carrier must fit resolved pruneWindowChars or fail before publication. Replay/fork preserve it; prune/compaction remove it atomically with replaced Run history. No credentials or rendered request body.'
      properties:
        role: { type: string, enum: [ai] }
        content: { type: string }
        apiTypeId: { type: string, enum: [openai-chat-completions, anthropic-messages, mimo-responses] }
        apiTypeVersion: { type: integer, minimum: 1 }
        nativeRecords: { type: array, items: { type: object, additionalProperties: true } }
    RuntimeReadFileRequest: { type: object, required: [path], additionalProperties: false, properties: { path: { type: string, description: 'Workspace-relative path.' }, max_bytes: { type: integer, description: 'Truncate content to N bytes; truncated=true marks an applied cut.' } } }
    WorkspaceFactsResult: { type: object, required: [isRepository, cwd, platform, shell, observedAt], properties: { isRepository: { type: boolean }, branch: { type: string, description: 'Omitted when non-repo or detached.' }, head: { type: string }, cwd: { type: string, nullable: true, description: 'Logical sandbox cwd (/workspace in docker); null = unknown (host/mxc never report host paths).' }, platform: { type: string, nullable: true, description: 'Execution-face OS (container OS in docker, Runtime host OS otherwise).' }, shell: { type: string, nullable: true, description: 'Tool-exec shell entry (xihe-shell in docker); null = no shell layer or unknown.' }, observedAt: { type: string, format: date-time, description: 'Report time (RFC3339 UTC); diagnostics only, never an idempotency key.' } } }
    RuntimeReadFileResult: { type: object, required: [found, content, truncated], properties: { found: { type: boolean, description: 'false = path resolved to no content (missing file or unmaterialized root); true = content authoritative even when empty string.' }, content: { type: string, description: 'File content; empty string when found=false or the file is empty (distinguish via found).' }, truncated: { type: boolean } } }
    AgentSpawnRequest: { type: object, required: [parentRunId, toolCallId], additionalProperties: false, properties: { parentRunId: { type: string, format: uuid }, toolCallId: { type: string, format: uuid, description: 'Canonical MCP tool-call correlation ID for the spawn invocation.' } } }
    AgentSpawnResponse: { type: object, required: [sessionId, runId, principalId, workspaceId], properties: { sessionId: { type: string, format: uuid }, runId: { type: string, format: uuid }, principalId: { type: string, format: uuid, description: 'Stable AgentPrincipal resolved from the durable parent Session; never taken from the request' }, workspaceId: { type: string, format: uuid } } }
    RegisterRequest: { type: object, required: [email, password, name], properties: { email: { type: string }, password: { type: string }, name: { type: string } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
    AuthResponse: { type: object, properties: { accessToken: { type: string }, refreshToken: { type: string }, user: { type: object }, workspaceId: { type: string } } }
    Workspace: { type: object, required: [id, name, ownerId, storageBackend, storageRef, storageMode, executionMode, generation], properties: { id: { type: string }, name: { type: string }, description: { type: [string, 'null'] }, ownerId: { type: string }, storageBackend: { type: string }, storageRef: { type: string }, storageMode: { type: string, enum: [managed_import, direct_attach] }, hostPath: { type: [string, 'null'], description: 'Canonical host path only for the owner/admin; null for ordinary members. Never a display or authorization substitute.' }, executionMode: { type: string, enum: [docker, windows-mxc, windows-host] }, generation: { type: integer }, createdAt: { type: [string, 'null'], format: date-time }, updatedAt: { type: [string, 'null'], format: date-time } } }
    WorkspaceCreateRequest: { type: object, properties: { name: { type: string }, description: { type: [string, 'null'] }, profile: { type: string, enum: [strict, coding, isolated], default: coding, description: 'Docker-only sandbox profile.' }, image: { type: string, description: 'Docker-only allowlisted image.' }, storageMode: { type: string, enum: [managed_import, direct_attach], default: managed_import }, hostPath: { type: string, description: 'Required for direct_attach; Runtime validates the absolute directory. This request field is never echoed to ordinary members.' }, executionMode: { type: string, enum: [docker, windows-mxc, windows-host] } } }
    WorkspaceUpdateRequest: { type: object, properties: { name: { type: string }, description: { type: [string, 'null'] } } }
    WorkspaceAgentPermission: { type: object, additionalProperties: false, required: [actionClass], properties: { actionClass: { type: string }, resource: { type: string, default: '*' } } }
    WorkspaceAgentView: { type: object, required: [principalId, name, createdAt, permissions], properties: { principalId: { type: string, format: uuid }, name: { type: string }, templateId: { type: [string, 'null'] }, templateName: { type: [string, 'null'] }, createdAt: { type: string, format: date-time }, permissions: { type: array, items: { $ref: '#/components/schemas/WorkspaceAgentPermission' } } } }
    WorkspaceAgentCapView: { type: object, required: [principalId, workspaceId, permissions], properties: { principalId: { type: string, format: uuid }, workspaceId: { type: string, format: uuid }, permissions: { type: array, items: { $ref: '#/components/schemas/WorkspaceAgentPermission' } } } }
    AgentPrincipalCreateView: { type: object, required: [principalId, createdAt], properties: { principalId: { type: string, format: uuid }, templateId: { type: [string, 'null'], format: uuid }, templateName: { type: [string, 'null'] }, createdAt: { type: string, format: date-time } } }
    AgentTemplateListView: { type: object, required: [layer, workspaceId, templates], properties: { layer: { type: string, enum: [instance, user, workspace] }, workspaceId: { type: [string, 'null'], format: uuid, description: Present only for the workspace layer; null for instance/user layers. }, templates: { type: array, description: 'Raw agent-templates.templates[] entries of exactly one layer, returned as stored. Roles and secret-like fields are never part of this response.', items: { type: object, additionalProperties: false, required: [id, name, description, systemPrompt, toolMode, roleId], properties: { id: { type: string, format: uuid }, name: { type: string }, description: { type: string }, systemPrompt: { type: string }, toolMode: { type: string, enum: [none, workspace] }, provider: { type: string }, model: { type: string }, roleId: { type: string, format: uuid } } } } } }
    CheckpointChangedFile:
       type: object
       additionalProperties: false
       required: [status, path]
       properties:
         status: { type: string, enum: [M, A, D] }
         path: { type: string }
    CheckpointRevertBookkeeping:
       type: object
       additionalProperties: false
       required: [state, at, counts, ref, attemptCount]
       properties:
         state: { type: string, enum: [none, rolled_back, partial, failed] }
         at: { type: [string, 'null'], format: date-time }
         counts: { type: [object, 'null'], additionalProperties: true }
         ref: { type: [string, 'null'], description: Restored slice ref recorded for the attempt }
         attemptCount: { type: integer, minimum: 0 }
    CheckpointSlice:
       type: object
       additionalProperties: false
       required: [id, sliceRef, capturedAt, sourceRunId, sourceSessionId, predecessorRef, changedFiles, changedCount, opaqueNestedRepos, state, unrollableReason, revert]
       properties:
         id: { type: string, format: uuid }
         sliceRef: { type: [string, 'null'], description: Null only for a degraded capture record without a slice }
         capturedAt: { type: [string, 'null'], format: date-time }
         sourceRunId: { type: [string, 'null'] }
         sourceSessionId: { type: [string, 'null'] }
         predecessorRef: { type: [string, 'null'] }
         changedFiles: { type: array, items: { $ref: '#/components/schemas/CheckpointChangedFile' } }
         changedCount: { type: integer, minimum: 0 }
