services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "effective_cache_size=256MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xihe}
      POSTGRES_USER: ${POSTGRES_USER:-xihe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${XIHE_PG_PORT:-12634}:5432"
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xihe -d xihe"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - xihe-net

  control-plane:
    build:
      context: packages/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${XIHE_CP_PORT:-12631}:8080"
    env_file:
      - path: .env
        required: false
      - path: .env.dev
        required: false
    environment:
      XIHE_CP_PORT: "8080"
      XIHE_LOG_DIR: "/logs"
      XIHE_CP_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/xihe"
      XIHE_AGENT_URL: "http://agent:8000/internal/v1/agent/chat"
      XIHE_AGENT_BASE_URL: "http://agent:8000"
      XIHE_RUNTIME_URL: "http://runtime:8001"
      XIHE_CP_API_TOKEN: "${XIHE_CP_API_TOKEN:-dev-token-not-secure}"
      SPRING_PROFILES_ACTIVE: "dev"
    volumes:
      - ./logs/cp:/logs
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xihe-net

  agent:
    build:
      context: packages/agent
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${XIHE_AGENT_PORT:-12632}:8000"
    env_file:
      - path: .env
        required: false
      - path: .env.dev
        required: false
    environment:
      XIHE_AGENT_PORT: "8000"
      XIHE_LOG_DIR: "/logs"
      XIHE_CP_PORT: "8080"
      XIHE_CP_URL: "http://control-plane:8080"
      XIHE_CP_API_TOKEN: "${XIHE_CP_API_TOKEN:-dev-token-not-secure}"
      # PLAN-0307 T3.3/T3.7: provider keys are offline fallback only and never live in
      # committed files; export them in the shell or use `docker compose --env-file .env.local up`.
      XIHE_XIAOMI_API_KEY: "${XIHE_XIAOMI_API_KEY:-}"
      XIHE_DEEPSEEK_API_KEY: "${XIHE_DEEPSEEK_API_KEY:-}"
      XIHE_OPENAI_API_KEY: "${XIHE_OPENAI_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    volumes:
      - ./logs/agent:/logs
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/v1/agent/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - xihe-net

  runtime:
    build:
      context: packages/runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${XIHE_RUNTIME_PORT:-12633}:8001"
    env_file:
      - path: .env
        required: false
      - path: .env.dev
        required: false
    environment:
      XIHE_RUNTIME_PORT: "8001"
      XIHE_CP_URL: "http://control-plane:8080"
      XIHE_CP_API_TOKEN: "${XIHE_CP_API_TOKEN:-dev-token-not-secure}"
      XIHE_REMOTE_MCP_ALLOW_INSECURE_LOCAL: "${XIHE_E2E_EXTERNAL_SERVER:-false}"
    volumes:
      - ./logs/runtime:/logs
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - xihe-net

volumes:
  pgdata:

networks:
  xihe-net:
    driver: bridge
