# Runtime host log rotation (tracing-appender writes daily files: logs/runtime.log.<YYYY-MM-DD>)
# The trailing file (logs/runtime.log) is the active sink; only rotated/completed days are compressed.
# Adjust <XIHE_LOG_DIR> to the actual log directory when deploying.
"<XIHE_LOG_DIR>/runtime.log.[0-9]*-[0-9]*-[0-9]*" {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    nocreate
}
